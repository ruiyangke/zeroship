# zeroship platform schema — Liquibase master changelog.
#
# Single entry point Liquibase reads
# (`--changelog-file=db/changelog/db.changelog-master.yaml`). It owns the
# single `zeroship` schema. It ALSO provisions the empty `oauth_hydra`
# namespace + least-privileged role for Hydra (changeset 0027) — but Hydra
# still migrates its own TABLES into oauth_hydra via `hydra migrate` (the
# hydra-migrate compose service, connecting as that role). Do NOT add hydra
# tables here — Hydra's table DDL is version-locked to the hydra binary.
#
# Every migration is a formatted-SQL file under changesets/, applied in
# lexicographic filename order (0001_, 0002_, …). To add a migration, create
# the next-numbered file there with a `--changeset author:id` header and a
# matching `--rollback`; includeAll picks it up automatically.
#
# These are hand-authored (not generated from a DB dump): the SQL is the
# source of truth, reviewable and rollback-able.
databaseChangeLog:
  - includeAll:
      path: changesets/
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: true
