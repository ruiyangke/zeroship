# DSN is intentionally NOT inlined here. Hydra reads it from the `DSN`
# environment variable, which production MUST inject as a secret reference to
# the least-privileged `oauth_hydra` login role (provisioned by Liquibase
# changeset 0027 — its own `oauth_hydra` schema + search_path, NO superuser /
# BYPASSRLS). Never connect Hydra as the `postgres` superuser: that defeats the
# schema isolation (BYPASSRLS over every tenant table) and scatters hydra_*
# tables into the platform `zeroship` schema. Shape (password from your secret
# manager, NEVER committed):
#   DSN=postgres://oauth_hydra:<secret>@<db-host>:5432/zeroship?sslmode=require
# See docs/runbooks/auth-deploy.md §3. (review finding I2)

serve:
  public:
    port: 4444
    host: 0.0.0.0
  admin:
    port: 4445
    host: 127.0.0.1         # prod: loopback only — the admin API is unauthenticated (port 4445 must never bind a routable interface)
  cookies:
    same_site_mode: Lax
    domain: auth.zeroship.ai

urls:
  self:
    issuer: https://auth.zeroship.ai/
    public: https://auth.zeroship.ai/
  login:   https://auth.zeroship.ai/login
  consent: https://auth.zeroship.ai/consent
  logout:  https://auth.zeroship.ai/logout
  error:   https://auth.zeroship.ai/error

strategies:
  access_token: opaque

oauth2:
  pkce:
    enforced_for_public_clients: true
    enforced: true
  grant:
    refresh_token:
      rotation_grace_period: 30s
      rotation_grace_reuse_count: 3

device_authorization:
  token_polling_interval: 5s
  user_code:
    entropy_preset: medium

ttl:
  access_token: 1h
  refresh_token: 720h
  id_token: 1h
  auth_code: 60s
  login_consent_request: 1h

oidc:
  subject_identifiers:
    supported_types: [public]
  dynamic_client_registration:
    enabled: false

log:
  level: info
  format: json
