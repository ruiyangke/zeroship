# zeroship shared config overlay. Copy to ops/zeroship.toml (one per environment)
# and pass via --config / ZEROSHIP_CONFIG.
#
# Placing this file at the well-known path /etc/zeroship/zeroship.toml makes
# --config unnecessary: the binaries auto-discover that fixed system path when no
# explicit --config / ZEROSHIP_CONFIG is given. (That is the ONLY auto-discovered
# location — there is no CWD/env redirect.)
#
# All keys are optional. Absent keys use the binary's compiled default.
# Scalar key precedence: CLI flag > env > this file > default.
# Secrets NEVER go in this file — use env/CLI/file-paths.

[auth]
# Hydra admin API base URL used by control for OAuth client management,
# builder bootstrap, and bearer-token introspection.
# Optional; absent => compiled default.
# Precedence: CLI flag > env > this file > default.
hydra_admin_url = "http://hydra:4445"

# Hydra public issuer/base URL used by control and gateway for OIDC
# protocol endpoints and token verification.
# Optional; absent => compiled default.
# Precedence: CLI flag > env > this file > default.
hydra_public_url = "https://auth.zeroship.ai"

# First-party OAuth client IDs that skip Hydra consent screens.
# Option<Vec<String>> semantics: OMIT this key entirely => the platform's
# compiled default set is used; a PRESENT list => exactly that set (no merge
# with the default); a present-but-EMPTY list (`trusted_oauth_clients = []`)
# => no trusted clients at all. This key is file/default ONLY — there is no
# CLI flag or env var that overrides it.
trusted_oauth_clients = ["zeroship-builder"]

[observability]
# Tracing filter passed to Rust tracing subscribers, equivalent to RUST_LOG.
# Optional; absent => compiled default.
# Precedence: CLI flag > env > this file > default.
rust_log = "info,zeroship_=debug"

# Log output format. Use "json" for production log pipelines. Supported
# values include "pretty", "compact", "json", "logfmt", and "bunyan".
# Optional; absent => compiled default.
# Precedence: CLI flag > env > this file > default.
log_format = "json"
