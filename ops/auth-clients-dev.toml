# Declarative OIDC client config — LOCAL docker-compose variant.
#
# Mirror of ops/auth-clients.example.toml with every public URL pointed at the
# Caddy-fronted *.zeroship.localhost dev domain instead of *.zeroship.ai. The
# auth service reconciles this against hydra's admin API at every boot
# (upsert; never deletes). Mounted at /etc/zeroship/auth-clients.toml.
#
# NOTE: the `zeroship-builder` client is NOT declared here — control's
# --bootstrap-builder-client registers it dynamically with the redirect URI
# from BUILDER_REDIRECT_URI (http://builder.zeroship.localhost/auth/callback)
# and writes its generated secret to /data/builder-client-secret.

[[client]]
client_id = "console.zeroship.localhost"
client_name = "zeroship Console"
client_secret = "dev-secret-rotate-me"
redirect_uris = ["http://console.zeroship.localhost/auth/callback", "http://localhost:5173/auth/callback"]
post_logout_redirect_uris = ["http://console.zeroship.localhost/", "http://localhost:5173/"]
# OIDC Back-Channel Logout 1.0 — hydra POSTs here when a console user
# signs out; the control plane verifies the logout_token and revokes
# the user's console sessions (Phase 7 U2).
backchannel_logout_uri = "http://console.zeroship.localhost/oidc/backchannel-logout"
scope = "openid offline_access email profile"
access_token_strategy = "jwt"
id_token_signed_response_alg = "EdDSA"
audience = ["http://api.zeroship.localhost"]
first_party = true

[[client]]
client_id = "zeroship-cli"
client_name = "zeroship CLI"
client_secret = ""
grant_types = ["urn:ietf:params:oauth:grant-type:device_code", "refresh_token"]
response_types = []
redirect_uris = []
scope = "openid offline_access apps:deploy apps:read"
token_endpoint_auth_method = "none"
first_party = true

[[client]]
client_id = "gateway"
client_name = "zeroship Gateway (hosted apps)"
client_secret = "dev-secret-rotate-me-too"
# redirect_uris grow per-deployed-app — control plane appends on each deploy
redirect_uris = []
# OIDC Back-Channel Logout 1.0 — hydra POSTs here when a user signs out;
# the gateway verifies the logout_token and revokes the user's app sessions.
# One stable URL services every hosted creator-app subdomain.
backchannel_logout_uri = "http://api.zeroship.localhost/oidc/backchannel-logout"
scope = "openid offline_access email profile"
access_token_strategy = "jwt"
id_token_signed_response_alg = "EdDSA"
audience = ["http://api.zeroship.localhost"]
first_party = true
