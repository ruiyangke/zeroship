# Minimal self-hosted Lago for the credential-free forwarder->Lago billing e2e
# (tests/e2e_lago_billing.sh). API + worker + Postgres + Redis; no frontend.
# Dedicated ports AND a dedicated compose project so it never collides with the
# platform compose or the e2e harnesses. The org + API key are bootstrapped at
# runtime via GraphQL by the e2e (fresh self-hosted Lago has no key until an
# organization is registered).
#
# `name:` IS LOAD-BEARING, and its absence was a live hazard. Without it compose
# derives the project from this file's PARENT DIRECTORY - `deploy/compose` ->
# project `compose` - which is the SAME project as the platform stack in
# docker-compose.yml beside it. The three Lago harnesses each end with
# `docker compose -f lago.yml down -v`, so that cleanup was scoped to the
# platform's project, not to Lago's.
#
# MEASURED 2026-08-12 with `down -v --dry-run` while the platform stack was up:
#     Network compose_default  Removing
#     Network compose_default  Resource is still in use
# It reached for the LIVE stack's network and was refused only because the
# network was busy. The header above used to promise "dedicated ports so it
# never collides", which is true of ports and was silently untrue of the
# project - the reassuring half of the sentence is what stopped anyone looking.
#
# openmeter.yml beside this file already did the right thing
# (`name: zeroship-openmeter`); this is the same fix. Harnesses address services
# through `docker compose -f lago.yml ps -q <service>`, never by container name,
# so pinning the project is transparent to them (checked: zero hardcoded
# project-prefixed names in the three Lago harnesses).
name: zeroship-lago

services:
  lago-db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: lago
      POSTGRES_PASSWORD: lago
      POSTGRES_DB: lago
    ports:
      - "127.0.0.1:5480:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lago"]
      interval: 3s
      timeout: 3s
      retries: 30

  lago-redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6480:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  lago-api:
    image: getlago/api:v1.35.0
    depends_on:
      lago-db:
        condition: service_healthy
      lago-redis:
        condition: service_healthy
    command: ["./scripts/start.api.sh"]
    ports:
      - "127.0.0.1:3480:3000"
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      LAGO_API_URL: http://localhost:3480
      LAGO_FRONT_URL: http://localhost:3481
      DATABASE_URL: postgresql://lago:lago@lago-db:5432/lago
      REDIS_URL: redis://lago-redis:6379
      SECRET_KEY_BASE: ${LAGO_SECRET_KEY_BASE}
      LAGO_RSA_PRIVATE_KEY: ${LAGO_RSA_PRIVATE_KEY}
      LAGO_ENCRYPTION_PRIMARY_KEY: ${LAGO_ENCRYPTION_PRIMARY_KEY}
      LAGO_ENCRYPTION_DETERMINISTIC_KEY: ${LAGO_ENCRYPTION_DETERMINISTIC_KEY}
      LAGO_ENCRYPTION_KEY_DERIVATION_SALT: ${LAGO_ENCRYPTION_KEY_DERIVATION_SALT}
      LAGO_DISABLE_SIGNUP: "false"
      LAGO_CREATE_ORG: "true"
      LAGO_ORG_NAME: zeroship-e2e
      LAGO_ORG_USER_EMAIL: e2e@zeroship.test
      LAGO_ORG_USER_PASSWORD: zeroship-e2e-pw-123
      LAGO_ORG_API_KEY: ${LAGO_ORG_API_KEY}

  lago-worker:
    image: getlago/api:v1.35.0
    depends_on:
      lago-api:
        condition: service_started
    command: ["./scripts/start.worker.sh"]
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      LAGO_API_URL: http://localhost:3480
      DATABASE_URL: postgresql://lago:lago@lago-db:5432/lago
      REDIS_URL: redis://lago-redis:6379
      SECRET_KEY_BASE: ${LAGO_SECRET_KEY_BASE}
      LAGO_RSA_PRIVATE_KEY: ${LAGO_RSA_PRIVATE_KEY}
      LAGO_ENCRYPTION_PRIMARY_KEY: ${LAGO_ENCRYPTION_PRIMARY_KEY}
      LAGO_ENCRYPTION_DETERMINISTIC_KEY: ${LAGO_ENCRYPTION_DETERMINISTIC_KEY}
      LAGO_ENCRYPTION_KEY_DERIVATION_SALT: ${LAGO_ENCRYPTION_KEY_DERIVATION_SALT}
