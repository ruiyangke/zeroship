# zeroship platform - full-stack LOCAL DEV stack, fronted by Caddy.
#
# THE DOMAIN IS A VARIABLE, NOT A CONSTANT. `${ZEROSHIP_DOMAIN}` drives the
# gateway's --app-base-domain, the auth issuer, the gateway/auth public URLs,
# Caddy's network aliases and (via the caddy service's environment) every site
# block in deploy/ops/Caddyfile. Set it ONCE in deploy/compose/.env to move the
# whole stack:
#
#   ZEROSHIP_DOMAIN=zeroship.localhost   # default; *.localhost resolves to 127.0.0.1
#   ZEROSHIP_ORIGIN_SCHEME=http          # default; the scheme PUBLIC urls advertise
#
# Deployed behind a TLS-terminating proxy, set both (e.g. `example.com` +
# `https`) so the OIDC issuer and gateway public URL advertise the scheme the
# BROWSER sees, not the plain http the origin actually serves. Do not put a
# literal hostname back into this file: it becomes a hostname in every
# deployment that copies it.
#
# This is the local-development topology. Strong local secrets are generated
# once by `zeroship dev init` and loaded from this directory's gitignored .env
# and secrets/ files. The service binaries run their normal security checks.
#
# Usage:
#   docker compose build && docker compose pull   # build/pull all images AHEAD
#   docker compose up -d                          # boot the whole stack (build-free)
#   docker compose up -d --scale worker=10        # scale workers
#   docker compose logs -f                        # watch all logs
#   docker compose down                           # stop (keeps pnpm/verdaccio/bundle caches)
#   docker compose down -v                        # stop + WIPE volumes (slow next boot)
#
# Once up, browse (with the default domain; any *.localhost resolves to 127.0.0.1):
#   http://console.zeroship.localhost   - the creator console / AI app-builder
#                                         (a gateway-fronted zeroship app; needs
#                                          OPENAI_API_KEY on the console app env)
#   http://auth.zeroship.localhost      - login / OIDC
#   http://<app>.zeroship.localhost     - a deployed creator app (via gateway)
#
# Caddy also carries network ALIASES for the auth/console/api hosts so
# CONTAINERS resolve those same names to Caddy - required for server-side OIDC
# token exchange / JWKS fetch to hit the same issuer the browser sees.

services:
  verdaccio:
    image: verdaccio/verdaccio:6
    # The committed config keeps `storage: storage` so the same file works
    # for local-process Verdaccio. In compose that path lives under the
    # mounted /verdaccio/conf tree; run as root so the named volume can
    # create htpasswd/tarballs there during local development.
    user: "0"
    command:
      - verdaccio
      - --config
      - /verdaccio/conf/config.yaml
      - --listen
      - 0.0.0.0:4873
    # Loopback-only publication (SEC-8): the registry must not be reachable
    # from the LAN or from sandbox guests via the host's external interfaces.
    ports:
      - "127.0.0.1:4873:4873"
    volumes:
      - ../verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
      - verdaccio_storage:/verdaccio/conf/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4873/-/ping').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 15

  postgres:
    image: postgres:16
    # wal_level=logical is LOAD-BEARING for `db.live` / stream RPCs, and the
    # postgres:16 default (`replica`) breaks them HALF-WAY rather than loudly.
    #
    # MEASURED 2026-08-12 by me, two throwaway postgres:16 containers differing
    # in nothing but this flag. On `replica`:
    #   CREATE PUBLICATION      -> succeeds, only `WARNING: wal_level is
    #                              insufficient to publish logical changes`,
    #                              and pg_publication really does gain the row
    #   pg_create_logical_...   -> ERROR: logical decoding requires
    #                              wal_level >= logical, pg_replication_slots 0
    # On `logical` both succeed and the slot is created. That asymmetry is the
    # whole problem: `replication::ensure_publication_and_slot` creates the
    # publication with a bare `pool.execute` and NOT in a transaction with the
    # slot step, so the publication survives the failure. A subscription can
    # therefore serve its initial snapshot and then never emit another frame,
    # which reads as a hang rather than an error.
    #
    # This is a server START parameter, and the trap is that the wrong fix LOOKS
    # like it works: `SET` is refused outright ("cannot be changed without
    # restarting the server"), but `ALTER SYSTEM SET` is ACCEPTED and a reload
    # silently does not apply it - SHOW still says `replica` and pg_settings
    # flags pending_restart. So it must be on the command line here; putting it
    # in postgres-init.sql would appear to succeed and change nothing.
    #
    # CONCRETE COST of leaving it at the default: 12 plugin-db integration tests
    # skip themselves on a `replica` server (`pg_has_logical_wal`), and
    # crates/plugin-db/tests/integration.rs:2243 already anticipates this,
    # saying CI's pg-test image gets `-c wal_level=logical` "once the rollout
    # lands". This is that rollout for the compose stack.
    command:
      - postgres
      - -c
      - wal_level=logical
    environment:
      POSTGRES_PASSWORD: zeroship
      POSTGRES_DB: zeroship
    # Sets the role default search_path to `zeroship` so unqualified table
    # references resolve in the single-schema platform DB.
    volumes:
      # THE PLATFORM DATABASE, and until 2026-08-11 it was the ONE stateful
      # service here with no durable storage. Measured while walking the
      # operator deploy: redis (a cache) had `redis-data:/data` and redpanda (a
      # replayable log) had `redpanda-data:/var/lib/redpanda/data`, while
      # postgres' only volumes entry was the read-only init-script bind below.
      # PGDATA therefore lived in the container's writable layer, so
      # `docker compose down` - or any `up` that recreates the container after a
      # config change - destroyed control state, auth, billing, the platform
      # migration journal and every `app_*` schema, while the cache and the log
      # survived. Nobody chooses to make a Redis cache durable and the system of
      # record ephemeral; the asymmetry is what marks it as an oversight.
      #
      # WARNING FOR THE FIRST `up` AFTER THIS LANDS: adding this volume changes
      # the service definition, so compose RECREATES the container, and whatever
      # is currently in the old container layer is not carried over. On a fresh
      # target that is nothing. On a long-lived dev box it is everything - this
      # machine's container held 96 `app_*` schemas when the gap was found. Dump
      # first (`pg_dump`) if the contents matter; this change does not and cannot
      # migrate them.
      - pgdata:/var/lib/postgresql/data
      - ../ops/postgres-init.sql:/docker-entrypoint-initdb.d/00-search-path.sql:ro
    ports:
      - "127.0.0.1:5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Platform schema migrations (control/auth/platform schemas). One-shot: runs
  # the `zeroship-platform-migrate` binary against the shared DB then exits 0.
  # control/auth gate on its successful completion, so they only ever boot
  # against a fully-migrated schema. Hand-authored JS DSL migrations live in
  # db/migrations-ts/; the runner authors each `.ts` in-process (zeroship-runtime
  # V8 + the published `zero-migrate` v1 recorder), lowers under the Platform
  # guard, and applies over the native compio-postgres seam - no Node, no
  # recorder-child subprocess.
  #
  # Runs the SAME `zeroship-platform:dev` image the native services use (the
  # Dockerfile builds + installs the `zeroship-platform-migrate` bin). The run
  # applies all `db/migrations-ts/*.ts` under the PLATFORM trust profile (the
  # widened guard for the zeroship/public schemas). The apply is idempotent: a
  # re-run re-derives byte-identical journal versions and skips already-applied
  # files. Destructive in-place evolutions (DROP CONSTRAINT/COLUMN, etc.) in the
  # committed platform set are auto-approved by construction - this operator-side
  # one-shot treats the committed migrations as the intended apply.
  migrate:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: zeroship-platform:dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../db/migrations-ts:/db/migrations-ts:ro
    command:
      # NB: the bin's parser takes space-separated flag/value pairs only
      # (no `--flag=value` form) - keep each flag and its value as separate
      # list items.
      - zeroship-platform-migrate
      - --migrations-dir
      - /db/migrations-ts
      - --database-url
      - ${ZEROSHIP_MIGRATE_DSN:-postgres://postgres:zeroship@postgres:5432/zeroship}
      - --project-schema
      - zeroship
      - --project-id
      - zeroship
    # zeroship-platform-migrate is a compio/io_uring binary like every other
    # service; io_uring_setup is blocked by Docker's default seccomp, so this
    # one-shot needs the same unconfined profile the long-running services use.
    security_opt:
      - seccomp:unconfined
    # BOUNDED, unlike the long-running services below, because this is a ONE-SHOT
    # and several of its failure modes are deterministic.
    #
    # MEASURED 2026-08-11 walking the operator deploy: with a journal recording
    # `20260702000200_control_tables.ts` as applied on 2026-08-07 and the source
    # edited since, the checksum guard refuses - correctly - and the refusal can
    # never self-heal. `restart: on-failure` resolves to MaximumRetryCount=0,
    # which is UNLIMITED, so the container restarted 10 times in about a minute
    # and would have kept going until stopped by hand.
    #
    # It is a resource leak, NOT a hidden failure, and the distinction is worth
    # keeping: `docker compose up -d` DID exit 1 and print
    # `service "migrate" didn't complete successfully: exit 1`, and control /
    # gateway / worker / auth stayed `created`, correctly gated. The operator is
    # told. The container just keeps spinning afterwards.
    #
    # Three retries still absorb a transient blip. The not-ready race that
    # usually justifies an unbounded policy is already handled above by
    # `depends_on: postgres: condition: service_healthy`, so unbounded bought
    # nothing here. The long-running services keep plain `on-failure`: a crashed
    # server SHOULD come back indefinitely.
    restart: on-failure:3

  control:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    # All five native services share ONE built image (built+tagged once,
    # not five times) - they differ only by `command`.
    image: zeroship-platform:dev
    # Self-heal transient first-boot races with auth on the shared
    # control/authz schema.
    restart: on-failure
    # Secrets (--db / --control-key / --master-key) are NOT passed as flags:
    # they come from deploy/ops/zeroship.toml ([secrets] env references), mounted at
    # the well-known path below. The flags that remain are genuinely per-binary
    # operational args the config schema does not cover.
    command: >
      zeroship-control
        --port 9090
        --bind 0.0.0.0
        --blob-store /data/bundles
        --allow-unsupported-billing
        --app-base-domain ${ZEROSHIP_DOMAIN:-zeroship.localhost}
        --signing-key-file /etc/zeroship/secrets/control-signing.pem
    # READINESS, not liveness: /readyz answers 200 only once Postgres answers,
    # so `service_healthy` on this service means "can serve API calls", not
    # "the process bound a port". `curl` is present in the runtime image
    # (deploy/Dockerfile stage 3 installs ca-certificates + curl); verified by
    # running it inside the built image, because a CMD-SHELL probe naming a
    # binary the image lacks fails forever and reads as a broken service.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9090/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    environment:
      # STALE as of the secret conversion. The [secrets] table and its
      # env-to-env references are deleted; each binary now declares its own
      # canonical ZEROSHIP_* secret name. The assignments below still use the
      # pre-conversion spellings - rewriting deployment inputs is Step 6 of
      # docs/proposals/2026-08-11-config-name-alignment.md.
      ZEROSHIP_DATABASE_URL: ${CONTROL_DATABASE_URL:-postgres://zeroship_control:zeroship_control@postgres:5432/zeroship}
      # Public-edge topology, independent of the origin's plain HTTP transport
      # and of the service's security posture.
      ZEROSHIP_ORIGIN_SCHEME: ${ZEROSHIP_ORIGIN_SCHEME:-http}
      # Control validates platform-issued access tokens against this explicit
      # issuer. It is deployment topology, not a switch that relaxes checks.
      ZEROSHIP_AUTH_PLATFORM_ISSUER: ${ZEROSHIP_ORIGIN_SCHEME:-http}://auth.${ZEROSHIP_DOMAIN:-zeroship.localhost}/oauth2
      # Privileged provisioning DSN for deploy-time migrations ONLY: control
      # opens this to CREATE SCHEMA "<app_id>" + CREATE ROLE migrator_<app_id>,
      # which the least-priv zeroship_control role above CANNOT do (no CREATEROLE /
      # CREATE-on-db, per V0025). The shipped `migrate` service likewise runs as
      # the postgres superuser. Without this, every migration-carrying deploy 503s.
      PROVISION_DATABASE_URL: ${PROVISION_DATABASE_URL:-postgres://postgres:zeroship@postgres:5432/zeroship}
      ZEROSHIP_CONTROL_KEY: ${ZEROSHIP_CONTROL_KEY:?run zeroship dev init}
      ZEROSHIP_MASTER_KEY: ${ZEROSHIP_MASTER_KEY:?run zeroship dev init}
      # control ALSO needs WORKER_KEY: deploy/ops/zeroship.toml:63 maps
      # `worker_key` to this env var, and crates/control/src/main.rs:878
      # refuses to start without it. It was set on gateway and worker only,
      # so control crash-looped with `secret reference env var
      # 'ZEROSHIP_WORKER_KEY' is not set`. MUST match the worker's value.
      ZEROSHIP_WORKER_KEY: ${ZEROSHIP_WORKER_KEY:?run zeroship dev init}
      # OPTIONAL, and empty means "this deployment does not accept Stripe
      # webhooks". Stripe is the only party that can issue a value that
      # verifies: the secret is `whsec_...` from the dashboard endpoint, or
      # from `stripe listen --print-secret`. A locally generated random value
      # cannot match a real Stripe-Signature, so requiring one bought nothing -
      # it forced every Stripe-less deployment to carry an inert placeholder,
      # and left a Stripe-USING deployment that forgot the real value looking
      # identically configured. Empty is now visibly unconfigured.
      #
      # This does NOT relax the server. Signature verification is unconditional
      # and an empty secret fails closed: crates/control/src/stripe_handlers.rs
      # rejects with 500 before any JSON parse or database work, and control
      # warns at boot that every delivery will be rejected. Pinned by
      # `webhook_empty_secret_*` in crates/control/tests/stripe_webhook_test.rs.
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Dedicated PERMANENT pairwise-salt secret (auth-sdk sec. 6.2). MUST be
      # byte-identical on control + gateway - both derive the per-app `pws_`.
      # Never rotate without a per-app `pws_` migration.
      PAIRWISE_SALT: ${PAIRWISE_SALT:?run zeroship dev init}
      # --- Console runtime env: NOTHING FORWARDS THESE ANY MORE --------------
      # These were read from THIS process env at install time by the console
      # seed, which wrote them onto the console app's env store. That seed was
      # REMOVED when the console stopped being a built-in app, so control no
      # longer reads any of the vars below and setting them has no effect on the
      # console.
      #
      # They are kept, not deleted, because the console still needs the same
      # values -- it now receives them the way every creator app does, through
      # `zeroship secret set` / `zeroship var set` against its own deploy. An
      # operator wiring that up will want this list as the inventory of what to
      # supply. Deleting them is a reasonable follow-up once that path is
      # documented; leaving them is NOT a silent fallback, because nothing reads
      # them at all.
      #
      # OPERATOR MUST SUPPLY: OPENAI_API_KEY (the AI codegen/chat is dead
      # without it). Export it in the host shell before `docker compose up`;
      # the empty default lets the stack boot (console AI degrades) if absent.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Sandbox/preview backend - same values the `sandbox` service is
      # configured with (URL on the compose network + its bearer token).
      SANDBOX_URL: http://sandbox:9091
      SANDBOX_TOKEN: sandbox-dev-token-change-me-0123456789abcd
      # In-cluster control-plane base URL the deployed console's control-client
      # calls (the localhost default is wrong inside the compose network).
      ZEROSHIP_CONTROL_URL: http://control:9090
    # No host port. Caddy reaches control over the compose network through the
    # authenticated control.<domain> route.
    volumes:
      - bundles:/data/bundles
      - ../../data:/data
      # Control MINTS PATs, so it needs the same key material gateway and auth
      # already mount. The `migrated` service verifies against this SAME file,
      # which is what lets a creator PAT authorize a migration apply.
      - ${ZEROSHIP_SECRETS_DIR:-./secrets}:/etc/zeroship/secrets:ro
      # mounted at the well-known path => auto-discovered, no --config needed
      - ../ops/zeroship.toml:/etc/zeroship/zeroship.toml:ro
    security_opt:
      - seccomp:unconfined
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The CREATOR migration service: applies a DEPLOYED APP's own migrations into
  # its per-app schema. Distinct from the `migrate` one-shot above, which applies
  # the PLATFORM's schema (db/migrations-ts) once at boot and exits.
  #
  # WHY THIS EXISTS, added 2026-08-11 while deploying examples/db-todos. It was
  # absent, and the absence is silent: the `.zship` deliberately carries NO
  # migration documents (crates/bundle/src/manifest.rs - they "are applied
  # through the standalone migration service"), so a migration-carrying deploy
  # SUCCEEDS, the gateway serves the app, and only then does every env.db call
  # fail against tables nothing ever created. The tell was already in this file:
  # PROVISION_DATABASE_URL was set on `control`, and the ONLY code that reads it
  # is crates/migrated/src/main.rs - a service that was not here.
  #
  # LOOPBACK by default (ZEROSHIP_MIGRATED_BIND): like gateway and auth, nothing outside
  # the compose network should reach it. Creators drive it through control, and
  # the operator drives it over an SSH tunnel.
  migrated:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: zeroship-platform:dev
    command: >
      zeroship-migrated
        --port 9091
        --bind 0.0.0.0
    # /readyz opens a Postgres connection on the policy-store DSN - the same
    # DSN every apply/policy endpoint uses - so unhealthy here means applies
    # would fail, not merely that the port is closed.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9091/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:9091:9091"
    environment:
      # Least-priv role for reading control-plane authz data (who owns the app).
      DATABASE_URL: ${MIGRATED_DATABASE_URL:-postgres://zeroship_control:zeroship_control@postgres:5432/zeroship}
      # SUPERUSER DSN, and the reason this service exists: applying an app's
      # migrations means CREATE SCHEMA "<app_id>" + CREATE ROLE migrator_<app_id>,
      # which the least-priv role above cannot do.
      PROVISION_DATABASE_URL: ${PROVISION_DATABASE_URL:-postgres://postgres:zeroship@postgres:5432/zeroship}
      # MUST be the same file control signs with, or a control-issued creator PAT
      # will not verify here and every apply is 401.
      SIGNING_KEY_FILE: /etc/zeroship/secrets/control-signing.pem
      # Unlike the other four services, migrated reads CONTROL_KEY directly and
      # does not resolve the ZEROSHIP_CONTROL_KEY reference from zeroship.toml.
      CONTROL_KEY: ${ZEROSHIP_CONTROL_KEY:?run zeroship dev init}
      # Seals the server-composed migration policy. It is stable across restarts
      # and independent from the platform encryption and transport keys.
      MIGRATED_POLICY_SEAL_KEY: ${MIGRATED_POLICY_SEAL_KEY:?run zeroship dev init}
      # OAuth issuer topology, not a relaxed security posture. Containers reach
      # this public hostname through Caddy's compose-network alias.
      ZEROSHIP_AUTH_PLATFORM_ISSUER: ${ZEROSHIP_ORIGIN_SCHEME:-http}://auth.${ZEROSHIP_DOMAIN:-zeroship.localhost}/oauth2
    volumes:
      - ${ZEROSHIP_SECRETS_DIR:-./secrets}:/etc/zeroship/secrets:ro
      - ../ops/zeroship.toml:/etc/zeroship/zeroship.toml:ro
    # compio/io_uring, same as every other native service here.
    security_opt:
      - seccomp:unconfined
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  gateway:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: zeroship-platform:dev
    restart: on-failure
    entrypoint: /bin/sh
    command:
      - -c
      - |
        sleep 3
        WORKERS=""
        for ip in $$(getent hosts worker | awk '{print $$1}'); do
          [ -n "$$WORKERS" ] && WORKERS="$$WORKERS,"
          WORKERS="$${WORKERS}http://$${ip}:8080"
        done
        [ -z "$$WORKERS" ] && WORKERS="http://worker:8080"
        echo "[gateway] workers: $$WORKERS"
        exec zeroship-gate \
          --port 8000 \
          --bind 0.0.0.0 \
          --control-url http://control:9090 \
          --worker-urls "$$WORKERS" \
          --blob-store /data/bundles \
          --poll-interval 3 \
          --auth-ui-url ${ZEROSHIP_ORIGIN_SCHEME:-http}://auth.${ZEROSHIP_DOMAIN:-zeroship.localhost} \
          --public-url ${ZEROSHIP_ORIGIN_SCHEME:-http}://api.${ZEROSHIP_DOMAIN:-zeroship.localhost}
    # /readyz is 503 until the route table has actually been pulled from
    # control, which is what separates "the gateway is up" from "the gateway
    # can route". `start_period` covers the entrypoint's `sleep 3` plus the
    # first `--poll-interval 3` cycle.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8000/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 40s
    volumes:
      # Platform key material (Ed25519 signing keys, broker master secret,
      # pairwise salt). The default host directory is explicitly gitignored.
      - ${ZEROSHIP_SECRETS_DIR:-./secrets}:/etc/zeroship/secrets:ro
      # Same content-addressed blob store control writes to (asset proxy).
      - bundles:/data/bundles
      # mounted at the well-known path => auto-discovered, no --config needed
      - ../ops/zeroship.toml:/etc/zeroship/zeroship.toml:ro
    environment:
      # STALE as of the secret conversion; see the control service above. The
      # gateway's least-priv
      # DSN; --control-key/--worker-key flow through the file, not literal flags.
      # `--worker-key` MUST match the worker's WORKER_KEY.
      ZEROSHIP_DATABASE_URL: ${GATEWAY_DATABASE_URL:-postgres://zeroship_gateway:zeroship_gateway@postgres:5432/zeroship}
      ZEROSHIP_CONTROL_KEY: ${ZEROSHIP_CONTROL_KEY:?run zeroship dev init}
      ZEROSHIP_WORKER_KEY: ${ZEROSHIP_WORKER_KEY:?run zeroship dev init}
      # Public-edge topology consumed by the gateway's --origin-scheme setting.
      ZEROSHIP_ORIGIN_SCHEME: ${ZEROSHIP_ORIGIN_SCHEME:-http}
      # Counterpart to auth AUTH_BROKER_SECRET_FILE -- same file, same bytes.
      GATEWAY_SIGNING_KEY_FILE: /etc/zeroship/secrets/gateway-signing.pem
      GATEWAY_BROKER_SECRET_FILE: /etc/zeroship/secrets/broker-secret
      # HMAC key signing the per-request __Host-zs_oidc_stash cookie.
      # Tampering is rejected at decode time; rotating this key
      # invalidates any in-flight OIDC dances.
      STASH_SIGNING_KEY: ${STASH_SIGNING_KEY:?run zeroship dev init}
      # Dedicated PERMANENT pairwise-salt secret (auth-sdk sec. 6.2). MUST equal the
      # control service's PAIRWISE_SALT - both derive the per-app `pws_`. Never
      # rotate without a per-app `pws_` migration.
      PAIRWISE_SALT: ${PAIRWISE_SALT:?run zeroship dev init}
    # LOOPBACK, and this costs the documented path nothing. Caddy reaches the
    # gateway by SERVICE NAME over the compose network (`reverse_proxy
    # gateway:8000`, three site blocks in deploy/ops/Caddyfile), never through
    # this published port. Publishing on 0.0.0.0 therefore bought only a SECOND
    # entrance - one that skips Caddy, and so skips Cloudflare, which is where
    # TLS terminates for the deployed domain. 127.0.0.1 keeps every host-side `curl
    # localhost:8000` and every local harness working; only remote reach goes.
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - seccomp:unconfined
    depends_on:
      postgres:
        condition: service_healthy
      control:
        condition: service_started
      worker:
        condition: service_started
      auth:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: zeroship-platform:dev
    # Worker defaults to binding 127.0.0.1 for safety. In the Docker
    # network the gateway reaches the worker via the `worker` DNS name,
    # so we explicitly opt in to 0.0.0.0 AND set a WORKER_KEY - without
    # the key the worker refuses to bind a non-loopback address (to
    # avoid exposing unauthenticated code execution). The key must match
    # the gateway's `--worker-key`.
    # Secrets (--control-key / --worker-key / --db) come from deploy/ops/zeroship.toml's
    # [secrets] env references (resolved per-binary from this service's
    # `environment:` block), not literal flags. WORKER_KEY must match the
    # gateway's. NOTE on the worker's DSN: ZEROSHIP_DATABASE_URL here is
    # plugin-db's PROVISIONING connection, NOT a constrained system-table role.
    # plugin-db's register_model creates per-app PG roles + schemas
    # (CREATEROLE/CREATEDB) and manages the WAL replication slot, so this
    # connection MUST stay a privileged principal (the postgres superuser here in
    # dev) - a DIFFERENT role than control/gateway's least-priv DSNs, which is
    # exactly why the shared `[secrets].database_url` reference reads a PER-BINARY
    # env value. The `zeroship_worker` role from changeset 0025 exists (and owns
    # ZERO zeroship.* system-table grants), but it is NOT the worker's login role
    # - the worker never touches the system tables; its per-app tenant access is
    # gated by plugin-db's own `SET LOCAL ROLE <per-app role>` mechanism, a
    # separate trust boundary.
    command:
      - zeroship-worker
      - --port
      - "8080"
      - --threads
      - "4"
      - --bind
      - 0.0.0.0
      - --control-url
      - http://control:9090
      - --blob-store
      - /data/bundles
      - --kv-url
      - redis://redis:6379
      # env.storage backend: a bare path/`file://` is LocalFs (the shared
      # volume below); an `s3://...` URL is S3/R2/MinIO (see the docker-compose
      # runbook "Production object storage" section). Same grammar as
      # --blob-store; S3 creds come from AWS_ACCESS_KEY_ID/SECRET in the env.
      - --storage-url
      - /data/app-storage
      - --max-isolates
      - "200"
      - --poll-interval
      - "3"
    # /readyz needs BOTH of the worker's dependencies: a current control-plane
    # version poll and a reachable blob store. A worker that cannot read
    # bundles serves 500s while its port is wide open, which is exactly the
    # state a port check cannot see.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 40s
    environment:
      # STALE as of the secret conversion; see the control service above.
      # Worker DSN = privileged provisioning superuser (see NOTE above); distinct
      # from control/gateway roles under the same shared `database_url` reference.
      ZEROSHIP_DATABASE_URL: ${WORKER_DATABASE_URL:-postgres://postgres:zeroship@postgres:5432/zeroship}
      ZEROSHIP_CONTROL_KEY: ${ZEROSHIP_CONTROL_KEY:?run zeroship dev init}
      ZEROSHIP_WORKER_KEY: ${ZEROSHIP_WORKER_KEY:?run zeroship dev init}
    volumes:
      # Same content-addressed blob store control writes to (deploy blobs).
      - bundles:/data/bundles
      # SHARED app object store for env.storage. Every worker replica mounts
      # the SAME named volume at the same path, so a `storage.put` on one
      # replica is readable by another - the multi-node-consistent LocalFs
      # pattern (mirrors how `bundles` is shared for deploy blobs). S3/R2
      # replaces this in prod behind the same Backend trait.
      - app-storage:/data/app-storage
      # Mounted at the well-known path => auto-discovered, so the worker
      # picks up the shared [observability] defaults with no --config.
      - ../ops/zeroship.toml:/etc/zeroship/zeroship.toml:ro
    deploy:
      replicas: 3
    security_opt:
      - seccomp:unconfined
    depends_on:
      # --db now points at the shared Postgres, so wait for the schema to
      # exist (postgres healthy + the one-shot migrate completed) the same
      # way control/gateway do - otherwise the first env.db op races the
      # migration.
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      control:
        condition: service_started
      redis:
        condition: service_started

  # redis - the SHARED key-value store backing the deployed-app `env.kv`
  # namespace. The worker's `--kv-url redis://redis:6379` points every
  # worker replica at this ONE instance, so a `kv.set` on one replica is
  # visible to another (multi-node consistency). The bespoke compio-redis
  # driver speaks to it; zero tokio. Single-node here in dev; the
  # `Redis` backend's URL transparently upgrades to cluster mode
  # (`?cluster=true&seeds=...`) for a sharded prod fleet.
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  # redpanda - Kafka-wire durable stream for the billing-provider platform.
  # Host-side integration tests use:
  #   REDPANDA_BROKERS=127.0.0.1:19092 cargo test -p zeroship-stream --test redpanda_roundtrip
  # In-compose services should use REDPANDA_BROKERS=redpanda:9092 when S4/S5 wire
  # the forwarder and worker producer.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:19092
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

  # zeroship-auth - native OIDC OP + UI. The gateway redirects
  # unauthenticated end users to it (gateway's
  # --auth-ui-url https://auth.<domain>). Binds loopback by default, so
  # compose passes --addr 0.0.0.0:9092 to be reachable across the network.
  auth:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: zeroship-platform:dev
    # Self-heal transient first-boot races while migrations settle.
    restart: on-failure
    # Secret (--db-url) and the console `frame-ancestors` allowlist come from
    # deploy/ops/zeroship.toml ([secrets].auth_db_url env ref +
    # [auth].frame_ancestor_origins), mounted at the well-known path below.
    # ZEROSHIP_AUTH_PUBLIC_URL is set here because the auth issuer is an auth-service
    # runtime setting, not part of the shared TOML overlay.
    command: >
      zeroship-auth
        --addr 0.0.0.0:9092
        --relay-forward-mailer stdout
    # No login, token or consent route works without Postgres, so /readyz
    # probes it. Liveness stays on /healthz precisely so a database blip does
    # not get the OP restarted on top of the outage.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9092/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    environment:
      # STALE as of the secret conversion; see the control service above. Auth's
      # least-priv DSN is now ZEROSHIP_AUTH_DATABASE_URL (auth's
      # flag is --db-url, a separate slot from the control/gateway/worker --db).
      AUTH_DB_URL: ${AUTH_DB_URL:-postgres://zeroship_auth:zeroship_auth@postgres:5432/zeroship}
      # Native OP issuer base; discovery/JWKS and token `iss` use
      # `${ZEROSHIP_AUTH_PUBLIC_URL}/oauth2`.
      ZEROSHIP_AUTH_PUBLIC_URL: ${ZEROSHIP_ORIGIN_SCHEME:-http}://auth.${ZEROSHIP_DOMAIN:-zeroship.localhost}
      # auth loads the SAME ../ops/zeroship.toml overlay as control and gateway,
      # and every consumer of the shared control_key declares ZEROSHIP_CONTROL_KEY.
      # Every binary reading the overlay must therefore supply the var; auth set only
      # AUTH_DB_URL + ZEROSHIP_AUTH_PUBLIC_URL and crash-looped on the unresolved reference.
      # Auth uses this ONLY to gate control -> auth internal OP mint calls.
      ZEROSHIP_CONTROL_KEY: ${ZEROSHIP_CONTROL_KEY:?run zeroship dev init}
      # Auth has independent stash-cookie and TOTP-at-rest keys. Both are
      # generated once and retained across restarts by the dev overlay.
      AUTH_STASH_SIGNING_KEY: ${AUTH_STASH_SIGNING_KEY:?run zeroship dev init}
      AUTH_TOTP_ENC_KEY: ${AUTH_TOTP_ENC_KEY:?run zeroship dev init}
      # Required on real boot -- auth refuses to start without the OP signing
      # key. AUTH_BROKER_SECRET_FILE is the SAME file the gateway reads as
      # GATEWAY_BROKER_SECRET_FILE: the OP derives each brokered client secret
      # from this master, so a mismatch fails every code exchange.
      AUTH_SIGNING_KEY_FILE: /etc/zeroship/secrets/auth-signing.pem
      AUTH_PAIRWISE_SALT_FILE: /etc/zeroship/secrets/pairwise-salt
      AUTH_BROKER_SECRET_FILE: /etc/zeroship/secrets/broker-secret
      REFRESH_HASH_KEY_FILE: /etc/zeroship/secrets/refresh-hash-key
      REFRESH_IDEM_KEY_FILE: /etc/zeroship/secrets/refresh-idem-key
    # LOOPBACK, same reasoning as the gateway: Caddy reaches auth by service
    # name (`reverse_proxy auth:9092`, three site blocks), so this published
    # port was a second entrance to the OIDC provider that bypassed the edge.
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      # Platform key material (Ed25519 signing keys, broker master secret,
      # pairwise salt). The default host directory is explicitly gitignored.
      - ${ZEROSHIP_SECRETS_DIR:-./secrets}:/etc/zeroship/secrets:ro
      # frame_ancestor_origins comes from the shared [auth] overlay,
      # auto-discovered at the well-known path.
      - ../ops/zeroship.toml:/etc/zeroship/zeroship.toml:ro
    security_opt:
      - seccomp:unconfined
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # zeroship-sandbox - the sandbox/preview backend now lives in the STANDALONE
  # `zeroship-sandbox` project (sibling repo), NOT in this compose. It is built
  # and run there (it has its own compose). The control plane reaches it over
  # HTTP via `SANDBOX_URL` / `SANDBOX_TOKEN` (see the `control` service env).
  #
  # The sandbox still uses THIS deployment's shared Postgres: the `migrate`
  # service applies the sandbox schema + creates the least-privilege roles
  # (`sandbox_app` / `sandbox_audit` / `sandbox_gdpr`, db/migrations-ts
  # 20260702000100_schema_roles_extensions.ts and 20260702000900_grants.ts),
  # and the external sandbox controller connects AS those roles via its own
  # SANDBOX_DATABASE_URL{,_AUDIT,_GDPR}. To run previews locally, bring up the
  # zeroship-sandbox project pointed at this Postgres + set the control
  # service's SANDBOX_URL to the external controller.

  # NOTE: the separate `builder` Vite dev service was RETIRED in the R5 cutover.
  # The AI app-builder IS the console now: a regular zeroship app built to a
  # `.zship`, seeded by control's `--bootstrap-console`, served by the gateway
  # at console.<domain>. Its OPENAI_API_KEY / sandbox creds are
  # injected as server-side app env on the seeded console app (control env
  # store), not via a standalone Vite container. The builder's confidential
  # OIDC client + BUILDER_*/TOKEN_ENCRYPTION_KEY env are gone with it.

  # caddy - dev reverse proxy on :80 for the *.<domain> domain.
  # Routes auth/console/api + the {app}.<domain> catch-all to the
  # right upstream (see deploy/ops/Caddyfile). console.* now proxies to the GATEWAY
  # (the console is a gateway-fronted app). The network ALIASES make those
  # public hostnames ALSO resolve to Caddy from INSIDE the compose network, so
  # server-side OIDC (control/gateway verifying tokens, fetching JWKS,
  # exchanging codes against http://auth.<domain>) hits the same
  # issuer the browser does.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ../ops/Caddyfile:/etc/caddy/Caddyfile:ro
    # The Caddyfile builds every site block from {$ZEROSHIP_DOMAIN}, so the
    # proxy has to SEE the variable. Without this the Caddyfile silently falls
    # back to its own default and the site blocks stop matching the aliases
    # below - the stack comes up and every host 404s.
    environment:
      ZEROSHIP_DOMAIN: ${ZEROSHIP_DOMAIN:-zeroship.localhost}
    networks:
      default:
        aliases:
          - auth.${ZEROSHIP_DOMAIN:-zeroship.localhost}
          - console.${ZEROSHIP_DOMAIN:-zeroship.localhost}
          - api.${ZEROSHIP_DOMAIN:-zeroship.localhost}
    depends_on:
      control:
        condition: service_started
      gateway:
        condition: service_started
      auth:
        condition: service_started

volumes:
  # The platform database. See the warning at the postgres service: this volume
  # was absent until 2026-08-11, so the database lived in the container layer.
  pgdata:
  bundles:
  # Shared object store for deployed-app env.storage (LocalFs). One volume,
  # mounted at the same path on every worker replica -> cross-node-consistent.
  app-storage:
  # Persisted redis dataset for the deployed-app env.kv store.
  redis-data:
  # Persisted Redpanda log for billing stream development.
  redpanda-data:
  verdaccio_storage:
