storage: storage

web:
  title: ZeroShip SDK Registry

auth:
  htpasswd:
    # Self-registration is disabled (SEC-8). Publisher accounts are
    # provisioned out of band by an operator editing the htpasswd file.
    file: storage/htpasswd
    max_users: -1

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

# Reads stay open; publish/unpublish are restricted to the named
# operator-provisioned publisher account (SEC-8) — never $authenticated,
# which any self-registered or sandbox-held token would satisfy.
packages:
  '@zeroship/*':
    access: $all
    publish: zeroship-publisher
    unpublish: zeroship-publisher

  '**':
    access: $all
    publish: zeroship-publisher
    unpublish: zeroship-publisher
    proxy: npmjs

server:
  keepAliveTimeout: 60

middlewares:
  audit:
    enabled: true

log:
  type: stdout
  format: pretty
  level: http
