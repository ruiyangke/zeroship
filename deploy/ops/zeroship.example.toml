# zeroship shared config overlay. Copy to deploy/ops/zeroship.toml (one per environment)
# and pass via --config / ZEROSHIP_CONFIG.
#
# Placing this file at the well-known path /etc/zeroship/zeroship.toml makes
# --config unnecessary: the binaries auto-discover that fixed system path when no
# explicit --config / ZEROSHIP_CONFIG is given. (That is the ONLY auto-discovered
# location - there is no CWD/env redirect.)
#
# All keys are optional. Absent keys use the binary's compiled default.
# Scalar key precedence: CLI flag > env > this file > default.
# Secret values may be literals in an UNTRACKED overlay, but never in THIS file:
# it is tracked, and a plaintext secret in a tracked file is unrecoverable once
# committed. See the secrets note below the operational tables.

# Public-edge topology for browser-visible URLs and same-origin checks. These
# are ordinary operational settings, not security-check switches. Exact
# origins only: no wildcards, paths, queries, fragments, credentials, or null.
# origin_scheme = "https"
# trusted_origins = ["https://console.zeroship.ai", "http://localhost:3000"]

# Platform-global secrets, at the ROOT because several binaries read the one
# value: control_key (control, gateway, worker, migrated) and pairwise_salt
# (control, gateway). Root keys must precede the
# first table header, or TOML puts them inside it.
control_key = "urn:zeroship:file:/etc/zeroship/secrets/control_key"
pairwise_salt = "urn:zeroship:file:/etc/zeroship/secrets/pairwise_salt"

[auth]
# Supply the native OP public origin to auth through ZEROSHIP_AUTH_PUBLIC_URL and the
# matching token issuer to control through ZEROSHIP_AUTH_PLATFORM_ISSUER. This shared
# overlay defines neither key.
#
# TWO SETTINGS NAME THE PLATFORM OP, AND THEY ARE NOT INTERCHANGEABLE. One is a
# name, one is an address, and a deployment behind a CDN or an ingress cannot
# use one string for both jobs:
#
#   auth.platform_issuer    TRUST ANCHOR. The exact string a platform token's
#                           `iss` claim must equal. PUBLIC, always - it is what
#                           the OP stamps and what every verifier compares.
#   auth.platform_jwks_url  OUTBOUND. Where control FETCHES the OP's signing
#                           keys; defaults to
#                           `{issuer}/.well-known/jwks.json`, which is only
#                           correct when the public name is reachable from
#                           inside.
#
# On a single host whose public name resolves to a CDN there is no route back
# in, so a derived JWKS address fails while the OP answers instantly one
# network hop away. Setting the outbound value to an internal address is what
# fixes it; it does NOT change what control trusts.
#
# Left commented because the outbound value is deployment topology - uncomment
# it together with the issuer, or set both as environment variables as
# deploy/compose/docker-compose.yml does.
# platform_jwks_url = "http://auth:9092/oauth2/.well-known/jwks.json"
#
# First-party OAuth client IDs that skip native OP consent for the first-party
# CONSOLE only. (The old gateway POST /__zeroship/auth/password first-party gate
# this value also fed is GONE - the immersive iframe login replaced it; the
# anti-clickjacking gate is now the browser-enforced `frame_ancestor_origins`
# allowlist below.) A consent prompt for the platform's own console is
# meaningless, and the framed /login dance would otherwise have to render a
# framed consent document.
# Option<Vec<String>> semantics: OMIT this key => the compiled default, which
# is now EMPTY (fail-closed: NO client skips consent unless listed here); a
# PRESENT list => exactly that set; `[]` => none. File/default ONLY - no CLI
# flag or env var override.
#
# To skip consent for the console, set this to the console's per-app PKCE client
# id, which `zeroship-control --bootstrap-console` prints:
#   client_id_for_app(console_app_id(console_host))  => "oac_<base62>"
# e.g. for console.zeroship.ai:
# trusted_oauth_clients = ["oac_<your-console-client-id>"]
trusted_oauth_clients = []

# Console origin(s) the auth-service login/signup/consent documents admit via
# CSP `frame-ancestors` so the console's immersive iframe login can embed them
# (design sec. 4.3/sec. 10.1). Browser-enforced anti-clickjacking: ONLY a listed origin
# may frame /login - every other surface (creator apps, external sites) is
# blocked by the browser and falls back to the popup. EXACT origins only - NO
# wildcards (a `https://*.zeroship.ai` would re-admit every creator app and
# defeat the property). Also settable via `--frame-ancestor-origins` /
# `ZEROSHIP_AUTH_FRAME_ANCESTOR_ORIGINS` (comma-separated); a non-empty CLI/env wins, else this
# overlay applies, else empty (the relax is a no-op -> strict frame-ancestors
# 'none'). Empty/omitted => single-origin / dev (no immersive iframe).
# frame_ancestor_origins = ["https://console.zeroship.ai"]
frame_ancestor_origins = []


[observability]
# Tracing filter passed to Rust tracing subscribers (EnvFilter syntax).
# Optional; absent => compiled default.
# Precedence: CLI flag > env > this file > default.
log_filter = "info,zeroship_=debug"

# Log output format. Use "json" for production log pipelines. Supported
# values include "pretty", "compact", "json", "logfmt", and "bunyan".
# Optional; absent => compiled default.
# Precedence: CLI flag > env > this file > default.
log_format = "json"

# ---------------------------------------------------------------------------
# Secrets
#
# There is no [secrets] table. A secret sits WITH its siblings, so LOCATION
# ENCODES SHARING: a key at the root is one every consumer shares, a key under
# [control] is control's alone. The flat table destroyed that distinction, which
# is how one control_key ended up a literal in four services and a ${VAR}
# indirection in the fifth with nothing marking the difference.
#
# A value is EITHER the secret itself OR urn:zeroship:file:/abs/path. That is
# the whole set. The env-to-env form (urn:zeroship:env:<VAR>) is gone - a config
# file naming an environment variable so a deployment can set it under a third
# name IS the alias hop - and so are the Vault and AWS Secrets Manager forms,
# which parsed but always failed at boot with BackendUnavailable. A syntax the
# runtime always refuses is not a deployment source.
#
# EVERY FILE A urn:zeroship:file: REFERENCE OR A --<name>-file FLAG NAMES MUST BE
# OWNER-ONLY. Boot refuses it outright if any group or other permission bit is
# set, and says so with the mode and the chmod that fixes it. There is no way to
# switch that off. Under docker the mode that counts is the HOST file's.
#
# A LITERAL IS PERMITTED HERE, and that is deliberate: the overlay may itself BE
# a mounted Kubernetes Secret, in which case the values never enter git and are
# RBAC-controlled. Permitting a literal by environment and forbidding one by
# mounted file had no principled basis. What is forbidden is a plaintext secret
# in a TRACKED file - THIS file is tracked, so keep references here and put
# literals only in an untracked overlay.
#
# Precedence for every secret: the generated --<name>-file path flag, then the
# canonical ZEROSHIP_* environment name, then this file. Under --check-config
# nothing is opened and no reference is followed: the run establishes which
# source supplies each secret, validates its source policy and format, and
# reports presence only.
#
# Convention, not mechanism: keep secret entries last within each table.

[control]
# Control's own secrets, under control's table. Each of these is read by
# exactly one binary, which is what the scope segment records.
database_url = "urn:zeroship:file:/etc/zeroship/secrets/control_database_url"
master_key = "urn:zeroship:file:/etc/zeroship/secrets/master_key"
legacy_master_keys = "urn:zeroship:file:/etc/zeroship/secrets/legacy_master_keys"
stripe_webhook_secret = "urn:zeroship:file:/etc/zeroship/secrets/stripe_webhook_secret"
stripe_secret_key = "urn:zeroship:file:/etc/zeroship/secrets/stripe_secret_key"
smtp_password = "urn:zeroship:file:/etc/zeroship/secrets/control_smtp_password"
resend_api_key = "urn:zeroship:file:/etc/zeroship/secrets/control_resend_api_key"

[gateway]
database_url = "urn:zeroship:file:/etc/zeroship/secrets/gateway_database_url"
stash_signing_key = "urn:zeroship:file:/etc/zeroship/secrets/stash_signing_key"
# NO `broker_secret` here. The gateway takes the broker master secret as a PATH
# (`gateway.broker_secret_file`) because it must read the same raw bytes auth
# does, and a `Secret<String>` round trip normalizes them. An overlay key
# spelled `broker_secret` configured nothing at all; it was found and removed
# when tests/config_name_alignment_gate.sh started joining these leaves against
# the compiled contract.
broker_secret_file = "/etc/zeroship/secrets/broker_secret"

[worker]
database_url = "urn:zeroship:file:/etc/zeroship/secrets/worker_database_url"
cdc_relay_url = "wss://cdc-relay:9094/internal/v1/cdc/subscribe"
cdc_relay_ca_file = "/etc/zeroship/secrets/cdc-cert.pem"
kv_config = "urn:zeroship:file:/etc/zeroship/secrets/kv.toml"

[data_cdc_server]
database_url = "urn:zeroship:file:/etc/zeroship/secrets/cdc_database_url"
listen = "0.0.0.0:9094"
tls_cert_file = "/etc/zeroship/secrets/cdc-cert.pem"
tls_key_file = "/etc/zeroship/secrets/cdc-key.pem"

[migrate_server]
database_url = "urn:zeroship:file:/etc/zeroship/secrets/migrated_database_url"
provision_database_url = "urn:zeroship:file:/etc/zeroship/secrets/provision_database_url"
policy_seal_key = "urn:zeroship:file:/etc/zeroship/secrets/policy_seal_key"
mutation_rate_limit_burst = 2
mutation_rate_limit_per_minute = 3
