# deploy/ops/zeroship.toml -- cross-binary domain config. Hand-edited; in git.
# One file PER ENVIRONMENT. Secrets never live here.

# Public-edge topology is intentionally omitted here. Compose injects
# ZEROSHIP_ORIGIN_SCHEME so one .env value can vary by deployment and override
# the optional root-level `origin_scheme` file key. Add a root-level
# `trusted_origins = ["https://exact-origin.example"]` only when the gateway
# must accept an additional exact origin; an absent list means no additions.

[auth]
# The native OP public origin is supplied to auth through AUTH_PUBLIC_URL, and
# control receives the matching token issuer through ZEROSHIP_AUTH_PLATFORM_ISSUER in
# deploy/compose/docker-compose.yml. This shared overlay defines neither key.
#
# First-party trusted OAuth client(s) that skip native OP consent. This is the
# FIRST-PARTY CONSOLE only - a deliberate, narrow exception to the spec rule
# that per-app (THIRD-PARTY creator) clients NEVER skip consent. A consent prompt
# for the platform's OWN console is meaningless, and the immersive iframe login
# frames the /login dance - a console consent screen would also have to be a
# framed document. (The old gateway POST /__zeroship/auth/password first-party
# gate this value also fed is GONE - the anti-clickjacking gate is now the
# browser-enforced `frame-ancestors` allowlist; see
# [auth].frame_ancestor_origins below.)
#
# STALE, and it can no longer be recomputed from the tree. The value below was
# derived as client_id_for_app(console_app_id("console.zeroship.localhost")):
#   console_app_id(host)   = uuid8(SHA-256("zeroship:console:app:v1\0" || host))
#                          = 5819848e-dc81-819a-bb81-7ef736a413d5
#   client_id_for_app(uuid)= "oac_" + base62(uuid) = oac_2gEz9tHlodeyWPNRtQsLsT
# `console_app_id` lived in the console seed, which was REMOVED when the console
# stopped being a built-in app, so there is no `--bootstrap-console` log line to
# verify it against and no code that reproduces the first line. The console is
# now deployed like any other creator app, and `ensure_app_client`
# (crates/control/src/app_oauth_client.rs) mints its client id at deploy time.
# OPERATOR DECISION, deliberately not made here: either drop this entry, or
# replace it with the client id the console's own deploy actually produces.
# Trusting a client id nothing mints is inert today, not dangerous, but it will
# read as configured trust to the next person.
trusted_oauth_clients = ["oac_2gEz9tHlodeyWPNRtQsLsT"]
# Console origin(s) the auth-service login/signup/consent documents admit via CSP
# `frame-ancestors` so the console's immersive iframe login can embed them
# (design sec. 4.3/sec. 10.1). Browser-enforced anti-clickjacking: ONLY a listed origin
# may frame /login; everyone else is blocked and falls back to the popup. EXACT
# origins only - NO wildcards. This compose serves the console at the Caddy host.
frame_ancestor_origins = ["http://console.zeroship.localhost"]

[observability]
log_filter = "info,zeroship_=debug"
log_format = "json"

# Secret REFERENCES only - never a plaintext literal (a literal is rejected at
# resolve by crates/core/src/config/secrets.rs::obtain_secret). Each value is a
# `urn:zeroship:env:<VAR>` reference: the named env var is read PER BINARY from
# that service's compose `environment:` block, so a binary backfills its secret
# from this shared file instead of carrying it as a literal CLI flag. Precedence
# is CLI/env-flag > [secrets] file reference > default, so any leftover literal
# flag would silently win and defeat this indirection - keep them OFF the
# command lines.
#
# DB URLs are PER BINARY (different least-priv PG roles: zeroship_control /
# zeroship_gateway / zeroship_auth) yet the file is SHARED. The single
# `database_url` reference points every platform binary at the SAME env var name
# (ZEROSHIP_DATABASE_URL); each compose service sets its OWN role-specific DSN
# under that name, so one shared reference resolves to four distinct DSNs. The
# auth service uses its own `auth_db_url` reference (its flag is `--db-url`,
# resolved from AUTH_DB_URL) so it can diverge from the worker/control/gateway
# `--db` slot if ever needed.
#
# LOCAL COMPOSE: `zeroship dev init` writes strong, stable values to the
# gitignored deploy/compose/.env file. Compose supplies those values to every
# consumer through these references. Every service runs the same secret and
# authentication checks locally that it runs in any other deployment.
[secrets]
control_key  = "urn:zeroship:env:ZEROSHIP_CONTROL_KEY"
master_key   = "urn:zeroship:env:ZEROSHIP_MASTER_KEY"
worker_key   = "urn:zeroship:env:ZEROSHIP_WORKER_KEY"
database_url = "urn:zeroship:env:ZEROSHIP_DATABASE_URL"
# Privileged provisioning DSN (control only): the CREATEROLE + CREATE-on-db
# admin role deploy-time migrations use to create each app's schema + migrator
# role. SEPARATE from `database_url` (the least-priv zeroship_control role,
# which has neither privilege). Only the control service sets PROVISION_DATABASE_URL.
provision_db_url = "urn:zeroship:env:PROVISION_DATABASE_URL"
auth_db_url  = "urn:zeroship:env:AUTH_DB_URL"
