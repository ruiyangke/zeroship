[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "xtask"

# Test orchestration has an independent dependency graph from shipped services.
[workspace]

[dependencies]
compio = { version = "0.18", features = ["macros", "time", "runtime", "polling"] }
compio-postgres = { path = "../libs/compio-postgres" }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
nix = { version = "0.31", features = ["signal", "process"] }
serde_json = "1"
testcontainers = { version = "0.28", default-features = false, features = ["blocking", "watchdog"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[dev-dependencies]
url = "2"
proc-macro2 = "1"
quote = "1"
regex = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
tempfile = "3"
serde_yaml = "0.9"
