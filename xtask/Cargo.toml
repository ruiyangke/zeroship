[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

# Test orchestration has an independent dependency graph from shipped services.
[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
nix = { version = "0.31", features = ["signal", "process"] }
serde_json = "1"
testcontainers = { version = "0.28", default-features = false, features = ["blocking"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
