[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "xtask"
# Integration suites are modules of one `tests/main.rs` target, so the harness
# links one test executable instead of one per file.
autotests = false

# Test orchestration has an independent dependency graph from shipped services.
[workspace]

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
nix = { version = "0.31", features = ["signal", "process", "resource"] }
serde_json = "1"
testcontainers = { version = "0.28", default-features = false, features = ["blocking", "watchdog"] }
zeroship-testkit = { path = "../crates/zeroship-testkit" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[dev-dependencies]
url = "2"
proc-macro2 = "1"
quote = "1"
regex = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
tempfile = "3"
serde_yaml = "0.9"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
