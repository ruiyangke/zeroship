# zeroship platform — full-stack LOCAL DEV stack, fronted by Caddy on the
# *.zeroship.localhost dev domain.
#
# ⚠️  DEV ONLY — NOT for production. Hardcodes weak secrets (platform-key,
#     master-key, worker-key), and runs every service with --dev-insecure
#     (admin / internal auth relaxed). All of this is gated behind
#     --dev-insecure and a private box.
#
# Usage:
#   docker compose build && docker compose pull   # build/pull all images AHEAD
#   docker compose up -d                          # boot the whole stack (build-free)
#   docker compose up -d --scale worker=10        # scale workers
#   docker compose logs -f                        # watch all logs
#   docker compose down                           # stop (keeps pnpm/verdaccio/bundle caches)
#   docker compose down -v                        # stop + WIPE volumes (slow next boot)
#
# Once up, browse (any *.localhost auto-resolves to 127.0.0.1):
#   http://console.zeroship.localhost   — the creator console / AI app-builder
#                                         (a gateway-fronted zeroship app; needs
#                                          OPENAI_API_KEY on the console app env)
#   http://auth.zeroship.localhost      — login / OIDC
#   http://<app>.zeroship.localhost     — a deployed creator app (via gateway)
#
# Caddy also carries network ALIASES for the auth/console/api hosts so
# CONTAINERS resolve those same names to Caddy — required for server-side OIDC
# token exchange / JWKS fetch to hit the same issuer the browser sees.

services:
  verdaccio:
    image: verdaccio/verdaccio:6
    # The committed config keeps `storage: storage` so the same file works
    # for local-process Verdaccio. In compose that path lives under the
    # mounted /verdaccio/conf tree; run as root so the named volume can
    # create htpasswd/tarballs there during local development.
    user: "0"
    command:
      - verdaccio
      - --config
      - /verdaccio/conf/config.yaml
      - --listen
      - 0.0.0.0:4873
    # Loopback-only publication (SEC-8): the registry must not be reachable
    # from the LAN or from sandbox guests via the host's external interfaces.
    ports:
      - "127.0.0.1:4873:4873"
    volumes:
      - ./config/verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
      - verdaccio_storage:/verdaccio/conf/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4873/-/ping').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 15

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: zeroship
      POSTGRES_DB: zeroship
    # Sets the role default search_path to `zeroship` so unqualified table
    # references resolve in the single-schema platform DB.
    volumes:
      - ./ops/postgres-init.sql:/docker-entrypoint-initdb.d/00-search-path.sql:ro
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Platform schema migrations (control/auth/platform schemas). One-shot: runs
  # the `zeroship-migrate` binary against the shared DB then exits 0.
  # control/auth gate on its successful completion, so they only ever boot
  # against a fully-migrated schema. Hand-authored Flyway-style migrations live
  # in db/migrations/.
  #
  # Runs the SAME `zeroship-platform:dev` image the native services use (the
  # Dockerfile builds + installs the `zeroship-migrate` bin), under the
  # PLATFORM trust profile (the widened guard for the zeroship/oauth_hydra/public
  # schemas — design 2026-06-17-platform-migrations-flyway-mode). The `migrate`
  # subcommand applies all pending files once. `--yes` is required because the
  # ported platform set contains reviewed in-place schema evolutions (DROP
  # CONSTRAINT/COLUMN, etc.) the engine flags DESTRUCTIVE; passing it here is the
  # operator's standing, in-repo confirmation that the committed migrations are
  # the intended apply (the same role Liquibase's verbatim `update` played).
  migrate:
    build: .
    image: zeroship-platform:dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/db/migrations:ro
    command:
      - zeroship-migrate
      - migrate
      - --dir=/db/migrations
      - --database-url=postgres://postgres:zeroship@postgres:5432/zeroship
      - --profile=platform
      - --yes
    restart: on-failure

  control:
    build: .
    # All five native services share ONE built image (built+tagged once,
    # not five times) — they differ only by `command`.
    image: zeroship-platform:dev
    # Self-heal transient first-boot races with auth on the shared
    # control/authz schema.
    restart: on-failure
    # Secrets (--db / --control-key / --master-key) are NOT passed as flags:
    # they come from ops/zeroship.toml ([secrets] env references), mounted at
    # the well-known path below. The flags that remain are genuinely per-binary
    # operational args the config schema does not cover.
    command: >
      zeroship-control
        --port 9090
        --bind 0.0.0.0
        --blob-store /data/bundles
        --dev-insecure
        --app-base-domain zeroship.localhost
        --bootstrap-console
        --console-host console.zeroship.localhost
        --console-zship /opt/zeroship/console/app.zship
    environment:
      # Role-specific DSN + shared secrets, resolved from ops/zeroship.toml's
      # [secrets] `urn:zeroship:env:<VAR>` references (control's least-priv role).
      ZEROSHIP_DATABASE_URL: postgres://zeroship_control:zeroship_control@postgres:5432/zeroship
      # Privileged provisioning DSN for deploy-time migrations ONLY: control
      # opens this to CREATE SCHEMA "<app_id>" + CREATE ROLE migrator_<app_id>,
      # which the least-priv zeroship_control role above CANNOT do (no CREATEROLE /
      # CREATE-on-db, per V0025). The shipped `migrate` service likewise runs as
      # the postgres superuser. Without this, every migration-carrying deploy 503s.
      PROVISION_DATABASE_URL: postgres://postgres:zeroship@postgres:5432/zeroship
      ZEROSHIP_CONTROL_KEY: platform-key
      ZEROSHIP_MASTER_KEY: master-key
      # Dedicated PERMANENT pairwise-salt secret (auth-sdk §6.2). MUST be
      # byte-identical on control + gateway — both derive the per-app `pws_`.
      # Never rotate without a per-app `pws_` migration.
      PAIRWISE_SALT: ${PAIRWISE_SALT:-dev-pairwise-salt-never-rotate-in-prod}
      # --- Console runtime env, FORWARDED by --bootstrap-console -------------
      # The deployed console (the AI app-builder, a gateway-fronted zeroship
      # app) needs these as SERVER-SIDE app env to function. The console seed
      # (crates/control/src/bootstrap_console.rs) reads each from THIS process
      # env at install time and writes it onto the console app's env store
      # (secrets encrypted + exposed to process.env; plain URLs as vars) — never
      # the browser. An unset var here is skipped (that console feature
      # degrades) rather than failing the seed. These replace what the retired
      # `builder` Vite service used to inject.
      #
      # OPERATOR MUST SUPPLY: OPENAI_API_KEY (the AI codegen/chat is dead
      # without it). Export it in the host shell before `docker compose up`;
      # the empty default lets the stack boot (console AI degrades) if absent.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Sandbox/preview backend — same values the `sandbox` service is
      # configured with (URL on the compose network + its bearer token).
      SANDBOX_URL: http://sandbox:9091
      SANDBOX_TOKEN: sandbox-dev-token-change-me-0123456789abcd
      # In-cluster control-plane base URL the deployed console's control-client
      # calls (the localhost default is wrong inside the compose network).
      ZEROSHIP_CONTROL_URL: http://control:9090
    ports:
      - "9090:9090"
    volumes:
      - bundles:/data/bundles
      - ./data:/data
      # mounted at the well-known path => auto-discovered, no --config needed
      - ./ops/zeroship.toml:/etc/zeroship/zeroship.toml:ro
    security_opt:
      - seccomp:unconfined
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  gateway:
    build: .
    image: zeroship-platform:dev
    restart: on-failure
    entrypoint: /bin/sh
    command:
      - -c
      - |
        sleep 3
        WORKERS=""
        for ip in $$(getent hosts worker | awk '{print $$1}'); do
          [ -n "$$WORKERS" ] && WORKERS="$$WORKERS,"
          WORKERS="$${WORKERS}http://$${ip}:8080"
        done
        [ -z "$$WORKERS" ] && WORKERS="http://worker:8080"
        echo "[gateway] workers: $$WORKERS"
        exec zeroship-gate \
          --port 8000 \
          --bind 0.0.0.0 \
          --control http://control:9090 \
          --workers "$$WORKERS" \
          --blob-store /data/bundles \
          --poll-interval 3 \
          --auth-ui-url http://auth.zeroship.localhost \
          --gateway-public-url http://api.zeroship.localhost \
          --dev-insecure
    volumes:
      # Same content-addressed blob store control writes to (asset proxy).
      - bundles:/data/bundles
      # mounted at the well-known path => auto-discovered, no --config needed
      - ./ops/zeroship.toml:/etc/zeroship/zeroship.toml:ro
    environment:
      # Role-specific DSN + shared secrets, resolved from ops/zeroship.toml's
      # [secrets] `urn:zeroship:env:<VAR>` references. The gateway's least-priv
      # DSN; --control-key/--worker-key flow through the file, not literal flags.
      # `--worker-key` MUST match the worker's WORKER_KEY.
      ZEROSHIP_DATABASE_URL: postgres://zeroship_gateway:zeroship_gateway@postgres:5432/zeroship
      ZEROSHIP_CONTROL_KEY: platform-key
      ZEROSHIP_WORKER_KEY: worker-key
      # OAuth2 client_secret for the `gateway` client. The gateway exchanges
      # this on the per-app OIDC code-exchange (Phase 3 §10.2).
      GATEWAY_OIDC_SECRET: ${GATEWAY_OIDC_SECRET:-dev-secret-rotate-me-too}
      # HMAC key signing the per-request __Host-zs_oidc_stash cookie.
      # Tampering is rejected at decode time; rotating this key
      # invalidates any in-flight OIDC dances.
      STASH_SIGNING_KEY: ${STASH_SIGNING_KEY:-dev-stash-key-please-rotate}
      # Dedicated PERMANENT pairwise-salt secret (auth-sdk §6.2). MUST equal the
      # control service's PAIRWISE_SALT — both derive the per-app `pws_`. Never
      # rotate without a per-app `pws_` migration.
      PAIRWISE_SALT: ${PAIRWISE_SALT:-dev-pairwise-salt-never-rotate-in-prod}
    ports:
      - "8000:8000"
    security_opt:
      - seccomp:unconfined
    depends_on:
      postgres:
        condition: service_healthy
      control:
        condition: service_started
      worker:
        condition: service_started
      auth:
        condition: service_started

  worker:
    build: .
    image: zeroship-platform:dev
    # Worker defaults to binding 127.0.0.1 for safety. In the Docker
    # network the gateway reaches the worker via the `worker` DNS name,
    # so we explicitly opt in to 0.0.0.0 AND set a WORKER_KEY — without
    # the key the worker refuses to bind a non-loopback address (to
    # avoid exposing unauthenticated code execution). The key must match
    # the gateway's `--worker-key`.
    # Secrets (--control-key / --worker-key / --db) come from ops/zeroship.toml's
    # [secrets] env references (resolved per-binary from this service's
    # `environment:` block), not literal flags. WORKER_KEY must match the
    # gateway's. NOTE on the worker's DSN: ZEROSHIP_DATABASE_URL here is
    # plugin-db's PROVISIONING connection, NOT a constrained system-table role.
    # plugin-db's register_model creates per-app PG roles + schemas
    # (CREATEROLE/CREATEDB) and manages the WAL replication slot, so this
    # connection MUST stay a privileged principal (the postgres superuser here in
    # dev) — a DIFFERENT role than control/gateway's least-priv DSNs, which is
    # exactly why the shared `[secrets].database_url` reference reads a PER-BINARY
    # env value. The `zeroship_worker` role from changeset 0025 exists (and owns
    # ZERO zeroship.* system-table grants), but it is NOT the worker's login role
    # — the worker never touches the system tables; its per-app tenant access is
    # gated by plugin-db's own `SET LOCAL ROLE <per-app role>` mechanism, a
    # separate trust boundary.
    command:
      - zeroship-worker
      - --port
      - "8080"
      - --worker-threads
      - "4"
      - --bind
      - 0.0.0.0
      - --control
      - http://control:9090
      - --blob-store
      - /data/bundles
      - --kv-url
      - redis://redis:6379
      # env.storage backend: a bare path/`file://` is LocalFs (the shared
      # volume below); an `s3://…` URL is S3/R2/MinIO (see the docker-compose
      # runbook "Production object storage" section). Same grammar as
      # --blob-store; S3 creds come from AWS_ACCESS_KEY_ID/SECRET in the env.
      - --storage-url
      - /data/app-storage
      - --max-isolates
      - "200"
      - --poll-interval
      - "3"
    environment:
      # Resolved from ops/zeroship.toml [secrets] `urn:zeroship:env:<VAR>` refs.
      # Worker DSN = privileged provisioning superuser (see NOTE above); distinct
      # from control/gateway roles under the same shared `database_url` reference.
      ZEROSHIP_DATABASE_URL: postgres://postgres:zeroship@postgres:5432/zeroship
      ZEROSHIP_CONTROL_KEY: platform-key
      ZEROSHIP_WORKER_KEY: worker-key
    volumes:
      # Same content-addressed blob store control writes to (deploy blobs).
      - bundles:/data/bundles
      # SHARED app object store for env.storage. Every worker replica mounts
      # the SAME named volume at the same path, so a `storage.put` on one
      # replica is readable by another — the multi-node-consistent LocalFs
      # pattern (mirrors how `bundles` is shared for deploy blobs). S3/R2
      # replaces this in prod behind the same Backend trait.
      - app-storage:/data/app-storage
      # Mounted at the well-known path => auto-discovered, so the worker
      # picks up the shared [observability] defaults with no --config.
      - ./ops/zeroship.toml:/etc/zeroship/zeroship.toml:ro
    deploy:
      replicas: 3
    security_opt:
      - seccomp:unconfined
    depends_on:
      # --db now points at the shared Postgres, so wait for the schema to
      # exist (postgres healthy + the one-shot migrate completed) the same
      # way control/gateway do — otherwise the first env.db op races the
      # migration.
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      control:
        condition: service_started
      redis:
        condition: service_started

  # redis — the SHARED key-value store backing the deployed-app `env.kv`
  # namespace. The worker's `--kv-url redis://redis:6379` points every
  # worker replica at this ONE instance, so a `kv.set` on one replica is
  # visible to another (multi-node consistency). The bespoke compio-redis
  # driver speaks to it; zero tokio. Single-node here in dev; the
  # `Redis` backend's URL transparently upgrades to cluster mode
  # (`?cluster=true&seeds=...`) for a sharded prod fleet.
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  # zeroship-auth — native OIDC OP + UI. The gateway redirects
  # unauthenticated end users to it (gateway's
  # --auth-ui-url http://auth.zeroship.localhost). Binds loopback by default, so
  # compose passes --addr 0.0.0.0:9092 to be reachable across the network.
  auth:
    build: .
    image: zeroship-platform:dev
    # Self-heal transient first-boot races while migrations settle.
    restart: on-failure
    # Secret (--db-url) and the console `frame-ancestors` allowlist come from
    # ops/zeroship.toml ([secrets].auth_db_url env ref +
    # [auth].frame_ancestor_origins), mounted at the well-known path below.
    # AUTH_PUBLIC_URL is set here because the auth issuer is an auth-service
    # runtime setting, not part of the shared TOML overlay.
    command: >
      zeroship-auth
        --addr 0.0.0.0:9092
        --dev-insecure
        --relay-forward-mailer stdout
        --bootstrap
    environment:
      # auth's least-priv DSN, resolved from ops/zeroship.toml's
      # [secrets].auth_db_url = "urn:zeroship:env:AUTH_DB_URL" reference (auth's
      # flag is --db-url, a separate slot from the control/gateway/worker --db).
      AUTH_DB_URL: postgres://zeroship_auth:zeroship_auth@postgres:5432/zeroship
      # Native OP issuer base; discovery/JWKS and token `iss` use
      # `${AUTH_PUBLIC_URL}/oauth2`.
      AUTH_PUBLIC_URL: https://auth.zeroship.localhost
    ports:
      - "9092:9092"
    volumes:
      # frame_ancestor_origins comes from the shared [auth] overlay,
      # auto-discovered at the well-known path.
      - ./ops/zeroship.toml:/etc/zeroship/zeroship.toml:ro
    security_opt:
      - seccomp:unconfined
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # zeroship-sandbox — the sandbox/preview backend now lives in the STANDALONE
  # `zeroship-sandbox` project (sibling repo), NOT in this compose. It is built
  # and run there (it has its own compose). The control plane reaches it over
  # HTTP via `SANDBOX_URL` / `SANDBOX_TOKEN` (see the `control` service env).
  #
  # The sandbox still uses THIS deployment's shared Postgres: the `migrate`
  # service applies the sandbox schema + creates the least-privilege roles
  # (`sandbox_app` / `sandbox_audit` / `sandbox_gdpr`, db/migrations
  # V0011–V0024), and the external sandbox controller connects AS those roles
  # via its own SANDBOX_DATABASE_URL{,_AUDIT,_GDPR}. To run previews locally,
  # bring up the zeroship-sandbox project pointed at this Postgres + set the
  # control service's SANDBOX_URL to the external controller.

  # NOTE: the separate `builder` Vite dev service was RETIRED in the R5 cutover.
  # The AI app-builder IS the console now: a regular zeroship app built to a
  # `.zship`, seeded by control's `--bootstrap-console`, served by the gateway
  # at console.zeroship.localhost. Its OPENAI_API_KEY / sandbox creds are
  # injected as server-side app env on the seeded console app (control env
  # store), not via a standalone Vite container. The builder's confidential
  # OIDC client + BUILDER_*/TOKEN_ENCRYPTION_KEY env are gone with it.

  # caddy — dev reverse proxy on :80 for the *.zeroship.localhost domain.
  # Routes auth/console/api + the {app}.zeroship.localhost catch-all to the
  # right upstream (see ops/Caddyfile). console.* now proxies to the GATEWAY
  # (the console is a gateway-fronted app). The network ALIASES make those
  # public hostnames ALSO resolve to Caddy from INSIDE the compose network, so
  # server-side OIDC (control/gateway verifying tokens, fetching JWKS,
  # exchanging codes against http://auth.zeroship.localhost) hits the same
  # issuer the browser does.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
        aliases:
          - auth.zeroship.localhost
          - console.zeroship.localhost
          - api.zeroship.localhost
    depends_on:
      control:
        condition: service_started
      gateway:
        condition: service_started
      auth:
        condition: service_started

volumes:
  bundles:
  # Shared object store for deployed-app env.storage (LocalFs). One volume,
  # mounted at the same path on every worker replica → cross-node-consistent.
  app-storage:
  # Persisted redis dataset for the deployed-app env.kv store.
  redis-data:
  verdaccio_storage:
