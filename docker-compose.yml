# zeroship platform — multi-node simulation
#
# Usage:
#   docker compose up -d                          # default: 1 gw + 3 workers
#   docker compose up -d --scale worker=10        # scale to 10 workers
#   docker compose logs -f                        # watch all logs
#   docker compose down -v                        # tear down

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: zeroship
      POSTGRES_DB: zeroship
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  control:
    build: .
    command: >
      zeroship-control
        --port 9090
        --db postgres://postgres:zeroship@postgres:5432/zeroship
        --bundles /data/bundles
        --control-key platform-key
        --master-key master-key
    ports:
      - "9090:9090"
    volumes:
      - bundles:/data/bundles
    security_opt:
      - seccomp:unconfined
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build: .
    entrypoint: /bin/sh
    command:
      - -c
      - |
        sleep 3
        WORKERS=""
        for ip in $$(getent hosts worker | awk '{print $$1}'); do
          [ -n "$$WORKERS" ] && WORKERS="$$WORKERS,"
          WORKERS="$${WORKERS}http://$${ip}:8080"
        done
        [ -z "$$WORKERS" ] && WORKERS="http://worker:8080"
        echo "[gateway] workers: $$WORKERS"
        exec zeroship-gate \
          --port 8000 \
          --control http://control:9090 \
          --control-key platform-key \
          --worker-key worker-key \
          --workers "$$WORKERS" \
          --poll-interval 3 \
          --hydra-public http://hydra:4444 \
          --auth-public http://auth:9092
    ports:
      - "8000:8000"
    security_opt:
      - seccomp:unconfined
    depends_on:
      - control
      - worker

  worker:
    build: .
    # Worker defaults to binding 127.0.0.1 for safety. In the Docker
    # network the gateway reaches the worker via the `worker` DNS name,
    # so we explicitly opt in to 0.0.0.0 AND set a WORKER_KEY — without
    # the key the worker refuses to bind a non-loopback address (to
    # avoid exposing unauthenticated code execution). The key must match
    # the gateway's `--worker-key`.
    command: >
      zeroship-worker
        --port 8080
        --workers 4
        --bind 0.0.0.0
        --worker-key worker-key
        --control http://control:9090
        --control-key platform-key
        --max-isolates 200
        --poll-interval 3
    deploy:
      replicas: 3
    security_opt:
      - seccomp:unconfined
    depends_on:
      - control

  # ory/hydra — OIDC kernel sidecar for crates/auth.
  # public port 4444 (proxied via gateway at auth.zeroship.ai/oauth2/*)
  # admin port 4445 (production: loopback only; in compose we share the network)
  # Config lives at ops/hydra.yaml; secrets come from env.
  hydra:
    image: oryd/hydra:v25.4.0
    depends_on:
      postgres:
        condition: service_healthy
      hydra-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://postgres:zeroship@postgres:5432/zeroship?sslmode=disable
      SECRETS_SYSTEM: ${SECRETS_SYSTEM:-dev-secret-please-change-this-please}
      SECRETS_COOKIE: ${SECRETS_COOKIE:-dev-secret-please-change-this-please}
    volumes:
      - ./ops/hydra.yaml:/etc/config/hydra/hydra.yaml:ro
    command: serve all --dev --config /etc/config/hydra/hydra.yaml
    ports:
      - "4444:4444"
      # Admin port 4445 IS mapped for dev convenience (running smoke
      # tests like `cargo test -p zeroship-auth --test
      # hydra_client_smoke` from the host). In production we bind to
      # 127.0.0.1 and gate access via firewall — the admin API is
      # privileged and must never face the public internet.
      - "4445:4445"

  # One-shot migrator. Runs hydra's own schema migrations into the
  # shared zeroship Postgres database (creates the hydra_* tables
  # alongside the auth.* schema we own).
  hydra-migrate:
    image: oryd/hydra:v25.4.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://postgres:zeroship@postgres:5432/zeroship?sslmode=disable
    command: migrate sql up -e --yes
    restart: on-failure

  # zeroship-sandbox — Docker-backed dev containers for the AI builder.
  # Spawns sibling containers (Docker-out-of-Docker) by mounting
  # /var/run/docker.sock from the host. Bind-mounts the host's
  # /var/zeroship/projects so workspaces survive sandbox restarts AND
  # are reachable directly from the host (the agent's `read_file` /
  # `write_file` ops bypass docker exec for performance).
  sandbox:
    build: .
    command: >
      zeroship-sandbox
    environment:
      SANDBOX_PORT: "9091"
      SANDBOX_TOKEN: sandbox-key
      SANDBOX_IMAGE: zeroship/sandbox-base:latest
      SANDBOX_WORKSPACE_ROOT: /var/zeroship/projects
      SANDBOX_NETWORK: zeroship-sandbox-net
      SANDBOX_AUTO_PULL: "false"
      SANDBOX_IDLE_TIMEOUT_SECS: "1800"
      SANDBOX_MAX_LIFETIME_SECS: "28800"
    ports:
      - "9091:9091"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/zeroship/projects:/var/zeroship/projects
    networks:
      - default
      - zeroship-sandbox-net
    security_opt:
      - seccomp:unconfined

networks:
  zeroship-sandbox-net:
    name: zeroship-sandbox-net
    driver: bridge

volumes:
  bundles:
