packages:
  - "sdks/*"
  - "examples/*"
  # Browser-tier e2e suites (vitest + Playwright). One package, not one per
  # example, so a single run reports every demo's status in one summary.
  - "tests/e2e-browser"
  # The migration engine's TypeScript half: the authoring DSL, the CLI and its
  # live host suite, and the three driver shims. The vite-plugin depends on them
  # by `workspace:*` rather than by an absolute path into a sibling checkout that
  # only exists on one machine - which is what made the sdk CI job unable to
  # install at all.
  - "packages/*"
  # The N-API addon crate is a first-class publishable npm package, so the CLI
  # resolves it as `workspace:*` and pnpm links the built `.node`. It is compiled
  # by `napi build` rather than tsup, but is otherwise an ordinary member.
  - "crates/zeroship-migrate-node"

# Packages permitted to run lifecycle scripts. pnpm 11 renamed this from
# `onlyBuiltDependencies` (a list) to `allowBuilds` (a map), and writes the
# stub above on first install so the choice is explicit rather than inherited.
#
# All three are build tools that link or fetch a native binary in postinstall
# and cannot work without it: @swc/core and esbuild are the TS/JS compilers the
# SDK builds run on, msw installs its service-worker shim. Denying any of them
# breaks the build rather than hardening it.
allowBuilds:
  '@swc/core': true
  esbuild: true
  msw: true

# Centralised dependency versions — referenced as "catalog:" in package.json.
# Default catalog targets React 19; the `react18` named catalog is for
# examples that still pin React 18.
catalog:
  typescript: ~5.9.3
  tsx: ^4.21.0
  vite: ^8.0.0
  "@vitejs/plugin-react": ^6.0.1
  "@types/node": ^22.19.17
  zod: ^3.25.76
  "@tanstack/react-query": ^5.96.1
  react: ^19.2.0
  react-dom: ^19.2.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  clsx: ^2.1.1
  tailwind-merge: ^3.5.0
  tailwindcss: ^4.2.2
  "@tailwindcss/vite": ^4.2.2
  react-router-dom: ^7.14.0

catalogs:
  react18:
    react: ^18.3.1
    react-dom: ^18.3.1
    "@types/react": ^18.3.12
    "@types/react-dom": ^18.3.1
    react-test-renderer: ^18.3.1

# Allowlist of packages permitted to run lifecycle scripts. pnpm 10 blocks
# them by default; setting this now keeps the upgrade smooth.
onlyBuiltDependencies:
  - esbuild
  - msw
  - "@swc/core"
  - playwright
  - playwright-core
  - "@playwright/browser-chromium"
  - "@playwright/browser-firefox"
  - "@playwright/browser-webkit"

# lucide-react ships .d.ts that `import ... from "react"` but declares only a
# `react` peer, not an `@types/react` one. Without this, pnpm leaves its
# private dir with no @types/react, TypeScript walks up to the hoisted
# node_modules/.pnpm/node_modules/@types/react (which resolves to the React 18
# copy the `react18` catalog pulls in), and every consumer on React 19 types
# gets a two-copies-of-ReactNode error. Declaring the type peer as optional
# makes pnpm pick the @types/react of whichever importer pulls lucide-react in.
packageExtensions:
  lucide-react:
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
