name: CI
on: [push, pull_request]

jobs:
  # Commit conventions, in CI as well as in the local commit-msg hook. The hook
  # is the one that matters - it fails at the moment of the mistake - but it
  # only runs where someone has set core.hooksPath, and --no-verify skips it.
  # This is the backstop, and it is cheap: no toolchain, no submodule.
  #
  # MEASURED 2026-08-11: over one week, 59% of subjects exceeded the then-stated
  # 72-char limit and 43 commits carried no scope. The rule existed in
  # CONTRIBUTING.md the whole time and nothing checked it, so it rotted the way
  # every unenforced invariant in this tree has. That is what this job is for.
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the range needs both endpoints
      # Prove the linter can still FAIL before trusting a clean run from it.
      # A gate that accepts everything and a gate that is broken look identical.
      - name: Gate self-test
        run: tests/commit_msg_gate.sh --self-test
      - name: Check the commit messages in this change
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] \
            && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            # New branch, or a force-push whose base is gone. Checking the whole
            # history here would fail on every pre-gate commit, so scope it to
            # the tip and say so rather than reporting a vacuous pass.
            echo "no usable base ref; checking the tip commit only"
            range="${{ github.sha }}~1..${{ github.sha }}"
          fi
          echo "range: $range"
          tests/commit_msg_gate.sh --range "$range"

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The SDK dist files BEFORE any cargo command, and this is not stylistic.
      # zeroship-runtime `include_str!`s sdks/bootstrap/dist/runtime-entry.js,
      # sdks/bootstrap/dist/install-schema.js and sdks/db/dist/internal.js
      # (crates/runtime/src/core/init.rs:391 and
      # crates/runtime/src/core/bootstrap_modules.rs:59,65). Those three are
      # build outputs, gitignored, and have never been tracked in any ref, so a
      # fresh checkout does not have them. There is no build.rs and no cache
      # that supplies them. Measured 2026-08-13 on a clean worktree:
      # `cargo check -p zeroship-runtime` fails with three
      # `couldn't read ...: No such file or directory` errors.
      #
      # `cargo check --workspace` compiles zeroship-runtime because it is a
      # plain `crates/*` member with no `default-members` narrowing, so this job
      # could not have passed a fresh checkout without these steps.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # The vendored engine ships no dist/ and the vite-plugin imports it, so it
      # is built before the SDKs. Same ordering as the `sdk` job.
      - run: pnpm --filter @zeroship/migrate build
      - run: pnpm build
      # This is the no-hoist condition the gate must survive. Prove the root
      # import fails for the expected reason, then prove the declaring package
      # resolves its own dependency before trusting the contract run.
      - name: Prove tsx is package-local
        run: |
          if node --import tsx --eval "" >"$RUNNER_TEMP/root-tsx.out" \
              2>"$RUNNER_TEMP/root-tsx.err"; then
            echo "::error::tsx unexpectedly resolves from the workspace root"
            exit 1
          fi
          if ! grep -q "ERR_MODULE_NOT_FOUND" "$RUNNER_TEMP/root-tsx.err"; then
            cat "$RUNNER_TEMP/root-tsx.err"
            echo "::error::root tsx probe failed for an unexpected reason"
            exit 1
          fi
          pnpm --dir sdks/vite-plugin exec node --import tsx --eval ""
      - name: Build the CLI used by the project config gate
        run: cargo build -p zeroship-cli --bin zeroship
      - name: Project config contract
        run: bash tests/project_config_gate.sh
      # THE BARE TARGET SELECTION IS LOAD-BEARING. Cargo defaults to lib and
      # bins, which is the configuration that ships; adding `--all-targets`
      # would check strictly more code and yet catch strictly less, because a
      # test target in the unit graph unifies dev-dependency features into the
      # normal edge. That is not hypothetical: on 2026-09-04 the shipped
      # binaries had not built for a day while `--all-targets`, `--all-features`,
      # the clippy gate and every `cargo test` reported zero errors. THIS LINE
      # would have caught it (measured: exit 101, three errors). Do not "improve"
      # it. tests/shipped_config_gate.sh below states that contract in a form
      # that survives an edit to this line.
      - run: cargo check --workspace
      # The same configuration, as a gate: it audits cargo's artifact stream
      # against `cargo metadata` so a scheduling abort cannot read as a clean
      # tree, and it asserts that `test-helpers` really resolved OFF for the
      # five members that declare it. The line above reads only an exit code and
      # has no opinion on feature resolution, which is the axis the defect lived
      # on. Twenty seconds; no services, no database.
      - name: shipped configuration compiles
        run: tests/shipped_config_gate.sh
      # The same shipped-vs-test feature split, one member down, read off the
      # EMITTED OBJECT rather than off a comment. zeroship-migrate-node keeps
      # `napi` as a default feature and links its test binaries through
      # `napi/dyn-symbols` declared on the dev-dependency. Both halves are
      # silent when broken: dyn-symbols reaching the shipped cdylib compiles
      # and tests green while producing a .node that resolves N-API through its
      # own loader (measured: `cargo test -p zeroship-migrate-node` exits 0 with
      # all 12 blocks ok while the object's undefined `napi_*` count is 0
      # instead of 52), and losing the dev-dependency returns a 1719-line
      # linker wall that names a symbol but never the manifest.
      - name: napi addon symbol shape
        run: tests/napi_symbol_shape_gate.sh
      # WPT BEFORE `cargo test`, for exactly the reason the SDK dist files are
      # built before any cargo command above, and discovered the same way.
      #
      # crates/runtime declares a `wpt` test target whose 23 modules
      # `include_str!` crates/runtime/tests/wpt/. That directory is fetched on
      # demand by setup-wpt.sh, is in .gitignore, and `git ls-files` reports it
      # in no ref - so a fresh checkout does not have it, and nothing here made
      # one. rust-cache restores ~/.cargo and target/, not source trees.
      #
      # MEASURED 2026-08-20 on 4abf0f74a: with the directory absent,
      # `cargo test --workspace --no-run` fails with 207 `couldn't read
      # crates/runtime/tests/wpt/...` errors and builds no test binary at all
      # for the crate; with it present the same command exits 0 and builds 122.
      # `cargo check --workspace` above does NOT catch this, because without
      # --all-targets it never looks at a test target.
      #
      # So every cargo test step in this job, and the census gate below, could
      # not run. This is not new - the wpt_*.rs files date to 2026-05-01 and
      # were 23 separate auto-discovered targets before 2ee8bba08 consolidated
      # them, each equally uncompilable.
      #
      # Cached on the pin, so the ~1.1 GB working tree is fetched when the pin
      # moves and not once per run. setup-wpt.sh is idempotent: given an
      # existing clone it fetches the pin and resets, which is what makes a
      # restored cache safe rather than merely fast.
      - name: Pin the WPT commit for the cache key
        id: wpt-pin
        run: |
          set -o pipefail
          pin=$(grep -oP 'WPT_COMMIT="\$\{WPT_COMMIT:-\K[0-9a-f]{40}' \
            crates/zeroship-runtime/tests/setup-wpt.sh)
          if [ -z "$pin" ]; then
            echo "::error::could not read the WPT pin out of setup-wpt.sh; the cache key would be a constant and would serve a stale tree forever"
            exit 1
          fi
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: crates/zeroship-runtime/tests/wpt
          key: wpt-${{ steps.wpt-pin.outputs.pin }}
      - name: Fetch the WPT tree the runtime test target include_str!s
        run: ./crates/zeroship-runtime/tests/setup-wpt.sh
      # PROVISION BEFORE TESTING, and this step is what makes the deletion of
      # `ZEROSHIP_REQUIRE_LIVE_BACKENDS` safe here rather than merely correct.
      #
      # The PostgreSQL suites still require the shared provisioner. Redis
      # driver and KV tests start their own servers through Testcontainers.
      #
      # `zeroship-mailer` is the same shape and is why the SMTP sink is in that
      # script's set: its plaintext-transport test is not feature-gated, so
      # `--workspace` builds and runs it here, and it fails without a sink.
      #
      # The SAME script a developer runs, not a `services:` block that would be a
      # second definition of the same servers. `services:` also cannot pass
      # `-c wal_level=logical`. The native data job configures its owned
      # testcontainers separately; this job uses the compose definition.
      - name: Provision the shared test backends (postgres, smtp sink)
        run: bash tests/provision_test_backends.sh
      - name: Install snapshot clients matching the test server
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Install the extensions required by ordinary database tests
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter label=com.docker.compose.service=postgres --format '{{.ID}}')"
          test -n "$pg_container"
          docker exec "$pg_container" bash -c \
            'apt-get update && apt-get install -y --no-install-recommends postgresql-16-pgvector postgresql-16-postgis-3'
          docker exec "$pg_container" psql -U postgres -d zeroship -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector' \
            -c 'CREATE EXTENSION IF NOT EXISTS postgis'
      # The provisioner stands the servers up and writes the overlay; it does
      # not apply the platform corpus, and says so in its own "what it does not
      # provision" header. That was survivable while a target without a migrated
      # database announced a skip. It is not survivable now: those targets
      # REFUSE, so an unmigrated server takes this job red rather than green
      # over tests that never ran. The corpus is a prerequisite of the suite,
      # so it is provisioned like one.
      #
      # The DSN is the provisioner's own default (`PG_DSN` there, from PG_HOST /
      # PG_PORT / PG_USER / PG_PASS / PG_DB). If those defaults move, this moves
      # with them - which is why the applier is named rather than open-coded.
      - name: Apply the platform corpus to the provisioned database
        run: |
          set -o pipefail
          ZEROSHIP_MIGRATE_DSN='postgres://postgres:zeroship@127.0.0.1:5440/zeroship' \
            bash deploy/ops/db-migrate.sh
      # `--no-fail-fast` because cargo otherwise stops at the FIRST failing
      # target and never builds or runs the ones after it. Those targets do not
      # report as failed, they report as nothing at all, so one known-failing
      # unit test can hide every integration suite behind it. The verdict is
      # unchanged either way - the job still fails if anything fails - but
      # without this the run only tells you about the first thing that broke.
      #
      # THE `| tee` THAT STOOD ON THIS LINE AND FIVE OTHERS IS GONE. It wrote a
      # combined log for the skip census at the end of this job to read; the
      # census was deleted and nothing else ever read the file, so what was left
      # was a pipeline whose only remaining effect was to put a second command
      # between cargo and its exit status.
      #
      # `set -o pipefail` stays on every one of those steps, because the reason
      # it was added outlives the pipe: GitHub's default shell is `bash -e`
      # WITHOUT pipefail, so the moment anyone pipes cargo into anything the
      # status reported is the LAST command's - 0 whenever it could write - and
      # every failing test in the workspace sails through as a pass. The billing
      # gate hit that trap and solved it with PIPESTATUS.
      - run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast
      # --no-fail-fast fixes the STOPPING; this fixes the COUNTING. Nothing
      # anywhere records how many test targets there are supposed to be, so a
      # suite that quietly stops being built - a new `required-features` gate, a
      # dropped `[[test]]`, a crate removed from the workspace - produces a
      # smaller run, and a smaller run is indistinguishable from a smaller
      # project. Count the built test executables and fail if the number falls.
      #
      # Deliberately a floor, not an equality: adding targets needs no edit,
      # removing one needs a deliberate edit here. That asymmetry is the point -
      # losing coverage should cost a reviewed change, gaining it should be free.
      # It catches disappearance, not substitution.
      # A comment that cites a design doc is often the only pointer to where a
      # contract or a decision is written down. When the doc moves or is never
      # committed, the citation keeps its form and loses its value: it still
      # reads as "justified elsewhere", so it stops the reader looking, and
      # nothing anywhere notices. One sweep found 23 such citations at once.
      #
      # Excluded by directory, not by matched text: `wpt` is upstream WPT,
      # fetched on demand and kept pristine, whose doc paths are relative to
      # that project rather than ours; `dist`, `node_modules` and `target` hold
      # generated output, where a stale citation is a stale build, not a
      # mistake anyone can fix in place. Filtering the matched path instead of
      # the containing file silently lets all four through, since none of those
      # directory names appear in the cited path.
      # The pattern is ANCHORED (-P, negative lookbehind) and that is load-bearing.
      # Unanchored, it matches a doc path sitting INSIDE a longer path: a GitHub
      # URL, an absolute filesystem path, a vendored copy. This check shipped
      # unanchored and was green because the two doc paths it pulled out of
      # GitHub URLs happened to name local files. It would have failed the first
      # time anyone linked to a doc in another repository, which is the ordinary
      # reason to write a URL rather than a relative path.
      #
      # The `found` floor is the other half. This step counts what is MISSING and
      # passes at zero, so an extraction that yields nothing passes too - a broken
      # pattern, a wrong directory list, or a file the tool declines to read all
      # report a clean tree. Counting what was checked is what tells those apart
      # from a tree that is genuinely clean.
      - name: Doc citations resolve
        run: |
          ROOTS="crates sdks libs tests db examples"
          # The corpus check, and it carries more weight than the count below.
          #
          # A count floor cannot see a DROPPED DIRECTORY. Measured distribution:
          # crates 33, sdks 6, tests 3, examples 1, libs 0, db 0. Rename `sdks/`
          # and 6 citations vanish, leaving ~31 - above any floor loose enough to
          # survive ordinary comment edits. One whole tree skipped, gate green.
          # `libs/` and `db/` yield zero legitimately, which is why the per-root
          # assertion has to be EXISTENCE and not "yielded at least one": a
          # directory with no citations is normal, a directory that is not there
          # is a scan that silently stopped covering it.
          #
          # This is also why the `2>/dev/null` below is safe now and was not
          # before: it swallows grep's "No such file or directory", so a renamed
          # root used to produce a smaller result and no signal at all.
          for r in $ROOTS; do
            if [ ! -d "$r" ]; then
              echo "::error::doc-citation scan lists $r/, which does not exist - the scan silently stopped covering it"
              exit 1
            fi
          done
          missing=0
          found=0
          # The citation scanner and its self-test are excluded for the same
          # reason the scanner excludes them from its own sweep: both spell out
          # paths that deliberately do not exist - examples in one, a planted
          # probe in the other - so scanning them reports a tool describing a
          # path as a file citing one. The self-test's doc-side probe
          # (`docs/reference/zz-…-probe.md`) is exactly such a path, and it
          # failed this step the moment it was added.
          for p in $(grep -rhoP '(?<![A-Za-z0-9_/.-])(?:\.\./)*docs/[A-Za-z0-9_./-]+\.md' \
              --include='*.rs' --include='*.ts' --include='*.js' --include='*.tsx' \
              --include='*.toml' --include='*.sh' \
              --exclude-dir=wpt --exclude-dir=dist \
              --exclude-dir=node_modules --exclude-dir=target \
              --exclude=source_citation_gate.sh \
              --exclude=source_citation_selftest.sh \
              $ROOTS 2>/dev/null \
            | sed 's|^\(\.\./\)*||' | sort -u); do
            found=$((found + 1))
            if [ ! -f "$p" ]; then
              echo "::error::comment cites $p, which does not exist"
              missing=$((missing + 1))
            fi
          done
          # Print the coverage on SUCCESS, not only inside a failure message. A
          # number nobody sees until the gate already failed is a number that
          # cannot warn anyone; this is the channel where a false green differs
          # from a true one.
          echo "doc citations checked: $found across $ROOTS, unresolvable: $missing"
          # With the per-root check above carrying the corpus, this is back to
          # being the degenerate-case guard it was always meant to be: it only
          # has to separate "clean tree" from "the extraction returned nothing".
          # Left loose on purpose - the count moves with any ordinary comment
          # edit, so a tight floor here buys churn rather than coverage.
          if [ "$found" -lt 20 ]; then
            echo "::error::only $found doc citations found (expected ~37); the extraction returned nothing usable, so a clean result would mean nothing"
            exit 1
          fi
          [ "$missing" -eq 0 ]
      # The step above resolves citations that name a FILE. This one resolves
      # citations that name an ITEM, which nothing checked until now: no job ran
      # `cargo doc`, so a rustdoc link pointing at a deleted or renamed symbol
      # was invisible. Two survived that way until 2026-08-07 - `refund.rs`
      # citing a provider module deleted in f975eae8b, and `billing_read.rs`
      # promising a `RegistryError::Pricing` variant that never existed.
      #
      # Runs through a script rather than inline because the measurement has
      # three failure modes that each produce a confident wrong number (warm
      # cache, `-D` truncating the count, and a build that did not run reporting
      # zero warnings). The script's header documents all three and asserts the
      # documented-crate count as the control; see it before touching the floors.
      # The library that lets the live-DB gates say "this did not measure
      # anything" instead of reporting a full disk as a compile failure. Gated
      # here because it is exactly the kind of check that rots unnoticed: it only
      # ever runs on a bad day, so a pattern that silently stopped matching would
      # go undetected until the next time it was needed. The self-test asserts
      # both directions - a full disk IS recognised, and a genuine failure is NOT
      # relabelled as infrastructure - and refuses to pass over zero cases.
      - name: Measurement-integrity self-test
        run: tests/lib_measurement_integrity_selftest.sh
      # Same reasoning one layer over: the dev-readiness diagnosis only prints on
      # a bad day, so a rule that stopped matching would be invisible until the
      # run it was meant to explain. It classifies a TIMEOUT into cold dependency
      # optimisation / port already bound / blocked port / app fault, and getting
      # that wrong is worse than saying nothing, because a confident wrong
      # diagnosis sends the next reader at the wrong layer. Needs no services -
      # pure text in, text out - and refuses to pass over fewer cases than it
      # declares. (#273)
      - name: Dev-readiness diagnosis self-test
        run: tests/lib/dev_ready_selftest.sh
      - name: Doc links resolve
        run: tests/run_doc_gate.sh
      # The source-path half of the citation checks above, in BOTH directions.
      # The step above resolves comments naming a `docs/**.md` file. This one
      # resolves every citation that NAMES A SOURCE FILE, whether it was written
      # in source or in a doc - they rot identically and are read the same way,
      # as "the justification is over there", so a citation pointing at a file
      # that moved stops the reader looking and nothing notices. One sweep of
      # the source side found 82; the doc side, unguarded until 2026-08-10,
      # opened at 116 unresolvable of 943.
      #
      # The doc half deliberately does not cover pre-ship proposals, plans,
      # ADRs, review reports, `archive/`, or any dated `YYYY-MM-DD-*.md` record.
      # Those name a file they intend to create or one that existed at a past
      # HEAD; requiring them to resolve would forbid designing before building
      # and would turn a record of the past into a lie about the present. The
      # script's header carries the full reasoning and the measurements.
      #
      # The script carries its own resolution rules and the reasons each exists;
      # they were measured against this tree rather than assumed, and getting any
      # of them wrong produces a confident wrong answer rather than an obvious
      # one. It also prints the corpus size on success, not only inside a failure
      # message, because a count nobody sees until the gate has already failed
      # cannot warn anyone.
      #
      # Note when this fires: every citation it has ever caught named a REAL file
      # at a wrong address - stale, crate-relative, or reaching into the vendored
      # engine - not an invented one. The first question is "where did this move
      # to", not "does this exist". Deleting the citation is almost always the
      # wrong repair.
      - name: Source citations resolve
        run: tests/source_citation_gate.sh
      # And the control for the step above, for the same reason the
      # measurement-integrity self-test exists: that gate passes at zero
      # unresolvable citations, which is also what a gate that has quietly
      # stopped matching reports. A drifted pattern, a renamed root, a file grep
      # declines to read - all of them look exactly like a clean tree. This
      # plants a citation at a path that does not exist and asserts the gate
      # both NAMES it and exits non-zero, then asserts removing it returns the
      # gate to green. A gate that always fails is as useless as one that
      # always passes.
      - name: Source-citation gate self-test
        run: tests/source_citation_selftest.sh
      # SEC-8. The private registry must not allow open self-registration or
      # $authenticated publish, and its compose port must stay loopback-bound.
      #
      # WIRED 2026-09-04, AND IT HAD NEVER RUN. It was named
      # `verdaccio_config_guard.sh`, so both meta-gates - which take their
      # population from `tests/*_gate.sh` - could not see it, and nothing else
      # asked. The only thing enforcing SEC-8 statically was whoever remembered
      # the script existed. The rename is what turned that from a sentence in a
      # comment into a failure.
      #
      # It parses committed files and needs no registry, which is why it belongs
      # in this job rather than behind a service container.
      - name: Verdaccio registry config is closed
        run: tests/verdaccio_config_gate.sh
      # Three instances in one day (2026-08-10) of a tracked file hardcoding a
      # home directory: a `file:/home/...` dependency that shipped in a
      # published package (#265), a ZEROSHIP_BIN pointing into one home dir, and
      # a doc citation by absolute path. Each is correct on the machine that
      # wrote it and broken everywhere else, which is why no test caught them -
      # the tests run on that machine. Scoped by EXTENSION, not by filename: in
      # prose a path is a citation and rewriting it makes a worse record; in
      # code or config it is a dependency that resolves or does not.
      - name: No hardcoded home paths in source/config
        run: tests/home_path_gate.sh
      # Five shipped `zeroship deploy` instructions named `--key=<master>`, a flag
      # the CLI has never had, and two passed `.` where it takes a path to the
      # built `.zship`. Both fail in a way that never mentions what the creator
      # typed: the arg loop ignores the unknown flag and the command dies on a
      # missing token. Nothing compared these instructions to the binary, so they
      # rotted in place across a flag rename. The allowed set is parsed from the
      # CLI's own help lines rather than listed here - a hand list beside the
      # thing it describes is satisfiable by editing the list, which is the shape
      # this repo has been burned by twice.
      - name: Shipped deploy instructions match the CLI
        run: tests/deploy_instructions_gate.sh
      # These two existed and ran in NO workflow until 2026-08-11. Both were
      # written BECAUSE a specific drift happened - AGENTS.md advertised `build`
      # and `inspect` for months after both were removed; the two [[inject]]
      # ceilings disagreed about system-column defaults and every first insert
      # failed - and a gate that only runs when someone remembers is not much of
      # a gate. Measured before wiring: 33ms and 24ms, pure text, no services.
      #
      # Both proven load-bearing by MY OWN mutation rather than assumed:
      #   adding a `"teleport" =>` dispatch arm makes the index gate name it
      #     ("main.rs dispatches (8) ... AGENTS.md indexes (7) ... teleport")
      #   flipping created_at's `nullable = false` to `true` in ONE ceiling makes
      #     the mirror gate print the drifted line from both sides
      # The mirror-gate mutation is worth a note: my FIRST attempt edited the
      # word `created_at` where it appears in a COMMENT, the gate stayed green,
      # and for a moment that looked like the gate being hollow. The extractor
      # only compares `{ name = ... }` entries, so the mutation never reached
      # the compared region. A mutation that does not apply and a check that
      # does not fire print the same thing.
      - name: AGENTS.md crate index names the commands the CLI has
        run: tests/cli_command_index_gate.sh
      - name: The two [[inject]] ceilings agree
        run: tests/inject_policy_mirror_gate.sh
      # The organization ownership model, in three gates. Each runs its own
      # extractors against a positive and a one-variable control FIRST and
      # refuses if they disagree, because every one of the three is an ABSENCE
      # check over a corpus and an absence check that cannot read its corpus is
      # the cleanest green there is - the ownership gate found exactly that in
      # itself on its first run, a `grep --include` placed after `--` where grep
      # reads it as a filename.
      - name: An app reaches its owner only through its project
        run: tests/organization_ownership_path_gate.sh --self-test
      - name: One ownership path, and no cached authority
        run: tests/organization_ownership_path_gate.sh
      - name: Route and lock extractors discriminate
        run: tests/organization_route_authorization_gate.sh --self-test
      - name: Every mutating organization route is guarded and locks first
        run: tests/organization_route_authorization_gate.sh
      - name: The role ladder and the Cedar bands name the same ranks
        run: tests/organization_policy_ladder_gate.sh
      # THESE THREE LANDED WITHOUT A STEP and tests/ci_wiring_gate.sh has been
      # red on them since. All three are text scans that need no build and no
      # database, so the reason they were unwired was that nobody wired them,
      # which is exactly the state that gate exists to make visible: an
      # uninvoked gate and a clean tree print the same thing.
      - name: The app-id sweep's frontier does not go backwards
        run: tests/app_id_frontier_gate.sh
      - name: Every write that could resurrect a deleted app carries its fence
        run: tests/deleted_app_write_fence_gate.sh
      - name: A credential is minted only from a validating read of its row
        run: tests/mint_reads_row_gate.sh
      # The Cedar schema is the only thing that makes a typo'd action id
      # visible, and strict validation only rules on the ids the POLICIES
      # quote. This compares the schema against the Rust vocabulary and against
      # build_context directly, which is where the ids no band names live -
      # `migrations:approve` among them. Both gaps it catches surface at runtime
      # as a 500 raised before audit_decision, so nothing is written down.
      - name: The schema, the action enum and the request context agree
        run: tests/cedar_schema_vocabulary_gate.sh
      # A `curl -H` whose next word is the URL sends the URL as a header and
      # then has no URL, which most harnesses read as an empty response rather
      # than as a malformed call. Green on this tree; it was never wired.
      - name: Every curl -H in a harness is followed by a header
        run: tests/curl_header_flag_gate.sh
      # Account erasure has to stay REACHABLE: a users foreign key that blocks
      # the delete, or an auth statement naming a table zeroship_auth holds no
      # grant on, both surface only when a real due user is reaped under the
      # real role - which no unit test does, because they all connect as
      # postgres.
      - name: A due user can actually be erased
        run: tests/user_erasure_reachability_gate.sh
      # A control-plane fixture assembled an AuthConfig in Rust and set every
      # secret except the refresh keyring, so its token exchange answered
      # "refresh hash key is not configured" and the one end-to-end proof that
      # a `zeroship login` token authorizes a control endpoint was red. Auth's
      # own boot refuses without those files; a fixture that builds the config
      # by hand skips that refusal. Self-test first: a fixture scan that
      # matches nothing and a tree with no unfenced fixtures print the same
      # thing.
      - name: Session keyring fixture gate self-test
        run: tests/session_keyring_fixture_gate.sh --self-test
      - name: Auth fixtures that drive a token exchange configure a keyring
        run: tests/session_keyring_fixture_gate.sh
      # THE TWO SKIP-MARKER STEPS THAT STOOD HERE ARE GONE with the gate they
      # ran, and with the whole skip protocol: a test that cannot reach its
      # backend now fails, so there is no marker for a gate to police and no
      # census for a marker-less skip to hide from.
      #
      # The gate's own history is the sharpest example this file has of a check
      # that examined nothing, and it is why the surviving gates all declare
      # per-arm counts. Measured 2026-08-20 on the real tree: 8 rows found, 0
      # removed by the marker filter, all 8 removed by an ALLOW list of bare
      # path prefixes - so the run ruled on nothing and printed exactly what a
      # clean tree prints. tests/gate_arm_census.sh exists because of it and
      # still names it.
      #
      # A `//` comment in dispatch.rs said the transparent WebSocket proxy was
      # wired in a `proxy::` helper. That name existed in exactly one place in
      # the repo: the comment claiming it. It sat 760 lines from the function
      # that returns 501 and says the proxy does not exist, so the file
      # contradicted itself and the false half read first.
      #
      # Nothing could see it. A `//` comment is not a doc comment, so neither
      # rustdoc's intra-doc gate (tests/run_doc_gate.sh above) nor the citation
      # gates look at it. Text-only, runs no gateway.
      #
      # The gate watched that ONE identifier, so after the fix it examined zero
      # names and reported the same green it reports on a clean file. Measured
      # 2026-08-20 while it said "0 mention(s), 0 definition(s) -- no phantom":
      # three more comment-only names were live in that file, one of them nine
      # lines from the fix. Arm 1 now checks every backticked name the file
      # cites. Self-test first, because a detector that matches nothing and a
      # file with no phantoms print the same thing.
      - name: WS stub gate self-test
        run: tests/ws_subscription_stub_gate.sh --self-test
      - name: websocket subscription stub agrees with what describes it
        run: tests/ws_subscription_stub_gate.sh
      - name: Deleted database full-text search stays deleted
        run: tests/db_fts_deletion_gate.sh
      # The same shape as the WS stub above, one layer up: a comment ASSERTING
      # that two crates stay in agreement, with nothing enforcing it. Found ten
