name: CI
on: [push, pull_request]

# Toolchain jobs run inside the flake's devShell, so the environment has one
# definition. `nix develop` is required for the native build inputs and not only
# for Rust: `rdkafka` is configured with `cmake-build`, so `rdkafka-sys` compiles
# librdkafka and needs `curl/curl.h`, which the devShell supplies through
# `curl.dev`. Anything that builds the workspace needs those inputs, which is why
# every job opts in instead of only the Rust steps.
#
# pnpm comes from the devShell as well. It is a devShell entry, so it is first on
# PATH, and pnpm then switches itself to the `package.json#packageManager`
# version, which is what keeps that field the pin CI runs.
# libtest gives every test its own thread, and a spawned thread's default stack
# is a fraction of the main thread's. A test deep enough to exhaust it does not
# fail: it aborts the process, libtest never prints a result line, and a summary
# that counts those lines scores the aborted target as zero failures. The floor
# lives here rather than beside a step because the steps that need it are the
# ones invoking cargo directly - `cargo test --workspace` reaches every member,
# while `cargo xtask` steps carry their own floor from the harness.
env:
  RUST_MIN_STACK: "33554432"

defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-toolchain
      # Build SDK sources before Cargo: zeroship-data-v8 embeds the database facade.
      # runtime entry, and zeroship-data-v8 embeds the DB internal adapter.
      # These gitignored build outputs are absent from a fresh checkout.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # The vendored engine ships no dist/ and the vite-plugin imports it, so it
      # is built before the SDKs. Same ordering as the `sdk` job.
      - run: pnpm --filter @zeroship/migrate build
      - run: pnpm build
      # This is the no-hoist condition the gate must survive. Prove the root
      # import fails for the expected reason, then prove the declaring package
      # resolves its own dependency before trusting the contract run.
      - name: Prove tsx is package-local
        run: |
          if node --import tsx --eval "" >"$RUNNER_TEMP/root-tsx.out" \
              2>"$RUNNER_TEMP/root-tsx.err"; then
            echo "::error::tsx unexpectedly resolves from the workspace root"
            exit 1
          fi
          if ! grep -q "ERR_MODULE_NOT_FOUND" "$RUNNER_TEMP/root-tsx.err"; then
            cat "$RUNNER_TEMP/root-tsx.err"
            echo "::error::root tsx probe failed for an unexpected reason"
            exit 1
          fi
          pnpm --dir packages/vite-plugin exec node --import tsx --eval ""
      - name: Project config schema and generator
        run: |
          node --test schema/codegen.test.mjs
          node schema/codegen.mjs --check
      - name: Project config Rust behavior
        run: |
          cargo test --locked -p zeroship-cli --bin zeroship project_config::tests
          cargo test --locked -p zeroship-cli --test deploy_test
      - name: Project config build behavior
        run: >-
          pnpm --dir packages/vite-plugin exec node --import tsx --test
          test/project-config.test.ts test/zship.test.ts
      # Keep test targets out of this build: their dev-dependency features may
      # unify into normal dependencies and hide a broken shipped configuration.
      - name: Shipped Rust targets compile
        run: cargo check --locked --workspace --lib --bins
      # The owning crate checks the shipped-vs-test feature split against the
      # emitted object. Its integration target links through the dev-only
      # `napi/dyn-symbols`, then builds the shipped library configuration and
      # verifies that the Node host must resolve the imported API while the
      # addon exports its registrar.
      - name: napi addon symbol shape
        run: cargo test --locked -p zeroship-migrate-node --test shipped_symbol_shape
      # WPT BEFORE `cargo test`, for exactly the reason the SDK dist files are
      # built before any cargo command above, and discovered the same way.
      #
      # crates/runtime declares a `wpt` test target whose 23 modules
      # `include_str!` crates/runtime/tests/wpt/. That directory is fetched on
      # demand by setup-wpt.sh, is in .gitignore, and `git ls-files` reports it
      # in no ref - so a fresh checkout does not have it, and nothing here made
      # one. rust-cache restores ~/.cargo and target/, not source trees.
      #
      # MEASURED 2026-08-20 on 4abf0f74a: with the directory absent,
      # `cargo test --workspace --no-run` fails with 207 `couldn't read
      # crates/runtime/tests/wpt/...` errors and builds no test binary at all
      # for the crate; with it present the same command exits 0 and builds 122.
      # `cargo check --workspace` above does NOT catch this, because without
      # --all-targets it never looks at a test target.
      #
      # So every cargo test step in this job could
      # not run. This is not new - the wpt_*.rs files date to 2026-05-01 and
      # were 23 separate auto-discovered targets before 2ee8bba08 consolidated
      # them, each equally uncompilable.
      #
      # Cached on the pin, so the ~1.1 GB working tree is fetched when the pin
      # moves and not once per run. setup-wpt.sh is idempotent: given an
      # existing clone it fetches the pin and resets, which is what makes a
      # restored cache safe rather than merely fast.
      - name: Pin the WPT commit for the cache key
        id: wpt-pin
        run: |
          set -o pipefail
          pin=$(grep -oP 'WPT_COMMIT="\$\{WPT_COMMIT:-\K[0-9a-f]{40}' \
            crates/zeroship-runtime/tests/setup-wpt.sh)
          if [ -z "$pin" ]; then
            echo "::error::could not read the WPT pin out of setup-wpt.sh; the cache key would be a constant and would serve a stale tree forever"
            exit 1
          fi
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: crates/zeroship-runtime/tests/wpt
          key: wpt-${{ steps.wpt-pin.outputs.pin }}
      - name: Fetch the WPT tree the runtime test target include_str!s
        run: ./crates/zeroship-runtime/tests/setup-wpt.sh
      # PROVISION BEFORE TESTING, and this step is what makes the deletion of
      # `ZEROSHIP_REQUIRE_LIVE_BACKENDS` safe here rather than merely correct.
      #
      # The PostgreSQL suites still require the shared provisioner. Redis
      # driver and KV tests start their own servers through Testcontainers.
      #
      # Mailer owns its PostgreSQL and SMTP fixtures through Testcontainers.
      #
      # The SAME script a developer runs, not a `services:` block that would be a
      # second definition of the same servers. `services:` also cannot pass
      # `-c wal_level=logical`. The native data job configures its owned
      # testcontainers separately; this job uses the compose definition.
      - name: Provision the shared PostgreSQL test backend
        run: bash tests/provision_test_backends.sh
      - name: Install the extensions required by ordinary database tests
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter label=com.docker.compose.service=postgres --format '{{.ID}}')"
          test -n "$pg_container"
          docker exec "$pg_container" bash -c \
            'apt-get update && apt-get install -y --no-install-recommends postgresql-16-pgvector postgresql-16-postgis-3'
          docker exec "$pg_container" psql -U postgres -d zeroship -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector' \
            -c 'CREATE EXTENSION IF NOT EXISTS postgis'
      # The provisioner stands the servers up and writes the overlay; it does
      # not apply the platform corpus, and says so in its own "what it does not
      # provision" header. That was survivable while a target without a migrated
      # database announced a skip. It is not survivable now: those targets
      # REFUSE, so an unmigrated server takes this job red rather than green
      # over tests that never ran. The corpus is a prerequisite of the suite,
      # so it is provisioned like one.
      #
      # The DSN is the provisioner's own default (`PG_DSN` there, from PG_HOST /
      # PG_PORT / PG_USER / PG_PASS / PG_DB). If those defaults move, this moves
      # with them - which is why the applier is named rather than open-coded.
      - name: Apply the platform corpus to the provisioned database
        run: |
          set -o pipefail
          ZEROSHIP_MIGRATE_DSN='postgres://postgres:zeroship@127.0.0.1:5440/zeroship' \
            bash deploy/ops/db-migrate.sh
      # `--no-fail-fast` because cargo otherwise stops at the FIRST failing
      # target and never builds or runs the ones after it. Those targets do not
      # report as failed, they report as nothing at all, so one known-failing
      # unit test can hide every integration suite behind it. The verdict is
      # unchanged either way - the job still fails if anything fails - but
      # without this the run only tells you about the first thing that broke.
      #
      # THE `| tee` THAT STOOD ON THIS LINE AND FIVE OTHERS IS GONE. It wrote a
      # combined log for the skip census at the end of this job to read; the
      # census was deleted and nothing else ever read the file, so what was left
      # was a pipeline whose only remaining effect was to put a second command
      # between cargo and its exit status.
      #
      # `set -o pipefail` stays on every one of those steps, because the reason
      # it was added outlives the pipe: GitHub's default shell is `bash -e`
      # WITHOUT pipefail, so the moment anyone pipes cargo into anything the
      # status reported is the LAST command's - 0 whenever it could write - and
      # every failing test in the workspace sails through as a pass. The billing
      # gate hit that trap and solved it with PIPESTATUS.
      # The workflow environment example is a fixture ARTIFACT that the workflow
      # control tests read from ZEROSHIP_WORKFLOW_TEST_ENVIRONMENT_BIN. `cargo
      # test` does not build `[[example]]` targets and `CARGO_BIN_EXE_` is not
      # set for them, so the workspace test below needs it built and named here.
      - name: Build the workflow environment fixture artifact
        run: |
          cargo build -p zeroship-control --example workflow-test-environment
          echo "ZEROSHIP_WORKFLOW_TEST_ENVIRONMENT_BIN=$PWD/target/debug/examples/workflow-test-environment" >> "$GITHUB_ENV"
      - run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast
      # The step above resolves citations that name a FILE. This one resolves
      # citations that name an ITEM, which nothing checked until now: no job ran
      # `cargo doc`, so a rustdoc link pointing at a deleted or renamed symbol
      # was invisible. Two survived that way until 2026-08-07 - `refund.rs`
      # citing a provider module deleted in f975eae8b, and `billing_read.rs`
      # promising a `RegistryError::Pricing` variant that never existed.
      #
      # Runs through a script rather than inline because the measurement has
      # three failure modes that each produce a confident wrong number (warm
      # cache, `-D` truncating the count, and a build that did not run reporting
      # zero warnings). The script's header documents all three and asserts the
      # documented-crate count as the control; see it before touching the floors.
      - name: Rustdoc links resolve with default features
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --locked --no-deps --workspace
      - name: Rustdoc links resolve with all features
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --locked --no-deps --workspace --all-features
      - name: Data architecture and database posture
        run: cargo xtask test data-architecture
      - name: KV storage remains independent of the V8 binding
        run: cargo test -p zeroship-kv --test architecture
      - name: Repository dependency and feature contracts
        run: cargo xtask test repository
      # deploy/compose/docker-compose.yml HAS NO AUTOMATED CHECK as of
      # 2026-08-21. Four steps stood here - named volumes on stateful services,
      # 0.0.0.0 published only by the edge, secret strength, and a worker flag
      # that no longer exists - and were deleted with the
      # crates/zeroship-gatekit gates behind them, as a complexity-budget
      # decision about that crate rather than a finding that the checks were
      # wrong. The properties they held are unguarded; each had caught a real
      # defect (PGDATA in the container's writable layer; a 10-byte shared secret
      # against a 32-byte minimum).
      #
      # THE ONE STEP IN THIS JOB THAT USES DOCKER, and it has to.
      # crates/control/src/reserved_names.rs decides which app names creators
      # may not take by reading deploy/ops/caddy-claimed-hosts.json - the
      # Caddyfile as `caddy adapt` lowers it. Its cargo test binds the artifact
      # to the Caddyfile's sha256, so an edge edit without a regenerate is
      # already red there. What that test structurally CANNOT check is whether
      # the artifact is what Caddy actually produces: a hand-edited JSON with
      # an untouched Caddyfile keeps the sha valid. Only re-running the adapter
      # catches it, and only this step does that.
      #
      # It REFUSES rather than skips when caddy and docker are both absent. A
      # gate that quietly does nothing when its tool is missing prints the same
      # green as one that ran.
      - name: edge claimed-host artifact is what caddy makes of the Caddyfile
        run: deploy/ops/caddy-claimed-hosts.sh --check
      # Data tests own PostgreSQL containers and run without optional features.
      - run: |
          set -o pipefail
          cargo test -p zeroship-data-v8 --lib tests::sqlite::
          cargo test -p zeroship-data-orm
      # compio-postgres' `tls` feature has never been compiled by any workflow,
      # let alone run: `tls` appeared ZERO times in .github/ until this step.
      # The default feature set is empty, so `cargo test --workspace` above
      # builds none of it - the rustls connector, the six-mode verification
      # policy and its unit tests are otherwise only type-checked by the
      # all-features rustdoc invocation above.
      #
      # This is the step that runs the certificate-verifier proofs. They need no
      # server: they drive the real verifiers, through the real mode-to-verifier
      # selection, against certificates committed under tests/data/. That is
      # deliberate - the live suite below needs Docker and four containers,
      # and the one thing that must never regress unnoticed is which verifier
      # `verify-full` gets.
      - run: |
          set -o pipefail
          cargo test -p compio-postgres --features tls
      # The live half: the four servers `tls_live_setup.sh` stands up, and the
      # 22 checks that read `pg_stat_ssl` to find out what transport the SERVER
      # thinks it is serving. `--features live-tls-tests` is what builds the
      # target at all; without it cargo skips it silently, which is why it is
      # named here rather than left to the feature unification above.
      #
      # `sudo` is used by the setup script to chmod the server keys to
      # root:<postgres gid> 0640, which PostgreSQL insists on. GitHub runners
      # have passwordless sudo and Docker.
      - name: Provision the TLS test servers
        run: bash libs/compio-postgres/tests/tls_live_setup.sh
      - run: |
          set -o pipefail
          cargo test -p compio-postgres --features tls,live-tls-tests --test tls_live \
            -- --test-threads=1
      - name: Tear down the TLS test servers
        if: always()
        run: bash libs/compio-postgres/tests/tls_live_setup.sh --down
      # Cargo propagates lint and compilation failures using workspace lint levels.
      - name: Clippy across workspace targets and features
        run: cargo clippy --workspace --all-targets --all-features

  # Required billing and migration verification. Rust fixtures own PostgreSQL
  # and Redpanda, while xtask builds the migration host before running the crates.
  # The job name is kept because branch protection references it.
  billing-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-toolchain
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run billing tests with owned services
        run: cargo xtask test billing

  # Auth packages own their PostgreSQL, SMTP and HTTP fixtures.
  auth-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-toolchain
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run native auth tests with owned services
        run: cargo xtask test auth

  # Native data tests own their PostgreSQL fixture and real CDC relay process.
  data-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-toolchain
      # Build the SDK modules embedded by the V8 runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zeroship/migrate build
      - run: pnpm build
      - name: Run native data tests with owned PostgreSQL
        run: cargo xtask test data
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-test-results
          path: target/nextest/data/junit.xml

  # Worker fixtures own their databases and apply the platform corpus.
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-toolchain
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run native worker tests with owned services
        run: cargo xtask test worker

  # Gate the SDK type-level + unit suites. In particular this runs
  # @zeroship/migrate's `check` (tsc + the `tsconfig.types.json`
  # `@ts-expect-error` structural-safety / names-stay-strings suite) and its
  # node:test suite, so the tsc-as-assertion structural proof can no longer
  # silently rot - the assertion is now gated, not human-run-only.
  sdk:
    runs-on: ubuntu-latest
    steps:
      # This checkout once omitted submodules, which was invisible until the
      # engine became a workspace member: the vendored tree came up empty, the
      # workspace globs matched nothing, and install failed on an unresolvable
      # link. The engine is in-tree now, so nothing here depends on a submodule.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-toolchain
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # The vendored engine ships no dist/ (it is gitignored there and built
      # from source), so it has to be built before anything that imports it.
      - run: pnpm --filter @zeroship/migrate build
      # The migrate type layer reads @zeroship/db's built types; build SDKs first.
      - run: pnpm build
      # Ticket #267 - @zeroship/db's base `typecheck` (`tsc --noEmit`) reads
      # `include: ["src"]`, so nothing under tests/ was ever in the tsc
      # program: `tsc --noEmit --listFiles` showed 0 files under tests/,
      # so the several tests/*.test.ts files carrying `@ts-expect-error`
      # type-only assertions were checked by NOTHING (`npm test` runs them
      # through tsx, which strips types without checking them). `check`
      # additionally runs `tsconfig.tests.json` (extends the base config,
      # widens `include` to `["src", "tests"]`, drops rootDir/outDir),
      # mirroring the @zeroship/migrate pattern below.
      - run: pnpm --filter @zeroship/db run check
      - run: pnpm --filter @zeroship/migrate run check
      # Package tests use their own fixtures, so they cannot detect drift in
      # committed generated artifacts under examples. Compare those artifacts
      # directly against the current policy, renderer, and migration engine.
      - name: Committed gen-types artifacts are not stale
        run: pnpm gen-types:check
      # Run SDK and migration package suites in the job that builds their
      # artifacts. The Vite plugin's manual-schema fixtures currently fail
      # during generation; focused Vite contracts run above. Example and browser
      # suites require provisioned process-level harnesses and stay outside this
      # SDK command.
      - name: JavaScript suites
        run: |
          pnpm -r --no-bail --filter='./packages/*' --filter='!@zeroship/vite-plugin' --filter='!@zeroship/migrate' --filter='!zero-migrate-cli' --filter='!zeroship-migrate-node' test
          pnpm --filter @zeroship/migrate test
          pnpm --filter zero-migrate-cli test
          pnpm --filter zeroship-migrate-node test
