name: CI
on: [push, pull_request]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings

  # The billing & metering money-path integration suite talks to a real
  # Postgres and drives the REAL fleet-wide cron sweeps (reconcile, spend
  # recompute, stream forwarder). Its tests are DB-gated: without CONTROL_TEST_DB
  # they self-skip, so `cargo test --workspace` above never exercises them.
  # tests/run_billing_suite.sh provisions the DB, exports CONTROL_TEST_DB, and
  # runs each money-path binary SERIALLY (the fleet sweeps are advisory-locked
  # single-flight and cannot run two-at-a-time). This job is what actually gates
  # the F1-F5 billing regression tests on push/PR.
  billing-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: zeroship
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # Real Kafka-wire broker so run_billing_suite.sh exercises the real stream
      # path (rewind/seek + the wired producer->recompute->spend e2e), not just
      # the in-process memory transport. Launched as a step (not a `services:`
      # entry) because it needs an explicit --advertise-kafka-addr that GitHub
      # service containers cannot set. Mirrors the docker-compose `redpanda`.
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:latest \
            redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M \
            --node-id 0 --check=false \
            --kafka-addr external://0.0.0.0:19092 \
            --advertise-kafka-addr external://127.0.0.1:19092 \
            --set redpanda.auto_create_topics_enabled=true
          for i in $(seq 1 40); do
            if docker exec redpanda rpk cluster health --exit-when-healthy; then exit 0; fi
            sleep 3
          done
          echo "redpanda failed to become healthy" >&2; docker logs redpanda; exit 1
      - name: Run the billing money-path gate
        run: tests/run_billing_suite.sh
        env:
          PG_HOST: localhost
          PG_PORT: 5440
          PG_USER: postgres
          PG_PASS: zeroship
          REDPANDA_BROKERS: 127.0.0.1:19092

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd web/dashboard && npm ci && npx tsc --noEmit && npx vite build

  # Gate the SDK type-level + unit suites. In particular this runs
  # @zeroship/migrate's `check` (tsc + the PR5 tsconfig.types.json
  # `@ts-expect-error` structural-safety / names-stay-strings suite) and its
  # node:test suite, so the tsc-as-assertion structural proof can no longer
  # silently rot — the assertion is now gated, not human-run-only.
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # The migrate type layer reads @zeroship/db's built types; build SDKs first.
      - run: pnpm build
      - run: pnpm --filter @zeroship/migrate run check
      - run: pnpm --filter @zeroship/migrate test

  e2e:
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release --bin zeroship
      - run: cd web/dashboard && npm ci
      - run: |
          mkdir -p /tmp/e2e/data
          echo 'var __rpc = { ping: function() { return "pong"; } };' > /tmp/e2e/server.js
          cd /tmp/e2e && ZEROSHIP_MASTER_KEY=ci-key $GITHUB_WORKSPACE/target/release/zeroship serve server.js --port=3335 &
          sleep 3
          cd $GITHUB_WORKSPACE/web/dashboard && npx playwright install --with-deps chromium
          npx playwright test e2e/backend-api.spec.ts
