      # decision 2026-09-04 was to keep the property and mechanise it. Shrink-only
      # baseline: additions refused, removals accepted with a note. Self-test
      # first, because a detector that matches nothing and an engine holding no
      # new SQL print the same thing.
      - name: Decision four gate self-test
        run: tests/decision_four_gate.sh --self-test
      - name: No new production SQL statement text in the data engine
        run: tests/decision_four_gate.sh
      # DECISION 5's GATE HAD NEVER RUN HERE. It was written on 2026-09-01, it
      # is named in the comment above as the thing decision 4 lacked, and the
      # only occurrence of its filename in this workflow was that comment - so
      # for three days the gate that refuses a vendor type in a non-vendor crate
      # was enforced by whoever remembered to run it. That is the same failure
      # the meta-gate below exists for, one level up: a gate nobody invokes and
