name: CI
on: [push, pull_request]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      # `--no-fail-fast` because cargo otherwise stops at the FIRST failing
      # target and never builds or runs the ones after it. Those targets do not
      # report as failed, they report as nothing at all, so one known-failing
      # unit test can hide every integration suite behind it. The verdict is
      # unchanged either way - the job still fails if anything fails - but
      # without this the run only tells you about the first thing that broke.
      #
      # Tee'd into a log so the skip census at the end of this job can read it.
      # `set -o pipefail` is load-bearing: GitHub's default shell is `bash -e`
      # WITHOUT pipefail, so `cargo test | tee` would report tee's status, which
      # is 0 whenever tee could write - and every failing test in the workspace
      # would sail through as a pass. The billing gate hit this exact trap and
      # solved it with PIPESTATUS; pipefail is the same fix in one line.
      - run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee -a "$RUNNER_TEMP/rust-tests.log"
      # --no-fail-fast fixes the STOPPING; this fixes the COUNTING. Nothing
      # anywhere records how many test targets there are supposed to be, so a
      # suite that quietly stops being built - a new `required-features` gate, a
      # dropped `[[test]]`, a crate removed from the workspace - produces a
      # smaller run, and a smaller run is indistinguishable from a smaller
      # project. Count the built test executables and fail if the number falls.
      #
      # Deliberately a floor, not an equality: adding targets needs no edit,
      # removing one needs a deliberate edit here. That asymmetry is the point -
      # losing coverage should cost a reviewed change, gaining it should be free.
      # It catches disappearance, not substitution.
      # A comment that cites a design doc is often the only pointer to where a
      # contract or a decision is written down. When the doc moves or is never
      # committed, the citation keeps its form and loses its value: it still
      # reads as "justified elsewhere", so it stops the reader looking, and
      # nothing anywhere notices. One sweep found 23 such citations at once.
      #
      # Excluded by directory, not by matched text: `wpt` is upstream WPT,
      # fetched on demand and kept pristine, whose doc paths are relative to
      # that project rather than ours; `dist`, `node_modules` and `target` hold
      # generated output, where a stale citation is a stale build, not a
      # mistake anyone can fix in place. Filtering the matched path instead of
      # the containing file silently lets all four through, since none of those
      # directory names appear in the cited path.
      # The pattern is ANCHORED (-P, negative lookbehind) and that is load-bearing.
      # Unanchored, it matches a doc path sitting INSIDE a longer path: a GitHub
      # URL, an absolute filesystem path, a vendored copy. This check shipped
      # unanchored and was green because the two doc paths it pulled out of
      # GitHub URLs happened to name local files. It would have failed the first
      # time anyone linked to a doc in another repository, which is the ordinary
      # reason to write a URL rather than a relative path.
      #
      # The `found` floor is the other half. This step counts what is MISSING and
      # passes at zero, so an extraction that yields nothing passes too - a broken
      # pattern, a wrong directory list, or a file the tool declines to read all
      # report a clean tree. Counting what was checked is what tells those apart
      # from a tree that is genuinely clean.
      - name: Doc citations resolve
        run: |
          ROOTS="crates sdks libs tests db examples"
          # The corpus check, and it carries more weight than the count below.
          #
          # A count floor cannot see a DROPPED DIRECTORY. Measured distribution:
          # crates 33, sdks 6, tests 3, examples 1, libs 0, db 0. Rename `sdks/`
          # and 6 citations vanish, leaving ~31 - above any floor loose enough to
          # survive ordinary comment edits. One whole tree skipped, gate green.
          # `libs/` and `db/` yield zero legitimately, which is why the per-root
          # assertion has to be EXISTENCE and not "yielded at least one": a
          # directory with no citations is normal, a directory that is not there
          # is a scan that silently stopped covering it.
          #
          # This is also why the `2>/dev/null` below is safe now and was not
          # before: it swallows grep's "No such file or directory", so a renamed
          # root used to produce a smaller result and no signal at all.
          for r in $ROOTS; do
            if [ ! -d "$r" ]; then
              echo "::error::doc-citation scan lists $r/, which does not exist - the scan silently stopped covering it"
              exit 1
            fi
          done
          missing=0
          found=0
          for p in $(grep -rhoP '(?<![A-Za-z0-9_/.-])(?:\.\./)*docs/[A-Za-z0-9_./-]+\.md' \
              --include='*.rs' --include='*.ts' --include='*.js' --include='*.tsx' \
              --include='*.toml' --include='*.sh' \
              --exclude-dir=wpt --exclude-dir=dist \
              --exclude-dir=node_modules --exclude-dir=target \
              $ROOTS 2>/dev/null \
            | sed 's|^\(\.\./\)*||' | sort -u); do
            found=$((found + 1))
            if [ ! -f "$p" ]; then
              echo "::error::comment cites $p, which does not exist"
              missing=$((missing + 1))
            fi
          done
          # Print the coverage on SUCCESS, not only inside a failure message. A
          # number nobody sees until the gate already failed is a number that
          # cannot warn anyone; this is the channel where a false green differs
          # from a true one.
          echo "doc citations checked: $found across $ROOTS, unresolvable: $missing"
          # With the per-root check above carrying the corpus, this is back to
          # being the degenerate-case guard it was always meant to be: it only
          # has to separate "clean tree" from "the extraction returned nothing".
          # Left loose on purpose - the count moves with any ordinary comment
          # edit, so a tight floor here buys churn rather than coverage.
          if [ "$found" -lt 20 ]; then
            echo "::error::only $found doc citations found (expected ~37); the extraction returned nothing usable, so a clean result would mean nothing"
            exit 1
          fi
          [ "$missing" -eq 0 ]
      # The step above resolves citations that name a FILE. This one resolves
      # citations that name an ITEM, which nothing checked until now: no job ran
      # `cargo doc`, so a rustdoc link pointing at a deleted or renamed symbol
      # was invisible. Two survived that way until 2026-08-07 - `refund.rs`
      # citing a provider module deleted in f975eae8b, and `billing_read.rs`
      # promising a `RegistryError::Pricing` variant that never existed.
      #
      # Runs through a script rather than inline because the measurement has
      # three failure modes that each produce a confident wrong number (warm
      # cache, `-D` truncating the count, and a build that did not run reporting
      # zero warnings). The script's header documents all three and asserts the
      # documented-crate count as the control; see it before touching the floors.
      # The library that lets the live-DB gates say "this did not measure
      # anything" instead of reporting a full disk as a compile failure. Gated
      # here because it is exactly the kind of check that rots unnoticed: it only
      # ever runs on a bad day, so a pattern that silently stopped matching would
      # go undetected until the next time it was needed. The self-test asserts
      # both directions - a full disk IS recognised, and a genuine failure is NOT
      # relabelled as infrastructure - and refuses to pass over zero cases.
      - name: Measurement-integrity self-test
        run: tests/lib_measurement_integrity_selftest.sh
      - name: Doc links resolve
        run: tests/run_doc_gate.sh
      # The source-path half of the citation checks above. That step resolves
      # comments naming a `docs/**.md` file; this one resolves comments naming a
      # source file, which rot identically and are read the same way - as "the
      # justification is over there" - so a citation pointing at a file that
      # moved stops the reader looking and nothing notices. One sweep found 82.
      #
      # The script carries its own resolution rules and the reasons each exists;
      # they were measured against this tree rather than assumed, and getting any
      # of them wrong produces a confident wrong answer rather than an obvious
      # one. It also prints the corpus size on success, not only inside a failure
      # message, because a count nobody sees until the gate has already failed
      # cannot warn anyone.
      #
      # Note when this fires: every citation it has ever caught named a REAL file
      # at a wrong address - stale, crate-relative, or reaching into the vendored
      # engine - not an invented one. The first question is "where did this move
      # to", not "does this exist". Deleting the citation is almost always the
      # wrong repair.
      - name: Source citations resolve
        run: tests/source_citation_scan.sh
      # And the control for the step above, for the same reason the
      # measurement-integrity self-test exists: that gate passes at zero
      # unresolvable citations, which is also what a gate that has quietly
      # stopped matching reports. A drifted pattern, a renamed root, a file grep
      # declines to read - all of them look exactly like a clean tree. This
      # plants a citation at a path that does not exist and asserts the gate
      # both NAMES it and exits non-zero, then asserts removing it returns the
      # gate to green. A gate that always fails is as useless as one that
      # always passes.
      - name: Source-citation gate self-test
        run: tests/source_citation_selftest.sh
      - name: Test-target enumeration floor
        run: |
          # Keep stderr and check it, rather than discarding it. This step counts
          # what got BUILT, so anything that stops the build - a compile error, a
          # full disk, a killed rustc - removes executables and shrinks the
          # count. Discarding stderr made those indistinguishable from coverage
          # loss, and the failure message then blames the wrong thing.
          #
          # Measured, not hypothetical: running this locally on a disk that had
          # just hit 100 percent reported 213 against a floor of 245. Nothing had
          # been deleted; rustc could not write. The number was real and meant
          # nothing.
          #
          # No `--keep-going` here: cargo 1.94.0 accepts it on `cargo build` but
          # NOT on `cargo test`, so its presence made this step exit with
          # "unexpected argument" on every run - a gate that could never pass,
          # reported as a build failure. It was added to stop one broken package
          # masking the targets of every package after it, and the failure branch
          # below already covers that: a build that does not complete exits here
          # instead of reaching the count, so a short count from a partial build
          # is not a state this step can report as coverage loss.
          set -o pipefail
          if ! cargo test --workspace --no-run --message-format=json \
              >"$RUNNER_TEMP/targets.json" 2>"$RUNNER_TEMP/targets.err"; then
            echo "::error::the test build failed, so the target count below would measure the build and not the coverage"
            grep -E '^error' "$RUNNER_TEMP/targets.err" | sort -u | head -20
            exit 1
          fi
          count=$(grep -o '"executable":"[^"]*"' "$RUNNER_TEMP/targets.json" \
            | grep -v '"executable":null' \
            | sort -u | wc -l)
          # Floor set below the local measurement (261) because the count is
          # environment-sensitive (feature resolution, optional deps) and the CI
          # number has never been observed. The step prints the real count: once a
          # run has shown it, raise this to that number to make the check tight.
          #
          # 290 -> 245 when the live-database gate landed. The local measurement
          # fell 306 -> 261, exactly the 45 targets that now carry
          # `required-features = ["live-db-tests"]` (44 zeroship-control
          # integration binaries + zeroship-migrated's apply_api_test). Those are
          # the targets that panic on connect without a PostgreSQL, which this
          # job does not provision; they are built and run by the billing-gate
          # job instead. The floor moves by the measured delta and no further -
          # it is not slack, and nothing else was allowed to disappear behind it.
          # 245 -> 250: the local measurement moved 261 -> 266 as test targets were
          # added, so the floor moves by that same +5 and no further. It is still
          # NOT tight, and deliberately so - the count is environment-sensitive
          # (feature resolution, optional deps) and no CI run has ever reported
          # its own number, which is the only thing that would justify fitting
          # this to the real value. The step prints the count on every run; the
          # first CI number that appears is what to set here.
          floor=250
          echo "test targets built: $count (floor $floor)"
          if [ "$count" -lt "$floor" ]; then
            echo "::error::built test targets ($count) fell below the floor ($floor); a suite stopped being built"
            exit 1
          fi
      # `cargo test --workspace` SKIPS any target whose `required-features` are
      # not enabled, and skips it silently - the target is never built, so it
      # contributes no test count and no failure. plugin-db puts three suites
      # behind `test-helpers`, which is why none of them have ever run here.
      #
      # Only the SQLite one is listed: it needs no server and passes 124 tests
      # in about 20 seconds, so it is real coverage this job was missing. Its
      # two siblings (`integration`, `native_transaction`) need a live
      # PostgreSQL that this job does not provision, and they belong with the
      # other live-database gates rather than here.
      - run: |
          set -o pipefail
          cargo test -p zeroship-plugin-db --features test-helpers --test sqlite_integration 2>&1 \
            | tee -a "$RUNNER_TEMP/rust-tests.log"
      # Same shape one level down: the platform-migrate suite is a single
      # `#[cfg(feature = "platform-cli")]` module, so without the feature it
      # compiled away and the target ran empty - "running 0 tests ... ok".
      # It now declares the requirement, so `cargo test --workspace` skips it
      # rather than reporting a pass it did not earn, and this step is what
      # actually runs it. The tests needing a live server skip internally; the
      # rest do not.
      - run: |
          set -o pipefail
          cargo test -p zeroship-migrate-adapter --features platform-cli --test platform_migrate 2>&1 \
            | tee -a "$RUNNER_TEMP/rust-tests.log"
      # Every test above that returned early because its backend was absent is
      # inside the "N passed" totals and inside this job's green tick. Nothing
      # said so until this step: Rust cannot mark a test ignored at RUNTIME, so
      # the harness has already committed to counting it by the time the body
      # discovers the variable is unset.
      #
      # This job provisions NO backend at all, so a census here is expected to be
      # non-zero - the 9 PG-gated proofs in the platform-migrate step above
      # always skip, because ZERO_MIGRATE_TEST_PG_URL is set nowhere in this
      # repo. It REPORTS and does not fail, on purpose. Failing a job that
      # deliberately stands up no services would make the only honest outcome a
      # red tick, and the fix people would reach for is deleting the check.
      # Whether CI should provision any of these is an operator decision; this
      # step exists so that decision is made against a number instead of a
      # silence.
      #
      # `if: always()` so the census still prints when a test above failed. A
      # skip and a failure are different problems and the run should surface
      # both, not let the first one seen hide the other.
      - name: Skip census (tests that ran but exercised nothing)
        if: always()
        run: |
          . tests/lib/skip_census.sh
          zs_skip_census "$RUNNER_TEMP/rust-tests.log" || true
          if [ "${ZS_SKIP_COUNT:-0}" -gt 0 ]; then
            echo "::notice title=Skipped live-backend tests::${ZS_SKIP_COUNT} test(s) passed without exercising anything; see the Skip census step."
          fi
      # The lint policy lives in the root Cargo.toml `[workspace.lints]` table:
      # `clippy::all` is deny, `pedantic` and `nursery` are warn. Passing
      # `-D warnings` here would flatten that grading and promote every pedantic
      # and nursery warning to a hard error, which the workspace does not satisfy.
      # Run `cargo clippy --workspace --all-targets` to see where it currently
      # stands. Let the declared levels decide: deny-level lints still fail here.
      #
      # `--all-targets` only reaches targets whose `required-features` are
      # satisfied, so the 45 live-database test files would silently stop being
      # linted the moment they were gated - a second, quieter coverage loss on
      # top of the one the floor above measures. Naming the feature keeps
      # exactly the set that was linted before still linted.
      - run: >
          cargo clippy --workspace --all-targets
          --features zeroship-control/live-db-tests,zeroship-migrated/live-db-tests

  # The live-database gate. zeroship-control and zeroship-migrated between them
  # hold 45 test targets that dial a real Postgres and panic on connect without
  # one - the billing money path (which additionally drives the advisory-locked
  # fleet-wide cron sweeps), plus deploy, oauth, device, token, admin, bootstrap,
  # registry and workflow suites. They carry
  # `required-features = ["live-db-tests"]`, so the `rust` job above skips them;
  # this job provisions the database and is what actually runs them.
  #
  # The set it runs is the set that is gated, by construction: the script issues
  # `cargo test -p <crate> --features live-db-tests`, which runs every target in
  # the crate whose required-features are satisfied. There is no name list, so
  # nothing can be gated out of the default build and land in neither job - which
  # is exactly how fifteen non-billing control suites went unrun before.
  #
  # The job name is kept because branch protection references it.
  billing-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: zeroship
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # Real Kafka-wire broker so run_billing_suite.sh exercises the real stream
      # path (rewind/seek + the wired producer->recompute->spend e2e), not just
      # the in-process memory transport. Launched as a step (not a `services:`
      # entry) because it needs an explicit --advertise-kafka-addr that GitHub
      # service containers cannot set. Mirrors the docker-compose `redpanda`.
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:latest \
            redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M \
            --node-id 0 --check=false \
            --kafka-addr external://0.0.0.0:19092 \
            --advertise-kafka-addr external://127.0.0.1:19092 \
            --set redpanda.auto_create_topics_enabled=true
          for i in $(seq 1 40); do
            if docker exec redpanda rpk cluster health --exit-when-healthy; then exit 0; fi
            sleep 3
          done
          echo "redpanda failed to become healthy" >&2; docker logs redpanda; exit 1
      - name: Run the live-database gate
        run: tests/run_billing_suite.sh
        env:
          PG_HOST: localhost
          PG_PORT: 5440
          PG_USER: postgres
          PG_PASS: zeroship
          REDPANDA_BROKERS: 127.0.0.1:19092

  # The auth tests resolve their database from AUTH_DB_URL and return early when
  # it is unset, which cargo reports as a pass. `cargo test --workspace` above
  # therefore proves nothing about them. tests/run_auth_suite.sh provisions an
  # isolated database, runs the suite against it, and fails if any test reports
  # that it skipped, so a missing database cannot masquerade as a pass.
  auth-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: zeroship
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run the auth live-database gate
        run: tests/run_auth_suite.sh
        env:
          PG_HOST: localhost
          PG_PORT: 5440
          PG_USER: postgres
          PG_PASS: zeroship

  # Gate the SDK type-level + unit suites. In particular this runs
  # @zeroship/migrate's `check` (tsc + the `tsconfig.types.json`
  # `@ts-expect-error` structural-safety / names-stay-strings suite) and its
  # node:test suite, so the tsc-as-assertion structural proof can no longer
  # silently rot - the assertion is now gated, not human-run-only.
  sdk:
    runs-on: ubuntu-latest
    steps:
      # The only checkout in this file that used to omit submodules, which was
      # invisible until the vendored engine became a workspace member: without
      # it, `third_party/zero-migrate` is an empty directory, the workspace
      # globs match nothing, and install fails on an unresolvable link.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # The vendored engine ships no dist/ (it is gitignored there and built
      # from source), so it has to be built before anything that imports it.
      - run: pnpm --filter zero-migrate build
      # The migrate type layer reads @zeroship/db's built types; build SDKs first.
      - run: pnpm build
      - run: pnpm --filter @zeroship/migrate run check
      # Until now this job ran exactly one JavaScript suite, and could not
      # install to reach even that, so no JS test in this repo has ever gated a
      # merge. @zeroship/db alone is 503 tests. That is the mechanism behind two
      # defects already found: the db suite sat at over a hundred failures long
      # enough that nobody noticed, and the vite-plugin shipped a dependency it
      # never declared.
      #
      # Written as exclusions, not an allow-list, so a new package is gated the
      # day it appears rather than the day someone remembers to add it. The
      # three below are excluded by name because they fail today for one shared
      # reason, and each exclusion is a debt with an owner:
      #
      #   zero-migrate           vendored third-party code at a pinned commit.
      #                          Its suite is not ours to gate; it became
      #                          visible only because the pin joined the
      #                          workspace.
      #   @zeroship/migrate      6 golden/drift failures. Its fixtures resolve
      #                          into third_party/zero-migrate, so they compare
      #                          committed artifacts against that same pin.
      #   @zeroship/vite-plugin  7 failures, and they are TWO causes, not one.
      #                          2 are drift (env.db.ts committed vs fresh).
      #                          The other 5 are not drift at all: gen-types
      #                          hard-errors with `fold: constraint
      #                          posts_authorId_fkey already exists on posts`
      #                          and produces no artifact, so there is nothing
      #                          for a committed one to have drifted from.
      #                          Measured 2026-08-09; any manual schema.ts
      #                          with a single relation reproduces it, and a
      #                          schema with an explicit t.id() and no t.ref()
      #                          does not. See task #219.
      #
      # The drift ones are the committed generated artifacts having drifted
      # from the vendored engine, and settling which engine commit is
      # authoritative resolves them. That does NOT clear all three exclusions:
      # the 5 fold failures survive it untouched, because regenerating cannot
      # fix a generator that refuses to generate. Whoever regenerates on this
      # note alone will see them still red.
      #
      # Regenerate WITH CARE even for the drift ones: the fresh env.db.ts is
      # emptier than the committed artifact (a bare `//` where the
      # @zeroship/db import belongs), so the gate is right that they differ
      # and wrong about which side is correct. Fix the renderer first. See
      # task #220.
      #
      # The @zeroship/migrate line above is unverified by me and left as
      # written; only the vite-plugin claim was measured.
      #
      # Runs through a script rather than inline so the result can be COUNTED.
      # `pnpm -r` skips a package whose `test` script is renamed or removed, in
      # silence - measured, and invisible here because the filter selects 41
      # projects of which only 16 run a suite at all. The script carries the
      # filters and the floors; see its header for what it does and does not
      # catch.
      - name: JavaScript suites
        run: tests/run_js_suite.sh
