      # those had cited a guard that needed `--features test-helpers` plus a live
      # PostgreSQL and could not have caught the divergence that had already
      # shipped. The gate is a ratchet over a ledger of every such claim, not a
      # semantic judge. Self-test first: an extractor that matches nothing and a
      # tree whose every claim is ledgered print the same thing.
      - name: Sync claim gate self-test
        run: tests/sync_claim_gate.sh --self-test
      - name: Every cross-crate agreement claim is on the ledger
        run: tests/sync_claim_gate.sh
      # Decision 4 of docs/proposals/2026-08-31-data-crate-shape.md - "no SQL and
      # no dialect knowledge in the engine" - had NOTHING enforcing it, while
      # decision 5 beside it had tests/vendor_embedding_gate.sh. The asymmetry
