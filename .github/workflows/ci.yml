name: CI
on: [push, pull_request]

# Toolchain jobs run inside the flake's devShell, so the environment has one
# definition. `nix develop` is required for the native build inputs and not only
# for Rust: `rdkafka` is configured with `cmake-build`, so `rdkafka-sys` compiles
# librdkafka and needs `curl/curl.h`, which the devShell supplies through
# `curl.dev`. Anything that builds the workspace needs those inputs, which is why
# every job opts in instead of only the Rust steps.
#
# Node.js and pnpm come from the devShell as well. pnpm is a devShell entry, so
# it is first on PATH, and pnpm then switches itself to the
# `package.json#packageManager` version, which is what keeps that field the pin
# CI runs. Docker is the one tool the flake does not carry: it stays a host
# service, and the jobs that own containers use the runner's daemon.
#
# `pipefail` is part of the shell, because bash's default reports a pipeline's
# LAST command: a test command piped into anything would report the pipe's
# status, and every failing test would pass.
#
# Every test runs in exactly one `test (<shard>)` job. The shards are declared
# once, in xtask/src/shards.rs; the plan job prints them and the test job's
# matrix reads that output. `cargo xtask test repository` fails when a
# workspace package with tests is in no shard or in two, when the test job's
# shape could skip a shard, or when another job here runs a workspace
# package's tests; the one deliberate exception is `miri`, which interprets a
# few unit tests the shards also run natively. The `verify` job then checks
# what every shard actually ran against what it builds.
#
# CI builds dependencies without debuginfo (`.github/cargo-ci.toml`, which the
# setup action installs as the runner's cargo config), so the cached dependency
# artifacts fit the Actions cache budget.

defaults:
  run:
    shell: nix develop --command bash -eo pipefail {0}

jobs:
  # Lists the shards and makes sure the fixture image cache exists before any
  # shard restores it. The images are pulled only here, only when the list in
  # zeroship_testkit_server::images changes, and only the references the
  # previous cache lacks.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      images-key: ${{ steps.images.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
          workspaces: xtask -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: shards
        run: echo "shards=$(cargo xtask shards list)" >> "$GITHUB_OUTPUT"
      # The list is every base image and every fetching recipe's content-hashed
      # reference, so a recipe edit moves the key as a base bump does.
      - id: images
        run: |
          cargo xtask images list > "$RUNNER_TEMP/fixture-images.txt"
          echo "key=fixture-images-$(sha256sum "$RUNNER_TEMP/fixture-images.txt" | cut -c1-16)" \
            >> "$GITHUB_OUTPUT"
      - id: lookup
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/fixture-images.tar.zst
          key: ${{ steps.images.outputs.key }}
          lookup-only: true
      - name: Restore the previous fixture images
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/fixture-images.tar.zst
          key: ${{ steps.images.outputs.key }}
          restore-keys: fixture-images-
      # Pulls only the base images the previous cache lacks, and builds only the
      # fetching recipes it lacks: this is the one place a CI run reaches a
      # registry or a package mirror for a fixture.
      - name: Pull and build the fixture images the cache lacks
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/fixture-images.tar.zst"
          if [ -f "$archive" ]; then
            zstd -dc "$archive" | docker load
            rm "$archive"
          fi
          cargo xtask images pull
          cargo xtask images check
          mapfile -t references < "$RUNNER_TEMP/fixture-images.txt"
          docker save "${references[@]}" | zstd -T0 -3 -o "$archive"
          ls -l "$archive"
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/fixture-images.tar.zst
          key: ${{ steps.images.outputs.key }}

  # One job per shard. The contract in xtask/tests/repository/shards.rs holds
  # this job's shape exactly: the matrix is the plan's list with nothing added
  # or removed, and nothing here may skip the shard or forgive its failure.
  test:
    name: test (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Restore only: the cargo-cache job saves this entry, built from every
      # shard's selection, so every shard finds the dependencies its own
      # feature resolution compiles.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shards
          workspaces: |
            . -> target
            xtask -> target
          save-if: false
      - uses: ./.github/actions/fixture-images
        with:
          key: ${{ needs.plan.outputs.images-key }}
      # Build the JavaScript packages before Cargo. zeroship-data-v8 embeds the
      # DB adapter bundle with `include_str!`, and its test module embeds the
      # built DB SDK bundle too. Both are gitignored, so a fresh checkout has
      # neither. The root `build` script is the one definition of the package
      # build order.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run the shard
        env:
          SHARD: ${{ matrix.shard }}
        run: cargo xtask test "$SHARD"
      - name: Upload the shard's reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.shard }}
          path: target/nextest/ci/
          if-no-files-found: error

  # What the shards actually ran, checked against what they build: every
  # shard reported, each ran exactly the tests its build lists, no test ran in
  # two shards, and every test target cargo declares is in one shard. It runs
  # whatever happened to the shards, so a missing shard is a red verify.
  verify:
    needs: [plan, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
          workspaces: xtask -> target
          save-if: false
      - uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          path: reports
          merge-multiple: true
      - name: Every shard ran exactly what it builds
        run: cargo xtask shards verify reports

  # Builds every shard's artifacts and saves the one dependency cache the
  # shards restore. It runs beside the shards rather than before them: a shard
  # restores the entry the previous main build saved. On an exact hit there is
  # nothing new to save, so it builds nothing.
  cargo-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Every shard's artifacts share one target directory here, which needs
      # more disk than a shard does. The runner image's own SDKs are unused:
      # the toolchains come from the flake.
      - name: Free the disk the runner image's SDKs take
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: ./.github/actions/setup
      - id: cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: shards
          workspaces: |
            . -> target
            xtask -> target
          cache-on-failure: true
      - if: steps.cargo.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.cargo.outputs.cache-hit != 'true'
        run: pnpm build
      - name: Build every shard
        if: steps.cargo.outputs.cache-hit != 'true'
        run: |
          for shard in $(cargo xtask shards list | jq -r '.[]'); do
            cargo xtask test "$shard" --build-only
          done
          du -sh target

  # The Actions cache budget, measured: every entry this repository holds and
  # their total, after the jobs that save one. `cargo-cache` saves only on
  # main, so a main run is the one that measures the shard dependency entry.
  cache-budget:
    needs: [plan, test, verify, cargo-cache, checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Actions cache entries and their total
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 1000 --json key,sizeInBytes,ref \
            > "$RUNNER_TEMP/caches.json"
          jq -r '.[] | [.sizeInBytes, .ref, .key] | @tsv' "$RUNNER_TEMP/caches.json" | sort -rn \
            | awk -F'\t' '{ printf "%10.1f MiB  %s  %s\n", $1 / 1048576, $2, $3 }'
          jq -r '"\(length) entries, \(map(.sizeInBytes) | add / 1073741824 * 100 | floor / 100) GiB in total"' \
            "$RUNNER_TEMP/caches.json"

  # Everything that is not a test of a workspace package: generator checks,
  # the shipped build, documentation links, the repository-wide contracts, and
  # clippy. Every step after the build carries `!cancelled()`, so one failure
  # does not skip the checks behind it - a skipped step reports nothing.
  # `!cancelled()` rather than `always()`: a cancelled run should stop.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
          workspaces: |
            . -> target
            xtask -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # This is the no-hoist condition the gate must survive. Prove the root
      # import fails for the expected reason, then prove the declaring package
      # resolves its own dependency before trusting the contract run.
      - name: Prove tsx is package-local
        if: ${{ !cancelled() }}
        run: |
          if node --import tsx --eval "" >"$RUNNER_TEMP/root-tsx.out" \
              2>"$RUNNER_TEMP/root-tsx.err"; then
            echo "::error::tsx unexpectedly resolves from the workspace root"
            exit 1
          fi
          if ! grep -q "ERR_MODULE_NOT_FOUND" "$RUNNER_TEMP/root-tsx.err"; then
            cat "$RUNNER_TEMP/root-tsx.err"
            echo "::error::root tsx probe failed for an unexpected reason"
            exit 1
          fi
          pnpm --dir packages/vite-plugin exec node --import tsx --eval ""
      - name: Project config schema and generator
        if: ${{ !cancelled() }}
        run: |
          node --test schema/codegen.test.mjs
          node schema/codegen.mjs --check
      # These artifacts are TRACKED, so the build-input walker cannot hold them:
      # it compares mtimes, and checkout order makes an mtime meaningless for a
      # tracked file. `--check` compares content instead: does the committed
      # artifact still match what its sources generate.
      - name: Workflow schema artifacts match their sources
        if: ${{ !cancelled() }}
        run: |
          node crates/zeroship-workflow-schema/schema/generate.mjs --check
          node crates/zeroship-workflow-manager/schema/generate.mjs --check
          node crates/zeroship-workflow-manager/schema/deployments/generate.mjs --check
          node --test crates/zeroship-workflow-manager/schema/generate.test.mjs
      - name: Project config build behavior
        if: ${{ !cancelled() }}
        run: >-
          pnpm --dir packages/vite-plugin exec node --import tsx --test
          test/project-config.test.ts test/zship.test.ts
      # Keep test targets out of this build: their dev-dependency features may
      # unify into normal dependencies and hide a broken shipped configuration.
      - name: Shipped Rust targets compile
        if: ${{ !cancelled() }}
        run: cargo check --locked --workspace --lib --bins
      # No other job runs `cargo doc`, so a rustdoc link pointing at a deleted
      # or renamed symbol is otherwise invisible.
      - name: Rustdoc links resolve with default features
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --locked --no-deps --workspace
      - name: Rustdoc links resolve with all features
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --locked --no-deps --workspace --all-features
      - name: Data architecture and database posture
        if: ${{ !cancelled() }}
        run: cargo xtask test data-architecture
      - name: Repository dependency, feature and shard contracts
        if: ${{ !cancelled() }}
        run: cargo xtask test repository
      # No CI job runs a Playwright suite, so this is where a flake.lock bump
      # that leaves the workspace's Playwright behind fails.
      - name: Playwright matches the development shell's browsers
        if: ${{ !cancelled() }}
        run: cargo xtask test playwright-browsers
      # crates/zeroship-control/src/reserved_names.rs decides which app names
      # creators may not take by reading deploy/ops/caddy-claimed-hosts.json -
      # the Caddyfile as `caddy adapt` lowers it. Its cargo test binds the
      # artifact to the Caddyfile's sha256, so an edge edit without a
      # regenerate is already red there. What that test structurally CANNOT
      # check is whether the artifact is what Caddy actually produces: only
      # re-running the adapter catches a hand-edited JSON, and only this step
      # does that. It runs the compose file's caddy image through the runner's
      # Docker, and REFUSES rather than skips when caddy and docker are both
      # absent.
      - name: edge claimed-host artifact is what caddy makes of the Caddyfile
        if: ${{ !cancelled() }}
        run: deploy/ops/caddy-claimed-hosts.sh --check
      # The root Cargo.toml sets lint severity; a blanket `-D warnings` would
      # turn intentionally warning-level groups into errors.
      - name: Clippy across workspace targets and features
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features

  # Gate the SDK type-level and unit suites. This includes @zeroship/migrate's
  # `check` (tsc plus the `tsconfig.types.json` `@ts-expect-error`
  # structural-safety and names-stay-strings suite) and its node:test suite, so
  # the tsc-as-assertion structural proof is a CI gate.
  #
  # zero-migrate-cli's host suite starts PostgreSQL and MySQL through
  # testcontainers-node, which also starts its reaper, so this job restores the
  # fixture images and stops the daemon from pulling, like the shards.
  sdk:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
          workspaces: xtask -> target
          save-if: false
      - uses: ./.github/actions/fixture-images
        with:
          key: ${{ needs.plan.outputs.images-key }}
      - run: pnpm install --frozen-lockfile
      # The checks below resolve workspace packages through their built types:
      # @zeroship/migrate's `check` reads @zeroship/schema's.
      - run: pnpm build
      # @zeroship/db's base `typecheck` reads `include: ["src"]`, so its
      # tests/*.test.ts `@ts-expect-error` assertions are outside that program,
      # and `npm test` runs them through tsx, which strips types without
      # checking them. `check` additionally runs `tsconfig.tests.json`, which
      # widens `include` to `["src", "tests"]`.
      - run: pnpm --filter @zeroship/db run check
      - run: pnpm --filter @zeroship/migrate run check
      # The dev-bundle fixture the CLI's workflow suite runs under tsx is a
      # .ts file, and tsx strips types without checking them, so a
      # buildDevBundle signature change would otherwise reach a Rust suite as
      # a runtime TypeError. This tsc program typechecks the fixture.
      - run: pnpm --filter @zeroship/vite-plugin run check
      # Package tests use their own fixtures, so they cannot detect drift in
      # committed generated artifacts under examples. Compare those artifacts
      # directly against the current policy, renderer, and migration engine.
      - name: Committed gen-types artifacts are not stale
        run: pnpm gen-types:check
      # One step per suite, each carrying `!cancelled()`: by default a failing
      # suite skips the rest of the job, which would let one suite's failure
      # hide every later suite's result. Example and browser suites need a
      # provisioned live platform and run by hand (`cargo xtask test
      # examples`).
      - name: JavaScript package suites
        if: ${{ !cancelled() }}
        run: pnpm -r --no-bail --filter='./packages/*' --filter='!@zeroship/vite-plugin' --filter='!@zeroship/migrate' --filter='!zero-migrate-cli' --filter='!zeroship-migrate-node' test
      - name: '@zeroship/migrate suite'
        if: ${{ !cancelled() }}
        run: pnpm --filter @zeroship/migrate test
      - name: zero-migrate-cli suite
        if: ${{ !cancelled() }}
        run: pnpm --filter zero-migrate-cli test
      - name: zeroship-migrate-node suite
        if: ${{ !cancelled() }}
        run: pnpm --filter zeroship-migrate-node test
      # Every example opts into static verification by declaring a `typecheck`
      # script. The loop discovers those examples from package metadata, so a
      # new example is gated without editing this workflow. A failing example
      # does not stop the loop, so one run reports every example that fails
      # rather than only the first.
      - name: Example packages typecheck
        if: ${{ !cancelled() }}
        run: |
          set -u
          failed=0
          for dir in examples/*/; do
            [ -f "$dir/package.json" ] || continue
            if ! node -e "const s = require('./$dir/package.json').scripts; process.exit(s && s.typecheck ? 0 : 1)"; then
              continue
            fi
            echo "::group::typecheck $dir"
            if ! (cd "$dir" && pnpm typecheck); then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  # Coverage-guided fuzzing for the compio-postgres wire decoders. The fuzz
  # crate is excluded from the Cargo workspace, so `cargo fuzz` builds it in its
  # own workspace under the flake's `fuzz` shell, which carries the nightly
  # toolchain `-Zsanitizer=address` needs. A panic or hang is a decoder bug; a
  # decoding error is not, so a clean exit is the whole verdict.
  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop .#fuzz --command bash -eo pipefail {0}
        working-directory: libs/compio-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Smoke-fuzz the backend frame decoder
        run: cargo fuzz run backend_message -- -max_total_time=60
      - name: Smoke-fuzz the pgoutput decoder
        run: cargo fuzz run pgoutput -- -max_total_time=60

  # Miri interprets the workspace's pure `unsafe` code and fails on undefined
  # behaviour. Only the unit tests that drive a package's unsafe blocks are run:
  # the rest of the suite needs V8, io_uring, FFI or syscalls, which Miri cannot
  # execute. The flake's `miri` shell carries the toolchain, so nothing is
  # installed ad hoc. Each package is its own step so one failure does not hide
  # the others.
  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: nix develop .#miri --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: compio-postgres waker vtables and TLS buffer commit
        if: ${{ !cancelled() }}
        run: |
          cargo miri test -p compio-postgres --lib cloning_
          cargo miri test -p compio-postgres --features tls --lib commit_declares
      - name: zeroship-data-orm AEAD key zeroizes on drop
        if: ${{ !cancelled() }}
        run: |
          cargo miri test -p zeroship-data-orm --lib aead_key_zeroizes
      - name: zeroship-runtime entropy buffer volatile zeroize
        if: ${{ !cancelled() }}
        run: |
          cargo miri test -p zeroship-runtime --lib zeroize_slice
