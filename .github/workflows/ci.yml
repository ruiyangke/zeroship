      - name: No non-vendor crate embeds a vendor type
        run: tests/vendor_embedding_gate.sh
      # THE STEP ABOVE WAS THE VISIBLE HALF OF A LARGER MISS. Measuring "which
      # gates does this workflow actually run" on 2026-09-04 found TWELVE of the
      # 37 gates in tests/ wired nowhere - a third of them - and not one of the
      # twelve appeared in this file even as a comment, so no reader was going
      # to trip over them the way vendor_embedding was tripped over. Eight of
      # them read text or cargo metadata and cost seconds; they are here. Two
      # need a warm cargo cache and are wired at the end of this job. One needs
      # a database of its own and carries its reason on the allowlist in
      # tests/ci_wiring_gate.sh - the step that makes this question mechanical
      # instead of something somebody remembers to ask.
      # SELF-TEST FIRST, and this one had been written and never run. The gate's
      # own header said "Run the detector's own positive/control pair: this
      # script --self-test" while the only invocation in this file was the bare
      # run below - so the pair that proves its fence and YAML filters are
      # SELECTIVE, rather than blind, was enforced by whoever remembered. Its
      # markdown pair is what notices `fenced_only` inverting: measured 2026-09-04
      # with the in-block state flipped, the bare run's doc arm went 11 -> 10 and
      # EXITED 0, while the self-test went red on three cases - both halves of
      # that pair and the DELETED control beside it.
      - name: Cargo package spec gate self-test
        run: tests/cargo_package_spec_gate.sh --self-test
      - name: Every cargo -p spec in the repo names a real package
        run: tests/cargo_package_spec_gate.sh
      - name: The data crates cannot reach a driver or the V8 runtime
        run: tests/data_crate_closure_gate.sh
      - name: KV storage remains independent of the V8 binding
        run: cargo test -p zeroship-kv --test architecture
      - name: No feature routes onto a dev-only dependency
        run: tests/dev_dep_feature_route_gate.sh
      # TWO STEPS, and the split is the point. The bare run passes at zero bad
      # citations, which is also what an extractor that stopped matching prints;
      # its arm floors catch a collapse to nothing but cannot see ONE capability
      # going missing inside a population that is mostly something else. Measured
      # 2026-09-04: deleting the line-number group from the extractor removes
      # every line check the gate performs and takes its AGENTS.md arm from 77 to
      # 76 - green at floor 30. The self-test plants a citation one line past
      # end-of-file and requires a refusal, with the eof citation beside it as the
      # control, so the capability is bound rather than counted.
      - name: Doc citation gate self-test
        run: tests/doc_citation_gate.sh --self-test
      - name: Every path and line a document cites exists
        run: tests/doc_citation_gate.sh
      - name: The napi addon's declared and exported functions agree
        run: tests/napi_export_parity_gate.sh
      - name: No cfg pair whose two arms declare the identical item
        run: tests/noop_cfg_pair_gate.sh
      - name: Compose ships a finite max_slot_wal_keep_size
        run: tests/compose_db_posture_gate.sh
      - name: No platform column is stored beside its own hash
        run: tests/secret_beside_its_hash_gate.sh
      # Arm 2 of this one was RED on main the whole time it was unwired:
      # ZEROSHIP_SESSION_SECRET sat in its inventory and in
      # docs/reference/env-vars.md's "surviving test-only names" with no reader
      # anywhere, the SQLite session minter having gone with the HMAC session
      # anchor deleted on 2026-08-27. A gate nobody runs does not stay green, it
      # stays UNREAD.
      - name: Test-only env names are declared, and every declared one is read
        run: tests/test_only_env_gate.sh
      # THE META-GATE. `ws_subscription_stub_gate.sh`, run earlier in this job,
      # is one of four gates found vacuous on
      # 2026-08-20 - an arm watching a single identifier the fix had deleted,
      # examining 0 names and printing green. THIS SAID "the step above" until
      # 2026-09-04, and by then two later gates had been inserted between the
      # referent and the sentence, so it named decision_four_gate.sh - a gate
      # that did not exist on 2026-08-20. A positional reference in a file
      # people insert steps into decays on its own. The other three were skip_marker
      # (8 hits, 8 excused, 0 ruled on), deploy_scripts' argv scan (1 pre-filter
      # row, on the one service the filter excludes) and compose_secret_strength
      # (rule set regexed out of another file's message; the message improved).
      # Every one of them printed what a clean tree prints.
      #
      # So each gate now declares, per arm, how many items that arm ruled on
      # and a floor that number must clear. The floors live in the gates, beside
      # the code that produces the number; this step checks the PROPERTY - that
      # every gate participates - and holds no table of expected counts, because
      # such a table is the census that goes stale, which is the failure mode
      # four OTHER gates hit the same week when two new crates landed.
      #
      # STATIC by design. The per-arm floors are enforced at the point of
      # measurement by tests/lib/gate_arms.sh, in each gate's own CI step above
      # and below, which is where the diagnosis is. This reads text: no docker,
      # no database, no cargo. It was a 959-line Rust crate until 2026-08-21,
      # which is a lot of workspace member to read shell scripts with.
      - name: Every gate declares how much each of its arms examined
        run: tests/gate_arm_census.sh tests
      # THE OTHER META-GATE, and the one that would have caught the
      # vendor_embedding miss. `gate_arm_census.sh` above asks whether every
      # gate declares arms; `ci_invocable_gate.sh` below asks whether what this
      # workflow NAMES can execute. Neither asks whether every gate is named at
      # all - a gate absent from this file contributes nothing to
      # ci_invocable's count and so nothing for it to miss. That question had
      # gone unasked since the first gate landed, and the answer on 2026-09-04
      # was twelve.
      #
      # SELF-TEST FIRST, and here it is the whole gate. The miss it exists for
      # was a filename present in this file and present only in a COMMENT, so a
      # predicate built on "does the name appear" reports that gate as wired
      # and the gate is decorative. The self-test drives nine one-variable
      # cases through the same extractor the real run uses - a run: step and
      # the same line commented out, a command in a `run: |` block and the same
      # line behind a `#`, a path run and the same path passed to grep.
      #
      # It rules on itself, which is the point: this step is what stops the
      # next gate from being enforced by whoever remembers.
      - name: CI wiring gate self-test
        run: tests/ci_wiring_gate.sh --self-test
      - name: Every gate is run by a workflow, or allowlisted with a reason
        run: tests/ci_wiring_gate.sh
      # NOTHING IN THIS REPO BUILDS THE PLATFORM IMAGE. Measured 2026-08-11:
      # grep over .github/workflows/*.yml for `deploy/Dockerfile`, `docker build`
      # and `docker compose` returns ZERO hits, so the deploy path AGENTS.md
      # documents has carried no instrument at all. It had been unbuildable since
      # 8dbe4a8d4 extracted apps/zeroship-builder while the Dockerfile kept
      # COPYing apps/ - `"/apps": not found`, found by running it on a real host.
      #
      # This is the cheap lint, NOT a substitute for building the image: it reads
      # text, runs no docker, and proves only that the context paths resolve and
      # that .cargo/ reaches the stage that links. Building the image in CI costs
      # a full Rust + V8 compile and is the thorough answer; this is what would
      # have caught the two defects that actually happened, in under a second.
      - name: deploy/Dockerfile COPY paths resolve
        run: tests/dockerfile_copy_paths_gate.sh
      # deploy/compose/docker-compose.yml HAS NO AUTOMATED CHECK as of
      # 2026-08-21. Four steps stood here - named volumes on stateful services,
      # 0.0.0.0 published only by the edge, secret strength, and the unsigned
      # workflow-advance flag below - and were deleted with the
      # crates/zeroship-gatekit gates behind them, as a complexity-budget
      # decision about that crate rather than a finding that the checks were
      # wrong. The properties they held are unguarded; each had caught a real
      # defect (PGDATA in the container's writable layer; a 10-byte shared secret
      # against a 32-byte minimum).
      #
      # THE ONE STEP IN THIS JOB THAT USES DOCKER, and it has to.
      # crates/control/src/reserved_names.rs decides which app names creators
      # may not take by reading deploy/ops/caddy-claimed-hosts.json - the
      # Caddyfile as `caddy adapt` lowers it. Its cargo test binds the artifact
      # to the Caddyfile's sha256, so an edge edit without a regenerate is
      # already red there. What that test structurally CANNOT check is whether
      # the artifact is what Caddy actually produces: a hand-edited JSON with
      # an untouched Caddyfile keeps the sha valid. Only re-running the adapter
      # catches it, and only this step does that.
      #
      # It REFUSES rather than skips when caddy and docker are both absent. A
      # gate that quietly does nothing when its tool is missing prints the same
      # green as one that ran.
      - name: edge claimed-host artifact is what caddy makes of the Caddyfile
        run: deploy/ops/caddy-claimed-hosts.sh --check
      # The boot gate against a silent weak service credential
      # (docs/proposals/2026-08-16-service-identity.md section 6.5.2, modelled
      # on Superset's fix for CVE-2023-27524). The unit tests all rule on the
      # functions `main` calls and none of them rules on whether `main` CALLS
      # them; this launches the compiled binaries and reads exit codes.
      #
      # It builds the four binaries first because a gate whose subject is
      # absent prints "not built; its arms did not run" and, without the arm
      # census, would look like a pass. The release gateway is what proves the
      # dev escape is keyed to the build profile: no debug binary can measure
      # that about itself, so the `profile` arm reports ZERO without it and the
      # arm floor turns that into a refusal.
      - name: services refuse to boot on a placeholder service credential
        run: |
          cargo build --bins -p zeroship-gateway -p zeroship-worker -p zeroship-migrate-server
          cargo build --release -p zeroship-gateway --bin zeroship-gate
          tests/service_credential_boot_gate.sh
      # Fence F4 of docs/proposals/2026-09-05-auth-foundation-redesign.md: a
      # missing or unparseable peer document refuses STARTUP, not merely every
      # request. Same shape as the step above and for the same reason - the
      # loader test in crates/zeroship-core rules on the loader and cannot rule
      # on whether `main` calls it - so this launches the compiled binaries.
      #
      # It reuses the binaries the step above builds, and needs no release
      # build: there is no dev escape to key to a build profile, which is the
      # point. It needs no Postgres either, because the refusal was deliberately
      # hoisted above each binary's database work.
      - name: services refuse to boot without a peer public key
        run: tests/service_peer_boot_gate.sh
      # deploy/scripts/{deploy-remote,deploy-app}.sh had no test of any kind.
      # The compose-variable extraction in deploy-remote.sh produced two false
      # results while it was written - it counted `$${VAR}` escapes and refs in
      # comments, and its rename guard first passed on the very breakage it
      # exists for, then failed on a healthy host. Both were caught by hand.
      # Drives the pure functions against fixture compose files and the deploy
      # path through a stub ssh; runs no real ssh, no docker, no network.
      # MEASURED 2026-08-20 on a host with no target/debug/zeroship-control:
      # 141 assertions, floor 118. One further case runs only when that binary
      # is built. (This line said "64 assertions, floor 63" while the script's
      # floor was already 107, then "129" once the count had moved again - it
      # gets written and not re-run against the thing it describes.)
      - name: deploy scripts extraction, rename pairing and arguments
        run: tests/deploy_scripts_gate.sh
      # tests/lib/dev_secrets.sh gates whether e2e_docker.sh and
      # external_chain.sh may run at all, and had no test. Its hand-kept file
      # list demanded control-signing.pem for three days after 8e365f478
      # deleted that key, so `ensure_dev_secrets` returned 1 on every machine,
      # always, and both harnesses died before starting - invisibly, because
      # neither is in a suite anyone watches. Text-only: no binary, no docker.
      - name: dev secret provisioning check can actually pass
        run: tests/dev_secrets_gate.sh
      # The harness creates the database and passes the DSN in; a test that
      # makes its own decides its own isolation invisibly and cannot run
      # against a database anybody else is connected to. Four files issue
      # CREATE DATABASE and each is ruled on in the script, with the reason;
      # a ruling that no longer matches anything fails this too, because an
      # exemption nobody removed is how the next one gets waved through.
      # Text-only: no build, no database.
      - name: test code does not create its own databases
        run: tests/tests_do_not_create_databases_gate.sh
      # AGENTS.md's "zero tokio in the stack" invariant has never been checked by
      # anything. It is two claims: no manifest we own declares tokio (true, and
      # briefly false in b72fee096, caught by a human reading the diff), and the
      # transitive edge through cyper -> hyper exists and is accepted. The gate
      # bans the first and PINS the second, so it is green today and goes red on
      # movement in either direction - including the edge being REMOVED, which is
      # what investigate/cyper-tokio-removal is for and which must take the
      # AGENTS.md paragraph with it. Runs cargo metadata and cargo tree only:
      # both resolve from the manifests and the lockfile, so nothing is
      # compiled. This step sits in the rust job for the toolchain, not a build.
      - name: zero-tokio invariant
        run: tests/zero_tokio_gate.sh
      # AGENTS.md's "privilege follows the PROCESS, not the function" applied to
      # the one attribute the worker holds that creator code can reach:
      # PostgreSQL REPLICATION. The grant lives in db/migrations-ts, the boot
      # check that demands it lives in the worker, and the statements that need
      # it live in data-v8 - three files that must agree, and did not have to.
      # The gate joins them and is self-inverting, so it refuses both a premature
      # deletion of the reaper and a grant left behind after the CDC relay takes
      # the streaming path. Runs cargo tree and greps; nothing is compiled.
      - name: worker replication privilege coupling
        run: tests/worker_replication_privilege_gate.sh
      # THE INSTRUMENTS' OWN SELF-TESTS. Every e2e harness in tests/ sources one
      # or more of tests/lib/*.sh for its run accounting: whether a binary is
      # stale against its sources, whether a Rust test skipped and still counted
      # as passed, whether a run carrying SKIPPED checks may exit 0. If one of
      # those regresses, every harness that sources it keeps printing confident
      # numbers and no gate anywhere notices - the failure is invisible by
      # construction, because the thing that broke is the thing doing the
      # measuring.
      #
      # Seven such self-tests exist. THREE already ran somewhere; these FOUR ran
      # in no workflow at all. Measured before wiring, by me: 12/0, 17/0, 9/0,
      # 10/0 - 48 assertions - in 92ms, 229ms, 11ms and 20ms. Pure shell, no
      # services, no build, no database.
      #
      # THE FIRST THREE ARE ATTACHED TO THE SUBJECT: each sources the shipping
      # library rather than restating it, so breaking the library breaks the
      # test. Proven by my own one-line mutations, restored after each:
      #   e2e_stack.sh:85      SKIPPED stops rising  ->   9/0 becomes 9 checks, 1 failed
      #   binary_freshness.sh:104  `if false; then`  ->  12/0 becomes 7 passed, 5 failed
      #   scratch_db.sh:69     fixed name, no token  ->  20/0 becomes 17 passed, 3 failed
      #   scratch_db.sh:85     drop regardless of owner -> 20/0 becomes 19 passed, 1 failed
      #
      # Two more since, on the same terms. `suite_db.sh` names the SHARED
      # suite database after the migration set and `sweep_db.sh` decides which
      # databases a sweep destroys, so both are wired here and both were
      # mutation-checked against the shipping library, not a copy:
      #   suite_db.sh  pre-`set -e` form restored  ->  41/0 becomes 39 passed, 2 failed
      #   sweep_db.sh  root-pid test moved back after the self test
      #                                            ->  29/0 becomes 28 passed, 1 failed
      # The second is worth a sentence: with the order swapped, a self-pid of 0
      # or 1 marks the WHOLE process table "ours", every candidate reads as
      # live, and the sweeper reclaims nothing while reporting success.
      #
      # THE FOURTH IS DIFFERENT AND THE DIFFERENCE MATTERS. known_catchall_selftest
      # RE-IMPLEMENTS the counters and exit rule of tests/e2e_app_primitives.sh
      # rather than sourcing them, deliberately - that harness stands up a whole
      # platform at import time. So it pins the RULE ("a catch-all recording
      # known() cannot fail, one recording fail() can") and is worth running,
      # but it CANNOT detect a regression in the file it names: reverting
      # e2e_app_primitives.sh:309 to known() would leave it green. Wired for the
      # rule, not for the harness.
      #
      # `set -e` is explicit rather than left to the runner default. GitHub's
      # default shell is documented as `bash -eo pipefail`, but if that were
      # ever not so, only the LAST of the four exit codes would reach the step
      # and the other three would be decorative - the exact hollow shape these
      # very self-tests exist to catch. One line converts an inference about a
      # runner default into a property of the file.
      - name: Instrument self-tests (the libraries every e2e harness measures with)
        run: |
          set -e
          tests/lib_binary_freshness_selftest.sh
          tests/lib_scratch_db_selftest.sh
          tests/lib_suite_db_selftest.sh
          tests/lib_sweep_db_selftest.sh
          tests/lib_test_config_selftest.sh
          tests/lib/e2e_stack_selftest.sh
          tests/lib/known_catchall_selftest.sh
          tests/lib_gate_arms_selftest.sh
      # e2d0cba4c changed three harnesses from 100755 to 100644 in a commit about
      # sharing a helper. The next day two of them were wired into CI by bare
      # path, where a non-executable file is exit 126 - so those steps could not
      # run an assertion from the moment they were gated. Restored in ac3bfd2cf.
      # This checks the narrow invariant that actually broke: if CI runs a script
      # as a COMMAND, it must be executable. Sourced files are outside it by
      # construction, which matters because five tests/lib/*.sh are correctly
      # non-executable and a blanket rule would demand the wrong thing on them.
      - name: Scripts CI invokes by bare path are executable
        run: tests/ci_invocable_gate.sh
      # THE CONFIGURATION-NAME CONTRACT. Nothing invoked the checker binary in
      # any workflow until now: `cargo test --workspace` above ran the crate's
      # unit and fixture tests, but the four subcommands that inspect the REAL
      # tree (check-metadata, audit, env-vars-doc, raw-env) had never run in CI,
      # so the compiled registries of the five servers were checked against
      # nothing outside a developer's shell.
      #
      # Two of its seven checks found a live defect the first time they ran,
      # both of the same shape - a name that parses and that nothing reads:
      #   compose set ZEROSHIP_CONTROL_URL on the CONTROL service, and
      #     crates/control/src/ has no reader for it (it is auth's, gateway's
      #     and worker's name)
      #   deploy/ops/zeroship.example.toml set `[gateway] broker_secret`, while
      #     the gateway resolves that secret from a PATH; the overlay key
      #     configured nothing
      # Both are deleted in the same change that wires this. That is what the
      # step is for, and it is why the expected sets are joined out of the
      # COMPILED contract rather than listed in the script.
      #
      # The self-test runs FIRST and separately: it mutates the compose file and
      # an ops TOML, proves both text checks still reject the mutation, and then
      # re-runs the same checks on the real inputs as the one-variable partner.
      # Text and cargo only - no docker, no services.
      - name: Config-name gate self-test
        run: tests/config_name_alignment_gate.sh --self-test
      - name: Configuration names, the reference, and the deployment agree
        run: tests/config_name_alignment_gate.sh
      # THE FIVE-BINARY --check-config E2E. Built and ran nowhere until now,
      # which mattered: it is the only instrument that starts the real control,
      # gateway, auth, worker and migrated binaries and asserts what each one
      # RESOLVES - source precedence, secret presence-only reporting, and the
      # refusals. 76 assertions with a measured floor of 76 at the bottom of the
      # script. It starts no services; --check-config exits before any listener,
      # database or filesystem side effect, which is the property under test.
      - name: --check-config on all five server binaries
        run: tests/config_check_e2e.sh
      - name: Test-census gate self-test
        run: bash tests/test_target_census_selftest.sh
      - name: Test-target and test-name census
        run: |
          # Keep stderr and check it, rather than discarding it. This step counts
          # what got BUILT, so anything that stops the build - a compile error, a
          # full disk, a killed rustc - removes executables and shrinks the
          # count. Discarding stderr made those indistinguishable from coverage
          # loss, and the failure message then blames the wrong thing.
          #
          # Measured, not hypothetical: running this locally on a disk that had
          # just hit 100 percent reported 213 against a floor of 245. Nothing had
          # been deleted; rustc could not write. The number was real and meant
          # nothing.
          #
          # No `--keep-going` here: cargo 1.94.0 accepts it on `cargo build` but
          # NOT on `cargo test`, so its presence made this step exit with
          # "unexpected argument" on every run - a gate that could never pass,
          # reported as a build failure. It was added to stop one broken package
          # masking the targets of every package after it, and the failure branch
          # below already covers that: a build that does not complete exits here
          # instead of reaching the count, so a short count from a partial build
          # is not a state this step can report as coverage loss.
          set -o pipefail
          if ! cargo test --workspace --no-run --message-format=json \
              >"$RUNNER_TEMP/targets.json" 2>"$RUNNER_TEMP/targets.err"; then
            echo "::error::the test build failed, so the target count below would measure the build and not the coverage"
            grep -E '^error' "$RUNNER_TEMP/targets.err" | sort -u | head -20
            exit 1
          fi
          # THIS USED TO BE A FLOOR ON THE NUMBER OF TEST BINARIES, and it had
          # become unsatisfiable without anyone noticing. The history is worth
          # keeping because the failure is instructive and not obvious.
          #
          # The floor was 250 against a "local measurement" of 265. That 265 was
          # not a measurement: 266 was measured on 2026-08-07 (1ab7b4c92f) and
          # 265 was 266 minus one, written on 2026-08-19 (d9d6d5d07) when
          # compio-postgres's tls_live target gained required-features. Nothing
          # re-ran the count. Then, both AFTER that comment was written:
          #
          #   3f7d74ee9  2026-08-19 13:18  crates/auth     53 binaries -> 1
          #   2ee8bba08  2026-08-20 01:33  crates/runtime  140 -> 9
          #
          # -183 against 15 points of slack. Neither change lost a test - the
          # auth one was proved with a byte-identical 415-name `--list` across
          # the old binaries and the new target - and neither touched this file.
          #
          # So the guard fired on precisely the change everyone wanted, and the
          # obvious repair - lower the number until it passes - would have turned
          # it into a rubber stamp, because after that nothing distinguishes "we
          # consolidated" from "a suite vanished". A count of CONTAINERS cannot
          # tell those apart. The gate below counts TESTS, which consolidation
          # cannot move, and asserts per-package that every crate still builds
          # SOMETHING, which is the part a workspace-wide number never saw.
          #
          # Deliberately still an asymmetry, the one this file already argues for
          # above: adding tests or splitting binaries needs no edit here, losing
          # coverage needs a reviewed one.
          #
          # The number lives in tests/test_target_census_gate.sh and is NOT
          # restated here. Two copies of a measurement is how the deploy-scripts
          # comment came to say "64 assertions, floor 63" while the script's own
          # floor was 107. One copy, next to the code that reads it.
          bash tests/test_target_census_gate.sh "$RUNNER_TEMP/targets.json"
      # Data tests require the PostgreSQL provisioned by this job. Test builds
      # enable integration helpers without an opt-in feature.
      - run: |
          set -o pipefail
          cargo test -p zeroship-data-v8 --test test_helpers sqlite_integration::
          cargo test -p zeroship-data-orm
      # The migration service's suite: the service's own targets, the two live-PG
      # session proofs (`smoke_apply_pg`, `author_and_apply_pg`) and the
      # `CompioPgSession` unit test. Without a database the PG proofs skip
      # internally, so this stays a DB-free step; the live half runs in the billing
      # gate, which exports PG_TEST_URL.
      #
      # THE PACKAGE IS NAMED WITH NO TARGET FILTER ON PURPOSE. That is what makes a
      # test target that stops COMPILING a hard failure here rather than a silent
      # absence - a `--test <name>` filter would only build the one named, and a
      # sibling could rot unnoticed against engine API drift.
      #
      # NOT CHECKED ANYWHERE, and named here because its absence is otherwise
      # invisible: the DB-free guard comparing db/migrations-ts against
      # db/released_migrations.tsv. No CI job holds it.
      - run: |
          set -o pipefail
          cargo test -p zeroship-migrate-server
      # compio-postgres' `tls` feature has never been compiled by any workflow,
      # let alone run: `tls` appeared ZERO times in .github/ until this step.
      # The default feature set is empty, so `cargo test --workspace` above
      # builds none of it - the rustls connector, the six-mode verification
      # policy and its unit tests were reachable only through
      # `tests/run_doc_gate.sh --all-features`, which type-checks the module
      # through rustdoc and executes nothing.
      #
      # This is the step that runs the certificate-verifier proofs. They need no
      # server: they drive the real verifiers, through the real mode-to-verifier
      # selection, against certificates committed under tests/data/. That is
      # deliberate - the live suite below needs Docker and four containers,
      # and the one thing that must never regress unnoticed is which verifier
      # `verify-full` gets.
      - run: |
          set -o pipefail
          cargo test -p compio-postgres --features tls
      # The live half: the four servers `tls_live_setup.sh` stands up, and the
      # 22 checks that read `pg_stat_ssl` to find out what transport the SERVER
      # thinks it is serving. `--features live-tls-tests` is what builds the
      # target at all; without it cargo skips it silently, which is why it is
      # named here rather than left to the feature unification above.
      #
      # `sudo` is used by the setup script to chmod the server keys to
      # root:<postgres gid> 0640, which PostgreSQL insists on. GitHub runners
      # have passwordless sudo and Docker.
      - name: Provision the TLS test servers
        run: bash libs/compio-postgres/tests/tls_live_setup.sh
      - run: |
          set -o pipefail
          cargo test -p compio-postgres --features tls,live-tls-tests --test tls_live \
            -- --test-threads=1
      - name: Tear down the TLS test servers
        if: always()
        run: bash libs/compio-postgres/tests/tls_live_setup.sh --down
      # The two steps above run ONE feature resolution each, and a
      # `#[cfg(feature)]` test that resolution omits is not reported as skipped
      # or ignored - it is ABSENT FROM THE BINARY, so the run prints exactly
      # what a complete run prints. That is not hypothetical: three of the six
      # cases in tests/suite/temporal_edge_values.rs vanished that way on
      # 2026-08-27, and they were the ones proving `time '24:00'` is refused.
      # This gate lists (never runs) the suite under three resolutions and
      # compares the union against what the SOURCE declares, so no case can be
      # invisible to every one of them. It needs no server - `--list` compiles
      # and enumerates - which is why it sits after the teardown.
      - name: Every declared compio-postgres suite test compiles somewhere
        run: tests/compio_postgres_test_visibility_gate.sh
      # THE SKIP CENSUS STEP THAT STOOD HERE IS GONE. It counted the tests that
      # ran, exercised nothing, and were still inside this job's "N passed"
      # totals - Rust cannot mark a test ignored at RUNTIME, so the harness had
      # already committed to counting it by the time the body discovered its
      # backend was absent.
      #
      # It REPORTED rather than failed, on the ground that this job provisioned
      # no backend at the time and failing a job that deliberately stands up no
      # services makes the only honest outcome a red tick - after which the fix
      # people reach for is deleting the check. Both halves of that are moot now:
      # the job provisions its backends near the top, and those tests FAIL when
      # they cannot reach one. This job either provisions what a test needs or
      # does not run it; there is no third state for a census to describe.
      # The gate's own self-test: fixtures only, no build, seconds. It runs
      # BEFORE the gate so that a gate which has stopped discriminating is
      # reported as such rather than as a clean workspace.
      - name: Clippy gate self-test
        run: tests/clippy_gate_selftest.sh
      # This step used to be a bare
      #
      #   cargo clippy --workspace --all-targets --features <the two live-db ones>
      #
      # and it went red on main, unnoticed, twice in a week. The reason was
      # structural rather than anybody's carelessness: the per-crate `cargo test`
      # runs people do locally never invoke clippy, so this job was the only
      # thing that did, and its result is one tick among many.
      #
      # Worse, the SECOND break showed the one-liner cannot be trusted even when
      # someone is looking. A deny-level lint in crates/core aborted the run
      # before crates/auth and crates/control were ever scheduled, so the output
      # said nothing about them - and "said nothing" is exactly what a clean
      # crate looks like. A run reporting no auth errors had not found auth
      # clean; it had never reached auth.
      #
      # tests/clippy_gate.sh runs the same invocation and then AUDITS cargo's
      # `--message-format=json` stream against `cargo metadata`, so every
      # workspace package and every in-scope target has to show up as linted for
      # the step to pass. It also refuses, distinguishably, when a gitignored
      # build input is missing - which is why the `pnpm build` and WPT steps
      # earlier in this job are load-bearing for it.
      #
      # The `--features <the two live-db ones>` above became `--all-features` on
      # 2026-08-20, because "every in-scope target" was scoped BY that list. The
      # workspace declares 28 features; the list named 2, and the 18 it left off
      # gated 10 declared targets that arm 3 did not count as unlinted - it
      # filtered them out of its own expectation. One of them,
      # zeroship-migrate-adapter's `platform_migrate`, held eleven deny-level
      # `clippy::await_holding_lock` errors throughout. A fourth arm now checks
      # the resolution itself against the manifests and names any feature that
      # did not come out enabled.
      #
      # The invocation, including the feature selection and the deliberate
      # absence of `-D warnings`, lives in the script and nowhere else, so a
      # developer running it locally and this step cannot lint different things.
      # The reasoning for both is in the script header.
      - name: Clippy, with proof every crate was linted
        run: tests/clippy_gate.sh
      # The last two of the twelve gates that were wired nowhere. Both drive
      # cargo rather than reading text, so they sit at the end of this job where
      # the target directory is warm from everything above: measured locally at
      # 21 re-emitted compilation units for the first and four small
      # feature-split checks for the second, against a cold cost of a full
      # crate build each.
      - name: No item is reachable at a visibility its signature cannot honour
        run: tests/private_interface_gate.sh
      - name: The ORM driver contract is invariant across the feature split
        run: tests/contract_feature_invariance_gate.sh

  # The live-database gate. zeroship-control and zeroship-migrate-server between them
  # hold 45 test targets that dial a real Postgres and panic on connect without
  # one - the billing money path (which additionally drives the advisory-locked
  # fleet-wide cron sweeps), plus deploy, oauth, device, token, admin, bootstrap,
  # registry and workflow suites. They carry
  # `required-features = ["live-db-tests"]`, so the `rust` job above skips them;
  # this job provisions the database and is what actually runs them.
  #
  # The set it runs is the set that is gated, by construction: the script issues
  # `cargo test -p <crate> --features live-db-tests`, which runs every target in
  # the crate whose required-features are satisfied. There is no name list, so
  # nothing can be gated out of the default build and land in neither job - which
  # is exactly how fifteen non-billing control suites went unrun before.
  #
  # The job name is kept because branch protection references it.
  #
  # THIS JOB AND auth-gate BELOW EXITED 2 HAVING RUN ZERO TESTS on every fresh
  # checkout until 2026-08-20, and the reason was configuration, not a database.
  # Both scripts call `zs_test_config_load` (run_billing_suite.sh:133,
  # run_auth_suite.sh:157), which reads `deploy/ops/zeroship.test.toml` and
  # RETURNS 1 when it is absent. That file is gitignored (.gitignore:62) and is
  # written by tests/provision_test_backends.sh, which until this change had
  # exactly ONE call site in this workflow - the `rust` job at line 150. So the
  # service container below was healthy and reachable and the suite never got as
  # far as dialling it.
  #
  # MEASURED 2026-08-20 on a worktree with no overlay, against a real
  # postgres:16 with no POSTGRES_DB and no postgres-init.sql (so the `postgres`
  # role has no search_path either) - the same shape as a `services:` container.
  # Same command, same server, one variable apart:
  #   no overlay    exit 2,  0 `test result:` lines, 0 tests
  #   overlay       exit 0, 26 `test result:` lines, and an "AUTH SUITE: ...
  #                 tests passed" line clearing its floor
  # (that line carried a skip census and an allowlist count when this was
  # measured; both are deleted, and the script no longer prints either)
  # THE NUMBERS ARE auth-gate's. billing-gate was NOT run: it additionally needs
  # a Redpanda this machine had no free port for, and its 748-test suite plus a
  # cold zeroship-control build did not fit the session. Its overlay hurdle is
  # the same `zs_test_config_load` call and the same fix; what is unverified is
  # everything AFTER that line.
  #
  # A separate control, so the fix cannot be read as having quietened the
  # refusal: with the overlay naming :5444 and the caller asking for :5432, the
  # same command still exits 2 with 0 tests and prints "the server you asked for
  # is not the server the overlay names". tests/lib_test_config_selftest.sh
  # covers all 16 arms and is green.
  #
  # `--check` is the arm that ADOPTS a server rather than starting one: it skips
  # the `docker compose up` entirely and only probes the addresses it is given,
  # then writes the overlay naming them. That is exactly the relationship a
  # `services:` container needs - the runner owns the server's lifecycle, this
  # step owns the file that names it. Without `--check` the script would try to
  # bind compose's postgres to 5440, which the service container already holds.
  #
  # The PG_* values moved from the test step to job level so BOTH steps see
  # them. They are the provisioner's documented INPUTS, and the step below has
  # to have them or it would write the provisioner's own defaults instead.
  #
  # DO NOT READ `zs_test_config_assert_agrees` AS A GUARD IN THIS JOB. It
  # compares the caller's PG_* against the overlay, and here one job-level `env`
  # feeds both the step that writes the overlay and the step that checks it, so
  # the two cannot disagree and the comparison is vacuous. What actually catches
  # a `ports:` line drifting from PG_PORT is the provisioner's own probe: it
  # waits 60s for a server on the address it was handed and then fails with
  # "PostgreSQL never came up on localhost:<port>". Loud, but from a different
  # mechanism than the one the harness advertises.
  #
  # POSTGRES_DB: zeroship for the same reason, and it is the same kind of
  # claim - truth in the overlay, not a test that needs it. compose sets it, so
  # the overlay's DSN names `zeroship`; without it the DSN names a database that
  # does not exist on the service container. Nothing in either gate dials that
  # DSN today, because both scripts export PG_TEST_URL for their whole cargo run
  # and `database_url_opt` prefers it (crates/core/src/config/test_overlay.rs:131)
  # - so the overlay's own database is the unreachable fallback arm. Make it
  # real anyway; a generated topology that is only accidentally unread is not a
  # correct one.
  billing-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: zeroship
          POSTGRES_DB: zeroship
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # No billing test sends mail. The sink is here because the overlay writer
      # below waits on EVERY backend before describing any of them, and because
      # the provisioner describes the workspace's test backends as a SET - a job
      # that adopts the set adopts all of it. Per-job subsets would be a second,
      # hand-maintained statement of which tests need what.
      smtp:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      PG_HOST: localhost
      PG_PORT: 5440
      PG_USER: postgres
      PG_PASS: zeroship
      PG_DB: zeroship
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same reason as the `rust` job: run_billing_suite.sh builds
      # zeroship-control, which depends on zeroship-runtime, which
      # `include_str!`s three gitignored SDK dist files a fresh checkout lacks.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zeroship/migrate build
      - run: pnpm build
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # Real Kafka-wire broker so run_billing_suite.sh exercises the real stream
      # path (rewind/seek + the wired producer->recompute->spend e2e), not just
      # the in-process memory transport. Launched as a step (not a `services:`
      # entry) because it needs an explicit --advertise-kafka-addr that GitHub
      # service containers cannot set. Mirrors the docker-compose `redpanda`.
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:latest \
            redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M \
            --node-id 0 --check=false \
            --kafka-addr external://0.0.0.0:19092 \
            --advertise-kafka-addr external://127.0.0.1:19092 \
            --set redpanda.auto_create_topics_enabled=true
          for i in $(seq 1 40); do
            if docker exec redpanda rpk cluster health --exit-when-healthy; then exit 0; fi
            sleep 3
          done
          echo "redpanda failed to become healthy" >&2; docker logs redpanda; exit 1
      # Write deploy/ops/zeroship.test.toml for the service containers above.
      # Without this the next step exits 2 before it runs a single test; see the
      # comment on this job. `--check` provisions nothing - the runner already
      # started both servers - it probes them and writes the file that names
      # them.
      - name: Write the test overlay naming this job's service containers
        run: bash tests/provision_test_backends.sh --check
      - name: Run the live-database gate
        run: tests/run_billing_suite.sh
        env:
          REDPANDA_BROKERS: 127.0.0.1:19092

  # The auth tests used to resolve their database from AUTH_DB_URL and return
  # early when it was unset, which cargo reports as a pass. `cargo test
  # --workspace` above therefore proved nothing about them.
  # tests/run_auth_suite.sh provisions an isolated database and runs the suite
  # against it; the tests themselves refuse a run with no database, so a missing
  # one cannot masquerade as a pass in either vector.
  #
  # It could not masquerade as anything, because it did not run: see the long
  # comment on billing-gate for the absent-overlay defect both jobs had and for
  # why every line below is shaped the way it is.
  auth-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: zeroship
          POSTGRES_DB: zeroship
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The plaintext SMTP sink zeroship-mailer's transport test dials. This job
      # runs `cargo test -p zeroship-mailer` as a whole package (the binary list
      # in run_auth_suite.sh), and that test FAILS without a sink rather than
      # skipping, so the sink is a service of this job like the two above.
      #
      # NO `--health-cmd`, and that is not an omission: the provisioner step
      # below waits on this port itself with a bounded probe and fails naming the
      # address, which is the same readiness contract with one fewer guess about
      # what the image ships to probe with.
      smtp:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      PG_HOST: localhost
      PG_PORT: 5440
      PG_USER: postgres
      PG_PASS: zeroship
      PG_DB: zeroship
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A SECOND defect, found only once the overlay fix above let this job get
      # far enough to hit it. run_auth_suite.sh:239 provisions its database with
      # deploy/ops/db-migrate.sh. That wrapper used to `cargo run` the
      # zeroship-platform-migrate binary, which pulled in zeroship-runtime, which
      # `include_str!`s three gitignored SDK dist files. It now runs the
      # `zero-migrate` CLI instead - so the Rust edge is gone, but the pnpm
      # requirement is NOT: the CLI is a Node program and needs `pnpm build` to
      # exist at all.
      # The block below is therefore still load-bearing, for a different reason.
      # The original failure, reproduced
      # 2026-08-20 in a worktree that had never run pnpm:
      #   error: couldn't read .../sdks/bootstrap/dist/install-schema.js
      #   error: couldn't read .../sdks/db/dist/internal.js
      #   error: couldn't read .../sdks/bootstrap/dist/runtime-entry.js
      #   error: could not compile `zeroship-runtime` (lib) due to 3 previous errors
      # billing-gate and data-tests already carry this block for the
      # same reason; auth-gate reaches the same crate by a different route (the
      # migrate binary rather than the crate under test) and was missed.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zeroship/migrate build
      - run: pnpm build
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Write the test overlay naming this job's service containers
        run: bash tests/provision_test_backends.sh --check
      - name: Run the auth live-database gate
        run: tests/run_auth_suite.sh

  # Native data tests own their PostgreSQL fixture and real CDC relay process.
  data-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Build the SDK modules embedded by the V8 runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zeroship/migrate build
      - run: pnpm build
      - name: Install snapshot clients matching the test server
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Run native data tests with owned PostgreSQL
        run: cargo xtask test data
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-test-results
          path: target/nextest/data/junit.xml

  # The live-Postgres gate for zeroship-worker: seven tests that drive
  # `workflow_advance_unsigned` end to end and whose claim path joins
  # `zeroship.apps` / `plans` / `app_deploys`.
  #
  # WHY IT IS ITS OWN JOB. Those seven were UNGATED until 2026-08-28 and nothing
  # provisioned a migrated database for them, so the `rust` job above - which
  # runs `tests/provision_test_backends.sh` and gets a live but EMPTY `zeroship`
  # - failed all seven on `relation "zeroship.plans" does not exist`. That is a
  # void run presented as seven regressions, and `zeroship-control` hit the
  # identical shape on 2026-08-20. The fix is the same pair: the tests moved
  # behind `--features live-db-tests` (so `cargo test --workspace` above is
  # honest about what it ruled on) and this job runs them against a database the
  # suite script creates and migrates itself.
  #
  # NOT folded into auth-gate, which already owns a migrated database. Two
  # reasons, and the second is the binding one: auth-gate builds no crate that
  # depends on zeroship-runtime, so adding zeroship-worker would pull V8 into a
  # job that does not otherwise need it; and auth-gate's AUTH_MIN_PASSED floor
  # is a sum over every binary it runs, so adding ~114 passes to it means
  # re-measuring that floor against the whole auth suite - a number this crate's
  # change has no way to establish.
  #
  # THE SCRIPT DOES NOT SKIP. Without an overlay, a server, or the `zero-migrate`
  # CLI it exits 2 naming the fix and never reaches `cargo test`, so this job
  # cannot go green having run nothing.
  worker-live-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: zeroship
          POSTGRES_DB: zeroship
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The shared provisioner also checks the SMTP sink used by mailer tests.
      smtp:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      PG_HOST: localhost
      PG_PORT: 5440
      PG_USER: postgres
      PG_PASS: zeroship
      PG_DB: zeroship
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Twice load-bearing, same as billing-gate / auth-gate / data-tests:
      # zeroship-worker depends on zeroship-runtime, which `include_str!`s three
      # gitignored SDK dist files, AND deploy/ops/db-migrate.sh is a Node program
      # that the suite script shells out to.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zeroship/migrate build
      - run: pnpm build
      # The suite reads its server's coordinates from the generated overlay and
      # from nowhere else; without this file it refuses rather than guessing.
      - name: Write the test overlay naming this job's service containers
        run: bash tests/provision_test_backends.sh --check
      - name: Run the worker live-database gate
        run: tests/run_worker_suite.sh

  # Gate the SDK type-level + unit suites. In particular this runs
  # @zeroship/migrate's `check` (tsc + the `tsconfig.types.json`
  # `@ts-expect-error` structural-safety / names-stay-strings suite) and its
  # node:test suite, so the tsc-as-assertion structural proof can no longer
  # silently rot - the assertion is now gated, not human-run-only.
  sdk:
    runs-on: ubuntu-latest
    steps:
      # This checkout once omitted submodules, which was invisible until the
      # engine became a workspace member: the vendored tree came up empty, the
      # workspace globs matched nothing, and install failed on an unresolvable
      # link. The engine is in-tree now, so nothing here depends on a submodule.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # The vendored engine ships no dist/ (it is gitignored there and built
      # from source), so it has to be built before anything that imports it.
      - run: pnpm --filter @zeroship/migrate build
      # The migrate type layer reads @zeroship/db's built types; build SDKs first.
      - run: pnpm build
      # Ticket #267 - @zeroship/db's base `typecheck` (`tsc --noEmit`) reads
      # `include: ["src"]`, so nothing under tests/ was ever in the tsc
      # program: `tsc --noEmit --listFiles` showed 0 files under tests/,
      # so the several tests/*.test.ts files carrying `@ts-expect-error`
      # type-only assertions were checked by NOTHING (`npm test` runs them
      # through tsx, which strips types without checking them). `check`
      # additionally runs `tsconfig.tests.json` (extends the base config,
      # widens `include` to `["src", "tests"]`, drops rootDir/outDir),
      # mirroring the @zeroship/migrate pattern below.
      - run: pnpm --filter @zeroship/db run check
      - run: pnpm --filter @zeroship/migrate run check
      # The committed `generated/zeroship/` artifacts have generator INPUTS that
      # nobody edits when they change them: the injection ceiling
      # (sdks/vite-plugin/src/gen-types/confined-ceiling.ts), the env.db renderer,
      # and the vendored engine pin. Move any one of those and EVERY committed
      # artifact in the repo stales at once, silently, because the artifact is a
      # build output that only a regeneration compares against.
      #
      # #220 built the repo-wide runner for exactly that failure and it was never
      # wired here, so the failure recurred: measured 2026-08-10, at 0c852e2e1
      # `examples/db-todos/generated/zeroship/schema.runtime.json` was STALE on
      # main.
      #
      # THE DIRECTION OF THAT DRIFT WAS RECORDED BACKWARDS HERE UNTIL 2026-08-11,
      # and the wrong version cost a full investigation: it said cb1bcb59 "now
      # emits the `text` our ceiling declares, so the fresh artifact drops it",
      # i.e. that a committed artifact CARRYING `maxLength: 255` was the stale one.
      # The opposite is true, verified by reading the pinned commit rather than
      # HEAD:
      #   git show cb1bcb59:crates/zeroship-migrate/src/model/table_shape.rs :413
      #       "text" => ColType::String { length: 255 },
      #   git show cb1bcb59:crates/zeroship-migrate/src/render/lower.rs  :9242-9245
      #       ColType::String { length } => Some(i64::from(*length)),
      #   render/declarative.rs :2035 emits that as `"maxLength": <len>`.
      # So a policy-INJECTED system string column (`id`, `created_by`,
      # `updated_by`) is bounded VARCHAR(255) at our pin - deliberately, so it can
      # be keyed on MySQL where unbounded TEXT cannot be - and the FRESH artifact
      # CARRIES maxLength. A committed artifact WITHOUT it is the stale one.
      #
      # The bounding is not new and not a pin bump: `git merge-base --is-ancestor
      # 23cc6987 cb1bcb59` is true. 23cc6987 is "render t.text() as unbounded MySQL
      # TEXT; bound injected system columns" - two changes in one subject, and
      # reading only the first half yields exactly the inverted summary that stood
      # here. Upstream confirms all three sites are unchanged in behaviour at their
      # HEAD, so a newer pin does not change this.
      #
      # NOTHING CAUGHT IT, and it is worth knowing why before trusting the two
      # gen-types tests to cover this. They pin the vite-plugin's OWN fixtures,
      # not the repo's artifacts: `@zeroship/vite-plugin` measured 235 tests,
      # 230 pass / 5 fail with the STALE artifact and 230 pass / 5 fail with the
      # FRESH one - byte-identical verdicts, so that suite is blind here by
      # construction. It is also excluded from tests/run_js_suite.sh for the 5
      # unrelated fold failures (#219), so it gates nothing either way.
      #
      # This step is the one that discriminates: at 0c852e2e1 it exits 1 naming
      # the file and printing the first divergence; with the artifact regenerated
      # it reports "no drift - 4 artifact set(s)".
      - name: Committed gen-types artifacts are not stale
        run: pnpm gen-types:check
      # Until now this job ran exactly one JavaScript suite, and could not
      # install to reach even that, so no JS test in this repo has ever gated a
      # merge. @zeroship/db alone is 503 tests. That is the mechanism behind two
      # defects already found: the db suite sat at over a hundred failures long
      # enough that nobody noticed, and the vite-plugin shipped a dependency it
      # never declared.
      #
      # Written as exclusions, not an allow-list, so a new package is gated the
      # day it appears rather than the day someone remembers to add it. The
      # two below are excluded by name because they have known failures, and
      # each exclusion is a debt with an owner:
      #
      #   @zeroship/migrate      engine tests with pre-existing generated-file,
      #                          documentation, and repository-scan failures.
      #                          Migration contract paths are gated separately.
      #   @zeroship/vite-plugin  7 failures, and they are TWO causes, not one.
      #                          2 are drift (env.db.ts committed vs fresh).
      #                          The other 5 are not drift at all: gen-types
      #                          hard-errors with `fold: constraint
      #                          posts_authorId_fkey already exists on posts`
      #                          and produces no artifact, so there is nothing
      #                          for a committed one to have drifted from.
      #                          Measured 2026-08-09; any manual schema.ts
      #                          with a single relation reproduces it, and a
      #                          schema with an explicit t.id() and no t.ref()
      #                          does not. See task #219.
      #
      # The drift ones are the committed generated artifacts having drifted
      # from the vendored engine, and settling which engine commit is
      # authoritative resolves them. That does NOT clear all three exclusions:
      # the 5 fold failures survive it untouched, because regenerating cannot
      # fix a generator that refuses to generate. Whoever regenerates on this
      # note alone will see them still red.
      #
      # The 2 drift ones are ordinary staleness and regenerating is correct.
      # Do NOT read the gate's "first divergence" as the whole story: it
      # reports one line, and for env.db.ts that line is a `//` against the
      # committed `import ... from "@zeroship/db"`, which LOOKS like the
      # generator emitting less. It is not. The renderer's header comment
      # gained a paragraph, so every following line is offset and the first
      # mismatch lands mid-header. The schema.runtime.json one is the same
      # shape: a trailing comma, because the ceiling now declares a default
      # for `version` (17cd17b46) that the committed artifacts predate.
      # See task #220.
      #
      # The vite-plugin claim is the measured one; the migrate entry above is
      # now a record of a CLEARED exclusion, not an open debt.
      #
      # Runs through a script rather than inline so the result can be COUNTED.
      # `pnpm -r` skips a package whose `test` script is renamed or removed, in
      # silence - measured, and invisible here because the filter selects 56
      # projects of which only 21 run a suite at all. The script carries the
      # filters and the floors; see its header for what it does and does not
      # catch.
      - name: JavaScript suites
        run: tests/run_js_suite.sh

  # The creator path, end to end, and until now nothing in CI touched it.
  #
  # MEASURED 2026-08-10: `tests/` holds 61 shell harnesses. Exactly 7 are named
  # by this file. Of the 40 `e2e_*.sh` + `golden_path.sh` harnesses, ZERO ran in
  # CI - so every scenario in docs/pilot/e2e-scenarios.md, all four
  # dev-vs-deployed harnesses, and every seam fix landed against them were
  # ungated. (Careful re-deriving that number: run_billing_suite.sh contains the
  # literal string `tests/e2e_durable_workflows.sh` at line 142, inside a comment
  # explaining a --test-threads=1 rationale. It is not a call.)
  #
  # This job closes the first and largest of them. tests/golden_path.sh walks
  # `pnpm build` -> .zship -> provision -> gateway serve -> RPC round-trip ->
  # `pnpm dev` -> dev-vs-deployed diff -> dev-runtime supervisor -> env.db data
  # plane. It is the only harness that drives BOTH tiers and diffs the RESULTS,
  # which is the class of defect a crate suite cannot see by construction: both
  # backends read correctly alone.
  #
  # STEP 3 NOW SHIPS THE ARTIFACT WITH `zeroship deploy`, and the two notes this
  # replaces said otherwise for two different reasons - both worth keeping,
  # because the second is how the gap survived.
  #
  # FIRST, CORRECT WHAT THOSE NOTES CLAIMED. They said "the deploy CLI - the
  # command the golden path is named after - is NOT exercised here", and that
  # sentence was too strong. MEASURED 2026-08-21 by running the harness on the
  # arm CI was taking: `zeroship deploy` already ran at three sites - step 10f's
  # policy-flip redeploy, step 12's second app for the pairwise-sector check, and
  # step 14's - of which the last never reached the CLI in CI at all because its
  # artifact was missing. So the binary ran, twice, and exactly ONE assertion
  # rested on it ("second app registered through the deploy API"), which checks
  # the CLI's exit status and nothing about what reached the control plane. Each
  # of the three is SETUP for a step measuring something else, and each sits
  # behind a guard belonging to that other step. What was missing was not the
  # command; it was step 3 - the one named "Create app + deploy", whose APP_ID
  # every serve, RPC, body-cap, dev-diff and log assertion below hangs off - and
  # any assertion about the deploy itself.
  #
  # The FIRST note said minting a token needs zeroship-control started with
  # `--signing-key-file`, "which golden_path.sh does not do (it runs under
  # ZEROSHIP_DEV_INSECURE with an ephemeral key nothing can sign against)". Both
  # halves stopped being true when the relaxation flag was deleted, and nothing
  # re-read the note. The SECOND note corrected that and stated the real gate -
  # "only that nothing in CI sets ZEROSHIP_TOKEN" - and then left it open,
  # because closing it looked like a change to the harness rather than to this
  # file. It was; that change has now been made.
  #
  # golden_path.sh takes `--provision=deploy|dev-provision`, defaulting to
  # deploy, and does not read ZEROSHIP_TOKEN at all. The deploy arm seeds a
  # `zeroship.users` row, mints an `at+jwt` against the harness's own OP (the
  # one `e2e_platform_op_up` already stands up so control has an issuer to
  # verify against), creates the app through POST /api/apps and ships the .zship
  # with `zeroship deploy --app=... --token=...`. It then checks that the hash
  # the CLI printed is the hash control wrote to `zeroship.apps` and
  # `zeroship.app_deploys`, and that the same deploy with a bad bearer is
  # REFUSED - so the arm cannot pass by talking to nothing.
  #
  # WHAT THIS STILL DOES NOT GATE, and it is worth knowing before trusting it:
  #
  #   the credential ACQUISITION path. The bearer is minted by the harness
  #   against its own JWKS, not obtained the way a creator obtains one. So
  #   `zeroship login` (the device flow, and the on-disk credential it writes)
  #   and the ZEROSHIP_TOKEN input are both uncovered; only `--token=` is
  #   driven. tests/e2e_device_login.sh is the harness that runs a real OP.
  #
  #   the deploy CLI's RESOLUTION surface. The invocation passes an explicit
  #   `--app` uuid and `--control` url, so auto-create, `--no-create`,
  #   name-to-id lookup, `--env=`, declared secrets and every zeroship.jsonc
  #   precedence rule in docs/reference/project-config.md are untouched here.
  #   tests/e2e_project_config.sh covers the config half.
  #
  #   the TRANSPORT. Loopback HTTP to a control plane on the same box: no TLS,
  #   no DNS, no edge, no proxy, and an artifact small enough that nothing about
  #   chunking or timeouts is under load.
  #
  #   which arm ran, IF SOMEONE CHANGES IT. That is the one thing this file no
  #   longer has to be trusted about: the harness prints a `step 3 arm:` line
  #   naming the arm it took, and the step below requires the DEPLOY arm's line
  #   to be in the log.
  golden-path:
    runs-on: ubuntu-latest
    # A bound, because one of the seven local runs taken while wiring this up
    # HUNG rather than failed: step 9's `users.seed` got no bytes back within
    # its own 10s curl timeout, and the db-todos dev runtime logged nothing
    # after `creator app dispatch error` on the readiness probe. The harness
    # recovered and reported it as a failed assertion that time, but a hang one
    # layer up (a service that never binds, a `pnpm build` that stalls) has no
    # such bound and would otherwise burn the 6h default. 60 minutes is well
    # clear of the ~25 min this job needs from a cold Rust cache.
    #
    # NOT a retry, deliberately. A flaky step is a defect to diagnose; making
    # CI re-run it until green is how a real intermittent failure becomes
    # invisible. This turns a hang into a red tick, nothing more.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      # lsof is not optional decoration here. golden_path.sh frees its ports with
      # `lsof -ti :$PORT -sTCP:LISTEN` and, in step 7c, FINDS the live dev runtime
      # the same way in order to SIGABRT it. Without lsof every one of those calls
      # returns empty, step 7c takes its `could not find the healthy runtime` arm
      # and fails - loudly, which is the right direction, but the reason would be
      # a missing package rather than a defect.
      # zstd because step 1b reads the manifest out of the artifact with
      # `tar --zstd -xOf`, which shells out to the zstd binary.
      - name: Install harness prerequisites
        run: sudo apt-get update && sudo apt-get install -y lsof zstd postgresql-client
      # Postgres as an explicit `docker run`, NOT a `services:` entry, and the
      # container NAME is the reason. golden_path.sh creates and drops its own
      # dedicated database through `docker exec "$PG_CONTAINER" psql` (default
      # `compose-postgres-1`, matching the dev compose stack) and verifies the
      # migration landed the same way. GitHub generates the name of a `services:`
      # container, so `docker exec` by name cannot reach it. This is the same
      # reason billing-gate launches Redpanda as a step rather than a service.
      #
      # postgres:17 to match billing-gate and auth-gate. The measurement quoted
      # in golden_path.sh was taken against the dev compose stack's postgres:16;
      # the harness asserts on `to_regclass` and on app behaviour, neither of
      # which is version-sensitive between 16 and 17.
      - name: Start Postgres
        run: |
          docker run -d --name compose-postgres-1 -p 5440:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=zeroship \
            postgres:17
          for i in $(seq 1 40); do
            if docker exec compose-postgres-1 pg_isready -U postgres; then exit 0; fi
            sleep 3
          done
          echo "postgres failed to become ready" >&2; docker logs compose-postgres-1; exit 1
      - run: pnpm install --frozen-lockfile
      # The vendored engine ships no dist/ and the vite-plugin imports it, so it
      # has to be built before the SDKs. Same ordering as the `sdk` job.
      - run: pnpm --filter @zeroship/migrate build
      # `pnpm build` FIRST and cargo second is load-bearing, not stylistic: the
      # runtime crate `include_str!`s sdks/bootstrap/dist/{runtime-entry,dispatcher}.js.
      - run: pnpm build
      # THE ONE EXAMPLE THE HARNESS DOES NOT BUILD ITSELF, and until now nothing
      # built it here either. golden_path.sh builds starter, db-todos, the
      # scaffold and wall-probe inside the run; step 14 deliberately consumes a
      # PREBUILT examples/auth-notes-db/dist/app.zship (its own comment says so,
      # and it asserts the artifact is newer than its sources so that a
      # forgotten rebuild cannot pass). Root `pnpm build` filters to ./sdks/*,
      # and `dist` is gitignored, so on a fresh checkout that file is absent.
      #
      # MEASURED on a clean worktree 2026-08-21: step 14 produced ONE outcome -
      # `14: missing .../examples/auth-notes-db/dist/app.zship` - instead of its
      # twelve, a red that is NOT in GOLDEN_EXPECTED_FAILURES, so the run also
      # reported `1 unexpected` and sat well under its own floor. That was true
      # before this commit and has nothing to do with the deploy arm: the whole
      # of step 14 (two identities, one row, no cross-tenant leak) has never run
      # in CI, and the floor has been unreachable here for as long.
      - run: pnpm --filter auth-notes-db build
      # Exactly the prereq list in golden_path.sh's own header (lines 14-18).
      # `-p zeroship-control --bins` is what produces `dev-provision`, which
      # steps 9, 10, 11 and 12w use to stand up their own apps (step 3 uses it
      # only on the `--provision=dev-provision` arm this job does not take);
      # `-p zeroship-cli` produces the `zeroship` binary - the deploy CLI step 3 now
      # drives, and the dev runtime `pnpm dev` spawns in steps 6, 7 and 9.
      - name: Build the release binaries the harness starts
        run: |
          cargo build --release -p zeroship-control -p zeroship-worker -p zeroship-data-cdc-server \
            -p zeroship-gateway -p zeroship-cli --bins
      # ZS_FRESHNESS_STRICT=1 because the harness's own freshness note says so:
      # step 1 runs `pnpm build` inside the example and consumes whatever
      # sdks/vite-plugin/dist is already on disk, so a run over a stale dist is
      # green about a build that predates the change under test. It WARNS by
      # default (mtime is a weak proxy for provenance on a developer's machine);
      # in CI the dist is built two steps above, so a stale one means the build
      # did not happen and refusing is correct.
      #
      # `set -o pipefail` before the tee for the reason the rust job documents:
      # GitHub's default shell is `bash -e` WITHOUT pipefail, so `script | tee`
      # reports tee's status - 0 whenever tee could write - and a failing harness
      # would sail through as a pass.
      #
      # The harness carries its own anti-hollow-gate guards: a measured
      # total-passed floor, a per-step ran-something check against a declared
      # step list, and a classification of every FAILURE against the documented
      # red-at-HEAD set. It exits non-zero if any fires, so a run that asserted
      # nothing cannot be reported as a pass.
      #
      # The third one exists because this job is red at HEAD by design (see the
      # `if: always()` note further down), which means its exit status says
      # nothing about regressions - it is already 1. The classifier is what
      # distinguishes a NEW failure from the known set, in both directions: an
      # unlisted failure is a regression, and a listed failure that stops
      # occurring means the defect was fixed without updating the list. Read
      # the `failures: N total, N expected, N unexpected` line, not the exit
      # code.
      #
      # The floor's VALUE deliberately does not appear here. It lives in
      # GOLDEN_MIN_PASSED at the bottom of tests/golden_path.sh, and nothing in
      # this job overrides it - the env block below sets three unrelated
      # variables and no more. This comment said "a MEASURED total-passed floor
      # of 24" until 2026-08-11, which was true when the job was wired and had
      # rotted by a factor of three as steps landed; the floor was 81 by then.
      # A stale number here is worse than none, because someone auditing whether
      # this gate means anything reads 24 and concludes it is nearly hollow.
      #
      # `--provision=deploy` is PASSED EXPLICITLY even though it is the harness's
      # default. The gap this closes was an arm selected by an absent environment
      # variable, and a job that relies on a default is one edit to that default
      # away from silently taking the other arm again. Written here, the arm this
      # job gates is visible in the job, and a change to it is a diff in this
      # file.
      - name: Golden path (build locally -> deploy -> serve, dev vs deployed)
        run: |
          set -o pipefail
          tests/golden_path.sh --provision=deploy 2>&1 | tee "$RUNNER_TEMP/golden-path.log"
        env:
          ZS_FRESHNESS_STRICT: 1
          PG_CONTAINER: compose-postgres-1
          PG_USER: postgres
      # THE ARM IS ENFORCED, not merely printed, and this step is what enforces
      # it. A run on the bypass arm does not exercise `zeroship deploy` at all -
      # the app is written straight into the registry and blob store - so it must
      # not be able to report as one that did.
      #
      # IT ASSERTS THE POSITIVE, AND THAT IS A DELIBERATE CHANGE OF SHAPE. This
      # used to count the skip marker the bypass arm announced, which made "the
      # covered arm ran" indistinguishable from "the harness produced no output
      # at all" unless the census also refused on an empty log. The skip protocol
      # is deleted workspace-wide, and grepping for the arm the job REQUIRES is
      # both simpler and stronger: a missing log, a truncated log and the wrong
      # arm all fail, because none of them contain the line.
      #
      # The string comes from golden_path.sh's own summary block, which prints
      # one `step 3 arm:` line unconditionally on every run, naming the arm it
      # took. -F, because the line contains no regex metacharacters worth
      # interpreting and a `--` in a pattern is an argument-parsing hazard.
      #
      # `if: always()` because the harness is red at HEAD by design; a step
      # without it would never run.
      - name: Golden path deploy arm (the deploy CLI must have been exercised)
        if: always()
        run: |
          if ! grep -qF 'step 3 arm: --provision=deploy' "$RUNNER_TEMP/golden-path.log"; then
            echo "FAIL: $RUNNER_TEMP/golden-path.log does not report the deploy arm." >&2
            echo "      Either the harness took --provision=dev-provision, which does NOT" >&2
            echo "      run \`zeroship deploy\`, or it produced no summary at all. Both are" >&2
            echo "      runs that say nothing about the deploy CLI. The arm this job gates" >&2
            echo "      is passed explicitly in the step above; check that first." >&2
            grep -F 'step 3 arm:' "$RUNNER_TEMP/golden-path.log" >&2 || \
              echo "      (no 'step 3 arm:' line in the log at all)" >&2
            exit 1
          fi
      # The .zship artifact contract, run over whatever the step above just
      # built. This job is the only one in the workflow that produces an
      # `examples/*/dist/app.zship`, which is why the check lives here rather
      # than in a job of its own - there is nothing for it to read anywhere else.
      #
      # `if: always()` is load-bearing, not defensive. golden_path.sh exits 1 BY
      # DESIGN at HEAD (step 10's six scaffold-policy reds, #260, and step 11's
      # two collation reds, #255), so a step without it would never run at all.
      # The contract check does not depend on the golden path's verdict, only on
      # its build output.
      #
      # WHAT IT CHECKS, per artifact: the archive is really zstd+tar with exactly
      # one root manifest.json; every other entry is `blobs/<64 hex>`; nothing
      # escapes the root; every blob's NAME equals the sha256 of its CONTENT;
      # every manifest-referenced hash resolves; every recorded `size` is the
      # real byte length; worker.entry names a key in worker.modules. A blob
      # whose name disagreed with its body would silently defeat the deploy
      # path's content-addressed dedup - the store would treat two different
      # bodies as one object - and nothing else in this repo opens the archive.
      #
      # MEASURED BEFORE WIRING, locally over all 29 artifacts in the tree:
      # 145 checks passed, 0 failed, 0 unreferenced blobs, 2.3s. Both mutation
      # controls the script declares were run and both fire hard:
      # MUTATE_CORRUPT_BLOB=1 -> 103/42, MUTATE_WRONG_SIZE=1 -> 128/17.
      #
      # COVERAGE HERE IS NARROWER THAN THAT, deliberately stated: CI sees only
      # the artifacts this job builds (starter, db-todos, the scaffold), not 29.
      # They are the ones built by the plugin at THIS commit, which is the set a
      # contract regression would show up in first.
      #
      # It cannot pass over nothing: finding zero artifacts is a FATAL exit 1
      # with "nothing was checked, which is not the same as everything passing".
      - name: .zship artifact contract (blob names, sizes, worker entry)
        if: always()
        run: |
          set -o pipefail
          tests/zship_artifact_gate.sh 2>&1 | tee "$RUNNER_TEMP/zship-contract.log"
      # The service logs the harness leaves in /tmp are where a failure is
      # actually diagnosable; without them a red run reports only which assertion
      # went red. `if: failure()` so a green run stays quiet.
      - name: Harness logs
        if: failure()
        run: |
          for f in /tmp/gp-build.log /tmp/gp-migrate.log /tmp/gp-control.log \
                   /tmp/gp-worker.log /tmp/gp-gate.log /tmp/gp-dev.log \
                   /tmp/gp-sup-a.log /tmp/gp-sup-b.log /tmp/gp-dbtodos.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            tail -60 "$f"
            echo "::endgroup::"
          done

  # The dev-vs-deployed family: run ONE identical operation sequence against
  # `pnpm dev` and against the same app deployed behind the gateway, then diff
  # the RESULTS. These are the only tests in the repo that can see a SEAM -
  # every crate suite drives one side and is blind by construction to "both
  # tiers answer, and they answer differently".
  #
  # FOUR of the nine are wired here. The other five are NOT, and they are held
  # back for three DIFFERENT reasons, which is worth keeping straight:
  #
  #   auth   RED on a real finding - 20 of 48 probed rows diverge (2026-08-10).
  #   login  RED on a real finding - 11 of 15 rows diverge: dev accepts a
  #          replayed session after signout, skips the X-ZS-Auth and Origin
  #          checks, and returns `scopes` the deployed tier omits.
  #   db     NOT a finding at all - it never gets far enough to compare. It
  #          aborts in setup: `dev did not apply migrations` -> `dev server never
  #          answered` -> `SEED FAILED, probe aborted`, with no summary line.
  #          ee2c352aa removed the boot-time schema apply from the dev server and
  #          split it into a separate `zeroship-dev-migrate` step, and updated no
  #          harness (`grep -rl zeroship-dev-migrate tests/` finds nothing). So
  #          `pnpm dev` no longer creates the schema and the harness never runs
  #          the step that now does. That is a stale harness, tracked as #262 -
  #          NOT a dev-vs-deployed disagreement, and it must not be read as one.
  #
  #   storage    GREEN when idle, RED under host load, deterministically.
  #   workflows  same, with three different timing failures. Both are documented
  #              at the point where their steps would otherwise sit, below.
  #
  # Wiring auth or login would mean weakening an assertion to match; they go
  # green by FIXING the divergence. db goes green by teaching the harness the
  # new dev-migration contract. storage and workflows go green by sizing their
  # CPU and readiness budgets for a loaded host.
  #
  # WHY LOAD IS A WIRING CRITERION AT ALL, and not fussiness: a GitHub-hosted
  # runner is 2-4 shared vCPUs, so "green on an idle 16-core workstation" is not
  # the question CI asks. Each candidate was therefore run twice: idle, and
  # against 12 busy cores. The four wired below held green in BOTH; the two
  # above went red only in the second. That is a discriminating test rather than
  # a stress test - it separates a harness that measures the product from one
  # that measures the host it ran on.
  #
  # The four wired here are unaffected by ee2c352aa, checked rather than assumed:
  # none of the fixture apps (stream-probe, kv-dashboard, error-probe, env-probe)
  # has a `migrations/` directory or a single `env.db` reference, so there is no
  # dev schema for the removed step to have created.
  # Checked the other way too, because "no migrations" is an argument and a
  # deleted directory is evidence: every app's `.zeroship` state directory was
  # moved aside and all of them re-run from nothing. Same counts for these four.
  # So none of the four is green on state left behind by an earlier run - which
  # is the specific false green that motivated looking.
  #
  # ONE JOB, SEQUENTIAL STEPS, not six jobs. The prerequisite - `pnpm build`
  # plus two cargo release builds - is the expensive part, and Swatinem's cache
  # is keyed per job, so six jobs would each pay a cold Rust build. A red tick
  # still names the failing step. The cost is that a failure stops the steps
  # after it; that is the trade taken, and re-running reports the next one.
  dev-vs-deployed:
    runs-on: ubuntu-latest
    # A bound for the same reason golden-path carries one: a service that never
    # binds, or a `pnpm build` that stalls, hangs rather than fails and would
    # otherwise burn the 6h default. The four harnesses measured 39s, 38s, 39s
    # and 30s locally; with a cold Rust build that sits far inside 90 minutes,
    # and the margin is deliberate because a 2-vCPU runner is much slower than
    # the box those numbers came from.
    #
    # NOT a retry, deliberately. A flaky step is a defect to diagnose; re-running
    # until green is how a real intermittent failure becomes invisible.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      # lsof only, and the omissions are deliberate rather than an oversight.
      # Every one of these six frees its ports with `lsof -ti :$PORT`; without it
      # each such call returns empty and a stale listener survives into the run.
      # NOT postgresql-client: unlike golden_path.sh, every psql call in this
      # family goes through `docker exec <container> psql`, which uses the
      # client inside the image. NOT zstd: nothing here unpacks a .zship.
      - name: Install harness prerequisites
        run: sudo apt-get update && sudo apt-get install -y lsof
      # Postgres as an explicit `docker run`, NOT a `services:` entry, and the
      # container NAME is the reason: stream/storage/workflows create and drop
      # their own dedicated database through `docker exec "$PG_CONTAINER" psql`
      # (default `compose-postgres-1`, matching the dev compose stack). GitHub
      # generates the name of a `services:` container, so `docker exec` by name
      # cannot reach it. Same reasoning as golden-path and billing-gate.
      #
      # errors and env do NOT use this one - they call stack_pg_up, which starts
      # its OWN postgres:16 container on its own port per harness. The native
      # KV test uses Testcontainers. These need Docker but not this step.
      - name: Start Postgres
        run: |
          docker run -d --name compose-postgres-1 -p 5440:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=zeroship \
            postgres:17
          for i in $(seq 1 40); do
            if docker exec compose-postgres-1 pg_isready -U postgres; then exit 0; fi
            sleep 3
          done
          echo "postgres failed to become ready" >&2; docker logs compose-postgres-1; exit 1
      - run: pnpm install --frozen-lockfile
      # The vendored engine ships no dist/ and the vite-plugin imports it, so it
      # has to be built before the SDKs. Same ordering as the `sdk` job.
      - run: pnpm --filter @zeroship/migrate build
      # `pnpm build` FIRST and cargo second is load-bearing, not stylistic: the
      # runtime crate `include_str!`s sdks/bootstrap/dist/{runtime-entry,dispatcher}.js.
      - run: pnpm build
      # dev-provision (from -p zeroship-control --bins) is what stream/kv/storage/
      # workflows deploy with; `-p zeroship-cli` produces the binary `pnpm dev` runs
      # as the dev tier on every one of the six.
      - name: Build the release binaries the harnesses start
        run: |
          cargo build --release -p zeroship-control -p zeroship-worker -p zeroship-data-cdc-server \
            -p zeroship-gateway -p zeroship-cli -p zeroship-migrate-server --bins
      # Account-status and spend-state both deploy the migration-first metering
      # probe. Build its ignored .zship and refresh its tracked IR together.
      - name: Build the metering probe
        run: pnpm --filter metering-probe build
      # ZS_FRESHNESS_STRICT=1 addresses the hazard tests/lib/binary_freshness.sh
      # describes: the dev tier runs `target/release/zeroship` and the deployed
      # tier runs the three server binaries, so a partial rebuild leaves the two
      # sides at different commits and the harness reports the VERSION SKEW as a
      # dev-vs-deployed divergence. That has already cost a full debugging cycle
      # once (a worker predating a list-shape change produced an error that read
      # exactly like an S3 defect).
      #
      # BE PRECISE ABOUT WHAT THIS FLAG CURRENTLY BUYS, because the obvious
      # reading is wrong. `zs_check_binary_freshness` returns 1 for "stale AND
      # strict" and 2 for "cannot answer", and all six of these harnesses call it
      # as `|| { [ "$?" -eq 2 ] && exit 2; }` - which acts on 2 and DISCARDS 1.
      # So in this family the flag makes the check WARN LOUDLY; it does not make
      # it refuse. Verified by running the caller pattern directly: a callee
      # returning 1 leaves the script running, one returning 2 exits 2. The
      # library function is right and its own selftest asserts rc==1; the six
      # callers drop it. Setting the variable is still correct - it is what makes
      # the warning appear at all, and it is what the refusal arm will read once
      # wired - but do not read a green run here as proof the binaries matched.
      # (golden-path is different: golden_path.sh has its own inline dist check
      # that really does `exit 1` under this flag.)
      #
      # `set -o pipefail` before each tee: GitHub's default shell is `bash -e`
      # WITHOUT pipefail, so `script | tee` reports tee's status - 0 whenever tee
      # could write - and a failing harness would sail through as a pass.
      #
      # Each harness carries its own anti-hollow-gate floor (a MEASURED minimum
      # passed-assertion count, cross-checked against an independent static count
      # of the call sites in its source) and exits non-zero if the floor is
      # breached, so a run that asserted nothing cannot report as a pass. The
      # derivation is written out at the bottom of each script.
      - name: Streaming (SSE chunk boundaries survive the gateway)
        run: |
          set -o pipefail
          tests/e2e_dev_vs_deployed_stream.sh 2>&1 | tee "$RUNNER_TEMP/dvd-stream.log"
        env:
          ZS_FRESHNESS_STRICT: 1
          PG_CONTAINER: compose-postgres-1
          PG_USER: postgres
      - name: Install the KV dashboard browser
        run: pnpm --dir examples/kv-dashboard exec playwright install --with-deps chromium
      - name: KV dashboard (RPC and browser on redb and Redis)
        run: pnpm --dir examples/kv-dashboard test
      - name: Retain KV fixture failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kv-deployment-logs
          path: examples/kv-dashboard/tests/.artifacts/**
          if-no-files-found: ignore
      # env.auth. This harness existed and ran in NO workflow until 2026-08-12.
      # Unlike storage and workflows below, whose exclusions are measured and
      # written down, nothing recorded a reason for this one - so it was an
      # omission, not a decision.
      #
      # WIRED ONLY AFTER MEASURING THAT IT CAN BE. Run at HEAD on this tree:
      # 22 passed, 1 failed, against its own AUTH_MIN_PASSED floor of 22. The
      # single red is the KNOWN dev-vs-deployed auth contract gap (20 of 48 rows
      # divergent, matching the number recorded when that gap was measured), and
      # the script CLASSIFIES it: `exit 0` on that documented shape, `exit 1` on
      # anything else. So it is green here by design and goes red the moment the
      # divergence set changes - which is the whole point of wiring it.
      #
      # Its siblings db and login ARE wired now, below. That paragraph used to
      # say login was deliberately excluded because it had no classifier and no
      # floor; both landed (05512356c, 04ae1edc5) and the exclusion expired with
      # them. All three classify by row IDENTITY rather than by count.
      - name: env.auth (dev provider vs deployed gateway identity)
        run: |
          set -o pipefail
          tests/e2e_dev_vs_deployed_auth.sh 2>&1 | tee "$RUNNER_TEMP/dvd-auth.log"
        env:
          ZS_FRESHNESS_STRICT: 1
          PG_CONTAINER: compose-postgres-1
          PG_USER: postgres
      # env.db and login. Both were classified before auth was, and both were
      # deliberately LEFT unwired for one stated reason: their counts had only
      # ever been measured on an idle machine, and storage and workflows (below)
      # are two standing cases of a harness that is stable idle and not stable
      # contended. That objection is now discharged by measurement rather than
      # by argument.
      #
      # MEASURED 2026-08-12, the condition a CI runner actually imposes: db and
      # login run CONCURRENTLY WITH EACH OTHER (four services each, and their
      # port bands do not overlap - db 93xx/3021/5021/5487, login 94xx/3092/
      # 5092/5460) plus 8 extra busy loops on a 16-core box. TWO such rounds:
      #     db     121 passed, 1 failed  (floor 121)  exit 0, both rounds
      #     login   30 passed, 1 failed  (floor 30)   exit 0, both rounds
      # and the divergent row SET was identical across both rounds on each.
      #
      # The load did change something, and it is the thing the design predicted:
      # db diverged on all FIVE rows both loaded rounds - including txBranch and
      # txOrphan, which are the two carried on db's TOLERATED list precisely
      # because they are timing-dependent (idle rounds have gone 5, 5 and 3).
      # A fixed COUNT would therefore have been wrong in one direction or the
      # other here, and the idle 3-run would have reported STALE EXPECTATION.
      # That is why these two are wireable only now that they compare identities
      # with a tolerated list, and not before.
      - name: env.db (SQLite dev vs Postgres deployed)
        run: |
          set -o pipefail
          tests/e2e_dev_vs_deployed_db.sh 2>&1 | tee "$RUNNER_TEMP/dvd-db.log"
        env:
          ZS_FRESHNESS_STRICT: 1
          PG_CONTAINER: compose-postgres-1
          PG_USER: postgres
      - name: Login (dev auth provider vs deployed OP)
        run: |
          set -o pipefail
          tests/e2e_dev_vs_deployed_login.sh 2>&1 | tee "$RUNNER_TEMP/dvd-login.log"
        env:
          ZS_FRESHNESS_STRICT: 1
          PG_CONTAINER: compose-postgres-1
          PG_USER: postgres
      # tests/e2e_dev_vs_deployed_storage.sh IS NOT WIRED HERE, and the reason is
      # a measurement rather than a suspicion. It carries a floor of 53 and scores
      # 54/0 on an idle machine - but its deployed 1 MiB chunked streamGet dies on
      # the worker's per-request CPU budget as soon as the host is contended:
      #
      #   idle machine     6 runs, 6 green   (54 passed, 0 failed)
      #   12 busy cores    2 runs, 2 RED     (48 passed, 6 failed), every time
      #                    `streamGet {"message":"CPU time limit exceeded"}`
      #
      # Same signature both times, so this is a deterministic sensitivity to host
      # load, not a random flake. A GitHub-hosted runner is 2-4 shared vCPUs, so
      # wiring it would produce a red that is about the runner rather than about
      # the product - and the honest fix is neither a retry (this repo's stance:
      # a flaky step is a defect to diagnose) nor a lowered floor.
      #
      # RE-MEASURED 2026-08-12 and the finding is sharper than "a 1 MiB read
      # costs too much" (task #364). Reproduced at 48/6 under 12 busy loops, and
      # THREE probes touch the same 1 MiB object in that same run:
      #   probe.streamPut           1 MiB written in 16 x 64 KiB chunks  PASSES
      #   probe.streamThenBuffered  1 MiB read buffered + checksummed    PASSES
      #   probe.streamGet           1 MiB read CHUNKED + checksummed     FAILS
      # Same bytes, proven by the identical checksum. streamThenBuffered runs
      # checksumOf() over the whole megabyte, so it does the same JS byte-loop
      # arithmetic - the differing variable is the `await reader.read()` loop,
      # not the volume and not the checksum. So this is a question about the
      # chunked READ path specifically. A creator draining a 1 MiB object
      # chunked on a busy node gets a 500. Wire it once that is settled.
      #
      # Three follow-ups, same day, so nobody re-runs them.
      #
      # (1) It REPRODUCES on freshly built worker/gateway/cli binaries (48/6
      # again), so the earlier measurement was not an artefact of a stale build.
      #
      # (2) NEITHER HALF EXCEEDS THE BUDGET ALONE - the sum does. Removing ONLY
      # the `updateChecksum` call from streamGet's drain loop, same 1 MiB, same
      # 12 busy loops, gives `53 passed, 1 failed` with ZERO "CPU time limit
      # exceeded", and the one failure is the checksum-mismatch assertion that
      # mutation must move. So chunk delivery on its own fits, and the spine
      # measures the checksum at ~30 ms on its own. Do not read this as "chunked
      # delivery is too expensive" and go optimise it in isolation.
      #
      # (3) What the three arms bound, taking the spine's ~30 ms checksum (which
      # was measured on a DIFFERENT vehicle, so this is inference, not a reading):
      # chunked delivery is over ~20 ms, buffered `get` is under ~20 ms, and the
      # 50 ms free-tier budget fits either one plus the checksum but not the
      # chunked pair. That is the shape any fix has to move.
      # tests/e2e_dev_vs_deployed_workflows.sh IS NOT WIRED HERE either, for the
      # same measured reason as storage and with a messier signature:
      #
      #   idle machine     3 runs, 3 green   (44 passed, 0 failed)
      #   12 busy cores    3 runs, 3 RED, and a DIFFERENT failure each time -
      #                    "dev server never answered" (the runtime missed the
      #                    25 x 2s readiness window), then `sleep` answering
      #                    `internal error` with the diff going red behind it,
      #                    then "platform migrations failed" before anything ran
      #
      # Three modes, one cause: every one is a timing budget, and under contention
      # a different one loses first. That is worse for CI than storage's single
      # deterministic failure, because each mode reads like a different product
      # bug. Not wired until the budgets are sized for a loaded host.
      #
      # RE-MEASURED 2026-08-12 and the RATE has moved a lot, though the verdict
      # has not. FOUR rounds under the same 12 busy loops that reproduce
      # storage's red on this box (so the load is real, not a weaker harness):
      #     3 rounds GREEN, 44 passed / 0 failed, exit 0
      #     1 round  RED,   36 passed / 8 failed, exit 1
      # So "3/3 red" no longer reproduces; it is roughly 1 in 4 now. Several
      # timing fixes landed in between and I have NOT attributed the change to
      # any of them.
      #
      # The surviving red is a FIFTH mode, none of the three above: the deployed
      # `wf.start` refuses with
      #     START-REFUSED {"message":"request timed out","name":"Error"}
      # and every one of the 8 failures in that round is downstream of that one
      # refused start.
      #
      # THAT IS THE DEPLOYED APP'S 5s WALL BUDGET, not a client timeout. I first
      # wrote "the @zeroship/rpc client timeout" here off the first grep hit
      # (sdks/rpc/src/transport.ts carries the same string) and that was wrong:
      # the harness calls with `curl -m 20`, so the TS client is not on this
      # path at all, and the value arrived as a RESPONSE BODY. The server-side
      # emitter is crates/worker/src/handler.rs (`make_error_msg(504, "request
      # timed out")`), and examples/workflow-probe/src/index.ts already explains
      # the cause in a comment written during an earlier investigation: dev
      # (`zeroship serve`) leaves the per-request wall clock unbounded
      # (crates/runtime/src/core/serve.rs, `wall_timeout: None`) while a
      # deployed app inherits FREE_TIER_RUNTIME_LIMITS - 5s wall, 50ms CPU.
      #
      # So this is the SAME family as the storage red above: a free-tier budget
      # sized on an idle host, crossed under contention, and invisible in dev
      # because dev does not enforce that budget at all. Worth knowing before
      # anyone treats the two as separate problems.
      # Asserts ABSOLUTELY on the deployed body, not only relatively: production
      # shipped Error.stack to anonymous callers for weeks while the auth harness
      # stayed green, because dev leaked the same stack and the diff was empty.
      # PG_CONTAINER is deliberately NOT set - this one starts its own.
      - name: Error envelopes (does production leak Error.stack?)
        run: |
          set -o pipefail
          tests/e2e_dev_vs_deployed_errors.sh 2>&1 | tee "$RUNNER_TEMP/dvd-errors.log"
        env:
          ZS_FRESHNESS_STRICT: 1
      # Same: starts its own Postgres. Asserts that a variable present in the
      # shell that launched the server, and never deployed, cannot be read by app
      # code - having first PROVEN off /proc that the variable was in the live
      # worker's environment to be leaked.
      - name: Environment surface (host vars must not reach app code)
        run: |
          set -o pipefail
          tests/e2e_dev_vs_deployed_env.sh 2>&1 | tee "$RUNNER_TEMP/dvd-env.log"
        env:
          ZS_FRESHNESS_STRICT: 1
      # Not a dev-vs-deployed diff, but the same KIND of test and the same
      # expensive prerequisite, so it rides this job's build rather than paying
      # a cold one of its own: a seam between two components that are each
      # self-consistent. The gateway splits a request path on '/' and enforces
      # the matched resource's auth level; the worker hands the URL to V8, whose
      # WHATWG parser folds '\' to '/' for special schemes. A unit test on
      # either side passes. Only a request driven end to end can see it.
      #
      # RAN IN NO WORKFLOW until 2026-08-11. Measured before wiring, three runs
      # of mine: 18 passed / 0 failed idle, 18/0 against 12 busy cores with an
      # IDENTICAL assertion set, 26s wall clock. That is the standard this job's
      # own comment sets - a GitHub runner is 2-4 shared vCPUs, so idle-green is
      # not the question CI asks.
      #
      # IT IS A NEGATIVE RESULT, and its controls are what make that worth
      # keeping: T2 proves the target resource DOES reject anonymously (401), so
      # a 200 on the attack would have meant something, and T3 proves the
      # dot-segment guard is live in THIS binary, so the attack's 400 is
      # coverage rather than a guard that never ran. The gateway rejects the
      # literal-backslash forms today; this pins that it keeps doing so.
      #
      # Starts its own Postgres through tests/lib/e2e_stack.sh, so PG_CONTAINER
      # is deliberately not set here.
      - name: Gateway path canonicality (literal backslash must not split the gate from the worker)
        run: |
          set -o pipefail
          tests/e2e_gateway_path_backslash.sh 2>&1 | tee "$RUNNER_TEMP/dvd-backslash.log"
        env:
          ZS_FRESHNESS_STRICT: 1
      # Control refuses every worker enrolment unless an operator DECLARED an
      # address envelope, and no file in this repository declared one until
      # tests/lib/e2e_stack.sh did - so the endpoint was unreachable in every
      # deployment here while its unit tests, which supply their own envelope,
      # stayed green. That is precisely the gap a crate-local test cannot see,
      # and it is why this is wired rather than left to be run by hand.
      #
      # It carries its own one-variable control: a SECOND control plane, same
      # binary and same database, with the network half cleared and nothing else
      # changed, must refuse the identical request as `envelope_unset`. Without
      # it a green run could not tell a working declaration from an endpoint
      # that admits everything.
      #
      # Starts its own Postgres through tests/lib/e2e_stack.sh, so PG_CONTAINER
      # is deliberately not set here.
      - name: Worker enrolment (the declared envelope admits, an undeclared one refuses)
        run: |
          set -o pipefail
          tests/e2e_worker_enrolment.sh 2>&1 | tee "$RUNNER_TEMP/dvd-enrolment.log"
      # The probe that CONFIRMED #199 by execution, and until now it ran in NO
      # workflow: `grep -rn e2e_gateway_workflow_advance_authz .github/`
      # returned nothing while the same search for golden_path.sh returned
      # ci.yml. So the single finding in this review with executed evidence of a
      # live authorization gap was ungated - whoever FIXES it would have been
      # told by nothing, and a widening would have been told by nothing either.
      #
      # IT IS RED AT HEAD, AND THAT IS WHY IT CARRIES A CLASSIFIER RATHER THAN
      # `continue-on-error`. #199's gap is real and unfixed, so a raw wiring
      # would paint this job permanently red and hide the next real regression
      # inside a failure everyone learns to skip. The script's own two-sided
      # block (414b8476c) exits 0 only when the documented, bounded gap is the
      # ONLY failure; it exits 1 on anything new AND on the gap disappearing
      # while AUTHZ_EXPECTED_FAILURES still names it.
      #
      # BOUNDED, and the probe measures the bounds itself rather than asserting
      # them: phase 2 shows the shipped worker refusing the unsigned advance
      # (HTTP 403, run stays queued) and phase 3 shows the dotless Host that
      # bypasses the gate is not routable through Caddy. Reaching the gap needs
      # BOTH the worker flag ON and direct gateway access.
      - name: Gateway workflow-advance authorization (#199 - red at HEAD, classified)
        run: |
          set -o pipefail
          tests/e2e_gateway_workflow_advance_authz.sh 2>&1 | tee "$RUNNER_TEMP/dvd-wfadvz.log"
      # examples/ are workspace packages (pnpm-workspace.yaml lists `examples/*`)
      # but root `pnpm build` is `pnpm -r --filter './sdks/*' ...`, so it does
      # NOT build them. Without this step the harness below reaches its own
      # prereq check and exits 1 with
      #   FAIL missing .../examples/kv-dashboard/dist/app.zship
      # i.e. a wired job that cannot run, the defect ac3bfd2cf and a001f28f9
      # already cost this project. MEASURED, not estimated: 7s + 4s = 11s from a
      # cleaned dist/ on a workstation. That is noise against this job's 90m
      # bound even if a 2-vCPU runner is several times slower.
      - name: Build the two example apps the redeploy harness deploys
        run: |
          (cd examples/kv-dashboard && pnpm build)
          (cd examples/starter && pnpm build)
      # Scenario 22: a redeploy while end users are mid-request. The harness
      # deploys two DIFFERENT apps under one name, so the swap is real -- a
      # rebuild of the SAME source is not, because deploy_hash comes from the
      # worker module blob and two builds of unchanged source produce the same
      # blob (measured: archives differ, blob is byte-identical).
      #
      # It asserts on 5xx-or-transport, NOT on non-200: A and B expose disjoint
      # procedures, so a 404 after the swap is CORRECT and counting non-200s
      # would report a break out of a healthy run. A span guard requires the
      # traffic to have seen both bundles, because with zero requests the 5xx
      # assertion passes vacuously.
      - name: Redeploy under load (scenario 22 - in-flight requests survive)
        run: |
          set -o pipefail
          tests/e2e_redeploy_replaces_app.sh 2>&1 | tee "$RUNNER_TEMP/dvd-redeploy.log"
      # Scenario 22, DEV half. No docker and no Postgres: the dev tier is
      # SQLite + the release `zeroship` binary this job already builds, driven
      # by `pnpm dev`. It edits examples/starter/src/server.ts and restores it
      # from a trap, which is safe on an ephemeral checkout.
      #
      # The span guard is the load-bearing assertion, not the 5xx one: the
      # first version of this experiment edited a console.log, which dev
      # DISCARDS (scenario 20), so a clean result was equally consistent with a
      # reload that never happened. Control-proven - disabling the edit gives
      # old=909 new=0 and rc=1.
      - name: Dev reload under load (scenario 22 - dev half, tiers must agree)
        run: |
          set -o pipefail
          tests/e2e_dev_reload_under_load.sh 2>&1 | tee "$RUNNER_TEMP/dvd-devreload.log"
      # Two of the 27 ungated harnesses (task #340), wired because I RAN both
      # green rather than because they looked safe. Cheapest first: neither
      # needs a new build step, unlike the redeploy harness which needed the
      # examples built.
      #
      # secret_expose_cli is standalone - no docker, no Postgres - and scored
      # 35 passed / 0 failed on my run. NOTE for anyone reading its output: it
      # PRINTS a line reading "27 passed / 8 failed, controls all still green".
      # That is its mutation-control DOCUMENTATION, describing what mutating
      # crates/cli/src/secrets.rs merge_expose would produce. It is not a
      # result. I misread it as one because it is the last line of the log.
      - name: Secret expose CLI (standalone, 35/0 at HEAD)
        run: |
          set -o pipefail
          tests/e2e_secret_expose_cli.sh 2>&1 | tee "$RUNNER_TEMP/dvd-expose.log"
      # uri starts its OWN ephemeral Postgres on :5446, so it needs docker
      # (present in this job) but not the shared compose-postgres-1 container.
      - name: Complex URI forwarding (own ephemeral Postgres)
        run: |
          set -o pipefail
          tests/e2e_uri.sh 2>&1 | tee "$RUNNER_TEMP/dvd-uri.log"
      # Scenario 15's harness (#305) - SSG / SSR / CSR through the gateway. It
      # was WALKED and mutation-proven in this review and then sat ungated,
      # which is task #340's point in one artifact: 29/0 is the same figure
      # #305 recorded, so the thing that proved the scenario was reporting to
      # nobody. Run by me at HEAD before wiring: 29 passed, 0 failed, 0
      # known-fail, 0 skipped, rc=0.
      - name: App primitives - rendering modes (scenario 15, 29/0 at HEAD)
        run: |
          set -o pipefail
          tests/e2e_app_primitives_render.sh 2>&1 | tee "$RUNNER_TEMP/dvd-render.log"
      # A COUNT IN A COMMENT DECAYS, and these two are why the shape is worth a
      # warning. Both carried "run by me at HEAD: N passed, 0 failed" from the
      # day they were wired (2026-08-11). On 2026-08-16 9b205f6ed removed the
      # worker's `--config` overlay as a credential boundary and both harnesses
      # kept passing it, so from that commit forward the worker exited on
      #
      #     error: unexpected argument '--config' found
      #
      # before either script's first assertion. Neither number had been true for
      # four days, and neither comment moved, because nothing re-runs a comment.
      # Date the measurement or delete it; an undated count reads as current
      # forever. tests/config_check_e2e.sh case 13c is the static gate that now
      # fails on a worker launch carrying --config.
      #
      # Scenario 17's harness (#311) - Active / PastDue / Suspended enforced at
      # the gateway. Re-run on this branch 2026-08-20 against the flag fix:
      # 18 passed, 0 failed, rc=0. Database provisioning adds two mandatory rows,
      # so the harness now requires a 20-assertion denominator.
      - name: Account status enforcement (scenario 17)
        run: |
          set -o pipefail
          tests/e2e_account_status_enforcement.sh 2>&1 | tee "$RUNNER_TEMP/dvd-acctstatus.log"
      # Scenario 16's harness (#306) - the spend ladder, Allow -> Warn ->
      # Degrade -> Block and recovery, enforced at the gateway. Re-run on this
      # branch 2026-08-20: 30 passed, 0 failed, rc=0. Database provisioning adds
      # two mandatory rows, so the harness now requires a 32-assertion denominator.
      #
      # Worth keeping because the commercial ladder is the one place a bug is
      # silently expensive: a broken Block arm serves traffic nobody is paying
      # for, and #306 found this harness had also been exiting 0 without docker.
      - name: Spend state transitions (scenario 16)
        run: |
          set -o pipefail
          tests/e2e_spend_state_transitions.sh 2>&1 | tee "$RUNNER_TEMP/dvd-spend.log"
      # The service logs these harnesses leave behind are where a failure is
      # actually diagnosable; without them a red run reports only which assertion
      # went red. They live in per-run mktemp dirs that the harness deletes on
      # exit, so what survives is the tee'd transcript - which carries the raw
      # deployed bodies each script prints on the way out.
      - name: Harness transcripts
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/dvd-*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            tail -120 "$f"
            echo "::endgroup::"
          done

  # The billing & metering pipeline end to end: real gateway traffic -> worker
  # platform counters + env.db primitive metrics -> Redpanda -> control's
  # recompute -> usage_aggregates -> priced charge -> spend Block/Degrade ->
  # Stripe invoice-item + finalize -> idempotent re-trigger. It is the only
  # harness that walks the whole commercial chain, and until 2026-08-11 it ran
  # in NO workflow.
  #
  # WHY IT IS WIRED NOW, and why it was not before: three things had to be true
  # first, and none of them was.
  #   eda51b973  its two env.db guards could not fail. One matched the STRING
  #              "db_writes" anywhere in the response (the probe prints that
  #              name regardless), the other had a bare `echo` for an else arm.
  #              Both were green over a property that had never held.
  #   e03f00353  the property itself was false: examples/metering-probe had no
  #              migrations/, so env.db installed nothing and every insert
  #              failed. db_writes now reaches usage_aggregates.
  #   a70280f4c  under load the harness SILENTLY DROPPED an assertion (38 of
  #              39, reported as "0 failed") because Postgres readiness was
  #              keyed on pg_isready and the consequence hid behind `|| true`.
  #   ae3943862  a floor on assertions that RAN, so the next such loss is a red
  #              rather than a quiet 38.
  # Wiring it before those would have put a hollow gate into CI.
  #
  # MEASURED AGAINST THE STANDARD THIS FILE ALREADY SETS for the
  # dev-vs-deployed family - idle AND against 12 busy cores, because a
  # GitHub-hosted runner is 2-4 shared vCPUs and "green on an idle 16-core
  # workstation" is not the question CI asks:
  #     idle          39 passed, 0 failed
  #     12 busy cores 39 passed, 0 failed   (38 before a70280f4c - the criterion
  #                                          caught a real defect on first use)
  #
  # Postgres and Redpanda are BOTH started by the harness itself (it docker-runs
  # its own `zs-e2e-billing-pg` and `zs-e2e-billing-redpanda` on a dedicated
  # port band), so this job provisions neither. That is also why there is no
  # `services:` block: the harness reaches its containers by NAME through
  # `docker exec`, and GitHub generates the name of a `services:` container -
  # the same reason golden-path and billing-gate start theirs as steps.
  billing-pipeline-e2e:
    runs-on: ubuntu-latest
    # A bound for the reason golden-path carries one: a service that never binds
    # hangs rather than fails and would otherwise burn the 6h default. The
    # harness itself took ~4 min on a 16-core box and ~5 min under 12-core load;
    # 60 minutes is well clear of that plus a cold Rust build on a 2-vCPU runner.
    #
    # NOT a retry, deliberately. A flaky step is a defect to diagnose; re-running
    # until green is how a real intermittent failure becomes invisible.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      # No lsof: the harness allocates its ports per run (tests/lib/e2e_ports.sh)
      # instead of pinning a band and SIGKILLing whatever holds it, so there is
      # no stale listener to clear. This comment used to explain the opposite.
      - name: Install harness prerequisites
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      # The vendored engine ships no dist/ and the vite-plugin imports it, so it
      # builds before the SDKs. Same ordering as the `sdk` and golden-path jobs.
      - run: pnpm --filter @zeroship/migrate build
      # `pnpm build` before cargo is load-bearing: the runtime crate
      # include_str!s sdks/bootstrap/dist/{runtime-entry,dispatcher}.js.
      - run: pnpm build
      # zeroship-migrate-server is in this list because e03f00353 wired a migration
      # apply into the harness - the probe is migration-first now, and without
      # that binary its env.db has no table.
      - name: Build the release binaries the harness starts
        run: |
          cargo build --release -p zeroship-control -p zeroship-worker -p zeroship-data-cdc-server \
            -p zeroship-gateway -p zeroship-cli -p zeroship-migrate-server --bins
      # The harness refuses to start without a built probe and says so; building
      # it here rather than letting that refusal read as a CI misconfiguration.
      - name: Build the metering probe
        run: pnpm --filter metering-probe build
      # `set -o pipefail` before the tee for the reason the rust job documents:
      # GitHub's default shell is `bash -e` WITHOUT pipefail, so `script | tee`
      # reports tee's status and a failing harness would sail through as a pass.
      - name: Billing and metering pipeline (traffic -> usage -> charge -> invoice)
        run: |
          set -o pipefail
          tests/e2e_metering_billing.sh 2>&1 | tee "$RUNNER_TEMP/billing-pipeline.log"
