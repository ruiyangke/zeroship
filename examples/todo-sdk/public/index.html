<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App — appbase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 60px 20px;
    }
    .container { width: 100%; max-width: 480px; }
    h1 { text-align: center; font-weight: 300; letter-spacing: 0.1em; margin-bottom: 32px; color: #fff; }
    .form { display: flex; gap: 8px; margin-bottom: 24px; }
    .form input {
      flex: 1; padding: 12px 16px; font-size: 15px;
      border: 1px solid #2a2a3e; border-radius: 8px;
      background: rgba(255,255,255,0.04); color: #e0e0e0; outline: none;
    }
    .form button {
      padding: 12px 20px; font-size: 14px; font-weight: 500;
      border: none; border-radius: 8px; background: #646cff; color: #fff; cursor: pointer;
    }
    .list { list-style: none; }
    .item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: 8px;
      background: rgba(255,255,255,0.03); margin-bottom: 4px;
    }
    .item.done .text { text-decoration: line-through; opacity: 0.4; }
    .check {
      width: 22px; height: 22px; border-radius: 6px;
      border: 1.5px solid #3a3a5c; background: transparent;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: transparent;
    }
    .check.checked { background: #646cff; border-color: #646cff; color: #fff; }
    .text { flex: 1; font-size: 15px; }
    .delete { background: none; border: none; color: #555; font-size: 18px; cursor: pointer; padding: 0 4px; }
    .stats { text-align: center; padding: 16px 0; font-size: 13px; color: #555; }
    .empty { text-align: center; padding: 40px 0; color: #444; }
  </style>
</head>
<body>
  <div class="container">
    <h1>todo</h1>
    <div class="form">
      <input id="input" placeholder="What needs to be done?" autofocus>
      <button onclick="addTodo()">Add</button>
    </div>
    <ul class="list" id="list"></ul>
    <div class="stats" id="stats"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
