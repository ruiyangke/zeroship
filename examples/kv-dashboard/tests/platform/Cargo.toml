[package]
name = "kv-dashboard-tests"
version = "0.1.0"
edition = "2021"
publish = false

[[test]]
name = "acceptance"
path = "acceptance.rs"

[dev-dependencies]
zeroship-core = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem", "rand_core"] }
rand = "0.8"
tempfile = { workspace = true }
testcontainers = { version = "0.28", default-features = false, features = ["blocking"] }
ureq = { version = "3", default-features = false, features = ["json"] }
rcgen = "0.14"
nix = { version = "0.31", features = ["signal"] }
toml = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }

[lints]
workspace = true
