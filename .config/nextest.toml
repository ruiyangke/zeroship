[profile.data]
fail-fast = false
retries = 0
test-threads = 8
slow-timeout = { period = "60s", terminate-after = 5 }

# Database tests own independent PostgreSQL containers. Bound concurrent server
# startup and V8 memory use while pure SQL and wire tests run concurrently.
[test-groups.data-database]
max-threads = 4

[[profile.default.overrides]]
filter = 'package(zeroship-data-orm) | package(zeroship-data-v8) | package(zeroship-data-cdc-server)'
test-group = 'data-database'

[profile.data.junit]
path = "junit.xml"
