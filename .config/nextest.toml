nextest-version = { required = "0.9.136" }

# One shared server per worktree serves every test process, so the run is not
# bounded by container count. A case that stops making progress is reported
# rather than allowed to hold the run open.
[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "30s" }

# CI carries the same bounds and records a JUnit report for the run.
[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "30s" }

[profile.ci.junit]
path = "junit.xml"

# The cases that build a string past V8's length limit from creator code, and
# the cases that allocate past an isolate's heap cap, allocate for real, up to
# V8's largest single object. One at a time keeps their peak memory from
# stacking.
[test-groups]
v8-large-allocation = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(zeroship-runtime) and test(/callback_safety::an_oversized_/)'
test-group = 'v8-large-allocation'

[[profile.default.overrides]]
filter = 'package(zeroship-runtime) and test(/heap_limits::/)'
test-group = 'v8-large-allocation'

[[profile.default.overrides]]
filter = 'package(zeroship-worker) and test(/an_isolate_stopped_at_its_heap_cap_is_replaced_by_the_next_request/)'
test-group = 'v8-large-allocation'

[[profile.default.overrides]]
filter = 'package(zeroship-runtime) and test(/the_request_after_a_heap_cap_stop_runs_on_a_fresh_isolate/)'
test-group = 'v8-large-allocation'

[[profile.default.overrides]]
filter = 'package(zeroship-runtime) and test(/subscription::eviction_runs_no_abort_listener_on_a_heap_stopped_isolate/)'
test-group = 'v8-large-allocation'

[[profile.default.overrides]]
filter = 'package(zeroship-worker) and test(/a_stopped_isolate_leaves_the_cache_without_a_new_request_or_eviction/)'
test-group = 'v8-large-allocation'
