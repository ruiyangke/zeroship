[package]
name = "appbase-gateway"
version = "0.1.0"
edition = "2021"
description = "appbase gateway — auth, rate limit, proxy to workers"

[[bin]]
name = "appbase-gate"
path = "src/main.rs"

[dependencies]
appbase-core = { workspace = true }
ntex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
compio = { workspace = true }
url = { workspace = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
httparse = { workspace = true }
mimalloc = { workspace = true }

[lints]
workspace = true
