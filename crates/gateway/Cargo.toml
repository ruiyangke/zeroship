[package]
name = "zeroship-gateway"
version = "0.1.0"
edition = "2021"
description = "zeroship gateway — auth, rate limit, proxy to workers"

[[bin]]
name = "zeroship-gate"
path = "src/main.rs"

[dependencies]
zeroship-core = { workspace = true }
zeroship-bundle = { workspace = true }
# Metering coverage (#27): the gateway is a SECOND metering producer. It
# builds its own process-wide `Arc<Meter>` + `spawn_flush_task` (same wire
# type, same `/internal/usage` ingest as the worker) and emits
# `gateway_egress_bytes` for the bodies the worker never sees (static
# assets, redirects, gateway error pages). The crate is service-agnostic
# (no V8), so this is a plain dependency with no new abstraction.
zeroship-metering = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
ntex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
compio = { workspace = true, features = ["fs"] }
url = { workspace = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
httparse = { workspace = true }
mimalloc = { workspace = true }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
lru = { workspace = true }
memmap2 = { workspace = true }
flume = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
cyper = { workspace = true }
http = { workspace = true }
rand = "0.8"
# auth-sdk Slice 1b-anchors — per-node mint single-flight uses
# `futures::future::Shared` to coalesce concurrent `?mint=1` minters for
# one anchor into a single Hydra refresh (the round-6 BLOCKER design).
futures = { workspace = true }
# Phase 8 U1 — gateway-issued wrapper-token signing key. PKCS#8
# PEM/DER loader for an Ed25519 private key (`openssl genpkey
# -algorithm ed25519`). The `pkcs8` + `pem` features pull in the
# `DecodePrivateKey` trait used by `crates/gateway/src/signing.rs`.
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem"] }
# Phase 3 U4 — per-origin app session store (`auth.gateway_sessions`).
compio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }

[dev-dependencies]
# Integration tests construct `GateState`, whose `meter` field is an
# `Arc<zeroship_metering::Meter>` (coverage #27). They need the type in
# scope to build the fixture.
zeroship-metering = { workspace = true }
async-trait = { workspace = true }
# Phase 3 U4 smoke test runs `zeroship_auth::store::migrations::migrate`
# against a live PG to guarantee the `auth.gateway_sessions` table
# exists before the CRUD round-trip. NOT a runtime dep — the gateway
# bin never imports `zeroship-auth`.
zeroship-auth = { workspace = true }
# The oidc_rp_e2e fixture builds an `AuthConfig` whose `smtp_tls` /
# `relay_smtp_tls` fields are `zeroship_mailer::SmtpTls` (the mailer was
# extracted out of `zeroship-auth` into its own crate). NOT a runtime dep.
zeroship-mailer = { workspace = true }
# Phase 8 U1 — signing-key loader round-trip tests write a PKCS#8
# PEM/DER fixture to a tmpdir and call `signing::load_from_path`.
tempfile = { workspace = true }

[lints]
workspace = true
