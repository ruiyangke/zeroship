[package]
name = "zeroship-cdc-wire"
version = "0.1.0"
edition = "2021"
description = "The CDC relay/worker wire contract: framing, the eleven frame types, the subscribe request and its permit commitment, and the closed enums both sides name. No I/O, no V8, no driver - encode and decode only."

# ---------------------------------------------------------------------------
# WHAT THIS MANIFEST IS FOR.
# ---------------------------------------------------------------------------
#
# `docs/proposals/2026-08-28-cdc-service.md` ("The worker/relay wire contract")
# calls for "a new leaf crate `zeroship-cdc-wire`, no I/O, no V8, to be depended
# on by both `zeroship-data-cdc-server` and `zeroship-data-v8`". LEAF is
# enforced HERE, the same
# way `crates/zeroship-data-sql/Cargo.toml` enforces its vendor fence: the names
# that would break it are absent below, so spelling one is E0433 at compile time.
#
# ABSENT ON PURPOSE, and each for its own reason:
#
#   compio, cyper, ntex        This crate must not be able to perform I/O. The
#                              relay owns its server and the worker owns its
#                              client; both hand this crate bytes.
#   v8, zeroship-runtime       A wire type that can name a V8 value is a wire
#                              type creator code can reach.
#   zeroship-data-v8         The proposal states it outright: "the relay does
#                              not depend on `zeroship-data-v8` either -
#                              neither edge exists, and the manifest states why
#                              for each absent one." The wire crate sits under
#                              the relay (`zeroship-data-cdc-server`) and the
#                              worker both, so it may not name either.
#   zeroship-data-*            Same direction. `ChangeEvent` is the BROKER's
#                              shape; this crate carries the RELAY's. Fusing them
#                              would make the wire format change whenever the
#                              in-process event does.
#   zeroship-core              The one that needs explaining, below.
#
# WHY NOT zeroship-core, WHEN IT OWNS `typed_id`. It is the natural home for the
# id parse this crate needs, and it is a NORMAL dependency of both consumers
# already, so the edge would widen no binary's closure. It is still refused: its
# own `[dependencies]` carry `compio` and `cyper` (an HTTP client, and the
# workspace's live hyper/tokio carrier), plus `jsonwebtoken`,
# `tracing-subscriber`, `clap` and `zeroship-bundle`. A crate whose stated
# property is "no I/O" cannot have an HTTP client in its normal closure and still
# mean it. The 30 lines of canonical base62 in `src/ids.rs` are the price, and
# the DEV-dependency below is what keeps them from drifting: a differential test
# proves this crate's parser accepts exactly what `zeroship_core::typed_id`
# accepts, including at the 2^128 canonicality boundary. Dev-dependencies do not
# participate in the library build graph (the same mechanism `zeroship-core`
# itself uses for its `zeroship-config-contract` gate), so the oracle costs the
# shipped closure nothing.
[dependencies]
# The permit commitment - SHA-256 over the domain separator plus the canonical
# request bytes with `term_permit` encoded as zero-length. Pure compute, no
# runtime, no I/O; it is the only cryptography this crate performs, and it
# verifies rather than signs (control mints the permit).
sha2 = { workspace = true }
# ONE body, and it is not a row: the `application/problem+json` failure
# representation, whose whole payload is a closed `code` enum plus its status.
# The proposal's "Not `serde_json`" prohibition is about the ROW wire - "a JSON
# `HashMap<String,String>` per row is exactly what let a bag of physical column
# names become the thing on the wire" - and every frame here is the hand-rolled
# binary format instead. No frame, cell, tuple or column name is ever serialized
# through serde in this crate.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The typed-id oracle. `tests/typed_id_oracle.rs` runs this crate's parser and
# `zeroship_core::typed_id::parse_with_prefix` over the same corpus and requires
# them to agree on every input, so the duplicated base62 decode cannot drift from
# the platform's. It is also what pins the ChangeOp vocabulary to
# `zeroship_core::change_event::ChangeOp`, which the broker event uses.
#
# DEV ONLY. See the block above: this edge exists so the shipped closure does not
# need it.
zeroship-core = { workspace = true }

[lints]
workspace = true
