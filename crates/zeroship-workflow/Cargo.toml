[package]
name = "zeroship-workflow"
version = "0.1.0"
edition = "2021"
description = "Durable workflow engine, journal, and Rust client"
# One test target for the crate. `tests/main.rs` registers the tier modules and
# `tests/integration/mod.rs` each suite, so a new `tests/integration/<name>.rs`
# is compiled by nothing until it is declared there.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
futures = { workspace = true }
flume = { workspace = true }
zeroship-core = { workspace = true }
zeroship-workflow-calendar = { workspace = true }
zeroship-workflow-client = { workspace = true }
zeroship-workflow-schema = { workspace = true }
zeroship-bundle = { workspace = true }
zeroship-data-orm = { workspace = true }
async-trait = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
compio = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# Named only by the `#[cfg(test)]` modules under `src/` and by `tests/`, which
# both see dev-dependencies.
[dev-dependencies]
zeroship-workflow-manager = { workspace = true }
zeroship-workflow-testkit = { path = "../zeroship-workflow-testkit" }
compio-s3 = { workspace = true }
testcontainers = { version = "0.28", default-features = false, features = ["blocking"] }
bytes = { workspace = true }
compio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tempfile = { workspace = true }

[lints]
workspace = true
