[package]
name = "zeroship-workflow"
version = "0.1.0"
edition = "2021"
description = "Durable workflow engine, journal, and Rust client"

[dependencies]
bytes = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
futures = { workspace = true }
zeroship-core = { workspace = true }
zeroship-bundle = { workspace = true }
zeroship-data-sql = { workspace = true }
zeroship-storage = { workspace = true }
async-trait = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
chrono-tz = "0.10"
compio = { workspace = true }
compio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
cyper = { workspace = true }
percent-encoding = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
zeroship-storage = { workspace = true, features = ["s3"] }
compio-s3 = { workspace = true }
testcontainers = { version = "0.28", features = ["blocking"] }

[lints]
workspace = true
