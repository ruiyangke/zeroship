[package]
name = "zeroship-auth"
version = "0.1.0"
edition = "2021"
description = "zeroship auth service — login/consent UI, identity flows, hydra admin client"

[[bin]]
name = "zeroship-auth"
path = "src/main.rs"

[dependencies]
zeroship-core = { workspace = true }
compio = { workspace = true }
compio-postgres = { workspace = true }
ntex = { workspace = true }
cyper = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
mimalloc = { workspace = true }

# Password hashing (Argon2id, PHC strings).
# Not workspace-pinned — auth is the only consumer today.
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"

[lints]
workspace = true
