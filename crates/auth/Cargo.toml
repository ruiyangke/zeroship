[package]
name = "zeroship-auth"
version = "0.1.0"
edition = "2021"
description = "zeroship auth service — login/consent UI, identity flows, hydra admin client"

[[bin]]
name = "zeroship-auth"
path = "src/main.rs"

[dependencies]
zeroship-core = { workspace = true }
compio = { workspace = true }
compio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1"] }
ntex = { workspace = true }
cyper = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
sha2 = { workspace = true }
# Used by `ui::oauth_stash` to MAC the short-lived federation stash cookie.
hmac = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
mimalloc = { workspace = true }
# Mailer trait uses `async fn` in trait — `#[async_trait]` keeps the trait
# object-safe (so we can store `Arc<dyn Mailer>` in `AppCtx`).
async-trait = { workspace = true }
# SES-SNS webhook signature verification (P6-U3). `x509-parser` is a
# pure-nom X.509 reader — used to lift the SubjectPublicKeyInfo out
# of the SigningCertURL PEM. The RSA-SHA1 verify itself goes through
# `aws-lc-rs` (workspace pin, also our FIPS provider for rustls).
x509-parser = "0.18"
aws-lc-rs = { workspace = true }
# SMTP mailer driver — BLOCKING `SmtpTransport` wrapped in
# `compio::runtime::spawn_blocking` (no tokio in the event loop).
# Crate-local pin, not workspace; the auth server is the only consumer.
# Features chosen explicitly to AVOID `tokio1*` (which would pull
# tokio in) and `native-tls` (we standardize on rustls).
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "pool", "hostname"] }

# Password hashing (Argon2id, PHC strings).
# Not workspace-pinned — auth is the only consumer today.
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"
# CSRF token encoding (workspace pin).
base64 = { workspace = true }
# Timestamps for `auth.users` (`email_verified_at`, `locked_until`, etc.).
# Pins must match `postgres-types`' `with-chrono-0_4` major.
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
# Compile-time-checked HTML templates for the login/signup/error pages.
# No web-framework integration feature — the handler calls `.render()`
# and stuffs the resulting `String` into an `ntex::web::HttpResponse` body.
#
# Template-directory override lives in `askama.toml` next to this file
# (askama 0.12 reads its config from that file, not from
# `[package.metadata.askama]` — that mechanism only landed in 0.13+).
askama = "0.12"

# Test-only dependencies: the in-process MockProvider fixture used by
# `tests/e2e_google.rs` + `tests/e2e_github.rs` signs JWTs with a
# generated Ed25519 keypair and serves them as a JWKS, so we pull in
# `jsonwebtoken` (encode side — verify side already lives in
# `zeroship-core`) and `ed25519-dalek` (with the `pkcs8` feature so we
# can hand the JWT encoder a PKCS#8-DER-encoded private key).
[dev-dependencies]
jsonwebtoken = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8"] }

[lints]
workspace = true
