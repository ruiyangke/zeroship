{% extends "base.html" %}
{% block title %}Authorize device · zeroship{% endblock %}
{% block body %}
<h2>Enter the code shown on your device</h2>
{% if let Some(err) = error %}
  <div class="error">{{ err }}</div>
{% endif %}
<form method="POST" action="/device">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Device code
    <input type="text" name="user_code" value="{{ user_code }}" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" required autofocus>
  </label>
  <button type="submit">Continue</button>
</form>
{% endblock %}
