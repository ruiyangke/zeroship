{% extends "base.html" %}
{% block title %}Two-factor authentication · zeroship{% endblock %}
{% block body %}
<h2>Two-factor authentication</h2>
<p>Enter the 6-digit code from your authenticator app, or one of your backup codes.</p>
{% if let Some(err) = error %}
  <div class="error">{{ err }}</div>
{% endif %}
<form method="POST" action="/login/2fa">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="return_to" value="{{ return_to }}">
  <label>Authentication code
    <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" required autofocus>
  </label>
  <button type="submit">Verify</button>
</form>
{% endblock %}
