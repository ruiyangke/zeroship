[package]
name = "zeroship-test-support"
version = "0.1.0"
edition = "2021"
description = "Test-only helpers shared across the workspace. Not published; consumed as a dev-dependency."
publish = false

[dependencies]
# For the declared-env accessors. Safe in both directions: zeroship-core does
# NOT depend on this crate, so there is no cycle. (`crates/bundle` is the one
# crate that must not gain this dependency; it is unrelated to this manifest.)
zeroship-core = { workspace = true }

[lints]
workspace = true
