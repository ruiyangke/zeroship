[package]
name = "zeroship-plugin-workflow"
version = "0.1.0"
edition = "2021"
description = "zeroship env.workflows native binding"

[dependencies]
zeroship-core = { workspace = true }
zeroship-runtime = { workspace = true }
zeroship-runtime-macros = { workspace = true }
async-trait = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
compio = { workspace = true }
compio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1"] }
cyper = { workspace = true }
percent-encoding = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
v8 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
