[package]
name = "zeroship-migrate-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The zeroship-migrate ENGINE: authoring, validation, the single catalog fold, lowering, the declarative differ, the plan/gate/apply flow, the journal and the drift comparator. VENDOR-NEUTRAL BY CONSTRUCTION — it depends on the backend CONTRACT, the wire IR and the policy PDP, and on no backend implementation. The composition that names the shipping vendors is `zeroship-migrate`, which depends on this crate."

# The engine is a clean, runtime-free, V8-FREE, tokio-AND-compio-free LIBRARY.
# Authoring, MySQL, and Postgres all execute in the Node process (the
# `zeroship-migrate` host-recorder evals the DSL → op-IR envelope; the
# `zeroship-migrate-node` napi addon LOWERs + applies it over the host `pg` / `mysql2`
# npm drivers). There is NO native Rust network Postgres driver and NO embedded V8
# in the Rust build graph: the PG/MySQL path is the dialect-neutral
# `driver::SqlSession` seam (host-callback / napi bridge), which supplies no
# in-Rust `SqlSession` impl — the in-crate recording driver (behind `cfg(test)`)
# is the first host-shaped producer and the napi bridge is the production one.
# SQLite does NOT ride that seam; it runs in-process on a sync rusqlite actor.
# The addon build stays cross-platform (no io_uring) because no native network PG
# driver is ever present. The command-line surface is the `zero-migrate-cli` TS CLI
# (`packages/zero-migrate-cli/src/cli.ts`); this crate ships NO Rust bin, so the
# shipped library links neither tokio nor compio.
#
# This crate has NO cargo features: the crate split expresses the separation
# structurally, so there is no build configuration left to select.
#
# ---------------------------------------------------------------------------
# THE VENDOR CRATES ARE ABSENT FROM `[dependencies]`, AND THAT ABSENCE IS THE POINT
# ---------------------------------------------------------------------------
#
# `zeroship-migrate-postgres`, `zeroship-migrate-sqlite` and `zeroship-migrate-mysql` used to be
# declared here so the engine could compose them into its shipping registry. The
# composition moved to `zeroship-migrate`, which depends on this crate, so the rule *the
# core should be neutral* is now enforced by CARGO: naming a vendor crate in this
# crate's production source is an unresolved-crate error, not a finding in a census.
#
# Six hand-written censuses used to police that edge over source text. The ones Cargo
# subsumes were retired in the commit that split the crates; the ones it does not —
# vendor GRAMMAR (`format!("EXCLUDE USING gist …")` names no crate), vendor PRODUCT
# NAMES in prose and diagnostics, and the raw spelling primitives — are still there
# and are still the only thing measuring those.
#
# THE ONE HOLE CARGO LEAVES is the `[dev-dependencies]` edge below. It is deliberate,
# it is bounded to one file, and `crates/zeroship-migrate/tests/dialect_matrix/core_names_no_vendor_crate.rs`
# is what keeps it bounded.

[dependencies]
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
# JSON Schema derive for the `op.*` IR types (MigrationIr + the closed Op enum).
# Emits `ir-envelope.schema.json` (the discriminated union the JS builder targets) via
# `schemars::schema_for!`. Sync + leaf — zero tokio; does not widen the trust
# domain (it only describes the IR shape, it does not parse untrusted SQL).
schemars = { workspace = true }
# Strict base64 decode + canonical encode for `IrScalar::Bytes`. The payload is
# stored DECODED internally and re-encoded with the canonical STANDARD (padded)
# alphabet on serialize, so two non-canonical encodings of the same bytes cannot
# hash differently across the JS/Rust front doors. The strict decoder
# refuses an invalid alphabet / wrong padding at LOAD, before any checksum.
base64 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The wire `FieldDef` map preserves the createTable column ORDER (the parity check
# compares serialized FieldDef maps, so a sorted-vs-declared order would
# false-mismatch). An insertion-ordered map is the clean carrier. The map was built by
# the wire-shape walker that preceded the fold, until
# docs/proposals/single-fold-and-effects.md; it is a projection of the single fold now,
# and the ordering requirement is unchanged - the fold's authored column map is an
# `IndexMap` for this reason.
indexmap = { workspace = true }
# The wire contract: MigrationIr, the closed Op enum, the
# closed Expr AST, IrScalar, the precondition/probe vocabulary, the typed-id
# machinery, the canonical checksum, the fail-closed load gate's policy-free half,
# and the STRUCTURAL validator. The engine re-exports the whole surface
# (`pub use zero_migrate_ir as ir;` + flattened root re-exports) so downstream
# `zero_migrate::{MigrationIr, Op, …}` names are unchanged.
zeroship-migrate-ir = { workspace = true }
# The backend CONTRACT: the `DmlRenderer` / `SchemaRenderer` traits, the render
# errors their signatures name (`IrLowerError`, `DeclarativeError`, `DmlError`,
# `VendorError`), the identifier/expression spelling seam, and the vendor-registry
# shape. The engine re-exports the whole surface under its historical paths
# (`render::{renderer, dml, vendor}`, `render::lower::IrLowerError`,
# `render::declarative::DeclarativeError`, `render::step::BindValue`,
# `schema::query::SchemaRenderer`, `schema::{descriptors, mask_codec, error}`), so
# no downstream name moved.
#
# THIS IS THE DEEPEST ZERO-MIGRATE CRATE THE ENGINE MAY NAME. Every backend surface
# it uses is reached through the `VendorSet` its callers hand it.
zeroship-migrate-backend = { workspace = true }
# The Policy Decision Point (PDP): the scope lattice + composition algebra +
# unforgeable `EffectivePolicy`. `resolve_create_table_policy` drives its
# column/index/PK injection off `EffectivePolicy::injects_for(object)` (the
# injection-as-rule model), replacing a monolithic policy-profile shape field. This
# crate is a pure LEAF (no SQL deps) — the engine maps its opaque inject `ty`
# tokens to `ColType`.
zeroship-migrate-policy = { workspace = true }
# The canonical version→id derivation (in the loader) builds a UUIDv7-SHAPED id
# (numeric version in the high 48 bits) and base62-encodes it via
# `crate::id::uuid_to_base62` (the vendored typed-id module), which takes a
# `&uuid::Uuid`.
uuid = { workspace = true }
# `FutureExt::catch_unwind` for panic-safe shadow-DB teardown — mirrors the
# runtime crate's panic_util seam. Zero tokio: `futures` is the executor-agnostic
# combinator crate, not a runtime.
futures = { workspace = true }
tracing = { workspace = true }
# The crate's own charter fixtures, which build a policy document as TOML text and
# compose it through the public loader - so a fixture's schema and extension names are
# escaped by the serializer rather than by hand.
# SYNC + leaf - zero tokio; the library trust domain is unchanged.
toml = { workspace = true }

[dev-dependencies]
# THE THREE SHIPPING BACKENDS, AS A DEV EDGE ONLY, AND THIS IS THE ONE HOLE IN THE
# STRUCTURAL RULE ABOVE.
#
# The engine's own `#[cfg(test)]` modules hand a `VendorSet` to every resolution door
# they exercise, and a set has to be composed from real vendors — a fake one would
# make several hundred unit tests assert against a double rather than against the
# backends that ship. There is no cycle: no vendor crate depends on this one, which is
# the property that let them be extracted at all, so Cargo accepts these edges.
#
# THEY ARE REACHABLE FROM `#[cfg(test)]` CODE ANYWHERE UNDER `src`, which is exactly
# what Cargo cannot narrow. `src/test_fixtures.rs` is the single file allowed to name
# them, it composes the set once, and
# `crates/zeroship-migrate/tests/dialect_matrix/core_names_no_vendor_crate.rs` is the ratchet that keeps that
# number at one file — the census that Cargo did NOT subsume, kept and re-aimed rather
# than retired.
#
# Resolver 3 keeps dev-dependency features and edges out of the normal build, so
# `cargo build -p zeroship-migrate-core` links none of this.
zeroship-migrate-postgres = { workspace = true }
zeroship-migrate-sqlite = { workspace = true }
zeroship-migrate-mysql = { workspace = true }
# TEST-ONLY: three `#[cfg(test)]` blocks in `render/dml.rs` run an assembled backfill
# statement on a real in-memory SQLite, so the engine's own emitted bytes are proven
# against a real database rather than a string comparison. `bundled` pins the SQLite
# build; `load_extension` matches the vendor crate's feature set so the workspace
# resolves one rusqlite rather than two.
rusqlite = { workspace = true, features = ["bundled", "load_extension"] }

[lints]
workspace = true
