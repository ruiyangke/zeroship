[package]
name = "zeroship-config-contract"
version = "0.1.0"
edition = "2024"
description = "Non-shipped configuration naming contract checker"
publish = false

[[bin]]
name = "zeroship-config-contract"
path = "src/main.rs"

[[package.metadata.zeroship-config.targets]]
target = "zeroship-config-contract"
class = "test-dev-tool"
reason = "Non-shipped configuration contract checker."

[dependencies]
zeroship-core = { workspace = true }
# The generated registries this tool checks and documents. Linking them is
# the point: `ConfigSpec` and `CONFIG_READ_SITES` are what the COMPILER produced
# from the declarations, so the checks exercise the same values the binaries use.
zeroship-auth = { workspace = true }
zeroship-control = { workspace = true }
# THE ONE EXCEPTION TO "NOTHING DEPENDS ON THE CDC RELAY", and it is named as
# such in `crates/zeroship-data-cdc-server/Cargo.toml` and enforced by
# `xtask/tests/data_architecture.rs`. This tool is `class =
# "test-dev-tool"` - it is not shipped - so linking the relay's registry does not
# put a relay in any deployed binary's closure. The alternative was to classify
# the relay as something other than `platform`, which would leave a shipped
# service's configuration surface unaudited: exactly the vacuity
# `tests/real_registry.rs` exists to prevent.
zeroship-data-cdc-server = { workspace = true }
zeroship-gateway = { workspace = true }
zeroship-migrate-server = { workspace = true }
zeroship-worker = { workspace = true }
zeroship-workflow-scheduler = { workspace = true }
zeroship-workflow-server = { workspace = true }
# A SEVENTH ENTRY USED TO SIT HERE: `zeroship-migrate-adapter`, linked for the
# `zeroship-platform-migrate` one-shot's declaration. Both the binary and the
# `PlatformMigrateSettings` declaration were deleted on 2026-08-28 when the
# platform schema moved to the `zero-migrate` CLI, so the dependency became
# unused and is gone with them. `real_registry.rs` compares this set against the
# `platform` targets cargo metadata reports, and that side lost the target too,
# so the shrink is symmetric rather than the silent one that file warns about.
clap = { workspace = true }
cargo_metadata = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
trybuild = "1.0"

[lints]
workspace = true
