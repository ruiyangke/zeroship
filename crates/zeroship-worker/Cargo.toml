[package]
name = "zeroship-worker"
version = "0.1.0"
edition = "2021"
description = "zeroship data plane — V8 compute worker"
# End-to-end suites are modules of the one `tests/main.rs` target; a new tests/e2e/<name>.rs is compiled by nothing until tests/e2e/mod.rs declares it.
autotests = false

[[package.metadata.zeroship-config.targets]]
target = "zeroship-worker"
class = "platform"
reason = "Initial long-running worker service in the server configuration scope."

[[bin]]
name = "zeroship-worker"
path = "src/main.rs"

[dependencies]
zeroship-core = { workspace = true }
zeroship-bundle = { workspace = true }
zeroship-runtime = { workspace = true }
zeroship-data-v8 = { workspace = true }
# The worker handles the ORM's typed errors directly in its slot reaper.
zeroship-data-orm = { workspace = true }
zeroship-kv = { workspace = true, features = ["redis"] }
zeroship-kv-v8 = { workspace = true }
zeroship-metering = { workspace = true }
zeroship-storage = { workspace = true, features = ["s3"] }
zeroship-storage-v8 = { workspace = true }
zeroship-workflow = { workspace = true }
zeroship-workflow-client = { workspace = true }
zeroship-workflow-runner = { workspace = true }
zeroship-workflow-v8 = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
ntex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
compio = { workspace = true }
compio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1"] }
futures = { workspace = true }
mimalloc = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
cyper = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Creator execution fixtures keep their deployment catalog in a separate ORM database.
zeroship-workflow-manager = { workspace = true }
# The workflow-typed fixture adapters over the plain workflow testkit.
zeroship-workflow-fixtures = { workspace = true }
# The drain contract's held execution implements the runner's task execution
# trait, which is declared through `async_trait`.
async-trait = { workspace = true }
# Parse generated configuration and compose private migration host settings.
toml = { workspace = true }
# Rust fixtures own PostgreSQL, Redis and temporary storage.
tempfile = { workspace = true }
# The shared-server crate owns the daemon client the fixtures query container
# state through.
zeroship-shared-server = { workspace = true }
testcontainers = { workspace = true }
# The peer-boot fixture derives deterministic Ed25519 public keys for the
# JWKS-shaped peer documents.
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
# The termination-grace contract reads the compose file the deployment ships.
serde_yaml = "0.9"

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
