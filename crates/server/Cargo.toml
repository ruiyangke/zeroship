[package]
name = "appbase-server"
version = "0.1.0"
edition = "2024"
description = "HTTP server for appbase — axum, Tower middleware, multi-tenant routing"

[dependencies]
appbase-core = { path = "../core" }
appbase-isolate = { path = "../isolate" }
appbase-metering = { path = "../metering" }
appbase-billing = { path = "../billing" }
axum = { version = "0.8", features = ["ws", "macros"] }
bytes = "1"
serde_json = "1"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }
tracing = "0.1"

[lints]
workspace = true
