[package]
name = "zeroship-runtime-macros"
version = "0.1.0"
edition = "2024"
description = "Proc macros for the zeroship runtime (#[v8_class], Vec<u8> ArrayBuffer bridge)"

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
# Insta snapshot tests of the code the macros emit (`#[v8_class]` with and
# without `#[v8_state_marker]`, the `v8_iterable` companion, and the
# `WebIdlDict` / `WebIdlEnum` derives), so any change to it surfaces as a
# reviewable diff. Bumps require `cargo insta accept` with reviewer audit.
insta = "1"
# Unit tests parse the macro output back through syn for round-trip
# verification — so the snapshot stays human-readable rather than a
# whitespace-fragile token blob.
#
# `verbatim` decides how the printer lays out standard-library macro
# invocations such as `thread_local!`, `concat!` and `format!`.
# Cargo unifies features across everything in one build, so any package
# built alongside this one can switch it on (bindgen does). Declaring it
# here gives the snapshots one layout whether this crate is tested alone
# or with the whole workspace.
prettyplease = { version = "0.2", features = ["verbatim"] }

[lints]
workspace = true
