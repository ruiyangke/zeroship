[package]
name = "zeroship-config-contract-fixtures"
version = "0.1.0"
edition = "2024"
description = "Leaf declaration fixtures and compile-fail cases for the configuration contract"
publish = false
# One test target: a new tests/integration/<name>.rs is compiled by nothing until tests/integration/mod.rs declares it.
autotests = false

[dependencies]
# The macro and the wrapper types the fixtures compile against. Nothing else:
# trybuild compiles the whole declared dependency graph into its own target dir,
# so every entry here is paid for on the first compile-fail run.
zeroship-core = { workspace = true }
# The macro's generated clap carrier names `clap` unqualified, so a crate that
# compiles a declaration needs the crate in scope. Already in core's graph.
clap = { workspace = true }

[dev-dependencies]
trybuild = "1.0"

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
