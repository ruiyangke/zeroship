[package]
name = "zeroship-core"
version = "0.1.0"
edition = "2021"
description = "Core types, VFS, and auth for the zeroship platform"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
aes-gcm = { workspace = true }
zeroize = { version = "1", features = ["derive"] }
zeroship-bundle = { workspace = true }
# OIDC verifier — JWKS cache + ID-token verification used by both
# gateway (P3-U3) and control plane (P3-U7) as OIDC RPs.
jsonwebtoken = { workspace = true }
parking_lot = "0.12"
cyper = { workspace = true }
http = { workspace = true }
# Observability — tracing subscriber init shared across all binaries.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true }
tracing-logfmt = { workspace = true }
tracing-bunyan-formatter = { workspace = true }

[dev-dependencies]
compio = { workspace = true }

[lints]
workspace = true
