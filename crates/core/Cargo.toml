[package]
name = "zeroship-core"
version = "0.1.0"
edition = "2021"
description = "Core types, VFS, and auth for the zeroship platform"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
indexmap = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
hex = { workspace = true }
# PKCE verifier generation (shared with gateway OIDC RP + auth tests).
rand = "0.8"
base64 = { workspace = true }
thiserror = { workspace = true }
linkme = { workspace = true }
zeroship-config-macros = { workspace = true }
# The secret policy. It used to be `config::secrets` in this crate; it is a leaf
# now so that gates and harnesses can read the table without linking `cyper`.
#
# THIS CRATE IS A CONSUMER, not a conduit: `config::credential_gate` audits every
# row of PLATFORM_SECRETS and `config::names` resolves secret references. Nothing
# here re-exports the policy - callers name `zeroship_secret_policy` themselves,
# so one symbol has one public path.
zeroship-secret-policy = { workspace = true }
aes-gcm = { workspace = true }
# Service assertions (`service_assertion`) sign with ed25519. `pkcs8` is what
# bridges a `SigningKey` to `jsonwebtoken::EncodingKey::from_ed_der`, which
# takes the DER form; the same feature was already enabled on the
# dev-dependency below before the minter existed.
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
zeroize = { version = "1", features = ["derive"] }
zeroship-bundle = { workspace = true }
# OIDC verifier — JWKS cache + ID-token verification used by both
# gateway (P3-U3) and control plane (P3-U7) as OIDC RPs.
jsonwebtoken = { workspace = true }
parking_lot = "0.12"
ipnet = { workspace = true }
cyper = { workspace = true }
# JWKS refresh bounds its outbound OP fetch with `compio::time::timeout`
# (zero-tokio). The workspace `compio` carries the `time` feature; the
# dev-dependency below additionally enables `polling` for sandboxed tests
# (Cargo unions the feature sets — same split as the `auth` crate).
compio = { workspace = true }
http = { workspace = true }
lru = { workspace = true }
url = { workspace = true }
# Observability — tracing subscriber init shared across all binaries.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true }
tracing-logfmt = { workspace = true }
tracing-bunyan-formatter = { workspace = true }

[dev-dependencies]
zeroship-test-support = { workspace = true }
# Core tests include local ntex/compio HTTP servers. The polling fallback
# keeps them runnable in sandboxes that block io_uring; production builds use
# the normal workspace compio dependency above the dev-dependency boundary.
compio = { workspace = true, features = ["polling"] }
ntex = { workspace = true }
# Phase 7 U1 — sign synthetic BCL `logout_token` JWTs in the
# `logout_token` verifier's unit tests. PKCS#8 encoding is needed
# because `jsonwebtoken::EncodingKey::from_ed_der` takes the DER form.
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
# The workspace raw-environment gate lives in tests/config_env_access_gate.rs
# because Section 4.5 of docs/proposals/2026-08-11-config-name-alignment.md
# puts it there, and because the exemption it grants (crates/core/src/config/
# env.rs) belongs to this crate. That makes a DEV-dependency cycle:
# zeroship-config-contract depends on zeroship-core. Cargo supports this - a
# dev-dependency does not participate in the library build graph - and the
# alternative was to move the gate away from the module it protects.
zeroship-config-contract = { path = "../config-contract" }

[lints]
workspace = true
