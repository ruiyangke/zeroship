# The zeroship CONFINED ceiling — the managed-policy server's default operator
# ceiling for a creator app (the monorepo-owned successor to the engine's deleted
# `PolicyProfile::confined()`).
#
# This is a `RootCeiling` document (loaded `LoadContext::RootCeiling` — the only
# layer allowed a `mandatory = true` inject). The managed server composes an
# untrusted creator draft against it via `admit`: the draft may only
# TIGHTEN (a looser grant than this ceiling permits is rejected, not clamped).
#
# The grants are authored at `scope = "all"` because the per-app SCHEMA pin is the
# guard's job (`GuardConfig::confined(app_schema)` derives the `schema.cross_schema`
# confinement from the app id); this ceiling governs the table-SHAPE injection +
# the creation/destructive posture a confined app gets.
#
# THIS FILE IS HALF A DOCUMENT. It holds the grants only. The mandatory
# system-table `[[inject]]` rule - the seven system columns + three system indexes
# + `["id"]` PK + `author_primary_key = "forbid"` - is NOT written here: it lives
# once, in `policies/confined-system-shape.inject.toml` at the repo root, and
# `crates/zeroship-migrate-server/src/policy.rs` concatenates the two with
# `concat!(include_str!(..), include_str!(..))`. Read that file for the shape and
# for why it is shared; loading this file alone gets a ceiling that injects
# nothing.
#
# The grants stayed here because they are NOT shared: the emit ceiling needs none
# and the adapter fixtures pin `schema.cross_schema` to a throwaway schema. Only
# the shape is invariant across consumers, so only the shape was collapsed.

policy_version = 1

# ── creation / movement authority (default-deny; the app may create + name tables) ──
[[grant]]
key = "schema.create_table"
value = true
scope = "all"

[[grant]]
key = "schema.rename"
value = true
scope = "all"

# Destructive posture: the confined app may author destructive ops (the managed
# server gates them behind operator approval at preflight, not at the policy floor).
# A creator draft may tighten this to `warn` or `forbid`.
[[grant]]
key = "safety.destructive_ops"
value = "allow"
scope = "all"

# NO per-op timeout ceilings. This file granted `runtime.lock_timeout_ms = 30000`
# and `runtime.statement_timeout_ms = 300000` until 2026-08-10, and the engine now
# REFUSES the whole document for it:
#
#   migrated: invalid migration policy seal config: load operator ceiling:
#   DeclaredOnlyNonDefault { key: "runtime.lock_timeout_ms" }
#
# so `zeroship-migrate-server` exits before binding its port and the deployed
# creator migration path is dead.
#
# The refusal is CORRECT and is the engine's II.6 gate. Every `runtime.*` knob is
# registered `DeclaredOnly` in the vendored engine
# (third_party/zero-migrate/crates/zeroship-migrate-ir/src/policy_registry.rs:432-439):
# no guard, executor or validator path reads one, so a charter raising one above
# its default would seal a policy ADVERTISING AUTHORITY THE ENGINE LACKS. A 30s
# "ceiling" that nothing applies is worse than no ceiling, because it reads like a
# control in a security-relevant file.
#
# These come back the moment the engine wires the knobs into the executor -- the
# classification is a property of the current implementation, not of the key.
#
# Dropping them costs NO enforcement, because these knobs were never the mechanism
# that bounds an apply. The executor bounds it, from `PgConfinement`, which the
# apply path takes at its defaults (`ExecutorConfig::new` in src/apply.rs sets no
# override): `SET statement_timeout` = 60s and `SET lock_timeout` = 3s
# (third_party/zero-migrate/crates/zeroship-migrate/src/conn.rs:124-125), applied per
# migration on the apply connection. A single migration may raise its OWN lock
# budget through `MigrationFlags::lock_timeout_ms`, which IS read.
#
# So the grants removed here did not merely fail to bind, they CONTRADICTED the
# binding value: this file advertised a 30s lock ceiling while every apply has in
# fact been failing fast at 3s. Read that as the real hazard of a declared-only
# knob, not the loss of a control.
#
# The default for a `UintCharter` is 1, so this is not a value that could be
# softened to stay: ANY value above 1, in this ceiling or in a creator draft, is
# refused at load.

