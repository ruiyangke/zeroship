[package]
name = "zeroship-migrate-server"
version = "0.1.0"
edition = "2021"
description = "zeroship standalone creator migration service"

[[package.metadata.zeroship-config.targets]]
target = "zeroship-migrate-server"
class = "platform"
reason = "Deployed long-running migration service in the server configuration scope."

[[bin]]
name = "zeroship-migrate-server"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
compio = { workspace = true }
compio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1"] }
mimalloc = { workspace = true }
ntex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroship-authz = { workspace = true }
zeroship-authn = { workspace = true }
zeroship-core = { workspace = true }
# This service consumes ONLY the `zeroship-migrate` engine crates. It owns the
# concrete driver producer itself, in `src/session.rs`: `CompioPgSession`, the
# newtype mapping the platform's io_uring PG driver onto the engine's
# driver-neutral `SqlSession` seam. The orphan rule needs that newtype to be LOCAL
# to whichever crate implements the foreign trait, which this one does.
#
# The engine ships NO native Rust network PG driver — its PG apply path is generic
# over `SqlSession`. `zeroship-migrate`'s default features light `host-pg` → the
# `pg_seam` cfg (the generic `PostgresBackend<D>`, `IrAuthor::load_and_lower*`, the
# `<D: SqlSession>` apply/journal/snapshot free functions). `session.rs` supplies
# the concrete producer; migrator-role + schema provisioning runs inline over the
# wrapped raw compio `Client`.
zeroship-migrate = { workspace = true }
# The managed-policy server composes the monorepo-owned confined/platform ceilings
# against untrusted creator drafts. That requires the engine's Policy Decision Point
# directly (`compose_strict`, `RootCeiling`, `PolicyDoc`, `LoadContext`, the builtin
# knob registry) — the `zeroship-migrate` facade re-exports only the seal +
# `resolve_create_table_policy`, not the composition algebra.
zeroship-migrate-policy = { workspace = true }
zeroship-migrate-ir = { workspace = true }
# The neutral contract crate, named directly for the same reason `-ir` and
# `-policy` are: this service reads advisory rule ids off it, and the facade does
# not re-export them.
zeroship-migrate-backend = { workspace = true }
# The PostgreSQL vendor crate. The neutrality refactor moved every PG-shaped
# thing off the neutral facade into here: `migrator_role_name`, and the
# `PostgresConfinement` that used to be `ExecutorConfig.pg`. This service is a
# PostgreSQL host, so it names the vendor it wants rather than reaching for a
# re-export the facade deliberately no longer carries.
zeroship-migrate-postgres = { workspace = true }
# For `zeroship_data_sql::SchemaName` only. The physical schema this service
# creates is the same value the data plane later derives its runtime role from,
# and `runtime_role_provisioning_sql` is one half of that pair - so both halves
# take the validated type rather than a `&str` either identity would satisfy.
# A leaf crate: it depends on `zeroship-core` and nothing else of ours.
zeroship-data-sql = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# `apply_api_test` drives the REAL `ControlPlaneAuthenticator`, whose only
# principal path is a platform OAuth access token. Minting one means signing an
# EdDSA `at+jwt` (jsonwebtoken + ed25519-dalek) and publishing the matching
# public key from a local JWKS endpoint the auth provider fetches over HTTP
# (base64 for the `x` coordinate). Same crates and features
# `crates/zeroship-control/Cargo.toml` uses for the identical fixture.
base64 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem", "rand_core"] }
jsonwebtoken = { workspace = true }
# Authoring proof: run the zero-migrate recorder inside zeroship-runtime's V8 isolate
# to author an ir_version:1 envelope from a `.ts` migration - the platform's own V8
# (no Node in the loop). Dev-only: the library surface stays V8-free.
zeroship-runtime = { workspace = true }
v8 = { workspace = true }

# ---------------------------------------------------------------------------
# Live-database test gate
# ---------------------------------------------------------------------------
# Same contract as `zeroship-control`'s feature of the same name: it marks the
# targets that CANNOT run without a reachable, migrated PostgreSQL. Determined
# by measurement - the built test executables were run with the test database
# (`zeroship_core::config::test_database_url_opt()`) pointed at a dead port,
# and `apply_api_test` was the one integration target that failed (it panics
# in `connect`, it does not skip).
#
# The feature also gates `migration_store`'s in-crate `mod tests`, whose two
# `*_pg` cases dial the same database from the LIB target. A `required-features`
# entry cannot reach inside a lib, so that module carries the `cfg` directly.
#
# Covered in CI by one invocation, with no second list to drift from this one:
#
#     cargo test -p zeroship-migrate-server --features live-db-tests
#
# driven by `tests/run_billing_suite.sh` (the `billing-gate` job).
[features]
live-db-tests = []

[[test]]
name = "apply_api_test"
path = "tests/apply_api_test.rs"
required-features = ["live-db-tests"]

# The driver conformance target for `CompioPgSession`, the seam producer this
# service SHIPS. It carries the same contract as `apply_api_test`: it cannot run
# without a reachable PostgreSQL, and it PANICS naming the provisioning fixture
# rather than skipping when the feature is on and no DSN is configured. A skipped
# live suite reports exactly like a passing one, which is how this driver went
# unconformed while `driver::conformance` was run only against the `PgDevSession`
# and `MysqlDevSession` TEST harnesses in `crates/zeroship-migrate/tests/`.
[[test]]
name = "compio_pg_conformance"
path = "tests/compio_pg_conformance.rs"
required-features = ["live-db-tests"]

[lints]
workspace = true
