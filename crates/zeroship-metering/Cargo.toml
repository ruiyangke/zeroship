[package]
name = "zeroship-metering"
version = "0.1.0"
edition = "2021"
description = "Metering infrastructure — per-worker atomic usage counters + stream usage-event outbox. NO V8: the producer side is the trusted data plugins (db/kv/storage) + the worker's platform counters; there is NO creator-facing env.meter API."

[features]
# The usage-event outbox, which publishes over the Kafka-family stream and so
# links librdkafka. Only the services that publish usage enable it; the counters
# every producer records into need none of its dependencies, so the creator CLI,
# which counts and never publishes, carries no stream client.
outbox = [
    "dep:zeroship-stream",
    "dep:compio",
    "dep:redb",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tracing",
]

[dependencies]
zeroship-core = { workspace = true }
uuid = { workspace = true }
zeroship-stream = { workspace = true, optional = true }
compio = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
redb = { version = "4.1", optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
async-trait = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "record_request"
harness = false

[lints]
workspace = true
