[package]
name = "zeroship-metering"
version = "0.1.0"
edition = "2021"
description = "Metering infrastructure — per-worker atomic usage counters + stream usage-event outbox. NO V8: the producer side is the trusted data plugins (db/kv/storage) + the worker's platform counters; there is NO creator-facing env.meter API."

[dependencies]
zeroship-core = { workspace = true }
zeroship-stream = { workspace = true }
compio = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
redb = { version = "4.1" }
thiserror = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "record_request"
harness = false

[lints]
workspace = true
