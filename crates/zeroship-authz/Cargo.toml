[package]
name = "zeroship-authz"
version = "0.1.0"
edition = "2021"
description = "Authorization wrapper policy types for the zeroship platform"

[dependencies]
cedar-policy = { version = "4.11.0", default-features = false, features = ["ipaddr"] }
compio-postgres = { workspace = true, features = ["with-serde_json-1"] }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
zeroship-id = { workspace = true }

[dev-dependencies]
compio = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
testcontainers = { version = "0.28", default-features = false, features = ["blocking", "watchdog"] }
toml = { workspace = true }
url = { workspace = true }

[build-dependencies]
cedar-policy = { version = "4.11.0", default-features = false, features = ["ipaddr"] }

[lints]
workspace = true
