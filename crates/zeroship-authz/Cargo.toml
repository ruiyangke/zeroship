[package]
name = "zeroship-authz"
version = "0.1.0"
edition = "2021"
description = "Authorization wrapper policy types for the zeroship platform"

[dependencies]
cedar-policy = { version = "4.11.0", default-features = false, features = ["ipaddr"] }
compio-postgres = { workspace = true, features = ["with-serde_json-1", "with-uuid-1"] }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# Promoted from dev-dependencies: `authority::app_uuid_or_refuse` parses the
# canonical `app_<base62>` rendering through `AppId`, so the LIB needs it, not
# only the tests. This adds no closure to any binary - every crate that depends
# on zeroship-authz already depends on zeroship-core.
zeroship-core = { workspace = true }

[dev-dependencies]
zeroship-test-support = { workspace = true }
compio = { workspace = true }

[build-dependencies]
cedar-policy = { version = "4.11.0", default-features = false, features = ["ipaddr"] }

[lints]
workspace = true
