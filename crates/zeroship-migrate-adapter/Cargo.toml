# The monorepo's bridge between the `zero-migrate` engine and the platform's native
# compio-postgres driver.
#
# `zero-migrate` (packages/zero-migrate + crates/zeroship-migrate*) ships NO native
# Rust network Postgres driver: its PG apply path is generic over the driver-neutral
# `zero_migrate::driver::SqlSession` seam (the host/napi bridge is the production
# producer). This crate supplies the MONOREPO's producer: a newtype wrapping
# `compio_postgres::Client` that implements `SqlSession`, so the platform's io_uring
# PG driver can drive the engine's apply flow directly, with no tokio and no Node in
# the loop.
#
# THAT NEWTYPE IS NOW THE WHOLE CRATE. It carried a second thing until 2026-08-28 -
# a `platform` module and a `zeroship-platform-migrate` binary behind a `platform-cli`
# feature, which authored `db/migrations-ts/*.ts` in a zeroship-runtime V8 isolate and
# applied them itself. That path is deleted; the platform schema is migrated by the
# general `zero-migrate` CLI (`packages/zero-migrate-cli`), driven from
# `tests/lib/runtime_secrets.sh`, `deploy/ops/db-migrate.sh` and the compose `migrate`
# one-shot. What remains has TWO consumers and no binary:
#
#   crates/zeroship-migrated/src/apply.rs   `CompioPgSession`, the creator-migration
#                                           service's session over the neutral seam
#   crates/zeroship-plugin-db (dev-dep)     the Postgres leg of tests/parity/
#
# It is therefore a LIBRARY-ONLY crate with no V8, no clap and no configuration
# declaration. `zeroship-core` moved to [dev-dependencies] with that change: the two
# PG test targets resolve their database through
# `zeroship_core::config::test_database_url_opt`, and nothing in the library reads
# configuration at all.
[package]
name = "zeroship-migrate-adapter"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The engine (path declared once in the root `[workspace.dependencies]`). Default
# features light `host-pg` -> the internal `pg_seam` cfg, which exposes
# `driver::SqlSession`, the generic `PostgresBackend<D>`, and the `<D: SqlSession>`
# apply/journal path this adapter drives.
zeroship-migrate = { workspace = true }
# The platform's native io_uring Postgres driver - the concrete session this
# adapter maps onto the neutral seam.
compio-postgres = { workspace = true }
# For spawning + detaching the connection run-loop (the crate-wide compio pattern).
compio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
compio = { workspace = true }
tempfile = { workspace = true }
# The declared-environment registry. The two PG suites resolve the test database
# through `zeroship_core::config::test_database_url_opt` (PG_TEST_URL, falling back
# to the generated TOML test overlay) so the reads are enumerable
# (docs/proposals/2026-08-11-config-name-alignment.md, Step 4). It was a normal
# dependency while `src/config.rs` declared the deleted binary's settings; with that
# file gone the library reads no configuration and only the tests need it.
zeroship-core = { workspace = true }
# Every PG-backed proof in tests/ returns early when there is no test database
# (PG_TEST_URL unset), which is the normal state in this repo's CI. The announcement
# has to go through `skip` rather than `eprintln!`: the harness replays captured
# output only for a FAILING test, so an eprintln on an early return is invisible on
# the green run that is exactly when it matters.
zeroship-test-support = { workspace = true }
# The smoke test authors an IR envelope as JSON, then parses + re-serializes it
# through the engine's `MigrationIr` (de)serialize + confined table-shape resolver.
serde_json = { workspace = true }
serde = { workspace = true }
# Authoring proof: run the zero-migrate recorder inside zeroship-runtime's V8 isolate
# to author an ir_version:1 envelope from a `.ts` migration - the platform's own V8
# (no Node in the loop). Dev-only: the library surface stays V8-free.
zeroship-runtime = { workspace = true }
v8 = { workspace = true }

[lints]
workspace = true
