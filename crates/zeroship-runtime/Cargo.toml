[package]
name = "zeroship-runtime"
version = "0.1.0"
edition = "2024"
description = "zeroship V8 runtime — compio/io_uring, ESM modules, WebCrypto, fetch, streaming"
# Cargo's bench auto-discovery picks up ANY benches/**/main.rs or benches/*.rs
# even when [[bench]] entries are declared explicitly below. `benches/ntex-bench/`
# depends on the `ntex` crate, which isn't (and hasn't been, since at least the
# 2026-04-10 workspace-refactor commit) a workspace dependency - it's a dead,
# never-compiling A/B-comparison harness left over from an earlier benchmark
# round. Disabling autodiscovery keeps it around for reference without letting
# it break `cargo build/clippy --all-targets`; the four real benches are still
# built via the explicit [[bench]] entries below.
autobenches = false

# Cargo links one executable per `tests/*.rs`, and each of them statically
# links this crate, V8 and the whole dependency graph. There were 137 such
# files and they cost 18.97 GiB of target/ (measured 2026-08-20 at
# `[profile.dev] debug = "line-tables-only"`). The `[[test]]` entries below are
# now the ONLY integration-test targets, so a new `tests/<name>.rs` is compiled
# by NOTHING until it is either listed here or declared as `mod <name>;` in one
# of the three consolidated entries. `tests/main.rs` carries the measurement
# and the per-target reasoning; read it before adding an entry here.
autotests = false

[[package.metadata.zeroship-config.targets]]
target = "echo-server"
class = "test-dev-tool"
reason = "Feature-gated HTTP echo peer used only by runtime benchmarks."

[[package.metadata.zeroship-config.targets]]
target = "zeroship-bench-server"
class = "test-dev-tool"
reason = "Feature-gated V8 server used only by runtime benchmarks."

# 102 former test files, now modules.
[[test]]
name = "main"
path = "tests/main.rs"

# The 23 `wpt_*.rs` modules. NOT in `main` because every one of them
# `include_str!`s `tests/wpt/`, which is not tracked in git -
# `tests/setup-wpt.sh` fetches it on demand. A checkout that has not run that
# script cannot compile them at all, and this keeps that true of one target
# instead of every integration test in the crate.
[[test]]
name = "wpt"
path = "tests/wpt.rs"

# The six `node_*_e2e.rs` modules. NOT in `main` because they mutate process
# environment behind `support/node_realworld.rs::lock_env()`, and that lock
# only excludes if there is exactly one copy of its `static` in the process.
[[test]]
name = "node_realworld"
path = "tests/node_realworld.rs"

# One target each. Every one of these saves, overwrites and RESTORES process
# environment behind an `ENV_LOCK` private to the file, so two of them in one
# process would be two mutexes over one environment: one restores
# `ZEROSHIP_DEV` to unset while the other is mid-request under it and
# `transport/ssrf.rs` starts blocking loopback. Sharing one lock would mean
# editing their bodies, so they stay apart.
[[test]]
name = "dev_auth"
path = "tests/dev_auth.rs"

[[test]]
name = "node_net"
path = "tests/node_net.rs"

[[test]]
name = "node_net_security"
path = "tests/node_net_security.rs"

[[test]]
name = "node_pg_e2e"
path = "tests/node_pg_e2e.rs"

[[test]]
name = "node_tls"
path = "tests/node_tls.rs"

# Sets `--allow-natives-syntax --turbofan` via `V8::set_flags_from_string` and
# depends on winning the race with `init_v8()`'s `Once`. V8 flags are
# process-global and silently ignored after `V8::initialize()`, so any
# neighbour that builds a `Runtime` first would drop them and
# `%OptimizeFunctionOnNextCall` would stop existing.
[[test]]
name = "v8_fastcall_smoke"
path = "tests/v8_fastcall_smoke.rs"

[dependencies]
# V8
v8 = { workspace = true }
deno_core_icudata = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto
aws-lc-rs = { workspace = true }
# Direct aws-lc-sys for the few raw EVP_* calls we need that aws-lc-rs's
# high-level API doesn't expose (e.g. RSA-PSS variable saltLength —
# `aws_lc_rs::signature::RSA_PSS_*` fixes salt length to digest length).
# Keep the call sites tiny + behind safe Rust wrappers.
aws-lc-sys = { version = "0.39" }
base64 = { workspace = true }

# Encoding (WHATWG-spec UTF-8 decoder backing TextDecoder)
encoding_rs = { workspace = true }

# Compression — backs CompressionStream / DecompressionStream and
# internal fetch Content-Encoding decoding. Codec layer in src/codec.rs.
flate2 = { workspace = true }
brotli = { workspace = true }

# TLS (for fetch HTTPS — need to install CryptoProvider at init)
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# URL
url = { workspace = true }
ada-url = { workspace = true }

# Async
futures = { workspace = true }

# compio event loop
compio = { workspace = true, features = ["time", "macros", "bytes"] }

# Native WebSocket framer (RFC 6455 — in-tree decoder/encoder + raw
# compio TCP/TLS. compio-ws remains feature-gated with native WebSocket;
# TLS itself is shared by wss:// and `node:tls`.
compio-ws = { workspace = true, optional = true }
compio-tls = { workspace = true, optional = true }
# Native trust roots for wss:// and node:tls. Direct dep — used in
# `transport::tls::build_tls_connector`.
rustls-native-certs = { version = "0.8", optional = true }

# HTTP client (fetch)
cyper = { workspace = true }
http = { workspace = true }
httparse = { workspace = true }

# Utilities
mimalloc = { workspace = true }
itoa = { workspace = true }
socket2 = { workspace = true }

sha2 = { workspace = true }

# WebSocket handshake (SHA-1 for Sec-WebSocket-Accept per RFC 6455)
sha1 = { workspace = true }

# Proc macros
zeroship-runtime-macros = { workspace = true }

# Logging
tracing = { workspace = true }
# Used only by the bench-server / echo-server binaries to init the
# shared tracing subscriber. The library itself only emits via
# `tracing::*`.
zeroship-core = { workspace = true }
zeroship-metering = { workspace = true }

# Insertion-ordered map — used by the rpc::superjson encoder to build
# `Meta::values` and `WithChildren` child maps, matching the wire-order
# contract Wave A pinned in `crates/core/src/superjson.rs`.
indexmap = { workspace = true }

# UUIDv7 keys for the rpc::abort registry — `(app_id, request_id)` keys
# the in-flight AbortController map walked by `entered_for_eviction`.
uuid = { workspace = true }

[[bin]]
name = "zeroship-bench-server"
path = "src/core/server.rs"
required-features = ["bench-bins"]

[[bin]]
name = "echo-server"
path = "src/core/echo_server.rs"
required-features = ["bench-bins"]

[features]
# Opt-in bench/echo binaries — kept out of the default library build so a
# plain `cargo build -p zeroship-runtime` doesn't compile them.
bench-bins = []
# Cutover landing 2: the native WebSocket impl is on by default.
# The polyfill's `WebSocket` and `WebSocketPair` JS classes still install
# but only wire to the native plumbing via `__nativeWebSocket` detection
# in `embed/websocket.js`. Tests that reach into the polyfill's per-WS
# state (state.websockets HashMap) and were not yet migrated to native
# can opt out via `--no-default-features`.
default = ["runtime_tls", "runtime_native_websocket"]
runtime_tls = ["dep:compio-tls", "dep:rustls-native-certs"]
# Per docs/archive/websocket-native.md D-25 (cutover cadence):
#  Landing 1: native behind feature flag, polyfill default — current.
#  Landing 2: flip default to native; polyfill remains as fallback.
#  Landing 3: delete polyfill.
# When OFF: the JS polyfill at `embed/websocket.js` provides
# `globalThis.WebSocket`; native classes are NOT installed.
# When ON: native classes install BEFORE the polyfill runs, and the
# polyfill detects this and skips its WebSocket assignment.
runtime_native_websocket = ["runtime_tls", "dep:compio-ws"]
# Strict-throws path for `binaryType` setter on unknown values. v2 D-7
# default is silent-no-op (matches undici, workerd, the WPT test); the
# strict path is preserved behind this feature only for WPT-update tracking.
runtime_websocket_strict_enum = []
# Emergency rollback to the polyfill once cutover landing 3 has shipped
# (delete polyfill); reserved.
runtime_legacy_websocket = []

[dev-dependencies]
# Compile-fail snapshot tests for proc-macro diagnostics. Locks in
# `#[v8_constructor(post_init = ...)]` error spans for malformed shapes
# (MAC-02, design `docs/archive/macro-constructor-post-init.md` §6.2).
trybuild = "1.0"
rcgen = "0.14"
# Wave F (RPC v2 phase 1): microbench for `default.rpc(...)` dispatch.
criterion = { workspace = true }

# RPC v2 phase 1 — Wave F. Measures the production single-call dispatch
# path (`extract_zs_v1_id` → `parse_rpc_body` → `RpcContext::build_js_object`
# → `with_rpc_context_in_als` → `rpc_fn.call` → `classify_rpc_return`).
# Per `docs/proposals/rpc.md` §5, the result decides whether phase 1
# stays on single-call or amends to a two-step `#[v8_method(fastcall)]`
# enqueue ABI.
[[bench]]
name = "rpc_dispatch"
harness = false

[[bench]]
name = "response_body_convert"
harness = false

[[bench]]
name = "pump_concurrency"
harness = false

[[bench]]
name = "node_net_read"
harness = false

# Declared explicitly because `autobenches = false` above turns off the
# discovery that used to pick this up. Without an entry here it is not a
# disabled bench, it is an invisible one - it stops being built and nothing
# reports that it stopped.
[[bench]]
name = "sse_bench"
harness = false

[lints]
workspace = true
