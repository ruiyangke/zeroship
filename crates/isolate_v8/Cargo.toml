[package]
name = "appbase-isolate-v8"
version = "0.1.0"
edition = "2024"
description = "Raw V8 isolate runtime — per-request model with Locker, direct V8 API"

[dependencies]
v8 = "147"
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
getrandom = "0.2"

[[bench]]
name = "v8_qps"
harness = false

[[bin]]
name = "v8-server"
path = "src/server.rs"

[[bin]]
name = "echo-server"
path = "benches/echo_server.rs"

[lints]
workspace = true
