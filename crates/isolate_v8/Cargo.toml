[package]
name = "appbase-isolate-v8"
version = "0.1.0"
edition = "2024"
description = "Raw V8 isolate runtime — per-request model with Locker, direct V8 API"

[dependencies]
v8 = "147"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
serde_json = "1"

[[bench]]
name = "v8_qps"
harness = false

[lints]
workspace = true
