[package]
name = "zeroship-schema-authority-e2e"
version = "0.1.0"
edition = "2021"
publish = false
description = "P7 capstone — the cross-crate end-to-end test for the schema-authority convergence. Carries NO library code: it is a dev-dep-only test target that chains the REAL component functions of P3 (zeroship-migrate frontend eval/generate), S4 (migrated-style IR provision/discover/sealed apply), and P4/P5 (zeroship-plugin-db introspect + CRUD) into one pipeline against real Postgres. This crate sits above those crates and keeps the graph acyclic."

# This crate is intentionally EMPTY of library code — `src/lib.rs` is a doc-only
# placeholder. All the substance is in `tests/`. The heavy crates are
# dev-dependencies so they are only built for the test target, never for a
# release of anything that depends on this package (nothing does).
[lib]
path = "src/lib.rs"

[dev-dependencies]
# P3/S4 — the JS schema front-end (`frontend`) plus the engine
# (`migrator_role_name`, IR discovery, provision, and sealed apply).
zeroship-migrate = { workspace = true }
# P4/P5 — the data plane: introspection-driven CRUD (encrypt-on-write,
# decrypt-on-read, mask sibling). `test-helpers` exposes the real pipeline fns.
zeroship-plugin-db = { workspace = true, features = ["test-helpers"] }

# Drivers + glue used directly by the test.
compio = { workspace = true }
compio-postgres = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }

[lints]
workspace = true
