[package]
name = "zeroship-data-v8"
version = "0.1.0"
edition = "2021"
description = "V8 adapter for the zeroship data ORM"
# Integration modules are registered by the explicit test entry points below.
autotests = false

[dependencies]
zeroship-runtime = { workspace = true }
zeroship-runtime-macros = { workspace = true }
zeroship-core = { workspace = true }
zeroship-data-orm = { workspace = true }
# Operator policy and metering are injected when the worker primitive is built.
zeroship-metering = { workspace = true }
compio = { workspace = true }
serde_json = { workspace = true }
v8 = { workspace = true }
tracing = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
compio-postgres = { workspace = true }
sha2 = { workspace = true }
rcgen = { workspace = true }
url = { workspace = true }
# Database integration tests are required by ordinary cargo test.
uuid = { workspace = true }
base64 = { workspace = true }
rusqlite = { workspace = true, features = ["bundled", "preupdate_hook"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
# Fixtures apply the migration engine's schema and privilege statements.
zeroship-migrate-server = { workspace = true }
zeroship-migrate-sqlite = { workspace = true }
zeroship-migrate = { workspace = true }
zeroship-migrate-postgres = { workspace = true }
zeroship-data-testkit = { workspace = true }
zeroship-testkit = { workspace = true }

# One integration binary; tests/integration/mod.rs and tests/e2e/mod.rs
# declare every suite.
[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
