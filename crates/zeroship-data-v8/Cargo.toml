[package]
name = "zeroship-data-v8"
version = "0.1.0"
edition = "2021"
description = "V8 adapter for the zeroship data ORM"
# Integration modules are registered by the explicit test entry points below.
autotests = false

[dependencies]
zeroship-runtime = { workspace = true }
zeroship-runtime-macros = { workspace = true }
zeroship-core = { workspace = true }
zeroship-data-sql = { workspace = true }
zeroship-data-orm = { workspace = true }
# Operator policy and metering are injected when the worker primitive is built.
zeroship-metering = { workspace = true }
compio = { workspace = true }
serde_json = { workspace = true }
v8 = { workspace = true }
tracing = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
zeroship-test-fixtures = { path = "../zeroship-test-fixtures" }
zeroship-migrate-policy = { workspace = true }
compio-postgres = { workspace = true }
sha2 = { workspace = true }
rcgen = "0.14"
url = { workspace = true }
# Database integration tests are required by ordinary cargo test.
zeroship-data-v8 = { path = ".", features = ["test-helpers"] }
zeroship-data-orm = { workspace = true, features = ["test-helpers"] }
uuid = { workspace = true }
base64 = { workspace = true }
rusqlite = { workspace = true, features = ["bundled", "preupdate_hook"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
zeroship-plugin-workflow = { workspace = true }
# Fixtures apply the migration engine's schema and privilege statements.
zeroship-migrate-server = { workspace = true }
zeroship-migrate-sqlite = { workspace = true }
zeroship-migrate = { workspace = true }
zeroship-migrate-postgres = { workspace = true }

[features]
# Expose adapter fixture setup to downstream integration tests.
test-helpers = ["zeroship-data-orm/test-helpers"]

[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "test_helpers"
path = "tests/test_helpers.rs"

[[test]]
name = "distributed_live"
path = "tests/distributed_live.rs"

[lints]
workspace = true
