[package]
name = "zeroship-cdc-transport-spike"
version = "0.1.0"
edition = "2021"
description = "A spike, not a service: runnable evidence that ntex v3 can stream a response body incrementally, that cyper's `stream` feature consumes it incrementally, that both run on compio with no tokio reactor, and what the transport does when the consumer is slower than the producer."

# ---------------------------------------------------------------------------
# WHY THIS CRATE EXISTS, AND WHEN TO DELETE IT.
# ---------------------------------------------------------------------------
#
# `docs/proposals/2026-08-28-cdc-service.md` refuses to put hours on the relay
# while its transport is unvalidated. This crate is that validation and nothing
# else. It contains NO relay: no leader election, no slot, no pgoutput, no
# frames from `zeroship-cdc-wire`, no subscription. Its whole output is four
# measured answers and the tests that produce them.
#
# It is a workspace member rather than a scratch directory for one reason: a
# spike whose result lives only in a report is worth much less than one somebody
# can re-run. `cargo test -p zeroship-cdc-transport-spike` is the whole
# re-measurement.
#
# DELETE IT when `zeroship-cdc` exists and carries these behaviours in its own
# tests. Nothing in the shipped tree depends on it - `grep -rn
# zeroship-cdc-transport-spike crates/ libs/` should find this manifest and
# nothing else until then.
#
# ---------------------------------------------------------------------------
# THE ZERO-TOKIO PIN THIS CRATE MOVES.
# ---------------------------------------------------------------------------
#
# `cyper` is the workspace's live hyper/tokio carrier, so naming it below adds
# this crate to `PINNED_ENTRYPOINTS` in `tests/zero_tokio_gate.sh` and takes the
# "our crates that name a carrier directly" count from nine to ten. That pin was
# updated in the same commit, which is exactly the movement the gate exists to
# force a human to notice. The edge stays LINKED, NOT DRIVEN: the integration
# test asserts, at runtime, that the ntex handler and the cyper client both sit
# on a compio runtime, and enumerates the process's own thread names to show no
# tokio worker exists.
#
# `cyper` is a dev-dependency because only the tests need an HTTP client; the
# library half is a bounded egress buffer and a length-prefix codec, which
# perform no I/O. The gate reads every dependency kind, so dev is not a way
# around the pin and is not used as one.
[dependencies]
# The response body type. `ntex::http::ResponseBuilder::streaming` takes
# `Stream<Item = Result<Bytes, E>> + Unpin + 'static`, so the shed buffer's
# reader half implements exactly that and plugs straight into a handler.
ntex = { workspace = true }
# `futures::Stream` only. The buffer is hand-written; nothing here uses a
# combinator that could hide a poll.
futures = { workspace = true }

[dev-dependencies]
# The client half of the proof. `stream` is the feature under test.
cyper = { workspace = true }
# The runtime the whole thing must run on, and the runtime-identity assertion
# (`compio::runtime::Runtime::try_with_current`) that makes "no tokio reactor"
# an observation rather than a claim.
compio = { workspace = true }
# The producer/consumer rendezvous. The ntex test server runs on its own thread
# with its own runtime, so the handshake that makes incrementality observable
# has to cross threads; `flume`'s channels are runtime-agnostic and Send.
flume = { workspace = true }

[lints]
workspace = true
