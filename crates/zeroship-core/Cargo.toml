[package]
name = "zeroship-core"
version = "0.1.0"
edition = "2021"
description = "Core types, VFS, and auth for the zeroship platform"
# Integration suites are modules of the one `tests/main.rs` target; a new tests/integration/<name>.rs is compiled by nothing until tests/integration/mod.rs declares it.
autotests = false

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
indexmap = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
hex = { workspace = true }
# PKCE verifier generation (shared with gateway OIDC RP + auth tests).
rand = "0.8"
base64 = { workspace = true }
# The consistent-hash ring positions in `worker_ring`. The gateway declares the
# same crate and feature; both must agree or the two rings order one fleet
# differently, which is the failure that module exists to prevent.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
thiserror = { workspace = true }
linkme = { workspace = true }
zeroship-config-macros = { workspace = true }
aes-gcm = { workspace = true }
# Service assertions (`service_assertion`) sign with ed25519. `pkcs8` is what
# bridges a `SigningKey` to `jsonwebtoken::EncodingKey::from_ed_der`, which
# takes the DER form; the same feature was already enabled on the
# dev-dependency below before the minter existed.
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
zeroize = { version = "1", features = ["derive"] }
zeroship-bundle = { workspace = true }
zeroship-id = { workspace = true }
zeroship-workflow-calendar = { workspace = true }
# OIDC verifier — JWKS cache + ID-token verification used by both
# gateway (P3-U3) and control plane (P3-U7) as OIDC RPs.
jsonwebtoken = { workspace = true }
parking_lot = "0.12"
ipnet = { workspace = true }
cyper = { workspace = true }
# `tls::install_process_crypto_provider`, the boot step every binary runs before
# any client exists. Declaring it here is also what puts the aws-lc-rs provider
# into a binary whose only path to rustls is cyper or compio-tls, neither of
# which selects one.
rustls = { workspace = true }
# JWKS refresh bounds its outbound OP fetch with `compio::time::timeout`
# (zero-tokio). The workspace `compio` carries the `time` feature; the
# dev-dependency below additionally enables `polling` for sandboxed tests
# (Cargo unions the feature sets — same split as the `auth` crate).
compio = { workspace = true }
http = { workspace = true }
url = { workspace = true }
# Observability — tracing subscriber init shared across all binaries.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true }
tracing-logfmt = { workspace = true }
tracing-bunyan-formatter = { workspace = true }

[dev-dependencies]
# `service_peers_test` writes real key files and peer documents and then loads
# them back through the production loader, including its file-permission
# refusal. That check has nothing to inspect unless a real file on a real
# filesystem is what the test hands it.
tempfile = { workspace = true }
# Core tests include local ntex/compio HTTP servers. The polling fallback
# keeps them runnable in sandboxes that block io_uring; production builds use
# the normal workspace compio dependency above the dev-dependency boundary.
compio = { workspace = true, features = ["polling"] }
ntex = { workspace = true }
# Phase 7 U1 — sign synthetic BCL `logout_token` JWTs in the
# `logout_token` verifier's unit tests. PKCS#8 encoding is needed
# because `jsonwebtoken::EncodingKey::from_ed_der` takes the DER form.
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
# The compile-fail suite exercises the rules the config attribute and the
# consumer-key types enforce. It lives beside the config types so each case
# compiles against the same spellings a declaration uses.
trybuild = "1.0"

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
