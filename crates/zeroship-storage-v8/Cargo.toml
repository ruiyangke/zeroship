[package]
name = "zeroship-storage-v8"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "V8 binding for zeroship-storage: env.storage streams and usage metering"
autotests = false

[dependencies]
zeroship-storage = { workspace = true }
zeroship-core = { workspace = true }
zeroship-runtime = { workspace = true }
zeroship-metering = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
v8 = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
zeroship-storage = { workspace = true, features = ["s3"] }
compio-s3 = { workspace = true }
compio = { workspace = true }
tempfile = { workspace = true }
zeroship-testkit = { workspace = true }

[lints]
workspace = true

# All suites are modules of the one test binary `tests/main.rs`.
[[test]]
name = "main"
path = "tests/main.rs"
