[package]
name = "appbase-runtime-compio"
version = "0.1.0"
edition = "2024"
description = "compio (io_uring) event loop for appbase V8 runtime"

[dependencies]
appbase-v8-core = { path = "../v8-core" }
v8 = "147"
compio = { version = "0.18", features = ["time", "macros", "bytes"] }
httparse = "1"
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
mimalloc = { version = "0.1", default-features = false }
bytes = "1"
socket2 = { version = "0.5", features = ["all"] }
itoa = "1"

# Native io_uring HTTP client (compio-based, no tokio thread needed)
cyper = { version = "0.8", default-features = false, features = ["rustls", "json"] }
http = "1"

[[bin]]
name = "v8-server-compio"
path = "src/main.rs"

[lints]
workspace = true
