[package]
name = "zeroship-control"
version = "0.1.0"
edition = "2021"
description = "zeroship control plane — admin API, internal API, Postgres, VFS"

[[bin]]
name = "zeroship-control"
path = "src/main.rs"

[dependencies]
zeroship-core = { workspace = true }
zeroship-bundle = { workspace = true }
zeroship-authz = { workspace = true }
# Builder OAuth bootstrap reuses auth/control migrations for
# `control.oauth_clients` in dev-mode startup.
zeroship-auth = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
# `with-chrono-0_4` so the console_sessions store can pull
# `TIMESTAMPTZ` columns into `chrono::DateTime<Utc>` directly.
compio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
compio = { workspace = true }
memmap2 = { workspace = true }
ntex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
async-trait = { workspace = true }
mimalloc = { workspace = true }
subtle = "2"
zeroize = "1"
# `stream_body_to_tmp_file` is generic over `Stream<Item = Result<B, E>>`
# (B: AsRef<[u8]>) so the helper compiles against ntex's `Bytes` from
# the request payload. We need `futures::Stream` in the public signature.
futures = { workspace = true }
# Auth — OIDC RP only post-U8. PKCE / state RNG + the legacy bcrypt
# password hasher + JWT cookie minter (which all lived under
# `auth_service` / `auth_handlers` / `oauth.rs`) were retired alongside
# those modules. The OIDC RP gets its CSRF + verifier bytes from
# `zeroship-core` and its JWKS verify path from `zeroship-core`'s
# `oidc_verify` module.
base64 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem", "rand_core"] }
jsonwebtoken = { workspace = true }
rand = "0.8"
cyper = { workspace = true }
url = { workspace = true }
http = { workspace = true }
tracing = { workspace = true }
# Phase 3 U7 — control plane OIDC RP module + console session store.
# `hmac` is already present above (used by the legacy stripe webhook
# verifier); reuse it here for the stash cookie HMAC envelope.
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }

[dev-dependencies]
# `deploy_test.rs` builds a synthetic `.zship` payload (tar+zstd) and
# feeds it through `zeroship_bundle::ingest`. The runtime path no longer
# depends on these crates — only the test packer does.
tar = { workspace = true }
zstd = { workspace = true }
# Stream tmp tests use `bytes::Bytes` to construct `stream::iter`
# inputs. The production helper is generic over `B: AsRef<[u8]>` so
# `bytes` itself isn't a runtime dep.
bytes = { workspace = true }
[lints]
workspace = true
