[package]
name = "appbase-control"
version = "0.1.0"
edition = "2024"
description = "Control plane for appbase — app registry, deploy, plan management"

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "sqlite", "postgres"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt"] }
appbase-plan = { path = "../plan" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
