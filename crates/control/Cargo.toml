[package]
name = "zeroship-control"
version = "0.1.0"
edition = "2021"
description = "zeroship control plane — admin API, internal API, Postgres, VFS"

[[bin]]
name = "zeroship-control"
path = "src/main.rs"

[dependencies]
zeroship-core = { workspace = true }
compio-postgres = { workspace = true }
compio = { workspace = true }
ntex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
zstd = { workspace = true }
tar = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
mimalloc = { workspace = true }
subtle = "2"
zeroize = "1"
# Auth
bcrypt = { workspace = true }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
cyper = { workspace = true }
url = { workspace = true }
http = { workspace = true }
# RNG for OAuth state / PKCE — small, no async runtime dep.
rand = "0.8"

[lints]
workspace = true
