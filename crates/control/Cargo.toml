[package]
name = "zeroship-control"
version = "0.1.0"
edition = "2021"
description = "zeroship control plane — admin API, internal API, Postgres, VFS"

[[package.metadata.zeroship-config.targets]]
target = "zeroship-control"
class = "platform"
reason = "Initial long-running control-plane service in the server configuration scope."

[[package.metadata.zeroship-config.targets]]
target = "zeroship-mock-stripe"
class = "test-dev-tool"
reason = "Standalone Stripe mock used only by billing and metering end-to-end tests."

[[package.metadata.zeroship-config.targets]]
target = "dev-provision"
class = "test-dev-tool"
reason = "Development and CI provisioning helper that is never deployed as a service."

[[bin]]
name = "zeroship-control"
path = "src/main.rs"

# Standalone mock-Stripe server for the billing & metering multi-node E2E
# (tests/e2e_metering_billing.sh). Reuses the same Stripe-wire idiom as the
# in-process mock in tests/billing_reconcile_test.rs, plus a /__mock/*
# introspection surface for shell assertions.
[[bin]]
name = "zeroship-mock-stripe"
path = "src/bin/mock_stripe.rs"

# Dev/local/CI-only internal app provisioning tool. Requires direct DB +
# blob-store access; not a network endpoint and not a replacement for the
# PAT-gated production deploy path.
[[bin]]
name = "dev-provision"
path = "src/bin/dev_provision.rs"

[dependencies]
zeroship-core = { workspace = true }
zeroship-bundle = { workspace = true }
zeroship-authn = { workspace = true }
zeroship-authz = { workspace = true }
# Builder OAuth bootstrap reuses auth/control migrations for
# `control.oauth_clients` in dev-mode startup.
zeroship-auth = { workspace = true }
# Shared mailer (extracted to `crates/mailer` in PR-0). The billing-notify cron
# (PR-6) sends creator lifecycle/money emails through the `Mailer` seam, honouring
# the same `email_suppressions` contract auth uses. PR-0 deliberately left control
# un-wired; this is the wiring.
zeroship-mailer = { workspace = true }
zeroship-plugin-workflow = { workspace = true }
zeroship-workflow-scheduler = { workspace = true }
zeroship-stream = { workspace = true }
zeroship-metering = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
# `with-chrono-0_4` so PAT issuance / the console seed can map
# `TIMESTAMPTZ` columns to `chrono::DateTime<Utc>` directly.
# `with-serde_json-1` so the plan catalog binds its JSONB price/quota/limits
# columns as `serde_json::Value` (PR4).
compio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1"] }
compio = { workspace = true }
memmap2 = { workspace = true }
ntex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
async-trait = { workspace = true }
bitflags = "2.11"
mimalloc = { workspace = true }
subtle = "2"
zeroize = "1"
# `stream_body_to_tmp_file` is generic over `Stream<Item = Result<B, E>>`
# (B: AsRef<[u8]>) so the helper compiles against ntex's `Bytes` from
# the request payload. We need `futures::Stream` in the public signature.
futures = { workspace = true }
# Auth — OIDC RP only post-U8. PKCE / state RNG + the legacy bcrypt
# password hasher + JWT cookie minter (which all lived under
# `auth_service` / `auth_handlers` / `oauth.rs`) were retired alongside
# those modules. The OIDC RP gets its CSRF + verifier bytes from
# `zeroship-core` and its JWKS verify path from `zeroship-core`'s
# `oidc_verify` module.
base64 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem", "rand_core"] }
jsonwebtoken = { workspace = true }
rand = "0.8"
cyper = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
url = { workspace = true }
http = { workspace = true }
tracing = { workspace = true }
# Phase 3 U7 — control plane OIDC RP module + console session store.
# `hmac` is already present above (used by the legacy stripe webhook
# verifier); reuse it here for the stash cookie HMAC envelope.
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
chrono-tz = "0.10"

[dev-dependencies]
zeroship-test-support = { workspace = true }
toml = { workspace = true }
# `deploy_test.rs` builds a synthetic `.zship` payload (tar+zstd) and
# feeds it through `zeroship_bundle::ingest`. The runtime path no longer
# depends on these crates — only the test packer does.
tar = { workspace = true }
zstd = { workspace = true }
# Stream tmp tests use `bytes::Bytes` to construct `stream::iter`
# inputs. The production helper is generic over `B: AsRef<[u8]>` so
# `bytes` itself isn't a runtime dep.
bytes = { workspace = true }
# Webhook HTTP-boundary tests (#9/#2/#7) compute a REAL Stripe `v1=` HMAC so the
# multi-v1 OR-fold and the signed-but-large-header paths exercise the production
# `verify_stripe_signature`, not a hand-faked header. Same crates the lib uses.
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serial_test = "3"
zeroship-runtime = { workspace = true }
# The workflow test fixtures seed an app by INSERTing into `zeroship.apps`,
# which skips the deploy-time migration apply that creates the app's workflow
# journal schema. They provision that schema through the migration service's own
# `provisioning::provision_workflow_journal_schema` rather than a CREATE SCHEMA
# of their own, so the seeded app carries production's privilege shape (owner
# `zeroship_workflow_owner`) instead of a test-only one.
zeroship-migrated = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

# ---------------------------------------------------------------------------
# Live-database test gate
# ---------------------------------------------------------------------------
# `live-db-tests` gates every integration target that CANNOT run without a
# reachable, migrated PostgreSQL. Those targets resolve their DSN via
# `zeroship_core::config::test_database_url_opt()` and fall back to the dev
# Postgres on :5440; with no server there they panic on connect ("error
# connecting to server"), so
# `cargo test --workspace` - which provisions no database - could never be green.
#
# The failing-without-a-database property is what this feature encodes, and the
# set below was originally determined by MEASUREMENT, not by grep: every control
# test executable was built once and then run with the DSN environment variables
# pointed at a dead port. The ones that failed are listed here; the six that
# passed (authz_guard_supabase_test, billing_pipeline_redpanda_e2e,
# durable_workflows_keystone_e2e, no_liquibase_residue_test,
# provider_conformance, trusted_clients_test) are deliberately NOT listed, so
# they keep running under a bare `cargo test --workspace`.
#
# The list is 43 targets as of 2026-08-17 (counted: 49 files in tests/, 43
# `required-features` entries, 6 ungated). It read "44" until then, which was
# stale by two deletions; the count is stated once here rather than twice
# because a number repeated is a number that rots. `net_grants_test` was added
# to it by CONSTRUCTION - it builds an `AppState` against a live DSN and cannot
# reach its first assertion without one - not by re-running the dead-port
# measurement.
#
# Gating hides a target from the default build, which is exactly the failure
# mode a gate is supposed to prevent, so it is only honest while something else
# runs the gated set. That something is a SINGLE invocation:
#
#     cargo test -p zeroship-control --features live-db-tests
#
# which builds and runs every target whose `required-features` are satisfied -
# the ones below AND the six ungated ones. There is no second list to keep in
# step: a target added to this file is covered by that command the moment it is
# added, and a target removed from it stops being gated rather than stops being
# run. `tests/run_billing_suite.sh` drives that one command (it no longer
# enumerates binaries by name), and CI's `billing-gate` job runs the script.
[features]
live-db-tests = []

[[test]]
name = "account_status_test"
path = "tests/account_status_test.rs"
required-features = ["live-db-tests"]

