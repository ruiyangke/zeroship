[package]
name = "zeroship-workflow-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generated workflow journal schema artifacts, their version and their stamp"
# One test target for the crate. `tests/main.rs` registers the tier modules and
# `tests/e2e/mod.rs` each suite, so a new `tests/e2e/<name>.rs` is compiled by
# nothing until it is declared there.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
