[package]
name = "zeroship-gateway"
version = "0.1.0"
edition = "2021"
description = "zeroship gateway — auth, rate limit, proxy to workers"

[[package.metadata.zeroship-config.targets]]
target = "zeroship-gate"
class = "platform"
reason = "Initial long-running gateway service in the server configuration scope."

[[bin]]
name = "zeroship-gate"
path = "src/main.rs"

[[bench]]
name = "dispatch_lookup"
harness = false

[[bench]]
name = "dispatch_envelope"
harness = false

[dependencies]
zeroship-core = { workspace = true }
zeroship-bundle = { workspace = true }
# Wrapper-token family revocation (`wrapper_revocation`) lives in zeroship-authz
# (moved out of zeroship-core so core links no DB driver). The gate's OIDC-RP
# JWT path checks revocation on every request.
zeroship-authz = { workspace = true }
# The service-assertion replay statement. The gateway is a callee on ONE
# internal edge (workflow-advance) and that edge takes the full profile, so
# it must claim a `jti` in the store every replica shares. The statement lives
# in zeroship-authn because it needs compio-postgres; a second copy here is the
# defect this dependency exists to avoid.
zeroship-authn = { workspace = true }
# Metering coverage (#27): the gateway is a SECOND metering producer. It
# builds its own process-wide `Arc<Meter>` + `spawn_flush_task` (same wire
# type, same `/internal/usage` ingest as the worker) and emits
# `gateway_egress_bytes` for the bodies the worker never sees (static
# assets, redirects, gateway error pages). The crate is service-agnostic
# (no V8), so this is a plain dependency with no new abstraction.
zeroship-metering = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
ntex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
compio = { workspace = true, features = ["fs"] }
url = { workspace = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
httparse = { workspace = true }
mimalloc = { workspace = true }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
lru = { workspace = true }
memmap2 = { workspace = true }
flume = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
cyper = { workspace = true }
http = { workspace = true }
rand = "0.8"
# auth-sdk Slice 1b-anchors — per-node mint single-flight uses
# `futures::future::Shared` to coalesce concurrent `?mint=1` minters for
# one anchor into a single refresh (the round-6 BLOCKER design).
futures = { workspace = true }
# Phase 8 U1 — gateway-issued wrapper-token signing key. PKCS#8
# PEM/DER loader for an Ed25519 private key (`openssl genpkey
# -algorithm ed25519`). The `pkcs8` + `pem` features pull in the
# `DecodePrivateKey` trait used by `crates/zeroship-gateway/src/signing.rs`.
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem"] }
# Phase 3 U4 — per-origin app session store (`auth.gateway_sessions`).
compio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }

[dev-dependencies]
# Database cases own their containers and run on compio.
compio = { workspace = true, features = ["polling"] }
testcontainers = { version = "0.28", default-features = false, features = ["blocking", "watchdog"] }
# The generated-controls test parses an overlay fixture to prove the
# observability tier is read from the canonical TOML path.
toml = { workspace = true }
# Exercise the real platform identity provider in source-owned gateway tests.
zeroship-auth = { workspace = true }
# Phase 8 U1 — signing-key loader round-trip tests write a PKCS#8
# PEM/DER fixture to a tmpdir and call `signing::load_from_path`.
tempfile = { workspace = true }
criterion = { workspace = true }

[lints]
workspace = true
