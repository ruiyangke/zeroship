[package]
name = "zeroship-secret-policy"
version = "0.1.0"
edition = "2021"
description = "The platform secret table, its strength rules and validators, and secret-reference resolution. A leaf: no HTTP client, no async runtime."

# EVERY DEPENDENCY HERE IS LOAD-BEARING AND LEAF. The reason this crate exists
# is that `zeroship-core` declares `cyper` -> `hyper` -> tokio, so anything that
# reached the secret table through core linked an HTTP stack to compare strings.
# Adding a dependency that carries an async runtime would put the table back
# where it was; `tests/zero_tokio_gate.sh` rules on that, in both directions.
[dependencies]
# `decoded_master_key_len` accepts base64url as well as hex.
base64 = { workspace = true }
hex = { workspace = true }
# `is_loopback_url` parses the URL rather than pattern-matching the text.
url = { workspace = true }
# `SecretError`'s variants.
thiserror = { workspace = true }

[lints]
workspace = true
