[package]
name = "zeroship-test-support"
version = "0.1.0"
edition = "2021"
description = "Test-only helpers shared across the workspace. Not published; consumed as a dev-dependency."
publish = false

# No dependencies. The crate held one on `zeroship-core` for the declared-env
# accessors, which existed solely to read `ZEROSHIP_REQUIRE_LIVE_BACKENDS`.
# With that flag deleted this crate reads no environment at all, so the
# dependency (and the dev-dependency cycle it formed with `crates/core`) goes
# with it. It must stay that way: an announcer that reads configuration is a
# flag again.
[dependencies]

[lints]
workspace = true
