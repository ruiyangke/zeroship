[package]
name = "appbase-plugins"
version = "0.1.0"
edition = "2024"
description = "Built-in plugins for appbase — db, kv, env"

[features]
default = ["db", "kv", "env"]
db = ["dep:uuid"]
kv = []
env = []

[dependencies]
appbase-core = { path = "../core" }
serde_json = "1"
thiserror = "2"

# db plugin only
uuid = { version = "1", features = ["v4"], optional = true }

[lints]
workspace = true
