[package]
name = "zeroship-plugin-storage"
version = "0.1.0"
edition = "2021"
description = "Storage plugin — zeroship.storage.* native primitives (local FS + S3 later)"

[dependencies]
zeroship-runtime = { workspace = true }
# Metering infrastructure: put/get emit raw usage metrics (storage_ops,
# storage_bytes, storage_egress_bytes) in their success arms via a
# MeterHandle. Platform-measured, unforgeable by app code.
zeroship-metering = { workspace = true }
compio = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
v8 = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }

# S3 backend deps — gated behind the `s3` feature so the default build
# (LocalFs only) pulls nothing extra.
compio-s3 = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = []
# S3-compatible backend (covers S3, R2, MinIO, Spaces, B2, etc.) via a
# hand-rolled client on cyper + hand-rolled SigV4. Adds no tokio.
s3 = ["dep:compio-s3", "dep:futures", "dep:tracing"]

[dev-dependencies]
# Backend-parity integration test drives the trait directly on a compio
# runtime; the S3 leg (Docker-gated) needs the client to build a MinIO config.
compio = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
compio-s3 = { workspace = true }
# The metering e2e asserts per-app counts off a real `Meter`, which keys
# its drain by parsed UUID app_id — the test parses the UUID it stamps
# into APP_ID.
uuid = { workspace = true }

[lints]
workspace = true
