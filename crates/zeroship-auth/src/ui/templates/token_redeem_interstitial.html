{% extends "base.html" %}
{% block title %}{{ title }} · zeroship{% endblock %}
{% block body %}
<noscript>
  <h2>{{ title }}</h2>
  <p>Click <b>Continue</b> to proceed. (JavaScript is disabled.)</p>
  <form method="POST" action="{{ action }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="token" value="{{ token }}">
    {%- for (name, value) in extra_fields %}
    <input type="hidden" name="{{ name }}" value="{{ value }}">
    {%- endfor %}
    <button type="submit">Continue</button>
  </form>
</noscript>
<form id="redeem" method="POST" action="{{ action }}" hidden>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="token" value="{{ token }}">
  {%- for (name, value) in extra_fields %}
  <input type="hidden" name="{{ name }}" value="{{ value }}">
  {%- endfor %}
</form>
<p>Redirecting…</p>
<script nonce="{{ script_nonce }}">
  (function() {
    // Scrub the token from history so back-button doesn't re-expose it.
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', window.location.pathname);
    }
    document.getElementById('redeem').submit();
  })();
</script>
{% endblock %}
