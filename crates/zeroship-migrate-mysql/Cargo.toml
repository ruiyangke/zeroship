[package]
name = "zeroship-migrate-mysql"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The MySQL backend for zeroship-migrate: this vendor's DML, schema, DDL, value-format and guard behavior. Implements the zeroship-migrate-backend contract; does NOT depend on the engine."
# Integration suites are modules of one `tests/main.rs` target, so
# the crate links one test executable instead of one per file.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
# The CONTRACT: the required renderer traits, the render errors their signatures name,
# the identifier/expression spelling seam this vendor calls, and the VendorSet shape
# `VENDOR` below is registered through. This is the ONLY zeroship-migrate crate a
# backend may depend on - depending on the engine is the cycle the split removed.
zeroship-migrate-backend = { workspace = true }
# The closed `Op` / `Expr` / `IrScalar` vocabulary the trait methods are handed, plus
# open dialect identity and this vendor's `BackendDescriptor`.
zeroship-migrate-ir = { workspace = true }
# The schema-field shape `SchemaRenderer` reads is the SDK's field JSON.
serde_json = { workspace = true }
# MySQL and SQLite both spell a binary/string literal as a hex form.
hex = { workspace = true }
# The backfill id is `bf_<32 hex chars>` of a SHA-256, and the two-phase apply
# checksums each DML step the same way — both in `backend/backfill_sql.rs`.
sha2 = { workspace = true }
# `uuid` for the per-row UUIDv4/v7 generators a backfill materializes in Rust when
# the server has no generator of its own (`backend/backfill_sql.rs`).
uuid = { workspace = true }
# The backend's own error enums (`MysqlInflightRecoveryError`) derive their
# `Display`/`Error` impls here, the same way every other crate in the tree does.
thiserror = { workspace = true }
# Structured apply-path events from `backend/session.rs`.
tracing = { workspace = true }
# `ExecutorConfig` carries an `EffectivePolicy`, so the execution half names the
# PDP's types. A pure LEAF with no SQL dependencies.
zeroship-migrate-policy = { workspace = true }

[dev-dependencies]
# TEST-ONLY: the canned `SqlSession` this crate's own unit tests drive. The ENGINE's
# integration tests drive the SAME object, because tests over that recorder also
# reach `apply_with_lock_backend` / `MigrationEngine` / `diff_snapshots` / `fold_ops`,
# which a vendor crate cannot name (the engine depends on this crate, so the edge back
# is a cycle). A second copy of the recorder is the hazard the shared crate avoids:
# its canned `information_schema` rows are the premise of both suites and two copies
# drift silently.
#
# The recorder holds the canned inflight marker as its own plain `String` fields,
# not this crate's `MysqlInflightDdlMarker`, so it names no edge back here: this
# is a DEV edge in one direction only. Neither crate names the other in its
# normal dependencies, so this crate's test targets link one copy of it, and a
# shipping `zeroship-migrate-mysql` links none of the recorder.
zeroship-migrate-mysql-recording = { workspace = true }
# TEST-ONLY: the async apply/backend surface is `async`, so the unit tests that
# drive it spin a throwaway compio run loop per test (zero tokio), exactly as the
# engine's own async-apply harness does.
compio = { workspace = true }
# TEST-ONLY: the charter fixtures build their TOML with the same `toml::Value`
# string escaping the engine's `test_fixtures` uses, so a vendor's test charter and
# the engine's are the same bytes rather than nearly the same.
toml = { workspace = true }

[lints]
workspace = true
