[package]
name = "zeroship-data-cdc-server"
version = "0.1.0"
edition = "2021"
description = "Separate CDC relay service with its own configuration and process boundary."

# No shipped binary links this service. The configuration contract checker is
# the permitted development consumer; data_crate_closure_gate.sh enforces it.
# The relay does not link the ORM or V8 adapter. Database tests, when added,
# belong to ordinary cargo test and must fail when their database is unavailable.

[[package.metadata.zeroship-config.targets]]
target = "zeroship-data-cdc-server"
class = "platform"
reason = "Deployed long-running CDC relay in the server configuration scope, with a dedicated database login and TLS listener."

[[bin]]
name = "zeroship-data-cdc-server"
path = "src/main.rs"

[dependencies]
# The generated settings carrier. `clap`'s derive is what `bootstrap_or_exit`
# parses, and `env` is what projects the canonical ZEROSHIP_* names.
clap = { workspace = true, features = ["derive", "env"] }
# The runtime `main` runs on. Zero tokio: `#[compio::main]`, io_uring.
compio = { workspace = true }
compio-postgres = { workspace = true, features = ["tls"] }
zeroship-data-cdc-wire = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }
compio-ws = { workspace = true }
compio-tls = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
# `zeroship_config`, the bootstrap/overlay resolver, `CheckConfigReport`, and the
# tracing subscriber every platform service installs the same way.
zeroship-core = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Exercise the public ORM client against the separate relay executable.
zeroship-data-orm = { workspace = true }
rcgen = "0.14"
tempfile = { workspace = true }
url = { workspace = true }
# The overlay-precedence test in `src/config.rs` builds a `toml::Value` by hand
# so the flag-over-overlay order is asserted without a file on disk. DEV only -
# the resolver itself takes an already-parsed value, so the shipped closure does
# not need a TOML parser.
toml = { workspace = true }

[lints]
workspace = true
