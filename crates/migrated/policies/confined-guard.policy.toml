# The zeroship CONFINED guard charter. Managed lowering uses the inject-bearing
# confined ceiling; the rendered-DDL guard uses this otherwise-equivalent charter
# without an inject rule so it can vet the CREATE TABLE emitted by that lower.
#
# The managed server binds the creation and movement grants below, plus the
# default-deny cross-schema grant, to one exact app schema before composing this
# charter. Keep these grants aligned with confined.policy.toml.
#
# THE ONE INTENTIONAL DIFFERENCE is that this charter is used ALONE, while
# confined.policy.toml is concatenated with
# policies/confined-system-shape.inject.toml before it is loaded
# (`crates/migrated/src/policy.rs`). The two grant files now look almost
# identical because the inject rule left both of them; the difference is in the
# constant, not in the file. Do not "fix" that by adding the fragment here - the
# rendered-DDL guard must vet a CREATE TABLE that the inject already expanded,
# so injecting again would double the system columns.

policy_version = 1

# ── creation / movement authority (default-deny; the app may create + name tables) ──
[[grant]]
key = "schema.create_table"
value = true
scope = "all"

[[grant]]
key = "schema.rename"
value = true
scope = "all"

# Destructive posture: the confined app may author destructive ops (the managed
# server gates them behind operator approval at preflight, not at the policy floor).
[[grant]]
key = "safety.destructive_ops"
value = "allow"
scope = "all"

# NO per-op timeout ceilings, matching the managed confined ceiling. Both files
# granted them until 2026-08-10 and both were refused at load with
# `DeclaredOnlyNonDefault { key: "runtime.lock_timeout_ms" }`; see the long note in
# confined.policy.toml for the mechanism and for what brings them back.
