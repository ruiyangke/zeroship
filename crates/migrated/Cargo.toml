[package]
name = "zeroship-migrated"
version = "0.1.0"
edition = "2021"
description = "zeroship standalone creator migration service"

[[package.metadata.zeroship-config.targets]]
target = "zeroship-migrated"
class = "platform"
reason = "Deployed long-running migration service in the server configuration scope."

[[bin]]
name = "zeroship-migrated"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
compio = { workspace = true }
compio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1"] }
mimalloc = { workspace = true }
ntex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroship-authz = { workspace = true }
zeroship-authn = { workspace = true }
zeroship-core = { workspace = true }
# Phase F Stage 3: this service consumes ONLY the published `zero-migrate` engine
# (vendored as a submodule at third_party/zero-migrate) plus the monorepo's
# `zeroship-migrate-adapter` (the `CompioPgSession` mapping the platform's io_uring
# PG driver onto the engine's driver-neutral `SqlSession` seam). The in-tree
# `zeroship-migrate` (v6) dependency is GONE: this crate no longer links the
# platform's migration source.
#
# The engine ships NO native Rust network PG driver — its PG apply path is generic
# over `SqlSession`. `zero-migrate`'s default features light `host-pg` → the
# `pg_seam` cfg (the generic `PostgresBackend<D>`, `IrAuthor::load_and_lower*`, the
# `<D: SqlSession>` apply/journal/snapshot free functions). The adapter supplies the
# concrete `CompioPgSession` producer; migrator-role + schema provisioning runs
# inline over the wrapped raw compio `Client`.
zero-migrate = { workspace = true }
# The managed-policy server composes the monorepo-owned confined/platform ceilings
# against untrusted creator drafts. That requires the engine's Policy Decision Point
# directly (`compose_strict`, `RootCeiling`, `PolicyDoc`, `LoadContext`, the builtin
# knob registry) — the `zero-migrate` facade re-exports only the seal +
# `resolve_create_table_policy`, not the composition algebra.
zero-migrate-policy = { workspace = true }
zero-migrate-ir = { workspace = true }
toml = { workspace = true }
zeroship-migrate-adapter = { workspace = true }

[dev-dependencies]
# `apply_api_test` drives the REAL `ControlPlaneAuthenticator`, whose only
# principal path is a platform OAuth access token. Minting one means signing an
# EdDSA `at+jwt` (jsonwebtoken + ed25519-dalek) and publishing the matching
# public key from a local JWKS endpoint the auth provider fetches over HTTP
# (base64 for the `x` coordinate). Same crates and features
# `crates/control/Cargo.toml` uses for the identical fixture.
base64 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem", "rand_core"] }
jsonwebtoken = { workspace = true }

# ---------------------------------------------------------------------------
# Live-database test gate
# ---------------------------------------------------------------------------
# Same contract as `zeroship-control`'s feature of the same name: it marks the
# targets that CANNOT run without a reachable, migrated PostgreSQL. Determined
# by measurement - the built test executables were run with MIGRATED_TEST_DB /
# CONTROL_TEST_DB pointed at a dead port, and `apply_api_test` was the one
# integration target that failed (it panics in `connect`, it does not skip).
#
# The feature also gates `migration_store`'s in-crate `mod tests`, whose two
# `*_pg` cases dial the same database from the LIB target. A `required-features`
# entry cannot reach inside a lib, so that module carries the `cfg` directly.
#
# Covered in CI by one invocation, with no second list to drift from this one:
#
#     cargo test -p zeroship-migrated --features live-db-tests
#
# driven by `tests/run_billing_suite.sh` (the `billing-gate` job).
[features]
live-db-tests = []

[[test]]
name = "apply_api_test"
path = "tests/apply_api_test.rs"
required-features = ["live-db-tests"]

[lints]
workspace = true
