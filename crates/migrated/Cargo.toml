[package]
name = "zeroship-migrated"
version = "0.1.0"
edition = "2021"
description = "zeroship standalone creator migration service"

[[bin]]
name = "zeroship-migrated"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
compio = { workspace = true }
compio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1"] }
mimalloc = { workspace = true }
ntex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroship-authz = { workspace = true }
zeroship-authn = { workspace = true }
zeroship-core = { workspace = true }
# Consumes only the V8-free apply/IR surface (apply_sealed / discover_ir_files /
# postgres_ir_apply_state / PostgresBackend), so it opts out of zeroship-migrate's
# default `zsv8` V8 host — keeping `v8` + `zeroship-runtime` out of this tree.
zeroship-migrate = { workspace = true, default-features = false }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }

[lints]
workspace = true
