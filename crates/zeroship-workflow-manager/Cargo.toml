[package]
name = "zeroship-workflow-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native workflow scheduling and durable metadata queue"
# The integration suites share one database fixture, so they compile into one
# test binary instead of one per `tests/*.rs`. `tests/integration/main.rs`
# registers each suite module; a new `tests/integration/<name>.rs` is compiled
# by nothing until it is declared there.
autotests = false

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dependencies]
compio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
thiserror = { workspace = true }
zeroship-core = { workspace = true }
zeroship-bundle = { workspace = true }
zeroship-data-orm = { workspace = true }
zeroship-workflow-calendar = { workspace = true }

[dev-dependencies]
compio-postgres = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
testcontainers = { version = "0.28", default-features = false, features = ["blocking"] }

[lints]
workspace = true
