[package]
name = "zeroship-kv"
version = "0.1.0"
edition = "2021"
description = "App-scoped key-value storage with embedded redb and distributed Redis backends"
# Integration suites are modules of the one `tests/main.rs` target; a new tests/integration/<name>.rs is compiled by nothing until tests/integration/mod.rs declares it.
autotests = false

[dependencies]
async-trait = { workspace = true }
compio-redis = { workspace = true }
redb = { version = "4.1", optional = true }
url = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[features]
default = ["redis", "redb"]
redis = []
redb = ["dep:redb"]

[dev-dependencies]
compio = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
testcontainers = { version = "0.28", default-features = false, features = ["blocking"] }
rcgen = "0.14"
zeroship-testkit = { workspace = true }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
