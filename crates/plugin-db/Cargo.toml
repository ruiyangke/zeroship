[package]
name = "zeroship-plugin-db"
version = "0.1.0"
edition = "2021"
description = "Database plugin — zeroship.db.* native primitives"

[dependencies]
zeroship-runtime = { workspace = true }
zeroship-runtime-macros = { workspace = true }
compio-postgres = { workspace = true }
compio = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
v8 = { workspace = true }
# `tracing` for INVALID-index recovery logging until A3 ships the
# `__zeroship_migrations` audit table. `sha2` produces a deterministic
# 8-char base32 suffix when the generated index name exceeds 60 bytes
# (Postgres NAMEDATALEN=64 minus headroom).
tracing = { workspace = true }
sha2 = { workspace = true }
# SQLite backend dependencies — gated behind the `sqlite` Cargo feature
# below. P1 PR 1 reintroduces these alongside the
# `crate::backend::sqlite` module skeleton (the previous declarations
# were removed in the P0 mop-up because the underlying module did not
# exist and `--features sqlite` failed E0433).
#
# - `rusqlite`: bundled SQLite amalgamation + `preupdate_hook` seam the
#   P2 CDC pass will wire in.
# - `flume`: bounded MPMC queue the `SqliteSession` actor uses to
#   serialise calls onto the single rusqlite writer thread (compio is
#   single-threaded; the actor runs under `spawn_blocking`). The
#   `flume` workspace dep was already declared for the sandbox phase-1
#   queue — we just opt in optionally here.
rusqlite = { workspace = true, features = ["bundled", "preupdate_hook"], optional = true }
flume = { workspace = true, optional = true }

[dev-dependencies]
compio = { workspace = true }
serde_json = { workspace = true }
# Test-only constructors (`row_for_test` / `column_for_test`) for the
# `bench_row_to_json` harness — enables synthesising a `Row` without
# hitting Postgres. Production builds of `compio-postgres` do not see
# this feature. See `crates/plugin-db/benches/bench_row_to_json.rs`.
compio-postgres = { workspace = true, features = ["test-utils"] }
# Performance r9 (cycle 09:30) forcing-function: a `cargo bench` harness
# must exist under `crates/plugin-db/benches/` so future perf reviews can
# quote real numbers instead of being blocked by the anti-fabrication rule.
# Initial bench target is `build_find` / `build_insert` (see
# `benches/bench_query_build.rs` for the rationale).
criterion = { workspace = true }
# Test-coverage r12 NEW-R11-1 + NEW-R12-1: the F1 warn-half (5d9acab8
# / fcf7ce3c / 7c6bd2ec / 18aee490) and the [I6] release_advisory_lock
# typed-error caller paths emit 9+ structured `tracing::warn!` /
# `tracing::error!` events whose field shape is operator-grep-contract.
# `tracing-subscriber`'s test layer captures emissions so unit tests
# can pin the field set + transition discriminator. Caught my own
# 7c6bd2ec drift in cycle 13:17 — a snapshot test would have caught
# it pre-commit.
tracing-subscriber = { workspace = true }

[[bench]]
name = "bench_query_build"
harness = false

# Row-decoding microbench — landed as the [I35] forcing function
# (performance r12). Synthesises `compio_postgres::Row` values via the
# `test-utils` feature on `compio-postgres` (dev-dep above) and runs
# `row_to_json_for_bench` against narrow / medium / wide column shapes.
[[bench]]
name = "bench_row_to_json"
harness = false

# findOne lowering microbench — perf r13 forcing function for the
# deferred [C3] redesign (`docs/reviews/plugin-db-deferred.md`). Measures
# the full `&[Row] → JSON-string` path the SDK sees on a `findOne` call:
# `v8_bridge::rows_to_json_value` composed with `crud::first_row_or_null`.
# The downstream V8 `JSON.parse` cost is the structural piece [C3] would
# have to redesign away; it lives in `zeroship-runtime` and is NOT part
# of this microbench.
[[bench]]
name = "bench_first_row_or_null"
harness = false

[features]
# Default backends — `pg` is the only backend implemented in P0.
#
# A `sqlite = []` feature was declared in r14 alongside a
# `BackendHandle::Sqlite(Rc<crate::backend::sqlite::SqliteBackend>)`
# enum arm, but the underlying `crate::backend::sqlite` module does
# not exist, so `--features sqlite` failed to compile (E0433). The
# P0-mop-up cycle (post-r14) removed both the feature declaration and
# the enum arm — they will be re-introduced atomically with the
# `crate::backend::sqlite::SqliteBackend` impl in P1.
default = ["pg"]
pg = []
# Re-introduced in P1 PR 1 alongside the `crate::backend::sqlite`
# module skeleton. Toggles the `rusqlite` + `flume` dep activation
# and gates the `BackendHandle::Sqlite` arm. The skeleton commits
# stub method bodies (every capability impl returns a typed
# `DbError::Internal { message: "P1 PR2+ stub" }` or `unimplemented!`);
# real behaviour lands across PR 2-5 per
# `docs/proposals/p1-sqlite-implementation-plan.md` §9.
sqlite = ["dep:rusqlite", "dep:flume"]
# `test-helpers` exposes the `*_for_tests` / `*_with_pool` symbols to
# downstream test crates (integration tests in `tests/integration.rs`).
# The same symbols are visible to the in-crate unit tests via
# `#[cfg(test)]` so `cargo test --lib` does NOT need this feature.
test-helpers = []
# `hardening` gates the dormant `auth/*` subsystem (~2,860 LOC: admin
# schema bootstrap, session minting, HMAC key rotation). Architect r7
# I5 + code-critique r9 MAJOR-R9-5: zero production callers today;
# enables 58 dead-code warnings in default builds. The eventual
# control-plane wire-up (per the auth-r1 design) flips this feature
# on. Until then, default builds skip the subtree entirely.
hardening = []
# Integration tests need both feature flags so the legacy auth surface
# the test suite probes is reachable.

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["test-helpers", "hardening"]

# SQLite-side integration target. P1 PR 1 wires the skeleton (a single
# `smoke_compiles` test); PR 2-5 backfill mirror coverage for the
# register-model / migration / introspection paths under the SQLite arm.
# Behind `required-features` so the default-feature build stays clean —
# `cargo test -p zeroship-plugin-db` (no flags) never builds rusqlite.
[[test]]
name = "sqlite_integration"
path = "tests/sqlite_integration.rs"
required-features = ["sqlite", "test-helpers"]

[lints]
workspace = true
