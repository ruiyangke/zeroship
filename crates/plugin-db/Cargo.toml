[package]
name = "zeroship-plugin-db"
version = "0.1.0"
edition = "2021"
description = "Database plugin — zeroship.db.* native primitives"

[dependencies]
zeroship-runtime = { workspace = true }
zeroship-runtime-macros = { workspace = true }
# **P7 PR 3** — typed_id minter for INSERT auto-populated `id` column.
# The dispatch_insert path calls `zeroship_core::typed_id::generate(prefix)`
# when the inbound doc omits `id`. Cargo dep is in-workspace path-only
# (no external crate) — flagged in the PR 3 commit body per the
# "new Cargo dep" disclosure rule.
zeroship-core = { workspace = true }
# Metering infrastructure: exec.rs emits a raw usage metric
# (db_reads / db_writes / db_rows_written) in the success arm of each
# query / mutation / count via a MeterHandle. Platform-measured,
# unforgeable by app code (replaces the deleted env.meter API).
zeroship-metering = { workspace = true }
compio-postgres = { workspace = true }
compio = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
v8 = { workspace = true }
# `tracing` for INVALID-index recovery logging until A3 ships the
# `__zeroship_migrations` audit table. `sha2` produces a deterministic
# 8-char base32 suffix when the generated index name exceeds 60 bytes
# (Postgres NAMEDATALEN=64 minus headroom).
tracing = { workspace = true }
sha2 = { workspace = true }
# **P5 PR 1** — column-encryption AEAD + key derivation. Both the PG
# arm and the SQLite arm consume `crate::encryption`, so these deps are
# unconditional (the encryption module compiles in every plugin-db
# build). `hmac` is promoted from optional/sqlite-only to unconditional
# below — deterministic mode HMAC-derives the synthetic nonce on both
# backends, and the env-var key sourcing in `encryption::keys` is
# pure-Rust.
aes-gcm = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
# **P5 PR 2** — the CRUD encryption pass exchanges ciphertext over JSON
# values (which cannot carry raw bytes), so plaintext bytes are
# base64-encoded into a `Value::String` and the SQL bind layer wraps
# the placeholder with `decode($N, 'base64')::bytea` on insert/update
# / `encode("col", 'base64')` on read. Both legs need a hot-path
# base64 codec; `base64` v0.22 is already a workspace dep.
base64 = { workspace = true }
# **P5 PR 2 follow-up** — zeroize root-key material, derived AEAD keys,
# and transient plaintext buffers on drop. The plugin-db encryption
# paths hold key/plaintext bytes in Rust-owned memory; `zeroize`
# hardens those drop paths without changing the wire contract.
zeroize = { version = "1", features = ["alloc", "derive"] }
# SQLite backend dependencies — unconditional now that both backends
# ship in every build.
#
# - `rusqlite`: bundled SQLite amalgamation + `preupdate_hook` seam the
#   P2 CDC pass will wire in.
# - `flume`: bounded MPMC queue the `SqliteSession` actor uses to
#   serialise calls onto the single rusqlite writer thread (compio is
#   single-threaded; the actor runs under `spawn_blocking`).
rusqlite = { workspace = true, features = ["bundled", "preupdate_hook"] }
flume = { workspace = true }
# **P4 PR 7** — `sqlite-vec` statically compiles the `vec0` C extension
# into the binary and hooks every rusqlite Connection via
# `sqlite3_auto_extension`. Unconditional now that the SQLite arm is
# always compiled in. The PG arm still never touches this crate.
sqlite-vec = { workspace = true }
tempfile = { workspace = true }
# **P3 PR 3** — SQLite SessionMinter uses HMAC-SHA256. `sha2` is
# already an unconditional dep (used for the auto-generated index
# name suffix). The previous `hmac = { ... optional = true }` line
# was widened to unconditional in **P5 PR 1** (line ~27 above) —
# deterministic-mode column encryption HMAC-derives the synthetic
# nonce on both backends, so the dep is no longer sqlite-only. The
# PG arm still signs sessions via `pgcrypto.hmac(...)` inside
# SECURITY DEFINER (no Rust HMAC there); only `encryption::aead`
# uses the Rust impl on the PG side.

[dev-dependencies]
compio = { workspace = true }
serde_json = { workspace = true }
# Test-only constructors (`row_for_test` / `column_for_test`) for the
# `bench_row_to_json` harness — enables synthesising a `Row` without
# hitting Postgres. Production builds of `compio-postgres` do not see
# this feature. See `crates/plugin-db/benches/bench_row_to_json.rs`.
compio-postgres = { workspace = true, features = ["test-utils"] }
# Performance r9 (cycle 09:30) forcing-function: a `cargo bench` harness
# must exist under `crates/plugin-db/benches/` so future perf reviews can
# quote real numbers instead of being blocked by the anti-fabrication rule.
# Initial bench target is `build_find` / `build_insert` (see
# `benches/bench_query_build.rs` for the rationale).
criterion = { workspace = true }
# Test-coverage r12 NEW-R11-1 + NEW-R12-1: the F1 warn-half (5d9acab8
# / fcf7ce3c / 7c6bd2ec / 18aee490) and the [I6] release_advisory_lock
# typed-error caller paths emit 9+ structured `tracing::warn!` /
# `tracing::error!` events whose field shape is operator-grep-contract.
# `tracing-subscriber`'s test layer captures emissions so unit tests
# can pin the field set + transition discriminator. Caught my own
# 7c6bd2ec drift in cycle 13:17 — a snapshot test would have caught
# it pre-commit.
tracing-subscriber = { workspace = true }
# P3 PR 4: cross-backend session-payload equivalence test in
# `tests/sqlite_integration.rs` needs to recompute HMAC-SHA256 over
# the canonical payload independently of the production code path so
# the assertion pins the SQLite-side byte format against a third
# implementation (the canonical_payload + compute_signature helpers
# are `pub(crate)` and unreachable from the integration target).
# `sha2` is already declared as a non-optional `[dependencies]` entry
# (line 20) so it's available to the test target without re-listing;
# `hmac` is also unconditional now, but we keep the dev-dep pin so the
# integration target still spells out its dependency explicitly.
hmac = { workspace = true }

[[bench]]
name = "bench_query_build"
harness = false

# Row-decoding microbench — landed as the [I35] forcing function
# (performance r12). Synthesises `compio_postgres::Row` values via the
# `test-utils` feature on `compio-postgres` (dev-dep above) and runs
# `row_to_json_for_bench` against narrow / medium / wide column shapes.
[[bench]]
name = "bench_row_to_json"
harness = false

# `find().first()` lowering microbench — perf r13 forcing function for
# the deferred [C3] redesign (`docs/reviews/plugin-db-deferred.md`).
# Measures the full `&[Row] → JSON-string` path the SDK sees on a
# single-row read (`find` with `LIMIT 1`):
# `v8_bridge::rows_to_json_value` composed with `crud::first_row_or_null`.
# The downstream V8 `JSON.parse` cost is the structural piece [C3] would
# have to redesign away; it lives in `zeroship-runtime` and is NOT part
# of this microbench.
[[bench]]
name = "bench_first_row_or_null"
harness = false

[features]
# `test-helpers` exposes the `*_for_tests` / `*_with_pool` symbols to
# downstream test crates (integration tests in `tests/integration.rs`).
# The same symbols are visible to the in-crate unit tests via
# `#[cfg(test)]` so `cargo test --lib` does NOT need this feature.
test-helpers = []

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["test-helpers"]

# SQLite-side integration target. PR 0 makes the backend unconditional,
# so only `test-helpers` remains gated.
[[test]]
name = "sqlite_integration"
path = "tests/sqlite_integration.rs"
required-features = ["test-helpers"]

[lints]
workspace = true
