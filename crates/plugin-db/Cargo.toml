[package]
name = "zeroship-plugin-db"
version = "0.1.0"
edition = "2021"
description = "Database plugin — zeroship.db.* native primitives"

[dependencies]
zeroship-runtime = { workspace = true }
zeroship-runtime-macros = { workspace = true }
compio-postgres = { workspace = true }
compio = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
v8 = { workspace = true }
# `tracing` for INVALID-index recovery logging until A3 ships the
# `__zeroship_migrations` audit table. `sha2` produces a deterministic
# 8-char base32 suffix when the generated index name exceeds 60 bytes
# (Postgres NAMEDATALEN=64 minus headroom).
tracing = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
compio = { workspace = true }
serde_json = { workspace = true }
# Performance r9 (cycle 09:30) forcing-function: a `cargo bench` harness
# must exist under `crates/plugin-db/benches/` so future perf reviews can
# quote real numbers instead of being blocked by the anti-fabrication rule.
# Initial bench target is `build_find` / `build_insert` (see
# `benches/bench_query_build.rs` for the rationale).
criterion = { workspace = true }

[[bench]]
name = "bench_query_build"
harness = false

[features]
# `test-helpers` exposes the `*_for_tests` / `*_with_pool` symbols to
# downstream test crates (integration tests in `tests/integration.rs`).
# The same symbols are visible to the in-crate unit tests via
# `#[cfg(test)]` so `cargo test --lib` does NOT need this feature.
test-helpers = []

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["test-helpers"]

[lints]
workspace = true
