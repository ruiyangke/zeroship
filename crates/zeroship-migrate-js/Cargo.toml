[package]
name = "zeroship-migrate-js"
version = "0.1.0"
edition = "2021"
description = "Optional JS/TS schema front-end for zeroship-migrate — evals a `schema.js` (the @zeroship/db `t.*` DSL) inside zeroship-runtime's V8 sandbox and lowers it to the descriptor IR the lean engine diffs. The analog of Atlas's HCL/ORM providers. NOT part of the lean core: this is the ONLY crate in the migrate family that carries V8 (via zeroship-runtime)."

# ---------------------------------------------------------------------------
# This crate is the pluggable JS front-end (design §5.1). It is deliberately
# SEPARATE from `zeroship-migrate` so the lean dbmate-style core stays V8-free:
# the public `zeroship-migrate migrate ./db/migrations` binary carries no JS
# engine. Only the full/platform build that needs `generate --schema` pulls
# this crate (and thus V8 via zeroship-runtime) in.
# ---------------------------------------------------------------------------

[dependencies]
# The V8 sandbox + module loader + WinterCG polyfills. Reused verbatim so the
# untrusted creator `schema.js` evaluates under the SAME security model as app
# code (no second JS engine, no second sandbox). This is where V8 enters the
# dependency graph — and ONLY here, never in the lean core.
zeroship-runtime = { workspace = true }
# The lean migration engine: the descriptor IR types (`CollectionDescriptor`),
# the declarative differ (`DeclarativeAuthor::diff` / `desired_snapshot`), the
# dbmate/Flyway migration serializer (`loader`), and the migration types.
zeroship-migrate = { workspace = true }
# The shared schema kernel — re-exported IR-adjacent types live here; pulled
# transitively by zeroship-migrate, declared explicitly for clarity.
zeroship-schema = { workspace = true }
# Tracing init for the bin (`observability::init_tracing`).
zeroship-core = { workspace = true }
# Live-schema introspection for `generate` runs over the bespoke compio-native
# PG driver — ZERO tokio, per the platform invariant.
compio-postgres = { workspace = true }
compio = { workspace = true }
v8 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
compio = { workspace = true }

# The full-build CLI: `zeroship-migrate-js generate --schema schema.js …`.
# A THIN arg-parser that delegates to the library. The lean core's own
# `zeroship-migrate` binary stays in the `zeroship-migrate` crate (V8-free).
[[bin]]
name = "zeroship-migrate-js"
path = "src/bin/zeroship-migrate-js.rs"

[lints]
workspace = true
