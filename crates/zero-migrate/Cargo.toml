[package]
name = "zero-migrate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable, security-first, multi-dialect DB migration engine — driver-neutral Postgres seam (host-callback / napi bridge) plus in-process SQLite. Runs V8-free: authoring, MySQL, and Postgres execution all run in the Node process (npm drivers) reached through the zero-migrate-node napi bridge; the engine ships NO embedded V8."

[features]
# Extraction: the engine is a clean, runtime-free, V8-FREE LIBRARY. Authoring,
# MySQL, and Postgres all execute in the Node process (the `zero-migrate`
# host-recorder evals the DSL → op-IR envelope; the `zero-migrate-node` napi
# addon LOWERs + applies it over the host `pg` / `mysql2` npm drivers). This
# standalone is **host-pg + SQLite only** — there is NO native compio Postgres
# driver, and NO embedded V8 in the Rust build graph. The engine's PG path is the
# driver-neutral `PgSession` seam (host-callback / napi bridge); a native Rust PG
# driver is intentionally absent. The default build is the driver-neutral PG seam
# (`host-pg`) + the standalone CLI, with NO `v8` anywhere in the graph or dev-deps.
#
# The former `v8-host` feature — which gated the in-Rust-V8 authoring front-end
# (`src/frontend/`) and live-MySQL backend (`src/apply/backend/mysql/`) — is GONE.
# That Rust source remains in-tree but is permanently never-compiled (gated on the
# `v8_host` internal cfg, which build.rs never emits); Node owns that work now.
default = ["host-pg", "standalone-cli"]
# The host-callback PG plumbing: the driver-neutral `PgSession` seam + the whole
# GENERIC PG apply path (journal/drift/precondition/baseline free fns, the generic
# `PostgresBackend<D>`, the `<D: PgSession>` executor entries, `ops::status`). It
# supplies NO in-Rust `PgSession` impl — the in-crate recording driver (behind
# `cfg(test)`) is the first host-shaped producer, and the napi bridge / Node
# `PgSession` host is the production producer. `host-pg` lights up the shared
# generic path via the internal `pg_seam` cfg (emitted by build.rs). The addon
# build (`--no-default-features --features host-pg`) stays cross-platform (no
# io_uring), since no compio PG driver is ever present.
host-pg = []
# NOTE: the former `v8-host` / `addon-host` features are REMOVED. They used to gate the
# in-Rust-V8 authoring front-end (`src/frontend/`) + live-MySQL backend
# (`src/apply/backend/mysql/`). Node now owns authoring/MySQL/PG execution (via the
# `zero-migrate` host-recorder + the `zero-migrate-node` napi bridge over the
# `pg`/`mysql2` npm drivers), so no in-Rust V8 host exists. That Rust source stays
# in-tree as permanently never-compiled dead code, still spelled
# `#[cfg(feature = "v8-host")]` / `#[cfg(feature = "addon-host")]`; build.rs declares
# those as expected cfg values (checked-cfg) so the build stays warning-free
# without resurrecting the feature or pulling `v8`.
#
# The standalone apply/runner CLI (the `zero-migrate` bin, which STAYS in this
# crate — it needs no in-Rust V8 host, only child-mediated recording). Pulls clap.
standalone-cli = ["dep:clap"]

[dependencies]
# Parse SQL with the REAL Postgres parser (libpg_query bindings) so the
# security PRECONDITION shape-gate + the idempotence/txn scans see exactly what
# Postgres would execute. The parse-time SQL security GUARD (deny-list, classify,
# advisories) now lives in the `zero-migrate-guard` crate (redesign step 3b); the
# engine still parses directly here for the precondition boolean-SELECT gate, the
# non-transactional idempotence scan (executor), and the raw-view-body validate
# scan. pg_query carries a C build dep (libpg_query).
pg_query = "6"
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
# JSON Schema derive for the `op.*` IR types (MigrationIr + the closed Op enum).
# Emits `op-ir.schema.json` (the discriminated union the JS builder targets) via
# `schemars::schema_for!`. Sync + leaf — zero tokio; does not widen the trust
# domain (it only describes the IR shape, it does not parse untrusted SQL).
schemars = { workspace = true }
# Strict base64 decode + canonical encode for `IrScalar::Bytes`. The payload is
# stored DECODED internally and re-encoded with the canonical STANDARD (padded)
# alphabet on serialize, so two non-canonical encodings of the same bytes cannot
# hash differently across the JS/Rust front doors (§2.5). The strict decoder
# refuses an invalid alphabet / wrong padding at LOAD, before any checksum.
base64 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Migration-first P2b: `fold_to_field_defs` preserves the createTable column ORDER
# (the keystone parity compares serialized FieldDef maps, so a sorted-vs-declared
# order would false-mismatch). An insertion-ordered map is the clean carrier.
indexmap = { workspace = true }
# Schema-authority P2: the engine ADOPTS the shared schema core for its
# schema-DESCRIPTION layer (the DSL→SQL type map + the DDL-shape vocabulary +
# sentinel codec + shape enums), replacing its own v1-SUBSET re-implementation.
# This is what gives the declarative differ FULL type capability
# (vector/encrypted/mask/geoPoint/literal) by reuse — the engine builds an SDK
# `def` from its FieldDescriptor and delegates the type/DDL spelling to this
# crate. The engine's LIFECYCLE (journal/guard/executor/rollback/…) and its
# snapshot-diff/introspection surface stay engine-owned and sit ON TOP of this.
zero-migrate-schema = { workspace = true }
# The wire contract (redesign step 3a): MigrationIr, the closed Op enum, the
# closed Expr AST, IrScalar, the precondition/probe vocabulary, the typed-id
# machinery, the canonical checksum, the fail-closed load gate's policy-free half,
# and the STRUCTURAL validator. The engine re-exports the whole surface
# (`pub use zero_migrate_ir as ir;` + flattened root re-exports) so downstream
# `zero_migrate::{MigrationIr, Op, …}` names are unchanged.
zero-migrate-ir = { workspace = true }
# The SQL security layer (redesign step 3b): the `pg_query`-backed parse-time
# deny-list, cross-schema confinement, statement classification, and operational
# advisories (`SqlGuard`, `GuardConfig`, `analyze`, `classify`, `Advisory`,
# `Severity`, the `flags_for`/`guard_for` free fns, `check_ir_data_security_policy`,
# `check_raw_view_body_text`, the `tree_walk` shape helpers). The engine
# re-exports this surface at its root so `zero_migrate::{SqlGuard, GuardConfig, …}`
# names are unchanged.
zero-migrate-guard = { workspace = true }
# The canonical version→id derivation (loader §6.2) builds a UUIDv7-SHAPED id
# (numeric version in the high 48 bits) and base62-encodes it via
# `crate::id::uuid_to_base62` (the vendored typed-id module), which takes a
# `&uuid::Uuid`.
uuid = { workspace = true }
# The Postgres apply flow (journal + apply) runs async on compio — ZERO tokio,
# per the platform invariant — but always through the driver-neutral `PgSession`
# seam. This standalone ships NO native Rust PG driver; the seam is fed by the
# napi/Node host (production) or the in-crate recording driver (tests).
compio = { workspace = true }
# SQLite migration backend (design 2026-06-19 §2.1.1). The migration connection
# is a DEDICATED, hardened, CDC-free rusqlite Connection — it does NOT reuse
# plugin-db's data-plane SqliteSession. `bundled` pins SQLite 3.51.3 (the
# version floor for DEFENSIVE/TRUSTED_SCHEMA/RETURNING/window-functions and the
# authorizer `zDb`-on-DROP_TABLE semantics the journal-immutability proof needs,
# §2.9). No `preupdate_hook`/vec0: the migration conn is CDC-free + extension-
# free to creator SQL (§2.1.1).
# `load_extension` is needed for `Connection::load_extension_disable()` — the
# real API (NOT a DbConfig variant) that disables extension loading at open
# (§2.1.1). Enabling the feature does NOT load any extension; it just exposes the
# enable/disable toggle, and we use it only to DISABLE.
rusqlite = { workspace = true, features = ["bundled", "load_extension"] }
# The migration actor's single-writer queue (zero-tokio: same spawn-thread +
# flume shape as plugin-db's SqliteSession, but a second security-scoped actor).
flume = { workspace = true }
# `FutureExt::catch_unwind` for panic-safe shadow-DB teardown (C1) — mirrors the
# runtime crate's panic_util seam. Zero tokio: `futures` is the executor-agnostic
# combinator crate, not a runtime.
futures = { workspace = true }
tracing = { workspace = true }
# CLI arg parsing for the `zero-migrate` bin (Phase 3, design §9). clap is
# SYNC — zero tokio — so it does not violate the zero-tokio invariant; the
# `env` feature backs the `--database-url` / `DATABASE_URL` env fallback.
# Optional so a pure-library embedder (`--no-default-features`) never compiles
# it; the `js-cli` / `standalone-cli` features pull it in for the CLI bins.
clap = { workspace = true, optional = true }
# The `zero-migrate` bin sets up a `warn`-level env-filtered subscriber
# on startup (replacing the former host `observability::init_tracing`).
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# The `zero-migrate.toml` project config for the CLI (DX parity). SYNC + leaf —
# zero tokio. Only the bin reads it; the library trust domain is unchanged.
toml = { workspace = true }

# ---------------------------------------------------------------------------
# The operator-side CLI binary (Phase 3, design §9). compio (NOT tokio): the
# bin's `#[compio::main]` drives the same compio-native `connect`/executor the
# library uses. `main` is a THIN arg-parser that delegates to the
# `guard::platform_runner::run_*` functions — the ONLY place the
# `PlatformCapability` token is minted (the §5 trust invariant).
# ---------------------------------------------------------------------------
[[bin]]
name = "zero-migrate"
path = "src/bin/zero-migrate.rs"
required-features = ["standalone-cli"]

[dev-dependencies]
# Executor tests hit a REAL Postgres (faithful-e2e); the compio test macro
# drives the async apply flow on the compio runtime.
compio = { workspace = true }
# Per-test temp SQLite files for the confinement/journal/atomic-apply proofs
# (design §3 P2 gate — every confinement claim proven on a REAL temp-file
# SQLite, never a shim). Auto-cleaning; workspace-pinned.
tempfile = { workspace = true }
# The guard-vendor-lower behaviour-lock tests (moved in from `guard/mod.rs` at
# step 3b) mint the operator-gated Platform/Trusted profiles via
# `OperatorCapability::for_test`, which the ir leaf exposes behind `test-support`.
zero-migrate-ir = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
