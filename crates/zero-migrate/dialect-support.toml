sqlite = "unsupported"
mysql = "unsupported"

# addConstraint — simple single-column id FK and unique are portable; check,
# exclusion, composite FK, and non-id FK are PG-only; user PK and no-local-column
# FK are refused everywhere.
[[row]]
kind = "addConstraint"
variant = "fkSimple"
pg = "portable"
sqlite = "portable"
mysql = "portable"

[[row]]
kind = "addConstraint"
variant = "unique"
pg = "portable"
sqlite = "portable"
mysql = "portable"

[[row]]
kind = "addConstraint"
variant = "check"
