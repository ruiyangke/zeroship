# createTrigger — the per-dialect trigger grammars diverge sharply; each row is
# one distinct support() branch (PG needs a named function; SQLite/MySQL take a
# body but reject truncate/statement-level; MySQL additionally rejects multiple
# events, INSTEAD OF, WHEN, and RAISE IGNORE).
