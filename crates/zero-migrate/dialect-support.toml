variant = "fkComposite"
pg = "portable"
sqlite = "portable"
mysql = "portable"

[[row]]
kind = "addConstraint"
variant = "fkNonId"
pg = "portable"
sqlite = "portable"
mysql = "portable"

# fkNotValid — NOT VALID online constraint adoption on a FK; PG-only (SQLite/MySQL
# have no NOT VALID). Composite/non-id notValid FKs collapse to this variant (all
# PG-only), keeping op-level Support::decision() == validate.
[[row]]
kind = "addConstraint"
variant = "fkNotValid"
pg = "portable"
sqlite = "unsupported"
mysql = "unsupported"

[[row]]
kind = "addConstraint"
variant = "fkNoLocalColumn"
pg = "unsupported"
sqlite = "unsupported"
mysql = "unsupported"

# insert: exact conflict targets are native on PostgreSQL and SQLite. MySQL can
# preserve exact row effects for guarded doUpdate, but has no exact targeted
# doNothing form.
[[row]]
kind = "insert"
variant = "base"
pg = "portable"
sqlite = "portable"
mysql = "portable"

[[row]]
