# ─────────────────────────────────────────────────────────────────────────────
# Payload-DEPENDENT ops — one row per distinct Support::decision() branch.
# ─────────────────────────────────────────────────────────────────────────────

# createTable — the base form is portable; several payload features push it
# PostgreSQL-only (partitioning, PG-only index features, nextval defaults,
# identity({always:true}), and non-portable by-default identity).
[[row]]
kind = "createTable"
variant = "base"
pg = "portable"
sqlite = "portable"
mysql = "portable"

[[row]]
kind = "createTable"
variant = "partitioned"
pg = "portable"
sqlite = "unsupported"
mysql = "unsupported"

[[row]]
kind = "createTable"
variant = "partitionedCollapse"
pg = "portable"
sqlite = "transparentDegradable"
mysql = "transparentDegradable"

[[row]]
kind = "createTable"
variant = "pgOnlyIndexFeature"
pg = "portable"
sqlite = "unsupported"
mysql = "unsupported"

[[row]]
kind = "createTable"
variant = "nextvalDefault"
pg = "portable"
sqlite = "unsupported"
mysql = "unsupported"

[[row]]
kind = "createTable"
variant = "identityAlways"
pg = "portable"
sqlite = "unsupported"
mysql = "unsupported"

[[row]]
kind = "createTable"
variant = "nonportableByDefaultIdentity"
pg = "portable"
sqlite = "unsupported"
mysql = "unsupported"

