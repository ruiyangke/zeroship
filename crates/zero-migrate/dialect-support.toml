# dialect-support.toml — the single-source dialect-support sidecar (DSL redesign
# Phase 0, slice S0.1).
#
# WHAT: one hand-authored row per (op-kind, variant) recording that token's
# DISPOSITION on each of the three dialects (postgres / sqlite / mysql). The
# generator (`packages/zero-migrate/scripts/gen-dialect-table.mjs`) reads this file and
# emits BOTH:
#   - crates/zero-migrate/src/model/dialect_table.rs (const lookup table)
#   - packages/zero-migrate/src/generated/dialect-table.ts        (the TS mirror)
# Regenerate with: `pnpm --filter zero-migrate gen:dialect-table`, then
# commit both generated artifacts.
#
# DISPOSITION vocabulary (per (row, dialect)):
#   portable             core construct that renders/validates on this dialect
#   transparentDegradable P12 — native where supported, absence-tolerable elsewhere
#                         (NOT produced by the current engine; reserved for the
#                          redesign — no S0.1 row uses it yet)
#   vendor               vendor-tier construct, admitted only on this dialect
#   unsupported          refused on this dialect
#
# FAITHFULNESS (the whole point of S0.1): this file is HAND-AUTHORED to MIRROR the
# live `crates/zero-migrate/src/model/support.rs` `Support::decision()` +
# `Support::tier` behaviour, mapped decision→disposition as:
#   Supported + Core   -> portable
#   Supported + Vendor -> vendor
#   Unsupported        -> unsupported
# The Rust test `tests/dialect_table_faithfulness.rs` proves the generated table
# agrees with `Op::support()` for every op-kind × variant × dialect, so this file
# cannot silently drift from the engine's dialect truth. S0.1 is ADDITIVE — no
# consumer reads the table yet (that is S0.2).
#
# VARIANT keys: payload-independent ops carry a single `variant = "base"` row.
# Ops whose `Support::decision()` depends on a node/option carry one row per
# distinct support() branch, keyed by a descriptive variant token; the
# faithfulness test builds one representative op per row and checks agreement.

# ─────────────────────────────────────────────────────────────────────────────
# Payload-independent — fully portable on all three dialects.
# ─────────────────────────────────────────────────────────────────────────────

[[row]]
kind = "alterPrimaryKey"
variant = "base"
pg = "portable"
sqlite = "portable"
mysql = "portable"

