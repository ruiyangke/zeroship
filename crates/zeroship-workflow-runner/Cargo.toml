[package]
name = "zeroship-workflow-runner"
version = "0.1.0"
edition = "2021"
description = "Workflow execution: job delivery, collection, propagation and the runner host"

[dependencies]
zeroship-bundle = { workspace = true }
zeroship-core = { workspace = true }
zeroship-storage = { workspace = true }
zeroship-workflow = { workspace = true }
zeroship-workflow-client = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
compio = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The workflow-typed fixture adapters over the plain workflow testkit.
zeroship-workflow-fixtures = { workspace = true }
zeroship-workflow-testkit = { workspace = true }
zeroship-testkit = { workspace = true }
zeroship-data-orm = { workspace = true }
compio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
zeroship-workflow-manager = { workspace = true }
zeroship-storage = { workspace = true, features = ["s3"] }
compio-s3 = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
tempfile = { workspace = true }
libc = { workspace = true }

[lints]
workspace = true
