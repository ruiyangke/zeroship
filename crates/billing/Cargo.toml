[package]
name = "appbase-billing"
version = "0.1.0"
edition = "2024"
description = "Billing, pricing, and spending limits for appbase"

[dependencies]
appbase-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt"] }

[lints]
workspace = true
