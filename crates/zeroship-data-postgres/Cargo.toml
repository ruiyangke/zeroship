[package]
name = "zeroship-data-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The PostgreSQL vendor tier of the data plane: the driver-facing backend, its catalog introspection, row decoding, error classification, session SQL and advisory-lock lease. This is the ONLY crate below the adapter permitted to name compio-postgres."

[dependencies]
# The driver. Naming it here is the point of the crate: `tests/vendor_embedding_gate.sh`
# refuses a `compio_postgres::` type in any signature outside the vendor tier, so
# every other crate reaches PostgreSQL through the contracts in
# `zeroship-data-core` instead.
compio-postgres = { workspace = true, features = ["with-uuid-1"] }
compio = { workspace = true }

zeroship-data-core = { workspace = true }
zeroship-schema = { workspace = true }
zeroship-core = { workspace = true }

serde_json = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
# The snapshot path hashes dump artifacts. It is OPTIONAL and tied to
# `test-helpers` rather than a dev-dependency: the code that calls it sits behind
# `cfg(feature = "test-helpers")` in the LIB, and a dev-dependency is linked only
# into test and bench targets - so a dev-dep here compiles for `cargo test` and
# fails for `cargo check --features test-helpers`.
sha2 = { workspace = true, optional = true }

[features]
# Mirrors the adapter's flag. It must be FORWARDED rather than merely declared:
# the capability traits this crate impls (`SchemaIntrospect`, `Backup`) are
# themselves feature-gated in data-core, and a `cfg(test)` here names THIS
# crate's test build, never data-core's feature. Impl and trait must therefore
# agree on the feature alone.
test-helpers = ["zeroship-data-core/test-helpers", "dep:sha2"]

[dev-dependencies]
# Live-PostgreSQL fixtures provision through the migration service.
zeroship-migrate-server = { workspace = true }
