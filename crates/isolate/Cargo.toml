[package]
name = "appbase-isolate"
version = "0.1.0"
edition = "2024"
description = "V8 isolate management for appbase — actor model, pool, CPU metering"

[dependencies]
appbase-core = { path = "../core" }
deno_core = "0.396.0"
deno_error = "0.7"
deno_fetch = "0.267.0"
deno_net = "0.235.0"
deno_web = "0.274.0"
deno_webidl = "0.243.0"
deno_permissions = "0.102.0"
deno_tls = "0.230.0"
deno_io = "0.153.0"
deno_fs = "0.153.0"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
appbase-plugins = { path = "../plugins" }

[[bench]]
name = "qps_bench"
harness = false

[lints]
workspace = true
