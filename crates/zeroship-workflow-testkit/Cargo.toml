[package]
name = "zeroship-workflow-testkit"
version = "0.1.0"
edition = "2021"
description = "Dev-only workflow fixtures: the platform database, journal seeding, placement and the manager queue"
publish = false

# A workspace member so its own tests run in the ordinary workspace suite and
# every dependency is pinned by `workspace = true`. Consumers reach it only
# through a `[dev-dependencies]` entry, so the testcontainers and database
# fixtures it carries stay off every shipped normal edge. It is classified
# `class = "test-dev-tool"`.

[[package.metadata.zeroship-config.targets]]
target = "zeroship-workflow-testkit"
class = "test-dev-tool"
reason = "Dev-only workflow fixtures; reached only through dev-dependencies."

[dependencies]
async-trait = { workspace = true }
compio = { workspace = true }
compio-postgres = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
zeroship-bundle = { workspace = true }
zeroship-core = { workspace = true }
zeroship-data-orm = { workspace = true }
zeroship-testkit = { workspace = true }
zeroship-workflow-manager = { workspace = true }

[lints]
workspace = true