[package]
name = "zeroship-kv-v8"
version = "0.1.0"
edition = "2021"
description = "V8 binding for zeroship-kv: env.kv primitives and platform usage metering"
# Integration suites are modules of the one `tests/main.rs` target; a new tests/integration/<name>.rs is compiled by nothing until tests/integration/mod.rs declares it.
autotests = false

[dependencies]
zeroship-id = { workspace = true }
zeroship-kv = { workspace = true }
zeroship-runtime = { workspace = true }
zeroship-runtime-macros = { workspace = true }
zeroship-metering = { workspace = true }
serde_json = { workspace = true }
v8 = { workspace = true }

[dev-dependencies]
zeroship-kv = { workspace = true, features = ["redis", "redb"] }
zeroship-core = { workspace = true }
compio = { workspace = true }
tempfile = { workspace = true }
zeroship-testkit = { workspace = true }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
