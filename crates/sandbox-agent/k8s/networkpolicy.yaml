# NetworkPolicy for sandbox-agent Pods.
#
# Threat model: a /exec invocation lands attacker code inside the
# microVM. The libkrun kernel boundary protects the host kernel, but
# we still want to:
#
#   1. Block lateral traffic from one sandbox to another.
#   2. Block egress to the cluster control-plane (kube-apiserver,
#      etcd) and to pod-network metadata services.
#   3. Allow only the controller's source CIDR to reach :7777.
#   4. Allow Prometheus to scrape :7777/metrics.
#
# This policy assumes:
#   - Sandbox Pods carry the label `app.kubernetes.io/name=sandbox-agent`.
#   - The controller runs in namespace `zeroship-control` with label
#     `app.kubernetes.io/name=controller`.
#   - Prometheus runs in namespace `monitoring` with label
#     `app.kubernetes.io/name=prometheus`.
#
# The CNI plugin must support NetworkPolicy. k3s ships flannel which
# does NOT support NetworkPolicy out of the box — install Calico or
# Cilium for production, or use k3s with `--flannel-backend=none` and
# bring your own CNI. See docs/runbooks/sandbox-agent.md.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-agent-default
  namespace: sandboxes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandbox-agent
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Controller → agent on :7777
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zeroship-control
          podSelector:
            matchLabels:
              app.kubernetes.io/name: controller
      ports:
        - protocol: TCP
          port: 7777

    # Prometheus → agent on :7777 (scrapes /metrics)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 7777

  egress:
    # DNS resolution. Without this nothing — including pip/npm —
    # can resolve hostnames. Restricted to kube-dns/CoreDNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Outbound HTTPS to the public internet (npm install, pip install,
    # AI provider APIs). Explicitly NOT allowed: the cluster Pod CIDR,
    # the Service CIDR, and link-local metadata (169.254.169.254).
    # Adjust the except list to match your cluster's CIDRs.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8       # typical pod/service CIDR
              - 172.16.0.0/12    # rfc1918
              - 192.168.0.0/16   # rfc1918
              - 169.254.0.0/16   # link-local incl. cloud metadata IMDS
              - 100.64.0.0/10    # CGNAT (kops, EKS)
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
