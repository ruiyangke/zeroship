[package]
name = "zeroship-sandbox-agent"
version = "0.1.0"
edition = "2021"
description = "In-VM agent (PID 1) for zeroship sandbox microVMs — exposes /exec, /files, /tree to the controller over HTTP."
build = "build.rs"

[lib]
name = "zeroship_sandbox_agent"
path = "src/lib.rs"

[[bin]]
name = "sandbox-agent"
path = "src/main.rs"

[dependencies]
# Shared port allow/deny constants used by both the controller and the
# agent (preview-URL § II.1 / I9 — defense-in-depth port deny).
zeroship-core = { workspace = true }

# Workspace runtime: compio (io_uring) + ntex (HTTP). Same stack as
# the controller so the project has one async story end-to-end.
compio = { workspace = true }
ntex = { workspace = true }

# Serde
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }

# Crypto. Ed25519 verifier holds the controller's PUBLIC key only —
# the private key never enters the VM. `subtle`/`zeroize` are no
# longer needed (no secret material on the agent side); body hash
# still uses sha2 for the canonical-string body coverage.
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
lru = { workspace = true }

# Observability — workspace tracing facade. Subscriber init lives in
# `zeroship_core::observability::init_tracing` (pluggable format via
# ZEROSHIP_LOG_FORMAT).
tracing = { workspace = true }

# Request ID generation (UUIDv7 — sortable, time-bearing).
uuid = { workspace = true }

# OS bits — signals (SIGCHLD reaper), waitpid, O_NOFOLLOW, killpg.
nix = { version = "0.29", default-features = false, features = ["signal", "process", "fs", "dir"] }
libc = { workspace = true }

# HTTP/1.1 client for the preview proxy's agent→app forward leg
# (zsbx-agent → 127.0.0.1:{port}). Sync; called inside
# `compio::runtime::spawn_blocking` so the ntex worker stays
# responsive. No TLS feature — loopback only.
ureq = { version = "2", default-features = false, features = ["json"] }

# WebSocket Upgrade parsing for the preview proxy (Phase 2). The WS
# port runs a tiny compio raw-TCP listener that parses just the HTTP
# request-head with httparse, verifies the V1_1_Ws canonical, and
# splices the two TCP sockets after a 101. No frame parsing.
httparse = { workspace = true }

# `futures_util::future::{select, join}` — used by the WS Upgrade
# splice loop (race the lifetime cap against the two splice halves).
# `default-features = false` keeps it lean.
futures-util = { version = "0.3", default-features = false }

[lints]
workspace = true

# ──── e2e example only — not pulled into the production binary ────
[dev-dependencies]
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[[example]]
name = "e2e_k3s"
path = "examples/e2e_k3s.rs"

[[example]]
name = "exploit_k3s"
path = "examples/exploit_k3s.rs"
