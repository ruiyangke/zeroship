[package]
name = "zeroship"
version = "0.1.0"
edition = "2021"
description = "zeroship CLI — build, serve, deploy, inspect"

[[bin]]
name = "zeroship"
path = "src/main.rs"

[dependencies]
zeroship-core = { workspace = true }
zeroship-runtime = { workspace = true }
zeroship-plugin-db = { workspace = true }
zeroship-plugin-storage = { workspace = true }
zeroship-plugin-kv = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# P5.5 PR 8 — `migrate.rs` scanner tests create a temp source tree
# rooted in `tempdir()`; the workspace already pulls `tempfile` for
# other crates, so we re-use the same dep without adding a new one.
tempfile = { workspace = true }

[lints]
workspace = true
