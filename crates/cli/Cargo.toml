[package]
name = "appbase"
version = "0.1.0"
edition = "2024"
description = "The appbase CLI — compile, serve, and develop full-stack apps"

[[bin]]
name = "appbase"
path = "src/main.rs"

[dependencies]
appbase-core = { path = "../core" }
appbase-metering = { path = "../metering" }
appbase-enforcement = { path = "../enforcement" }
appbase-plan = { path = "../plan" }
appbase-plugins = { path = "../plugins" }
appbase-server = { path = "../server" }
appbase-billing = { path = "../billing" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
toml = "1.1.1"

[lints]
workspace = true
