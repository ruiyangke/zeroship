[package]
name = "zeroship"
version = "0.1.0"
edition = "2021"
description = "zeroship CLI — build, serve, deploy, inspect"

[[package.metadata.zeroship-config.targets]]
target = "zeroship"
class = "creator-cli"
reason = "Creator CLI and local serve flow are outside the server configuration overlay."

[[bin]]
name = "zeroship"
path = "src/main.rs"

[dependencies]
zeroship-core = { workspace = true }
uuid = { workspace = true }
zeroship-runtime = { workspace = true }
zeroship-plugin-db = { workspace = true }
zeroship-plugin-storage = { workspace = true, features = ["s3"] }
zeroship-plugin-kv = { workspace = true }
zeroship-plugin-workflow = { workspace = true }
zeroship-metering = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem", "rand_core"] }
hex = { workspace = true }
rand = "0.8"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
