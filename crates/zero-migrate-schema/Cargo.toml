[package]
name = "zero-migrate-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared schema-authority core — DDL builders, diff classifier, live introspection, sentinel codec, and schema-shape descriptors. Reused by the migration engine (write/diff/generate) and the data plane (read/introspect). Leaf crate: NO v8, NO runtime, NO crypto."

[dependencies]
# Schema-shape values (`Value`) flow through every DDL builder + the diff
# classifier; the introspection rows are decoded into JSON-ish descriptors.
serde_json = { workspace = true }
# NOTE: the live-catalog INTROSPECTION helpers (`diff::read_live_schema`,
# `diff::estimate_row_count`, the `SchemaError` wrapper) required a native compio
# PG driver to EXECUTE. That driver was a monorepo private crate and is out of
# scope for this standalone (host-pg + SQLite only), so this crate ships the
# write/diff/describe layer ONLY (DDL builders in `query`, the diff classifier +
# metadata TYPES in `diff`, `mask_codec`, `descriptors`, `fts_sqlite`) — it names
# no PG-driver type and pulls no PG driver. The introspection-EXECUTION code stays
# as `#[cfg(feature = "introspect")]` dead code that this manifest never enables.
# The migration engine consumes only this write/diff profile: it does its OWN
# introspection over the driver-neutral `PgSession` seam
# (`zero-migrate/src/apply/backend/postgres/drift.rs`) and never calls
# `read_live_schema`.
# `sha2` produces the deterministic 8-char base32 fingerprint the DDL
# builder appends when a generated index name exceeds the 60-byte
# NAMEDATALEN headroom (`query::index_name`). This is a NAME-hashing use
# (stable + roughly-uniform), NOT key/AEAD crypto — it touches no key
# material and does not implicate the trust domain the leaf-purity
# constraint protects. The migration engine already depends on `sha2`.
sha2 = { workspace = true }

[lints]
workspace = true
