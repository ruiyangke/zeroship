[package]
name = "zeroship-data-core"
version = "0.1.0"
edition = "2021"
description = "The data plane's domain tier: the typed error hierarchy every backend translates INTO, and the immutable identity of one env.db binding. Names no database driver, no V8, and no runtime - the translators live in the vendor crates and the OpError lowering lives in the adapter."

# ---------------------------------------------------------------------------
# WHAT THIS MANIFEST IS FOR.
# ---------------------------------------------------------------------------
#
# Decision 5 of docs/proposals/2026-08-31-data-crate-shape.md - "the core and
# every other non-vendor crate never embed a vendor directly" - is enforced HERE
# rather than by review. `compio-postgres`, `rusqlite`, `v8` and
# `zeroship-runtime` are absent below, so naming `compio_postgres::Error` in this
# crate is E0433 at compile time, for everyone, forever.
#
# THE HOLE THIS BLOCK DESCRIBED IS CLOSED, AND THE DESCRIPTION WAS STALE.
#
# Until 2026-09-02 the paragraph here said the fence leaked: that
# `zeroship-schema` declared `compio-postgres` itself, that
# `crates/zeroship-schema/src/error.rs:31` was `pub source: compio_postgres::Error`,
# and that this crate was therefore "vendor-free in SPELLING rather than in its
# dependency closure". Re-measured, none of that is true now:
#
#   cargo tree -p zeroship-data-core -e normal | grep -c compio-postgres  -> 0
#   ... rusqlite -> 0, zeroship-runtime -> 0, v8 -> 0
#
# `zeroship-schema`'s own direct dependencies are serde_json, sha2 and
# zeroship-core; its src/ names no driver, and error.rs has no `source` field of
# any kind. The claim survived in this manifest, in #97 and in #101 after it
# stopped being true, which is why it is corrected here rather than deleted -
# the citation was precise, checkable, and wrong, and that is worth recording.
#
# THE REASONING WAS RIGHT EVEN THOUGH THE FACT EXPIRED. E0433 stops a crate
# SPELLING a path; it says nothing about a crate ACQUIRING one transitively,
# with no line of source changing. A manifest cannot police its own closure.
# `tests/data_crate_closure_gate.sh` now does: it asserts the normal closure of
# this crate and zeroship-data-query-builder reaches none of the four names
# above, and it is mutation-proved - adding `compio-postgres` here turns it red
# naming both the crate and the edge.
[dependencies]
# `DbError`'s Display/Debug and the descriptor-shaped payloads it carries.
serde_json = { workspace = true }
# `impl From<PerAppRoleNameError> for DbError` - per-app role naming is a
# platform vocabulary type, not a driver type.
zeroship-core = { workspace = true }
# `impl From<QueryError>` and `impl From<MaskSentinelError>`, both unconditional
# `impl` blocks, which is why this edge cannot be feature-gated away. See the
# hole described above.
zeroship-schema = { workspace = true }
# The `encryption` module, moved here from `zeroship-plugin-db` on 2026-09-02.
# It had to leave the adapter before either backend can be its own crate: both
# name `KeyStore` and `LocalKeySource`, so extracting a vendor first would make
# it depend on the crate that depends on it.
#
# Five crates, all PURE COMPUTE - no driver, no runtime, no V8 - so none of them
# widens what this tier is allowed to know. Randomness comes from
# `aes_gcm::aead::OsRng`; there is deliberately no `rand` here. (A first scan
# reported one: all four hits were the string literal "openssl rand -hex 32" in
# an error hint, which a comment-stripper cannot remove.)
aes-gcm = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
zeroize = { version = "1", features = ["alloc", "derive"] }

[dev-dependencies]
# `encryption::keys`'s tests build a runtime to drive the key-source futures.
# A DEV dependency only: the five `compio::runtime::Runtime::new()` calls are
# all inside `keys.rs`'s `#[cfg(test)] mod tests`, so production here still
# names no runtime and this crate's "no driver, no runtime, no V8" claim holds
# for everything it ships.
compio = { workspace = true }

[features]
# `DbBinding::cold_start` only. It was gated `#[cfg(any(test, feature =
# "test-helpers"))]` while it lived in `zeroship-plugin-db`, where `test` was
# true for that crate's own unit tests. Across a crate boundary `cfg(test)` is
# THIS crate's test build and never fires for a consumer, so the `test` arm
# would have silently become dead and the constructor unreachable from every
# test that uses it. The feature is now the whole gate.
test-helpers = []

[lints]
workspace = true
