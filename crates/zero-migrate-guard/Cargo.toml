[package]
name = "zero-migrate-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The zero-migrate SQL security layer: the pg_query(libpg_query)-backed parse-time deny-list, cross-schema confinement, statement classification, and operational advisories. Owns the ONLY C dependency on the non-SQLite path (libpg_query). Depends on the zero-migrate-ir wire contract and its open backend identity; does NOT depend on the engine."

[dependencies]
# Parse SQL with the REAL Postgres parser (libpg_query bindings) so the security
# guard sees exactly what Postgres would execute. A deny-list must not misparse
# or miss a dangerous statement; a pure-Rust parser (sqlparser-rs) is incomplete
# for exotic PG syntax, which is a security gap. pg_query carries a C build dep
# (libpg_query) — this crate is the ONLY owner of that C dep on the non-SQLite
# path.
pg_query = "6"
# The guard walks the serialized `pg_query` parse tree and builds structured
# advisory/classification values as JSON-ish data.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The wire contract: the closed `Op`/`MigrationIr` types the IR-shape data-security
# checks read, the policy vocabulary (`TrustProfile`/`SchemaScope`/
# `VendorCapabilities`/`OperatorCapability`/`DestructiveOps`), and the
# open `DialectId` identity the guard uses for provenance and fail-closed checks.
zero-migrate-ir = { workspace = true }
# The backend CONTRACT. `MigrationGuard`, `GuardConfig`, `GuardError`, `GuardOutcome`,
# `ParseError` and the `Advisory` vocabulary live there rather than here, because a
# vendor crate must be able to implement the trait, and a vendor crate may not depend
# on this one - `libpg_query` would follow it down and land under the two dialects that
# build without it today. This crate supplies PostgreSQL's IMPLEMENTATION of that
# contract, and the parser it needs.
zero-migrate-backend = { workspace = true }
# The Policy Decision Point: the unforgeable EffectivePolicy the guard now queries
# (grants/obligations) for its capability + data-security gate, plus the KnobKey/
# KnobValue vocabulary and the object model (ObjectName). The guard holds an
# EffectivePolicy and asks it — it no longer reads a raw VendorCapabilities bit.
zero-migrate-policy = { workspace = true }

[lints]
workspace = true
