[package]
name = "zeroship-runtime-macros"
version = "0.1.0"
edition = "2024"
description = "Proc macros for the zeroship runtime (#[v8_class], Vec<u8> ArrayBuffer bridge)"

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
# Insta snapshot tests for the v8_class proc-macro's emit. Locks the
# no-attribute path against drift (design `docs/proposals/macro-v8-state.md`
# §5.1 / §6.4) and the new `#[v8_state_marker]` path against unintended
# changes. Bumps require `cargo insta accept` with reviewer audit.
insta = "1"
# Unit tests parse the macro output back through syn for round-trip
# verification — so the snapshot stays human-readable rather than a
# whitespace-fragile token blob.
prettyplease = "0.2"

[lints]
workspace = true
