[package]
name = "appbase-runtime-macros"
version = "0.1.0"
edition = "2024"
description = "Proc macros for the appbase runtime (#[appbase_op], Vec<u8> ArrayBuffer bridge)"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[lints]
workspace = true
