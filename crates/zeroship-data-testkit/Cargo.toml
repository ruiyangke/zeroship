[package]
name = "zeroship-data-testkit"
version = "0.1.0"
edition = "2021"
description = "Dev-only data-plane fixtures: harness bindings, role ladders and the platform corpus"
publish = false

# A workspace member so its own tests run in the ordinary workspace suite and
# every dependency is pinned by `workspace = true`. It speaks plain data and
# leaf crates only, so a crate whose own unit tests exercise the data plane can
# reach it through `[dev-dependencies]` without a duplicate-type cycle. It is
# classified `class = "test-dev-tool"`, so no shipped binary may carry it in its
# normal closure.

[[package.metadata.zeroship-config.targets]]
target = "zeroship-data-testkit"
class = "test-dev-tool"
reason = "Dev-only data-plane fixtures; reached only through dev-dependencies."

[dependencies]
compio-postgres = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
zeroship-core = { workspace = true }
zeroship-migrate = { workspace = true }
zeroship-migrate-postgres = { workspace = true }
zeroship-migrate-server = { workspace = true }
zeroship-migrate-sqlite = { workspace = true }

[lints]
workspace = true