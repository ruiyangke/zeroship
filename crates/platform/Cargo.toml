[package]
name = "zeroship-platform"
version = "0.1.0"
edition = "2024"
description = "Multi-tenant platform layer — control plane, metering, billing, enforcement, HTTP server"

[dependencies]
# Runtime (V8 isolate pool)
zeroship-runtime = { path = "../runtime" }

# Async
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Runtime-agnostic channels (tokio ↔ compio bridge)
flume = "0.11"
# compio runtime for V8 worker threads
compio = { version = "0.18", features = ["time", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "sqlite", "postgres"] }

# HTTP server
axum = { version = "0.8", features = ["ws", "macros"] }
bytes = "1"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }
tracing = "0.1"

# Utilities
time = "0.3"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
