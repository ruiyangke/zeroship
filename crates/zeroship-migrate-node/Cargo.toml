# This crate is a full member of the root workspace: it inherits
# the shared `[workspace.package]` metadata + `[workspace.lints]` and resolves against
# the single root lockfile. `cargo build -p zeroship-migrate-node` (or `napi build`)
# compiles it, and so does a plain workspace-wide `cargo build` / `cargo test`.
#
# THIS COMMENT CLAIMED A PROTECTION THAT NEVER EXISTED, from `79b339aa7` until
# 2026-09-04. It said: "The root keeps it OUT of the default build/test flow via
# `default-members`, so a plain `cargo build`/`cargo test` never pulls the napi
# toolchain path." Every clause of that is false, and checking took one command:
# `grep -n default-members Cargo.toml` at the repo root exits 1. The root declares
# `members = ["crates/*", "libs/*"]` with `resolver = "3"` and an `exclude` list of
# three unrelated paths; `cargo metadata` puts this package in BOTH
# `workspace_members` and `workspace_default_members`, 44 of 44 either way.
#
# The claim was not merely inaccurate, it was load-bearing in the wrong direction: it
# described the reason a workspace-wide `cargo test` was safe, while that command was
# in fact selecting a package that could not link. Two other documents repeated it
# (`docs/proposals/2026-07-11-migrate-napi-shell-design.md`,
# `docs/proposals/2026-07-12-zero-migrate-redesign-plan.md`) and two open-question
# lists had already flagged the mismatch without anyone acting on it. A comment
# asserting an isolation mechanism is worth less than nothing when the mechanism is
# absent, because it stops the next reader looking.
#
# It is recorded rather than quietly deleted so the belief is closed instead of
# deferred. The isolation is not restored and is not wanted: the package builds and
# tests as a default member, which is what `tests/test_target_packages.txt` and
# `tests/shipped_config_gate.sh` both now rule on.
[package]
name = "zeroship-migrate-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Node/Bun N-API addon for zeroship-migrate: host-driven (pg/mysql2) apply over the dialect-neutral driver::SqlSession seam, zero tokio, zero io_uring, cross-platform .node"
publish = false

# A `cdylib` is terminal (no Rust crate can depend on it) → this is necessarily a
# leaf, so the graph stays acyclic (`zeroship-migrate-node → zeroship-migrate` is
# the only edge). `@napi-rs/cli` compiles it to `index.node` + `index.d.ts`.
# `cdylib` is the shipped `.node`; `rlib` is added so the crate's own Rust
# integration tests (`tests/`) can link the library (a bare `cdylib` cannot be
# depended on by a test binary). The `rlib` is a build-time convenience only — the
# published artifact is the `cdylib` `.node`.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The napi entrypoints are ONLY reachable when compiled by `napi build` (which
# defines `napi_build_metadata` / links against the Node ABI). `napi` gates them
# (`#[napi]` fns, ThreadsafeFunction, JsDeferred).
#
# **A bare `cargo test -p zeroship-migrate-node` WORKS**, with `napi` ON. Two
# earlier versions of this comment were both wrong, in opposite directions: one
# said the bare command worked when it did not, and its correction said no test
# binary could ever link the Node ABI. The second was true of the manifest as it
# then stood, not of the linker. Measured at 1144d787c: the bare command exited
# 101 with 1719 `undefined reference` lines, the first `napi_create_function`
# from src/bridge.rs:1222 in `_napi_rs_internal_register_status`.
#
# What resolves it is the `napi` entry in `[dev-dependencies]` below, which turns
# on `dyn-symbols`. Node ABI symbols are exported by the host process and resolve
# only at `.node` dlopen time; `dyn-symbols` replaces the extern block with a
# libloading-populated pointer table, so a test binary has nothing to resolve at
# link. `napi` therefore STAYS a default feature, and src/bridge.rs is compiled
# and type-checked by `cargo test` and by `cargo check --workspace` - which it
# never was before, because the only configuration that built was the one that
# excluded it.
#
# `--no-default-features` still builds the napi-free core and is still a valid
# way to compile this crate without the N-API surface, but it is NO LONGER
# REQUIRED and is no longer the recommended path: it type-checks 1486 fewer lines.
#
# No Rust test process may call an N-API function; it has no Node host. The
# platform corpus test launches the real CLI in a Node subprocess, while the
# package's Node tests exercise addon APIs directly through the real `.node`.
default = ["napi"]
napi = ["dep:napi", "dep:napi-derive"]

[dependencies]
# The core engine, host-callback path ONLY: NO compio (→ no io_uring → the .node
# is cross-platform), NO embedded V8. SQLite stays native (rusqlite bundled) inside
# the core; the host supplies PG/MySQL over the seam.
zeroship-migrate = { path = "../zeroship-migrate" }
# The PostgreSQL backend, named DIRECTLY rather than through a `zeroship-migrate`
# re-export. The apply and status/journal hosts below build `PostgresBackend` over
# the napi `pg` seam; the engine stopped re-exporting it when
# the execution half moved into this crate, and re-adding the re-export would be core
# naming a vendor crate outside its registry, which `core_names_no_vendor_crate`
# forbids. All three vendors are named the same way now.
zeroship-migrate-postgres = { path = "../zeroship-migrate-postgres" }
# The MySQL backend, named DIRECTLY rather than through a `zeroship-migrate` re-export.
# The apply host below builds `MysqlBackend` over the `mysql2` seam, and the
# engine no longer re-exports it: core naming a vendor crate outside its registry is
# what `core_names_no_vendor_crate` forbids, so the host names the vendor it wants.
zeroship-migrate-mysql = { path = "../zeroship-migrate-mysql" }
# The SQLite backend, named the same way and for the same reason. `apply_ir_sqlite` and
# its siblings below build `SqliteBackend` on the in-process rusqlite actor; the
# engine stopped re-exporting it when the execution half moved into this crate.
zeroship-migrate-sqlite = { path = "../zeroship-migrate-sqlite" }

# N-API 3, TOKIO-FREE by construction: default-features = false drops the
# ergonomic tokio-backed async (`async`/`tokio_rt`). `napi4` supplies the
# ThreadsafeFunction; `napi5` supplies `Env::create_function_from_closure`
# (the per-call `done` JS closure capturing the oneshot Sender) + Deferred;
# `napi6` supplies the BigInt bindings so the exact-integer
# domain (verb row counts, journal `event_seq`) crosses as a JS `bigint` — ending
# the `row_count: Option<f64>` vs `intStr`-string incoherence. `serde-json` lets a
# typed verb envelope carry the IR `ops` AST + a lowered `Migration` as a REAL JS
# value (not a re-serialized `*_json` string), so every verb request/response is a
# typed `#[napi(object)]` (`wire.rs`) — no more `Promise<string>`. Node/Bun both
# implement N-API ≥6. NO "async", NO "tokio_rt" — the `cargo tree` gate asserts zero
# tokio in the leaf.
napi = { version = "3", default-features = false, features = ["napi6", "serde-json"], optional = true }
napi-derive = { version = "3", optional = true }

# The tokio-free executor: `futures::executor::block_on` on a spawned std::thread
# per apply call, parked on a `oneshot::Receiver` fired cross-thread by the host
# `done` callback. futures-channel = oneshot; futures-executor =
# block_on. Workspace-pinned (0.3).
futures = { workspace = true }

# JSON marshaling for plan/generate/load-verify results returned as strings across
# the napi boundary (DB-free, sync entrypoints). Workspace-pinned.
serde = { workspace = true }
serde_json = { workspace = true }

# Engine diagnostics, collected at the HOST boundary and nowhere else. The core is
# a library and only emits through the `tracing` facade; the addon is the process
# edge, so it is the one place that may decide where those events go. `tracing` is
# here for `subscriber::with_default` (the thread-scoped install in `runtime.rs`),
# `tracing-subscriber` for the `fmt` collector + the fixed `Targets` filter. Both
# workspace-pinned; `tracing-subscriber` was declared at the root and consumed by
# nobody until now.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
zeroship-id = { workspace = true }
compio = { workspace = true }
compio-postgres = { workspace = true }
testcontainers = { version = "0.28", default-features = false, features = ["blocking", "watchdog"] }
toml = { workspace = true }
url = { workspace = true }

# The rollback verb is proven against a REAL temp-file SQLite database rather
# than a canned rowset, because the question is whether the reconstructed `down`
# reverses what apply did. Workspace-pinned, and test-only.
tempfile = { workspace = true }

# The Node ABI resolved through libloading instead of static externs, FOR TEST
# BINARIES ONLY. `napi_*` symbols are exported by the Node host and resolve only
# at `.node` dlopen time, so a test binary that links them fails with `undefined
# reference to napi_create_function`. `dyn-symbols` (napi 3.4.0 Cargo.toml:58 ->
# napi-sys/dyn-symbols) swaps the extern block for a libloading-populated function
# pointer table, so there is nothing to resolve at link. This is not an exotic
# path: napi-sys 3.0.1 src/lib.rs:5 gates on `any(target_env = "msvc", feature =
# "dyn-symbols")`, so it is the code that ALREADY SHIPS on x86_64-pc-windows-msvc.
#
# DECLARED ON THE DEV-DEPENDENCY, never routed through `[features]`, per
# xtask/tests/repository_architecture.rs. Under resolver v3 a dev-dependency's
# features unify into the normal edge WHENEVER A TEST TARGET IS IN THE UNIT GRAPH,
# so `cargo test` gets it and a `--lib`/`--bins` build does not. Measured: the
# shipped cdylib keeps 52 undefined `napi_*` symbols and a defined
# `napi_register_module_v1`; tests/napi_symbol_shape_gate.sh holds both halves.
#
# No Rust test process may call an N-API function. With no host loaded the napi-sys stub
# prints `Node-API symbol ... has not been loaded` to stderr and returns 1 for a
# `-> napi_status` fn and `mem::zeroed()` for every other return type - and
# `mem::zeroed()` of a `napi_status` reads as `napi_ok`, i.e. a false success with
# an uninitialised out-param. Tests of this boundary must use a real Node host,
# as the platform corpus subprocess and the package's Node tests do.
napi = { version = "3", default-features = false, features = ["napi6", "serde-json", "dyn-symbols"] }

[build-dependencies]
# `napi_build::setup()` needs NO Node headers at build time, so it is safe to run
# for both `napi build` and a plain `cargo test`.
#
# IT DOES NOT MAKE TEST BINARIES LINK, and this comment claimed otherwise until
# 2026-09-04 ("only emits cdylib link args (allow-undefined for the Node ABI
# symbols)"), which reads as an explanation for why undefined `napi_*` symbols are
# tolerated. Read in napi-build 2.2.4, the version Cargo.lock resolves: on Linux
# `setup()` matches `CARGO_CFG_TARGET_OS` and takes its `_ => {}` arm (src/lib.rs:39),
# emitting NO link args at all. The cdylib links only because GNU ld permits
# undefined symbols in `-shared` by default. The allow-undefined flags are macOS
# ONLY (src/macos.rs: `-undefined dynamic_lookup`) and are `rustc-cdylib-link-arg`,
# which by definition never reaches a test binary on any platform.
#
# What makes test binaries link is `napi/dyn-symbols` on the dev-dependency above.
napi-build = "2"

# The workspace source digest `buildInfo()` reports is folded here, at build time,
# from committed bytes only. Same hash the engine already uses for content
# addressing, so no new algorithm enters the tree.
sha2 = { workspace = true }
hex = { workspace = true }

# The `release`-profile settings for the shipped `.node` (`lto`, symbol strip) live
# in the ROOT workspace Cargo.toml `[profile.release]` — profile tables in a
# non-root workspace member are ignored by cargo, so they cannot live here.

[lints]
workspace = true
