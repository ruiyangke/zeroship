[package]
name = "zeroship-workflow-v8"
version = "0.1.0"
edition = "2021"
description = "V8 binding and local executor for zeroship workflows"
# One test target for the crate. `tests/main.rs` registers the tier modules and
# `tests/integration/mod.rs` each suite, so a new `tests/integration/<name>.rs`
# is compiled by nothing until it is declared there.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
zeroship-bundle = { workspace = true }
zeroship-workflow = { workspace = true }
zeroship-workflow-runner = { workspace = true }
tracing = { workspace = true }
zeroship-runtime = { workspace = true }
zeroship-runtime-macros = { workspace = true }
async-trait = { workspace = true }
compio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
v8 = { workspace = true }

[dev-dependencies]
zeroship-workflow-manager = { workspace = true }
zeroship-workflow-client = { workspace = true }
zeroship-data-orm = { workspace = true }
zeroship-core = { workspace = true }
zeroship-storage = { workspace = true }
sha2 = { workspace = true }
zeroship-id = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
