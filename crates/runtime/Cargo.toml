[package]
name = "zeroship-runtime"
version = "0.1.0"
edition = "2024"
description = "zeroship V8 runtime — compio/io_uring, ESM modules, WebCrypto, fetch, streaming"

[dependencies]
# V8
v8 = { workspace = true }
deno_core_icudata = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto
aws-lc-rs = { workspace = true }
base64 = { workspace = true }

# Encoding (WHATWG-spec UTF-8 decoder backing TextDecoder)
encoding_rs = { workspace = true }

# Compression — backs CompressionStream / DecompressionStream and
# internal fetch Content-Encoding decoding. Codec layer in src/codec.rs.
flate2 = { workspace = true }
brotli = { workspace = true }

# TLS (for fetch HTTPS — need to install CryptoProvider at init)
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# URL
url = { workspace = true }
ada-url = { workspace = true }

# Async
futures = { workspace = true }

# compio event loop
compio = { workspace = true, features = ["time", "macros", "bytes"] }

# Native WebSocket framer (RFC 6455 / tungstenite over compio).
# Optional + gated behind `runtime_native_websocket` so the polyfill
# build path doesn't drag in tungstenite. See
# docs/proposals/websocket-native.md §VII.1.
compio-ws = { workspace = true, optional = true }
compio-tls = { workspace = true, optional = true }

# HTTP client (fetch)
cyper = { workspace = true }
http = { workspace = true }
httparse = { workspace = true }

# Utilities
mimalloc = { workspace = true }
itoa = { workspace = true }
socket2 = { workspace = true }

sha2 = { workspace = true }

# WebSocket handshake (SHA-1 for Sec-WebSocket-Accept per RFC 6455)
sha1 = { workspace = true }

# Proc macros
zeroship-runtime-macros = { workspace = true }

[[bin]]
name = "zeroship-bench-server"
path = "src/server.rs"

[[bin]]
name = "echo-server"
path = "src/echo_server.rs"

[features]
default = []
# Per docs/proposals/websocket-native.md D-25 (cutover cadence):
#  Landing 1: native behind feature flag, polyfill default — current.
#  Landing 2: flip default to native; polyfill remains as fallback.
#  Landing 3: delete polyfill.
# When OFF: the JS polyfill at `embed/websocket.js` provides
# `globalThis.WebSocket`; native classes are NOT installed.
# When ON: native classes install BEFORE the polyfill runs, and the
# polyfill detects this and skips its WebSocket assignment.
runtime_native_websocket = ["dep:compio-ws", "dep:compio-tls"]
# Strict-throws path for `binaryType` setter on unknown values. v2 D-7
# default is silent-no-op (matches undici, workerd, the WPT test); the
# strict path is preserved behind this feature only for WPT-update tracking.
runtime_websocket_strict_enum = []
# Emergency rollback to the polyfill once cutover landing 3 has shipped
# (delete polyfill); reserved.
runtime_legacy_websocket = []

[lints]
workspace = true
