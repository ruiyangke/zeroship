[package]
name = "zeroship-runtime"
version = "0.1.0"
edition = "2024"
description = "zeroship V8 runtime — compio/io_uring, ESM modules, WebCrypto, fetch, streaming"

[dependencies]
# V8
v8 = { workspace = true }
deno_core_icudata = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto
aws-lc-rs = { workspace = true }
# Direct aws-lc-sys for the few raw EVP_* calls we need that aws-lc-rs's
# high-level API doesn't expose (e.g. RSA-PSS variable saltLength —
# `aws_lc_rs::signature::RSA_PSS_*` fixes salt length to digest length).
# Keep the call sites tiny + behind safe Rust wrappers.
aws-lc-sys = { version = "0.39" }
base64 = { workspace = true }

# Encoding (WHATWG-spec UTF-8 decoder backing TextDecoder)
encoding_rs = { workspace = true }

# Compression — backs CompressionStream / DecompressionStream and
# internal fetch Content-Encoding decoding. Codec layer in src/codec.rs.
flate2 = { workspace = true }
brotli = { workspace = true }

# TLS (for fetch HTTPS — need to install CryptoProvider at init)
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# URL
url = { workspace = true }
ada-url = { workspace = true }

# Async
futures = { workspace = true }

# compio event loop
compio = { workspace = true, features = ["time", "macros", "bytes"] }

# HTTP client (fetch)
cyper = { workspace = true }
http = { workspace = true }
httparse = { workspace = true }

# Utilities
mimalloc = { workspace = true }
itoa = { workspace = true }
socket2 = { workspace = true }

sha2 = { workspace = true }

# WebSocket handshake (SHA-1 for Sec-WebSocket-Accept per RFC 6455)
sha1 = { workspace = true }

# Proc macros
zeroship-runtime-macros = { workspace = true }

[[bin]]
name = "zeroship-bench-server"
path = "src/server.rs"

[[bin]]
name = "echo-server"
path = "src/echo_server.rs"

[lints]
workspace = true
