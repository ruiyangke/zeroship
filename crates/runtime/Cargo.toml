[package]
name = "appbase-runtime"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "appbase-rt"
path = "src/main.rs"

[dependencies]
deno_core = "0.395"
deno_error = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tokio-tungstenite = "0.26"
notify = "7"
futures-util = "0.3"

[lints]
workspace = true
