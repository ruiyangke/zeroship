[package]
name = "zeroship-runtime"
version = "0.1.0"
edition = "2024"
description = "zeroship V8 runtime — compio/io_uring, ESM modules, WebCrypto, fetch, streaming"

[dependencies]
# V8
v8 = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto
aws-lc-rs = { workspace = true }
base64 = { workspace = true }

# TLS (for fetch HTTPS — need to install CryptoProvider at init)
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# URL
url = { workspace = true }
ada-url = { workspace = true }

# Async
futures = { workspace = true }

# compio event loop
compio = { workspace = true, features = ["time", "macros", "bytes"] }

# HTTP client (fetch)
cyper = { workspace = true }
http = { workspace = true }
httparse = { workspace = true }

# Utilities
mimalloc = { workspace = true }
itoa = { workspace = true }
socket2 = { workspace = true }

# Bundle format
zeroship-bundle = { workspace = true }
zstd = { workspace = true }
sha2 = { workspace = true }

# WebSocket handshake (SHA-1 for Sec-WebSocket-Accept per RFC 6455)
sha1 = { workspace = true }

# Proc macros
zeroship-runtime-macros = { workspace = true }

[[bin]]
name = "v8-server-compio"
path = "src/server.rs"

[[bin]]
name = "echo-server"
path = "src/echo_server.rs"

[dev-dependencies]
zeroship-compiler = { workspace = true }

[lints]
workspace = true
