[package]
name = "appbase-runtime"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "appbase-rt"
path = "src/main.rs"

[[bin]]
name = "appbase-snapshot"
path = "src/snapshot_gen.rs"
required-features = ["snapshot"]

[lib]
name = "appbase_runtime"
path = "src/lib.rs"

[dependencies]
deno_core = "0.395"
deno_error = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tokio-tungstenite = "0.26"
notify = "7"
futures-util = "0.3"
libc = "0.2"
cpu-time = "1"

[features]
snapshot = []

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "rpc"
harness = false

[lints]
workspace = true
