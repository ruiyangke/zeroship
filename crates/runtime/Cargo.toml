[package]
name = "zeroship-runtime"
version = "0.1.0"
edition = "2024"
description = "zeroship V8 runtime — compio/io_uring, ESM modules, WebCrypto, fetch, streaming"

[dependencies]
# V8
v8 = { workspace = true }
deno_core_icudata = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto
aws-lc-rs = { workspace = true }
# Direct aws-lc-sys for the few raw EVP_* calls we need that aws-lc-rs's
# high-level API doesn't expose (e.g. RSA-PSS variable saltLength —
# `aws_lc_rs::signature::RSA_PSS_*` fixes salt length to digest length).
# Keep the call sites tiny + behind safe Rust wrappers.
aws-lc-sys = { version = "0.39" }
base64 = { workspace = true }

# Encoding (WHATWG-spec UTF-8 decoder backing TextDecoder)
encoding_rs = { workspace = true }

# Compression — backs CompressionStream / DecompressionStream and
# internal fetch Content-Encoding decoding. Codec layer in src/codec.rs.
flate2 = { workspace = true }
brotli = { workspace = true }

# TLS (for fetch HTTPS — need to install CryptoProvider at init)
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# URL
url = { workspace = true }
ada-url = { workspace = true }

# Async
futures = { workspace = true }

# compio event loop
compio = { workspace = true, features = ["time", "macros", "bytes"] }

# Native WebSocket framer (RFC 6455 — in-tree decoder/encoder + raw
# compio TCP / compio-tls TLS. compio-ws kept ONLY for its TLS connector
# helper; we hand-roll the HTTP handshake so the framer owns the
# leftover bytes after the 101 response.)
compio-ws = { workspace = true, optional = true }
compio-tls = { workspace = true, optional = true }
# Native trust roots for wss:// and node:tls. Direct dep — used in
# `transport::tls::build_tls_connector`.
rustls-native-certs = { version = "0.8", optional = true }

# HTTP client (fetch)
cyper = { workspace = true }
http = { workspace = true }
httparse = { workspace = true }

# Utilities
mimalloc = { workspace = true }
itoa = { workspace = true }
socket2 = { workspace = true }

sha2 = { workspace = true }

# WebSocket handshake (SHA-1 for Sec-WebSocket-Accept per RFC 6455)
sha1 = { workspace = true }

# Proc macros
zeroship-runtime-macros = { workspace = true }

# Logging
tracing = { workspace = true }
# Used only by the bench-server / echo-server binaries to init the
# shared tracing subscriber. The library itself only emits via
# `tracing::*`.
zeroship-core = { workspace = true }

# Insertion-ordered map — used by the rpc::superjson encoder to build
# `Meta::values` and `WithChildren` child maps, matching the wire-order
# contract Wave A pinned in `crates/core/src/superjson.rs`.
indexmap = { workspace = true }

# UUIDv7 keys for the rpc::abort registry — `(app_id, request_id)` keys
# the in-flight AbortController map walked by `entered_for_eviction`.
uuid = { workspace = true }

[[bin]]
name = "zeroship-bench-server"
path = "src/core/server.rs"

[[bin]]
name = "echo-server"
path = "src/core/echo_server.rs"

[features]
# Cutover landing 2: the native WebSocket impl is on by default.
# The polyfill's `WebSocket` and `WebSocketPair` JS classes still install
# but only wire to the native plumbing via `__nativeWebSocket` detection
# in `embed/websocket.js`. Tests that reach into the polyfill's per-WS
# state (state.websockets HashMap) and were not yet migrated to native
# can opt out via `--no-default-features`.
default = ["runtime_native_websocket"]
# Per docs/proposals/websocket-native.md D-25 (cutover cadence):
#  Landing 1: native behind feature flag, polyfill default — current.
#  Landing 2: flip default to native; polyfill remains as fallback.
#  Landing 3: delete polyfill.
# When OFF: the JS polyfill at `embed/websocket.js` provides
# `globalThis.WebSocket`; native classes are NOT installed.
# When ON: native classes install BEFORE the polyfill runs, and the
# polyfill detects this and skips its WebSocket assignment.
runtime_native_websocket = ["dep:compio-ws", "dep:compio-tls", "dep:rustls-native-certs"]
# Strict-throws path for `binaryType` setter on unknown values. v2 D-7
# default is silent-no-op (matches undici, workerd, the WPT test); the
# strict path is preserved behind this feature only for WPT-update tracking.
runtime_websocket_strict_enum = []
# Emergency rollback to the polyfill once cutover landing 3 has shipped
# (delete polyfill); reserved.
runtime_legacy_websocket = []

[dev-dependencies]
# Compile-fail snapshot tests for proc-macro diagnostics. Locks in
# `#[v8_constructor(post_init = ...)]` error spans for malformed shapes
# (MAC-02, design `docs/proposals/macro-constructor-post-init.md` §6.2).
trybuild = "1.0"
rcgen = "0.14"
# Wave F (RPC v2 phase 1): microbench for `default.rpc(...)` dispatch.
criterion = { workspace = true }

# RPC v2 phase 1 — Wave F. Measures the production single-call dispatch
# path (`extract_zs_v1_id` → `parse_rpc_body` → `RpcContext::build_js_object`
# → `with_rpc_context_in_als` → `rpc_fn.call` → `classify_rpc_return`).
# Per `docs/proposals/rpc-v2.md` §5, the result decides whether phase 1
# stays on single-call or amends to a two-step `#[v8_method(fastcall)]`
# enqueue ABI.
[[bench]]
name = "rpc_dispatch"
harness = false

[lints]
workspace = true
