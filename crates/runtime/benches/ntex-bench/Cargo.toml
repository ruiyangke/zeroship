[package]
name = "ntex-bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ntex-bench"
path = "main.rs"

[[bin]]
name = "ntex-v8-bench"
path = "v8_main.rs"

[[bin]]
name = "ntex-flume-bench"
path = "flume_main.rs"

[workspace]

[dependencies]
ntex = { version = "3", features = ["compio"] }
zeroship-runtime = { path = "../../../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = "0.1"
compio = { version = "0.18", features = ["time", "macros"] }
flume = "0.11"
futures = "0.3"
