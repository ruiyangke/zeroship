
extends = "confined"

[capabilities]
extension = true
schema = true
role = { allow = true, attrs = [] }
grant = true
rls = true
policy = true
function = true
raw_sql = true
raw_view_body = true
materialized_view = true
cross_schema = true
extensions = []
schemas = []

[operational]
index_creation = "allow_blocking"
lock_timeout_ms = 3000
statement_timeout_ms = 60000
table_rewrite = "allow"

[data_security]
require_rls = true
no_hard_delete = false
sensitive_columns = []
destructive_ops = "forbid"
