# dialect-support.toml - the single-source dialect-support sidecar.
#
# WHAT: one hand-authored row per (op-kind, variant) recording that token's
# DISPOSITION on each dialect. The generator
# (`packages/zero-migrate/scripts/gen-dialect-table.mjs`) reads this file and
# emits BOTH:
#   - crates/zeroship-migrate/tests/dialect_matrix/dialect_table.rs (Rust test artifact)
#   - packages/zero-migrate/src/generated/dialect-table.ts      (the TS mirror)
# Regenerate with: `pnpm --filter @zeroship/migrate gen:dialect-table`, then
# commit both generated artifacts.
#
# DISPOSITION vocabulary (per (row, dialect)):
#   portable             core construct that renders/validates on this dialect
#   transparentDegradable native where supported, absence-tolerable elsewhere.
#                         This legend used to end "(NOT produced by the current
#                         engine; reserved, and no row in this file uses it)".
#                         BOTH halves were false. TWO rows use it, on both
#                         non-PostgreSQL dialects: createPartition/base and
#                         createTable/partitionedCollapse. And it is live, not
#                         reserved - the generated test artifact carries it, each
#                         backend policy answers it, op_support.rs groups it with
#                         portable and vendor as SUPPORTED, and lowering acts on
#                         it: createPartition on MySQL/SQLite collapses the child
#                         into its parent behind a mirror guard instead of
#                         creating a relation.
#   vendor               vendor-tier construct, admitted only on this dialect
#   unsupported          refused on this dialect
#
# FAITHFULNESS, which is the whole point: this file is HAND-AUTHORED to MIRROR each
# registered backend's required `ValidationPolicy::op_disposition` answer and the
# live `Support::decision()` + `Support::tier` behaviour, mapped as:
#   Supported + Core   -> portable
#   Supported + Vendor -> vendor
#   Unsupported        -> unsupported
# WHICH TEST PROVES WHICH HALF. This comment used to say
# `crates/zeroship-migrate/tests/dialect_matrix/dialect_table_faithfulness.rs` "proves the generated table agrees with
# `Op::support()` for every op-kind × variant × dialect". IT DOES NOT, and cannot:
# `Op::support()` READS this table, so that comparison is TAUTOLOGICAL — the
# faithfulness test says so in its own header. What it actually proves is
# (a) the corpus covers the schema's 56 op-kinds, (b) `op_variant()` agrees with
# each corpus label, (c) the corpus ⟷ table row BIJECTION, and (d) sidecar ⟷
# generated table, row for row and cell for cell. The BEHAVIOURAL gate — that a
# decision matches what validate/lower actually do — is `op_support_matrix.rs`, and
# the LIVE one is `dialect_conformance_live.rs`. Three tests, three claims; naming
# one of them for all three is how a gap hides.
#
# CONSUMERS differ per side, so state them separately. The Rust table IS read by
# engine code: `crates/zeroship-migrate-core/src/model/op_support.rs` calls
# `dialect_table::lookup(kind, variant)`. The TypeScript mirror is read by
# NOTHING outside its own generated file - it exists so the SDK can be checked
# against the same sidecar, and a grep for `generated/dialect-table` or for
# `DIALECT_TABLE` on that side finds no other reference. Do not collapse
# these into one claim; they have already drifted apart once.
#
# ROW KEYS: `kind` and `variant` are the two STRUCTURAL keys. EVERY OTHER KEY IS A
# DIALECT ID, and the generator treats it as one without being taught the name — a
# fourth backend adds `duckdb = "..."` to each row and changes NOTHING ELSE. There
# is no per-vendor column in the generator, no per-vendor field in either emitted
# artifact, and no list of dialect names in core code.
#
# The key must be the CANONICAL `DialectId` (lowercase `[a-z][a-z0-9_]*`, matching
# `zero_migrate_ir::dialect::DialectId`), because it is emitted verbatim as
# `DialectId::new("<key>")`. It used to be `pg` here while every artifact this file
# fed said `postgres`, so `pg → postgres` was an ALIAS baked into the generator —
# and `DialectId`'s own rule is "no aliases and no display names in the id". The
# key is now `postgres`; `packages/zero-migrate/tests/dialect-table-drift.test.ts` pins that no alias
# comes back.
#
# VARIANT keys: payload-independent ops carry a single `variant = "base"` row.
# Ops whose `Support::decision()` depends on a node/option carry one row per
# distinct support() branch, keyed by a descriptive variant token; the
# faithfulness test builds one representative op per row and checks agreement.

# ─────────────────────────────────────────────────────────────────────────────
# Payload-independent — fully portable on all three dialects.
# ─────────────────────────────────────────────────────────────────────────────

