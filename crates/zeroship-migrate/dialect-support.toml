# dropConstraint stays `portable` on SQLite, and the reason is MEASURED rather
# than assumed. SQLite HAS a drop lane (`render/lower.rs`): when the live snapshot
# carries the table and the named constraint is a FOREIGN KEY, the op lowers to a
# 12-step rebuild and APPLIES end to end - proven through validate + lower + apply
# by `crates/zeroship-migrate/tests/dialect_matrix/sqlite_declaration_flip_over_refusal_control.rs`. It refuses
# `TableRebuildUnavailable` only for a missing snapshot or a NON-FK constraint.
#
# The live conformance suite recorded this row as a wrong declaration, but its
# representative drops a constraint that is not a foreign key, so it measured the
# narrow refusal and generalized it. Flipping this cell was TRIED here: the control
# above went red with `UNSUPPORTED ... SQLite cannot add or drop a table constraint
# in place`, i.e. the correction would have refused a migration that works today.
# There is one row for all constraint kinds and no variant split, so `portable` is
# the only disposition that does not break the working case.
[[row]]
kind = "dropConstraint"
variant = "base"
postgres = "portable"
sqlite = "portable"
mysql = "portable"

