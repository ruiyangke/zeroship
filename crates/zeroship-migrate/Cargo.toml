[package]
name = "zeroship-migrate"
version = "0.1.0"
edition = "2021"
description = "zeroship's versioned DB migration engine — native Postgres fast path plus V8-backed JS authoring front-end"

[features]
# The default build still builds the `zeroship-migrate-js` bin — the platform
# depends on that binary existing. A pure-library embedder opts out via
# `--no-default-features` to skip clap.
default = ["js-cli"]
# The JS authoring CLI bin (`zeroship-migrate-js`). Gated so the lean library
# embedder does not compile clap.
js-cli = ["dep:clap"]
# Raw standalone apply/runner surface for user-owned databases. Server/control
# crates must not enable this feature; workspace resolver = "3" keeps dev/test
# feature use from leaking into normal embedder binaries.
standalone-cli = ["dep:clap"]

[dependencies]
# Parse SQL with the REAL Postgres parser (libpg_query bindings) so the
# security guard sees exactly what Postgres would execute. A deny-list must
# not misparse or miss a dangerous statement; a pure-Rust parser
# (sqlparser-rs) is incomplete for exotic PG syntax, which is a security gap.
# pg_query carries a C build dep (libpg_query) — confirmed to build under the
# Nix C toolchain (cc/clang present).
pg_query = "6"
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
# JSON Schema derive for the `op.*` IR types (MigrationIr + the closed Op enum).
# Emits `op-ir.schema.json` (the discriminated union the JS builder targets) via
# `schemars::schema_for!`. Sync + leaf — zero tokio; does not widen the trust
# domain (it only describes the IR shape, it does not parse untrusted SQL).
schemars = { workspace = true }
# Strict base64 decode + canonical encode for `IrScalar::Bytes`. The payload is
# stored DECODED internally and re-encoded with the canonical STANDARD (padded)
# alphabet on serialize, so two non-canonical encodings of the same bytes cannot
# hash differently across the JS/Rust front doors (§2.5). The strict decoder
# refuses an invalid alphabet / wrong padding at LOAD, before any checksum.
base64 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Migration-first P2b: `fold_to_field_defs` preserves the createTable column ORDER
# (the keystone parity compares serialized FieldDef maps, so a sorted-vs-declared
# order would false-mismatch). An insertion-ordered map is the clean carrier.
indexmap = { workspace = true }
# Schema-authority P2: the engine ADOPTS the shared schema core for its
# schema-DESCRIPTION layer (the DSL→SQL type map + the DDL-shape vocabulary +
# sentinel codec + shape enums), replacing its own v1-SUBSET re-implementation.
# This is what gives the declarative differ FULL type capability
# (vector/encrypted/mask/geoPoint/literal) by reuse — the engine builds an SDK
# `def` from its FieldDescriptor and delegates the type/DDL spelling to this
# crate. The engine's LIFECYCLE (journal/guard/executor/rollback/…) and its
# snapshot-diff/introspection surface stay engine-owned and sit ON TOP of this.
zeroship-schema = { workspace = true }
# The JS-first authoring front-end is now part of this crate. Evaluating
# `schema.js` and recording op.* migrations uses the platform V8 runtime
# unconditionally; native compio-postgres remains the deploy/apply fast path.
zeroship-runtime = { workspace = true }
# The canonical version→id derivation (loader §6.2) builds a UUIDv7-SHAPED id
# (numeric version in the high 48 bits) and base62-encodes it via
# `crate::id::uuid_to_base62` (the vendored typed-id module), which takes a
# `&uuid::Uuid`.
uuid = { workspace = true }
# The Postgres executor (journal + apply flow) talks to PG over the bespoke
# compio-native driver — ZERO tokio, per the platform invariant. Runs
# out-of-band at deploy (not the request hot path), async on compio.
compio-postgres = { workspace = true }
compio = { workspace = true }
# SQLite migration backend (design 2026-06-19 §2.1.1). The migration connection
# is a DEDICATED, hardened, CDC-free rusqlite Connection — it does NOT reuse
# plugin-db's data-plane SqliteSession. `bundled` pins SQLite 3.51.3 (the
# version floor for DEFENSIVE/TRUSTED_SCHEMA/RETURNING/window-functions and the
# authorizer `zDb`-on-DROP_TABLE semantics the journal-immutability proof needs,
# §2.9). No `preupdate_hook`/vec0: the migration conn is CDC-free + extension-
# free to creator SQL (§2.1.1).
# `load_extension` is needed for `Connection::load_extension_disable()` — the
# real API (NOT a DbConfig variant) that disables extension loading at open
# (§2.1.1). Enabling the feature does NOT load any extension; it just exposes the
# enable/disable toggle, and we use it only to DISABLE.
rusqlite = { workspace = true, features = ["bundled", "load_extension"] }
# The migration actor's single-writer queue (zero-tokio: same spawn-thread +
# flume shape as plugin-db's SqliteSession, but a second security-scoped actor).
flume = { workspace = true }
# `FutureExt::catch_unwind` for panic-safe shadow-DB teardown (C1) — mirrors the
# runtime crate's panic_util seam. Zero tokio: `futures` is the executor-agnostic
# combinator crate, not a runtime.
futures = { workspace = true }
tracing = { workspace = true }
# CLI arg parsing for the `zeroship-migrate` bin (Phase 3, design §9). clap is
# SYNC — zero tokio — so it does not violate the zero-tokio invariant; the
# `env` feature backs the `--database-url` / `DATABASE_URL` env fallback.
# Optional so a pure-library embedder (`--no-default-features`) never compiles
# it; the `js-cli` / `standalone-cli` features pull it in for the CLI bins.
clap = { workspace = true, optional = true }
# The `zeroship-migrate-js` bin sets up a `warn`-level env-filtered subscriber
# on startup (replacing the former `zeroship_core::observability::init_tracing`).
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# The `zeroship-migrate.toml` project config for the CLI (DX parity). SYNC + leaf —
# zero tokio. Only the bin reads it; the library trust domain is unchanged.
toml = { workspace = true }
# PR4 build step: deploy-bundle manifest entry type (`MigrationFileEntry`) plus
# canonical content-addressed hash validation. The V8 front-end build path emits
# bundle migration entries over committed `.ir.json` bytes.
zeroship-bundle = { workspace = true }
v8 = { workspace = true }
# Raw syscalls for the kernel-sandboxed recorder child (rlimits, no-new-privs,
# namespaces), matching the existing sandbox-agent raw-libc posture.
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Kernel sandbox for the V8 recorder child: seccomp-bpf default-deny plus a
# Landlock read-only filesystem ruleset. Linux-only; other targets keep the
# userland budget floor.
seccompiler = { workspace = true }
landlock = { workspace = true }

# ---------------------------------------------------------------------------
# The operator-side CLI binary (Phase 3, design §9). compio (NOT tokio): the
# bin's `#[compio::main]` drives the same compio-native `connect`/executor the
# library uses. `main` is a THIN arg-parser that delegates to the
# `guard::platform_runner::run_*` functions — the ONLY place the
# `PlatformCapability` token is minted (the §5 trust invariant).
# ---------------------------------------------------------------------------
[[bin]]
name = "zeroship-migrate"
path = "src/bin/zeroship-migrate.rs"
required-features = ["standalone-cli"]

# The JS authoring CLI remains named `zeroship-migrate-js` so Vite/plugin and
# PATH-based call sites keep resolving the same executable.
[[bin]]
name = "zeroship-migrate-js"
path = "src/bin/zeroship-migrate-js.rs"
required-features = ["js-cli"]

# The kernel-sandboxed recorder child remains named exactly as before; the
# parent sandbox resolves this sibling binary from Cargo's target dir.
[[bin]]
name = "zeroship-migrate-recorder-child"
path = "src/bin/recorder-child.rs"

[dev-dependencies]
# Drift guard: `tests/core_id_parity.rs` asserts the vendored `id` / `db_url`
# copies stay byte-identical to core's originals while both crates coexist
# in-tree. Dev-only — the library no longer depends on core at runtime.
zeroship-core = { workspace = true }
# Executor tests hit a REAL Postgres (faithful-e2e); the compio test macro
# drives the async apply flow on the compio runtime.
compio = { workspace = true }
# Per-test temp SQLite files for the confinement/journal/atomic-apply proofs
# (design §3 P2 gate — every confinement claim proven on a REAL temp-file
# SQLite, never a shim). Auto-cleaning; workspace-pinned.
tempfile = { workspace = true }
# `mysql_jsdriver_e2e` reuses the runtime real-world node:net helpers. That
# support module also defines TLS fixtures, so its transitive test-only imports
# must be available here even though this suite only calls `ensure_mysql` and
# `allowlist`.
rcgen = "0.14"

[lints]
workspace = true
