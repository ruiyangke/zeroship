[package]
name = "zeroship-migrate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable, security-first, multi-dialect DB migration engine — the whole product: the vendor-neutral `zeroship-migrate-core` engine composed with the PostgreSQL, SQLite and MySQL backends this build ships. Driver-neutral Postgres/MySQL seam (host-callback / napi bridge) plus in-process SQLite. Runs V8-free: authoring, MySQL, and Postgres execution all run in the Node process (npm drivers) reached through the zeroship-migrate-node napi bridge; it ships NO embedded V8."

# THE COMPOSITION ROOT, and almost nothing else.
#
# `src/lib.rs` is a re-export of `zeroship-migrate-core` plus ONE fact: which vendors
# exist. That is the entire content of this crate, and it is why it exists — the three
# `[dependencies]` lines below used to sit in the engine's own manifest, where nothing
# but a hand-written census stopped any engine module from reaching a vendor directly.
# Moving them here makes the neutrality rule STRUCTURAL: `zeroship-migrate-core` cannot see
# these crates, so it cannot name them.
#
# The consumer-facing name did not move. `zeroship-migrate` is what a host depends on and
# "the whole product" is the right meaning for it; the engine is the part that got a
# new name.
#
# The engine's INTEGRATION TESTS live here, under `tests/`, and that is the correct
# home rather than a leftover: an integration test is a HOST. It composes the product
# and drives it through the public surface, which is precisely what this crate is for,
# and it is why `tests/dialect_matrix/the_registry_travels_as_a_value.rs` reads only
# `src` when it asserts that nothing reaches for the composition.
#
# This crate has NO cargo features.

[dependencies]
# THE ENGINE. Re-exported wholesale by `src/lib.rs`, so every `zero_migrate::…` path a
# host already wrote resolves unchanged across the split.
zeroship-migrate-core = { workspace = true }
# THE THREE SHIPPING BACKENDS. Named exactly once each, in the `SHIPPING` array in
# `src/lib.rs`, which is the registry composition that replaced the hard-coded match
# over the former closed SQL-dialect enum. The arrow only points this way: no vendor
# crate depends on the engine or on this crate, which is what let them be extracted at
# all, and what lets `zeroship-migrate-core` name none of them.
zeroship-migrate-postgres = { workspace = true }
zeroship-migrate-sqlite = { workspace = true }
zeroship-migrate-mysql = { workspace = true }
# The backend CONTRACT, for the two types the composition itself is written in:
# `BackendVendor` (what each vendor registers) and `VendorSet` (what this crate hands
# out). No renderer, no guard, no emitter is named here — resolving one is the
# engine's job, against the set it is given.
zeroship-migrate-backend = { workspace = true }

[dev-dependencies]
# Owned PostgreSQL fixtures for target-schema authorization regressions.
testcontainers = { version = "0.28", default-features = false, features = ["blocking", "watchdog"] }
url = { workspace = true }
# The wire contract, named DIRECTLY by the suites that build IR envelopes and dialect
# ids rather than reading them off the engine's re-exports. It is not a `[dependencies]`
# entry: `shipping_backends()` returns a `BackendRegistry`, but that name reaches this
# crate through the engine's own root re-export, so the composition needs no edge of
# its own to the leaf.
zeroship-migrate-ir = { workspace = true }
# The integration suites under `tests/` are HOSTS: they compose the product and drive
# it through its public surface, so their dependencies are this crate's dev edges
# rather than the engine's. Everything below is TEST-ONLY and none of it ships.
#
# The PDP, named directly by the charter/policy suites rather than through the
# engine's re-export, because those tests construct policy inputs rather than consume
# an `EffectivePolicy` the engine handed them.
zeroship-migrate-policy = { workspace = true }
# TEST-ONLY. Every engine parse site the old `[dependencies]` entry justified was
# PostgreSQL's and reached only through `MigrationBackend`; all of them left with
# `apply/backend/postgres/` for `zeroship-migrate-postgres/src/backend/`.
#
# COUNT THE CALL SITES BEFORE EDITING THIS COMMENT — the entry it replaces was wrong
# twice before for exactly that reason. Today there is ONE:
# `tests/authoring_surface/sequences_exclusion.rs` parses a rendered exclusion
# constraint to prove the bytes the author emitted are bytes PostgreSQL accepts.
# pg_query carries a C build dep (libpg_query).
pg_query = "6"
# TEST-ONLY FEATURES on crates this manifest already depends on. Each publishes that
# vendor's canned `SqlSession` recorder, which the vendor's own unit tests drive — and
# which the suites here drive while ALSO driving `apply_with_lock_backend` /
# `MigrationEngine` / `diff_snapshots` / `fold_ops`. Those four are the engine's, so
# those tests cannot live in the vendor crate (the edge back is a cycle Cargo refuses)
# — and a second copy of a recorder over here would be worse than the feature: its
# canned `information_schema` rows are the shared premise of both suites, and two
# copies drift silently.
#
# Resolver 3 keeps dev-dependency features out of the normal build, so a shipping
# `zeroship-migrate` compiles none of it.
zeroship-migrate-mysql = { workspace = true, features = ["testing"] }
zeroship-migrate-postgres = { workspace = true, features = ["testing"] }
# TEST-ONLY: the SEAM-generic async apply/backend surface is `async`, so the test
# harness drives it on a runtime. `#[compio::test]` spins a throwaway compio run loop
# per test (zero tokio) to `.await` the seam-generic apply/journal/drift/status paths
# over the in-crate recording driver + the in-process SQLite actor. NO shipped code
# links compio.
compio = { workspace = true }
# Per-test temp SQLite files for the confinement/journal/atomic-apply proofs
# (every confinement claim proven on a REAL temp-file SQLite, never a shim).
# Auto-cleaning; workspace-pinned.
tempfile = { workspace = true }
# TEST-ONLY: the SQLite integration suites open the app file raw to check what the
# hardened backend actually wrote. `bundled` pins the SQLite build; `load_extension`
# matches the vendor crate's feature set so the workspace resolves one rusqlite rather
# than two.
rusqlite = { workspace = true, features = ["bundled", "load_extension"] }
# TEST-ONLY live-Postgres driver. The blocking `postgres` crate backs `PgDevSession`,
# a `driver::SqlSession` impl that drives the SHIPPED generic
# PostgresBackend/executor/journal/drift path against a live PG, so the host-PG apply
# path has in-repo live-DB regression coverage.
# It is a `[dev-dependency]` ONLY — it pulls `tokio` TRANSITIVELY (the blocking
# `postgres` client wraps `tokio-postgres` on a private runtime), which is ACCEPTABLE
# because it NEVER ships: `cargo tree -p zeroship-migrate -e normal` stays tokio-free.
postgres = "0.19"
# TEST-ONLY (with `postgres`, above): the text-format param wrapper (`TextParam`)
# implements `postgres::types::ToSql`, whose `to_sql` writes into a
# `bytes::BytesMut`. Pinned to the version `tokio-postgres` already resolves, so the
# buffer type matches exactly.
bytes = "1"
# TEST-ONLY live-MySQL driver, the exact sibling of the `postgres` entry above and
# added for the same reason: until it existed, NO Rust test had ever asked a live
# MySQL server what the engine actually did.
#
# `default-features = false` with `minimal` only: the default set pulls `native-tls`
# (OpenSSL) and the `derive` proc-macro, and this driver connects to a loopback
# container over a plaintext socket and derives nothing.
mysql = { version = "28", default-features = false, features = ["minimal"] }
# TEST-ONLY, for the suites that build their own inputs rather than reading the
# engine's outputs: JSON schema-field maps and IR envelopes (`serde_json`), charter
# TOML (`toml`), checksum expectations (`sha2`, `hex`), the seam-generic async
# harness's combinators (`futures`), and the `ir-envelope.schema.json` golden gate
# (`schemars`).
serde_json = { workspace = true }
toml = { workspace = true }
# Compile the migration service's exact policy module into the byte-identity test;
# a dev-dependency on the service package itself would form a package cycle.
thiserror = { workspace = true }
uuid = { workspace = true }
zeroship-id = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
futures = { workspace = true }
schemars = { workspace = true }
# TEST-ONLY typed environment-read boundary. `clippy.toml`'s `disallowed-methods` ban
# on `std::env::var` names this crate's macro as the fix: `support::require_live_db_dsn`
# used to read `ZERO_MIGRATE_TEST_PG_URL` / `ZERO_MIGRATE_MYSQL_URL` with a raw
# `std::env::var`, which is exactly the un-enumerable read Section 4.5 of
# docs/proposals/2026-08-11-config-name-alignment.md exists to remove. `test_env!` is
# the sanctioned way for first-party test code to read a literal env name;
# both names are registered in
# `tests/test_only_env_gate.sh`'s closed INVENTORY in the same commit that adds them.
#
# Dev-only, so it never ships (`cargo tree -p zeroship-migrate -e normal` stays free of
# it). It reaches tokio via `cyper`/`hyper` as a NORMAL dependency of zeroship-core
# itself, which is not a new category of exposure for this crate's TEST build: the
# `postgres` dev-dependency above already pulls tokio in transitively, accepted for the
# same never-ships reason. `cargo xtask test repository` checks normal dependency
# paths and direct carrier declarations across every dependency kind. This dev
# dependency names zeroship-core, not a carrier, so neither boundary set changes.
zeroship-core = { workspace = true }

[lints]
workspace = true
