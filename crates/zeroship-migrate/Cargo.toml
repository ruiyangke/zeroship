[package]
name = "zeroship-migrate"
version = "0.1.0"
edition = "2021"
description = "zeroship's versioned DB migration engine — native Postgres fast path; the V8-backed JS authoring front-end + live-MySQL backend are optional behind the `zsv8` feature, so library embedders can build the guard/IR/render/PG+SQLite-apply core V8-free"

[features]
# Extraction Phase A: the engine is now a clean, runtime-free LIBRARY. The V8 bins
# (`zeroship-migrate-js`, the recorder child) + the in-Rust-V8 host impls moved to
# the monorepo adapter crate `zeroship-migrate-runtime` (which owns `clap` + the
# `js-cli`/`standalone-cli` CLIs). The default engine build is the V8-host consumer
# path (`v8-host`) + native PG — but with NO `zeroship-runtime`/`v8` in the graph.
default = ["v8-host", "native-pg"]
# The compio-postgres driver: the FIRST (native) `PgSession` impl. Gates the
# `compio-postgres` dep AND the compio-CONCRETE PG pieces — `impl PgSession for
# compio_postgres::Client` + the `SeamBind→ToSql` / `Row→SeamRow` /
# `Error→SeamError` adapters (`postgres/session.rs`), `PgOnline`/`PgShadow` (the
# online + shadow-dry-run harnesses on a compio run-loop `JoinHandle`), the
# `From<compio_postgres::Error>` leaf error arms, `conn.rs`'s connect path,
# `role.rs` provisioning, and the compio `&Client` executor/IR-apply entries.
# Since Phase A neutralised the trait (`SeamBind`/`SeamRow`/`SeamError`), the
# GENERIC apply path no longer names any `compio_postgres` type, so it is shared
# with `host-pg` via the internal `pg_seam` cfg (see build.rs), NOT gated here.
# Default-on, so the default build/test is byte-for-byte unchanged.
native-pg = ["dep:compio-postgres"]
# The host-callback PG plumbing: the driver-neutral `PgSession` seam + the whole
# GENERIC PG apply path (journal/drift/precondition/baseline free fns, the generic
# `PostgresBackend<D>`, the `<D: PgSession>` executor entries, `ops::status`),
# compiled WITHOUT the compio-postgres driver. It supplies NO `PgSession` impl of
# its own in this phase — the in-crate recording driver (behind `cfg(test)`) is the
# first host-shaped producer, proving genericity ahead of the Phase-C napi bridge.
# `native-pg` and `host-pg` both light up the shared generic path (the internal
# `pg_seam` cfg = either feature, emitted by build.rs); `native-pg` ADDITIONALLY
# provides the compio impl + PgOnline/PgShadow + connect + role provisioning.
# The addon build (`--no-default-features --features host-pg`) omits
# compio-postgres entirely, so the `.node` stays cross-platform (no io_uring).
host-pg = []
# The V8-backed authoring front-end (`src/frontend/`) + live-MySQL backend
# (`src/apply/backend/mysql/`) — made GENERIC over the `AuthoringHost`/
# `JsDriverHost`/`RecorderPlatform` seam traits (design §2). Extraction Phase A
# renamed `zsv8` → `v8-host` and, crucially, this feature NO LONGER pulls
# `zeroship-runtime` / `v8` — the in-Rust-V8 impl is the monorepo adapter crate
# `zeroship-migrate-runtime`. It still pulls the kernel sandbox deps (via `sandbox`)
# and `native-pg` (the JS authoring front-end does live PG introspection).
# `--no-default-features` compiles a V8-consumer-free core (guard + IR + render +
# PG/SQLite apply + journal), with V8 + `zeroship-runtime` absent from the graph.
v8-host = ["sandbox", "native-pg"]
# Back-name alias kept for the test suite + external callers that still say `zsv8`
# (~30 `#![cfg(feature = "zsv8")]` test files). Pre-launch we could rename them, but
# the seam edit is orthogonal to the feature spelling — the load-bearing invariant
# is that NEITHER `zsv8` NOR `v8-host` pulls `zeroship-runtime`/`v8` into the graph.
zsv8 = ["v8-host"]
# The kernel sandbox for the recorder child (seccomp/landlock/netns/rlimits). These
# are KERNEL primitives — independent of V8 and of `zeroship-runtime`. An embedder
# wanting the sandbox but a host-side authoring impl enables `sandbox` alone.
sandbox = ["dep:seccompiler", "dep:landlock", "dep:libc"]
# The JS authoring CLI + standalone runner CLIs. Pull `clap`. The V8-host bins
# (`zeroship-migrate-js`, the recorder child) MOVED to `zeroship-migrate-runtime`
# (they link the adapter — see §5.2), so `js-cli` no longer names a bin here; it is
# kept only so the standalone `zeroship-migrate` bin (which STAYS) resolves clap.
js-cli = ["dep:clap", "v8-host"]
# Raw standalone apply/runner surface (the `zeroship-migrate` bin, which STAYS in
# this crate — it needs no in-Rust V8 host, only child-mediated recording).
standalone-cli = ["dep:clap", "v8-host"]

[dependencies]
# Parse SQL with the REAL Postgres parser (libpg_query bindings) so the
# security guard sees exactly what Postgres would execute. A deny-list must
# not misparse or miss a dangerous statement; a pure-Rust parser
# (sqlparser-rs) is incomplete for exotic PG syntax, which is a security gap.
# pg_query carries a C build dep (libpg_query) — confirmed to build under the
# Nix C toolchain (cc/clang present).
pg_query = "6"
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
# JSON Schema derive for the `op.*` IR types (MigrationIr + the closed Op enum).
# Emits `op-ir.schema.json` (the discriminated union the JS builder targets) via
# `schemars::schema_for!`. Sync + leaf — zero tokio; does not widen the trust
# domain (it only describes the IR shape, it does not parse untrusted SQL).
schemars = { workspace = true }
# Strict base64 decode + canonical encode for `IrScalar::Bytes`. The payload is
# stored DECODED internally and re-encoded with the canonical STANDARD (padded)
# alphabet on serialize, so two non-canonical encodings of the same bytes cannot
# hash differently across the JS/Rust front doors (§2.5). The strict decoder
# refuses an invalid alphabet / wrong padding at LOAD, before any checksum.
base64 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Migration-first P2b: `fold_to_field_defs` preserves the createTable column ORDER
# (the keystone parity compares serialized FieldDef maps, so a sorted-vs-declared
# order would false-mismatch). An insertion-ordered map is the clean carrier.
indexmap = { workspace = true }
# Schema-authority P2: the engine ADOPTS the shared schema core for its
# schema-DESCRIPTION layer (the DSL→SQL type map + the DDL-shape vocabulary +
# sentinel codec + shape enums), replacing its own v1-SUBSET re-implementation.
# This is what gives the declarative differ FULL type capability
# (vector/encrypted/mask/geoPoint/literal) by reuse — the engine builds an SDK
# `def` from its FieldDescriptor and delegates the type/DDL spelling to this
# crate. The engine's LIFECYCLE (journal/guard/executor/rollback/…) and its
# snapshot-diff/introspection surface stay engine-owned and sit ON TOP of this.
zeroship-schema = { workspace = true }
# The reviewed-allowlist net-policy security type (`HostPort`/`ReviewedAllowlist`)
# the engine-owned `runtime_host::NetPolicy` reuses (design §2.5). NORMAL dep this
# phase (Phase B vendors it + drops this edge). The engine's public MySQL surface +
# its TLS-pin/net-policy construction stay runtime-`NetPolicy`-free.
zeroship-core = { workspace = true }
# The canonical version→id derivation (loader §6.2) builds a UUIDv7-SHAPED id
# (numeric version in the high 48 bits) and base62-encodes it via
# `crate::id::uuid_to_base62` (the vendored typed-id module), which takes a
# `&uuid::Uuid`.
uuid = { workspace = true }
# The Postgres executor (journal + apply flow) talks to PG over the bespoke
# compio-native driver — ZERO tokio, per the platform invariant. Runs
# out-of-band at deploy (not the request hot path), async on compio. OPTIONAL:
# the sole `PgSession` driver impl, gated behind `native-pg` (default-on). A
# `native-pg`-off embedder builds the SQLite + IR + render + guard core without
# it.
compio-postgres = { workspace = true, optional = true }
compio = { workspace = true }
# SQLite migration backend (design 2026-06-19 §2.1.1). The migration connection
# is a DEDICATED, hardened, CDC-free rusqlite Connection — it does NOT reuse
# plugin-db's data-plane SqliteSession. `bundled` pins SQLite 3.51.3 (the
# version floor for DEFENSIVE/TRUSTED_SCHEMA/RETURNING/window-functions and the
# authorizer `zDb`-on-DROP_TABLE semantics the journal-immutability proof needs,
# §2.9). No `preupdate_hook`/vec0: the migration conn is CDC-free + extension-
# free to creator SQL (§2.1.1).
# `load_extension` is needed for `Connection::load_extension_disable()` — the
# real API (NOT a DbConfig variant) that disables extension loading at open
# (§2.1.1). Enabling the feature does NOT load any extension; it just exposes the
# enable/disable toggle, and we use it only to DISABLE.
rusqlite = { workspace = true, features = ["bundled", "load_extension"] }
# The migration actor's single-writer queue (zero-tokio: same spawn-thread +
# flume shape as plugin-db's SqliteSession, but a second security-scoped actor).
flume = { workspace = true }
# `FutureExt::catch_unwind` for panic-safe shadow-DB teardown (C1) — mirrors the
# runtime crate's panic_util seam. Zero tokio: `futures` is the executor-agnostic
# combinator crate, not a runtime.
futures = { workspace = true }
tracing = { workspace = true }
# CLI arg parsing for the `zeroship-migrate` bin (Phase 3, design §9). clap is
# SYNC — zero tokio — so it does not violate the zero-tokio invariant; the
# `env` feature backs the `--database-url` / `DATABASE_URL` env fallback.
# Optional so a pure-library embedder (`--no-default-features`) never compiles
# it; the `js-cli` / `standalone-cli` features pull it in for the CLI bins.
clap = { workspace = true, optional = true }
# The `zeroship-migrate-js` bin sets up a `warn`-level env-filtered subscriber
# on startup (replacing the former `zeroship_core::observability::init_tracing`).
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# The `zeroship-migrate.toml` project config for the CLI (DX parity). SYNC + leaf —
# zero tokio. Only the bin reads it; the library trust domain is unchanged.
toml = { workspace = true }
# PR4 build step: deploy-bundle manifest entry type (`MigrationFileEntry`) plus
# canonical content-addressed hash validation. The V8 front-end build path emits
# bundle migration entries over committed `.ir.json` bytes.
zeroship-bundle = { workspace = true }
# Raw syscalls for the kernel-sandboxed recorder child (rlimits, no-new-privs,
# namespaces), matching the existing sandbox-agent raw-libc posture. OPTIONAL —
# its only users are the sandbox paths, so it is folded into `sandbox` (no in-core
# consumers → kept out of the sandbox-free tree). NOT a V8 dep.
libc = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Kernel sandbox for the V8 recorder child: seccomp-bpf default-deny plus a
# Landlock read-only filesystem ruleset. Linux-only; other targets keep the
# userland budget floor. OPTIONAL — used only in the V8-gated `frontend/` +
# recorder-child paths, so folded into `zsv8`.
seccompiler = { workspace = true, optional = true }
landlock = { workspace = true, optional = true }

# ---------------------------------------------------------------------------
# The operator-side CLI binary (Phase 3, design §9). compio (NOT tokio): the
# bin's `#[compio::main]` drives the same compio-native `connect`/executor the
# library uses. `main` is a THIN arg-parser that delegates to the
# `guard::platform_runner::run_*` functions — the ONLY place the
# `PlatformCapability` token is minted (the §5 trust invariant).
# ---------------------------------------------------------------------------
[[bin]]
name = "zeroship-migrate"
path = "src/bin/zeroship-migrate.rs"
required-features = ["standalone-cli"]

# NOTE (extraction Phase A, design §5.2): the two V8-host bins —
# `zeroship-migrate-js` (authoring CLI) and `zeroship-migrate-recorder-child`
# (kernel-sandboxed recorder) — MOVED to `crates/zeroship-migrate-runtime`, because
# they must link the adapter (which depends back on this crate) and would otherwise
# form a Cargo cycle. This lib crate now names NO bin that pulls the V8 host, so it
# stays a clean runtime-free library. The Vite plugin +
# `recorder_service::recorder_child_path()` resolve the moved binaries by name.

[dev-dependencies]
# The in-Rust-V8 adapter — injected into the seam-exercising tests so the
# authoring/record/lint + MySQL-echo suites run THROUGH `ZeroshipRuntimeHost`
# (design §6b). A dev-dependency cycle (adapter → engine → [dev] adapter) is
# permitted by cargo because dev-deps don't affect the normal build graph, so the
# runtime-free normal tree (§6a) is unaffected.
zeroship-migrate-runtime = { path = "../zeroship-migrate-runtime" }
# Executor tests hit a REAL Postgres (faithful-e2e); the compio test macro
# drives the async apply flow on the compio runtime.
compio = { workspace = true }
# Per-test temp SQLite files for the confinement/journal/atomic-apply proofs
# (design §3 P2 gate — every confinement claim proven on a REAL temp-file
# SQLite, never a shim). Auto-cleaning; workspace-pinned.
tempfile = { workspace = true }
# `mysql_jsdriver_e2e` reuses the runtime real-world node:net helpers. That
# support module also defines TLS fixtures, so its transitive test-only imports
# must be available here even though this suite only calls `ensure_mysql` and
# `allowlist`.
rcgen = "0.14"

[lints]
workspace = true
