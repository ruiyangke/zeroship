[package]
name = "zeroship-gatekit"
version = "0.1.0"
edition = "2021"
description = "Repository gates as Rust binaries: shared compose model, verdict reporting, and the gates themselves"

[[package.metadata.zeroship-config.targets]]
target = "compose-secret-strength"
class = "test-dev-tool"
reason = "A repository gate. It READS the deployment's compose file and is not in it; it has no configuration overlay of its own."

[[package.metadata.zeroship-config.targets]]
target = "compose-port-exposure"
class = "test-dev-tool"
reason = "A repository gate. It READS the deployment's compose file and Caddyfile and is in neither; it has no configuration overlay of its own."

[[package.metadata.zeroship-config.targets]]
target = "compose-stateful-volume"
class = "test-dev-tool"
reason = "A repository gate. It READS the deployment's compose file and is not in it; it has no configuration overlay of its own."

[[package.metadata.zeroship-config.targets]]
target = "compose-backing-service-reach"
class = "test-dev-tool"
reason = "A repository gate. It READS the deployment's compose file and is not in it; it has no configuration overlay of its own."

[[package.metadata.zeroship-config.targets]]
target = "compose-workflow-advance-flag"
class = "test-dev-tool"
reason = "A repository gate. It READS the deploy tree and one worker source file; it is not a deployed service and has no configuration overlay."

[[package.metadata.zeroship-config.targets]]
target = "gate-arm-census"
class = "test-dev-tool"
reason = "The meta-gate. It reads the repository's own gate scripts; it is not a deployed service and has no configuration overlay."

[dependencies]
serde = { workspace = true }
# The compose model needs a real YAML parser. `serde_norway` is the maintained
# fork of the (deprecated) `serde_yaml`, same API. MEASURED 2026-08-20 with
# `cargo tree -p serde_norway -e normal`: indexmap, itoa, ryu, serde,
# unsafe-libyaml-norway. No async runtime, no tokio.
serde_norway = { workspace = true }
# The rule set every secret gate reads. This dependency is the POINT of the
# crate: the rules are compiler-checked data, not text scraped out of the
# product's messages.
#
# IT IS ALSO THE COST, stated so nobody reads this crate as leaf-light.
# MEASURED 2026-08-20, `cargo tree -p zeroship-gatekit -e normal -i tokio`:
# tokio IS in this binary's graph, via zeroship-core -> cyper -> hyper. That is
# the pre-existing exception AGENTS.md documents, not something this crate
# introduces, but a gate that only reads a YAML file still links an HTTP stack
# to reach eight strings. If the rule table ever moves to a leaf crate, this
# dependency goes with it.
zeroship-core = { workspace = true }

[lints]
workspace = true
