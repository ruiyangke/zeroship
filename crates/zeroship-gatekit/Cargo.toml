[package]
name = "zeroship-gatekit"
version = "0.1.0"
edition = "2021"
description = "The repository meta-gate as Rust: the green/red/REFUSED verdict type and the per-arm census over tests/*_gate.sh"

[[package.metadata.zeroship-config.targets]]
target = "gate-arm-census"
class = "test-dev-tool"
reason = "The meta-gate. It reads the repository's own gate scripts; it is not a deployed service and has no configuration overlay."

[dev-dependencies]
# Only `tests/generated_secret_scrape.rs` needs it: that test pins
# deploy-remote.sh's sed extraction of the platform secret table to the table
# itself. Nothing this crate SHIPS depends on a zeroship crate, and keeping it
# that way is what stops `cargo tree -p zeroship-gatekit -i tokio -e normal`
# from finding the cyper -> hyper edge again.
zeroship-secret-policy = { workspace = true }

[lints]
workspace = true
