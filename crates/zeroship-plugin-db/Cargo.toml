[package]
name = "zeroship-plugin-db"
version = "0.1.0"
edition = "2021"
description = "Database plugin — zeroship.db.* native primitives"

[dependencies]
zeroship-runtime = { workspace = true }
zeroship-runtime-macros = { workspace = true }
# **P7 PR 3** — typed_id minter for INSERT auto-populated `id` column.
# The dispatch_insert path calls `zeroship_core::typed_id::generate(prefix)`
# when the inbound doc omits `id`. Cargo dep is in-workspace path-only
# (no external crate) — flagged in the PR 3 commit body per the
# "new Cargo dep" disclosure rule.
zeroship-core = { workspace = true }
# **Schema-authority P1** — the vendor-neutral schema-description layer (DDL
# builders, diff classifier, sentinel codec, schema-shape descriptor enums)
# lives in the leaf crate `zeroship-schema`. plugin-db's data plane and vendor
# tiers call *into* it for DDL / diff / codec / metadata values, and re-export
# the moved neutral items from their original module paths
# (`crate::query`, `crate::diff`, `crate::backend::{VectorMetric,…}`) so
# neutral call sites resolve unchanged. This also listed
# `crate::crud::mask_backfill::{build,parse}_mask_sentinel` until 2026-09-02;
# that module is deleted, and its two live consumers (`backend::pg_introspect`,
# `backend::sqlite`) call `zeroship_schema::mask_codec` directly rather than
# through any re-export. PostgreSQL introspection stays here in
# `backend::pg_introspect`; no vendor type crosses into the schema crate.
zeroship-schema = { workspace = true }
# The data plane's domain tier. `DbError` and `DbBinding` moved out of this
# crate; what stayed behind is the ADAPTER's half of the error hierarchy, the
# `ToOpError` lowering in `src/op_error.rs`.
zeroship-data-core = { workspace = true }
zeroship-data-postgres = { workspace = true }
zeroship-data-sqlite = { workspace = true }
# The ENGINE tier, extracted from this crate on 2026-09-03: `crud`,
# `transaction`, `exec`, `backend`, `backend_handle`, `backend_selection`,
# `tx_route`, `tx_lanes`, `metrics`, `system_shape_charter`, `descriptor` and
# `auth`. `src/lib.rs` re-exports every one of them under the same visibility
# ladder they had as modules, so both this crate's own files and its 12
# integration targets resolve `crate::crud::…` / `zeroship_plugin_db::exec::…`
# unchanged. The edge runs one way only, and this manifest is where that is
# enforced: `zeroship-data-engine` does not name this crate in either table.
zeroship-data-engine = { workspace = true }
# The operator charter is the worker's assignment authority, and it must not
# arrive from the creator-authored descriptor. `zeroship-migrate-policy` is a
# leaf (serde/toml/sha2/hmac/hex/thiserror/schemars and nothing of ours), so
# taking the parser here adds no cycle.
zeroship-migrate-policy = { workspace = true }
# Metering infrastructure: exec.rs emits a raw usage metric
# (db_reads / db_writes / db_rows_written) in the success arm of each
# query / mutation / count via a MeterHandle. Platform-measured,
# unforgeable by app code (replaces the deleted env.meter API).
zeroship-metering = { workspace = true }
# `with-uuid-1` is DECLARED here because this crate USES it:
# `backend/pg_row_json.rs` decodes OID 2950 through `row.try_get::<_, uuid::Uuid>`.
# It was previously absent and the crate still built, purely because
# `zeroship-authz` and `zeroship-workflow-scheduler` enable the feature and
# Cargo unifies features across whatever crates share a build graph. So
# `cargo check -p zeroship-plugin-db` ALONE failed with
# `Uuid: FromSql is not satisfied` while any wider build passed - a latent
# coupling that only becomes visible once a crate is asked to build by itself,
# which is exactly what the data-crate split asks of every tier.
compio-postgres = { workspace = true, features = ["with-uuid-1"] }
compio = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
v8 = { workspace = true }
# `tracing` for INVALID-index recovery logging until A3 ships the
# `__zeroship_migrations` audit table. `sha2` produces a deterministic
# 8-char base32 suffix when the generated index name exceeds 60 bytes
# (Postgres NAMEDATALEN=64 minus headroom).
tracing = { workspace = true }
sha2 = { workspace = true }
# **P5 PR 1** — column-encryption AEAD + key derivation. Both the PG
# arm and the SQLite arm consume `crate::encryption`, so these deps are
# unconditional (the encryption module compiles in every plugin-db
# build). `hmac` is promoted from optional/sqlite-only to unconditional
# below — deterministic mode HMAC-derives the synthetic nonce on both
# backends, and the env-var key sourcing in `encryption::keys` is
# pure-Rust.
aes-gcm = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
# **P5 PR 2** — the CRUD encryption pass exchanges ciphertext over JSON
# values (which cannot carry raw bytes), so plaintext bytes are
# base64-encoded into a `Value::String` and the SQL bind layer wraps
# the placeholder with `decode($N, 'base64')::bytea` on insert/update
# / `encode("col", 'base64')` on read. Both legs need a hot-path
# base64 codec; `base64` v0.22 is already a workspace dep.
base64 = { workspace = true }
# **P5 PR 2 follow-up** — zeroize root-key material, derived AEAD keys,
# and transient plaintext buffers on drop. The plugin-db encryption
# paths hold key/plaintext bytes in Rust-owned memory; `zeroize`
# hardens those drop paths without changing the wire contract.
zeroize = { version = "1", features = ["alloc", "derive"] }
# SQLite backend dependencies — unconditional now that both backends
# ship in every build.
#
# - `rusqlite`: bundled SQLite amalgamation + `preupdate_hook` seam the
#   P2 CDC pass will wire in.
# - `flume`: bounded MPMC queue the `SqliteSession` actor uses to
#   serialise calls onto the single rusqlite writer thread (compio is
#   single-threaded; the actor runs under `spawn_blocking`).
rusqlite = { workspace = true, features = ["bundled", "preupdate_hook"] }
flume = { workspace = true }
futures = { workspace = true }
# **P4 PR 7** — `sqlite-vec` statically compiles the `vec0` C extension
# into the binary and hooks every rusqlite Connection via
# `sqlite3_auto_extension`. Unconditional now that the SQLite arm is
# always compiled in. The PG arm still never touches this crate.
sqlite-vec = { workspace = true }
tempfile = { workspace = true }
# **P3 PR 3** — SQLite SessionMinter uses HMAC-SHA256. `sha2` is
# already an unconditional dep (used for the auto-generated index
# name suffix). The previous `hmac = { ... optional = true }` line
# was widened to unconditional in **P5 PR 1** (line ~27 above) —
# deterministic-mode column encryption HMAC-derives the synthetic
# nonce on both backends, so the dep is no longer sqlite-only. The
# PG arm still signs sessions via `pgcrypto.hmac(...)` inside
# SECURITY DEFINER (no Rust HMAC there); only `encryption::aead`
# uses the Rust impl on the PG side.

[dev-dependencies]
# `DbBinding::cold_start` is gated behind `test-helpers` in the domain tier: it
# builds a deploy identity from an app id, and shipping that constructor in a
# release binary would retire the check that nothing in production does so.
zeroship-data-core = { workspace = true, features = ["test-helpers"] }
zeroship-data-postgres = { workspace = true, features = ["test-helpers"] }
zeroship-data-sqlite = { workspace = true, features = ["test-helpers"] }
# Same reason, one tier up: this crate's own `#[cfg(test)]` unit tests call
# `zeroship_data_engine::reset_engine_for_tests`, `exec::ambient_route_for_tests`
# and `backend_selection::new_sqlite_backend`, all gated
# `cfg(any(test, feature = "test-helpers"))` in the engine - where `test` is the
# ENGINE's test build, never this crate's. The feature is what carries.
zeroship-data-engine = { workspace = true, features = ["test-helpers"] }
# The DbPlan IR. A DEV dependency on purpose: nothing in this crate's `src/`
# uses it yet, and declaring it a normal dependency would say otherwise. The
# search family's lowering is exercised by `tests/search_ir_live.rs`, which
# executes the SQL it renders against a real server - the half its own crate
# cannot reach, having no dependencies at all.
zeroship-data-query-builder = { workspace = true }
compio = { workspace = true }
serde_json = { workspace = true }
# Test-only constructors (`row_for_test` / `column_for_test`) for the
# `bench_row_to_json` harness — enables synthesising a `Row` without
# hitting Postgres. Production builds of `compio-postgres` do not see
# this feature. See `crates/zeroship-plugin-db/benches/bench_row_to_json.rs`.
compio-postgres = { workspace = true }
# Performance r9 (cycle 09:30) forcing-function: a `cargo bench` harness
# must exist under `crates/zeroship-plugin-db/benches/` so future perf reviews can
# quote real numbers instead of being blocked by the anti-fabrication rule.
# Initial bench target is `build_find` / `build_insert` (see
# `benches/bench_query_build.rs` for the rationale).
criterion = { workspace = true }
# Test-coverage r12 NEW-R11-1 + NEW-R12-1: the F1 warn-half (5d9acab8
# / fcf7ce3c / 7c6bd2ec / 18aee490) and the [I6] release_advisory_lock
# typed-error caller paths emit 9+ structured `tracing::warn!` /
# `tracing::error!` events whose field shape is operator-grep-contract.
# `tracing-subscriber`'s test layer captures emissions so unit tests
# can pin the field set + transition discriminator. Caught my own
# 7c6bd2ec drift in cycle 13:17 — a snapshot test would have caught
# it pre-commit.
tracing-subscriber = { workspace = true }
zeroship-plugin-workflow = { workspace = true }
# P3 PR 4: cross-backend session-payload equivalence test in
# `tests/sqlite_integration.rs` needs to recompute HMAC-SHA256 over
# the canonical payload independently of the production code path so
# the assertion pins the SQLite-side byte format against a third
# implementation (the canonical_payload + compute_signature helpers
# are `pub(crate)` and unreachable from the integration target).
# `sha2` is already declared as a non-optional `[dependencies]` entry
# (line 20) so it's available to the test target without re-listing;
# `hmac` is also unconditional now, but we keep the dev-dep pin so the
# integration target still spells out its dependency explicitly.
hmac = { workspace = true }
# `workflow_journal_redeploy_grants_do_not_reopen_without_reprovision` needs an
# app's `app_<uuid>` workflow journal schema to exist before the worker's
# `PgStore::provision` can put tables in it, and since 2a44ea8ef that schema is
# created by the deploy's migration apply, not by the worker. The test calls
# `provisioning::provision_workflow_journal_schema` - the production statement -
# rather than a CREATE SCHEMA of its own, which would leave the journal owned by
# whoever the test connected as: a privilege shape production never has.
# DEV-only, and `zeroship-migrate-server` does not depend on plugin-db, so no cycle.
zeroship-migrate-server = { workspace = true }
# The SAME argument, one dialect over. `crud/unmask.rs` stopped creating
# `__zeroship_audit_unmask` on 2026-08-28 - that was the last live DDL in the
# data plane - and the two migration apply hosts create it instead. The SQLite
# integration fixtures stand in for the dev-tier host, so they run
# `backend::audit_unmask_ddl`, the PRODUCTION generator, rather than a hardcoded
# copy: a fixture holding its own copy of the shape would keep reporting green
# while production drifted away from it. DEV-only; `zeroship-migrate-sqlite`
# does not depend on plugin-db, so no cycle.
zeroship-migrate-sqlite = { workspace = true }
# The SAME argument again, for the PROTECTION-FLOOR fixture. The floor's input is
# the mask/encryption sentinel a creator table carries, and in production that
# sentinel is written by the migration engine - never by
# `zeroship_schema::query::build_create_table_with_fks`, whose only callers are
# tests (measured: zero `src` call sites outside its own module). A fixture that
# builds its table with the data plane's emitter therefore cannot see a
# disagreement between the two, which is exactly the defect that shipped. The
# migration-engine fixture renders its CREATE TABLE through
# `zeroship_migrate::schema::query` under `zeroship_migrate_postgres::DIALECT`,
# the same pair `zeroship-migrate-server` drives. DEV-only; neither crate depends
# on plugin-db, so no cycle.
zeroship-migrate = { workspace = true }
zeroship-migrate-postgres = { workspace = true }

[[bench]]
name = "bench_query_build"
harness = false

# Row-decoding microbench. Synthesises `compio_postgres::Row` values via
# `compio_postgres::test_utils` (doc-hidden, always compiled) and runs
# `row_to_json_for_bench` against narrow / medium / wide column shapes.
[[bench]]
name = "bench_row_to_json"
harness = false

# `find().first()` lowering microbench. Measures the full
# `&[Row] → JSON-string` path the SDK sees on a single-row read (`find`
# with `LIMIT 1`): `v8_bridge::rows_to_json_value` composed with
# `crud::first_row_or_null`.
#
# It exists as the forcing function for a redesign that is still open:
# threading `Vec<Value>` straight through to V8 as a new `ResolveValue`
# shape, so the read path stops paying a `.to_string()` here and a
# matching `JSON.parse` on the other side. That boundary cost is
# structural for `ResolveValue::Json` and cannot be measured from this
# crate, because the parse half lives in `zeroship-runtime` - which is
# why this microbench covers the Rust side only, and why the redesign
# is a cross-crate change rather than a local one.
[[bench]]
name = "bench_first_row_or_null"
harness = false

[features]
# `test-helpers` exposes the `*_for_tests` / `*_with_pool` symbols to
# downstream test crates (integration tests in `tests/integration.rs`).
# The same symbols are visible to the in-crate unit tests via
# `#[cfg(test)]` so `cargo test --lib` does NOT need this feature.
test-helpers = [
    "zeroship-data-core/test-helpers",
    "zeroship-data-postgres/test-helpers",
    "zeroship-data-sqlite/test-helpers",
    "zeroship-data-engine/test-helpers",
]
# Live logical-decoding coverage is separate from the broader helper-gated
# integration suite because it requires the compose Postgres on port 5440.
live-db-tests = ["test-helpers", "zeroship-data-engine/live-db-tests"]

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["test-helpers"]

# SQLite-side integration target. PR 0 makes the backend unconditional,
# so only `test-helpers` remains gated.
[[test]]
name = "sqlite_integration"
path = "tests/sqlite_integration.rs"
required-features = ["test-helpers"]

# Native `Db.transaction(fn)` orchestrator E2E (P9 PR 3). Reaches the
# `test-helpers`-gated symbols such as `set_db_url_for_tests`, so it must carry
# the same `required-features` guard as the integration
# targets above — otherwise bare `cargo test -p zeroship-plugin-db`
# auto-discovers it and fails to compile (E0425/E0603).
[[test]]
name = "native_transaction"
path = "tests/native_transaction.rs"
required-features = ["test-helpers"]

[[test]]
name = "distributed_live"
path = "tests/distributed_live.rs"
required-features = ["live-db-tests"]

# The missing-per-app-role classification (`schema_not_provisioned`). Needs
# a live server because `compio_postgres::Error` has no public constructor,
# so the SQLSTATE this classifies can only be produced by PostgreSQL itself.
# It touches no `test-helpers` symbol, but carries the guard anyway so bare
# `cargo test -p zeroship-plugin-db` does not auto-discover a target that
# panics without a database.
[[test]]
name = "missing_role"
path = "tests/missing_role.rs"
required-features = ["test-helpers"]

# The DbPlan search family, executed. `zeroship-data-query-builder` renders SQL with no
# database in reach, so its own tests can only compare strings; this target runs
# the same statements against real PostgreSQL with pgvector and PostGIS, and
# holds the one arm that needs both backends in one process - the metric
# Postgres serves and SQLite refuses.
#
# Guarded like its siblings so bare `cargo test -p zeroship-plugin-db` does not
# auto-discover a target that panics without a database.
[[test]]
name = "search_ir_live"
path = "tests/search_ir_live.rs"
required-features = ["test-helpers"]

# The masking storage flip. Its own target rather than another section of
# `integration.rs` because every fixture in it builds its table from the
# PLATFORM'S OWN DDL emitter and writes through the real write pipeline - the
# flip's risk is the emitter and the data plane disagreeing about which physical
# column holds what, and a hand-written fixture agrees with whichever one its
# author had in mind. Guarded like its siblings, and it FAILS rather than skips
# without a database: a skipping run of a security suite is indistinguishable
# from a passing one.
[[test]]
name = "mask_flip"
path = "tests/mask_flip.rs"
required-features = ["test-helpers"]

# The write builders' `RETURNING` projection, executed by a role that holds
# COLUMN-level grants. Its own target rather than another section of
# `integration.rs` because it needs a fixture nothing else in the tree has: a
# role that may WRITE a masked field's raw column and may not READ it. That
# grant is unusable while any write verb stars, so this is the target that says
# whether the projection is real rather than whether the SQL text changed.
# Guarded like its siblings, and it FAILS rather than skips without a database.
[[test]]
name = "column_grants"
path = "tests/column_grants.rs"
required-features = ["test-helpers"]

# Which CONNECTION a `find({ unmask })` uses inside `db.transaction(fn)`. Its
# own target rather than another section of `mask_flip.rs` because every fixture
# in it has to park a real transaction connection in the per-isolate slot, and
# the question it rules on is about lanes rather than about masking storage.
# Guarded like its siblings, and it FAILS rather than skips without a database.
[[test]]
name = "unmask_tx_lane"
path = "tests/unmask_tx_lane.rs"
required-features = ["test-helpers"]

# Which CONNECTION the SEARCH FAMILY uses inside `db.transaction(fn)` - the
# sibling question to `unmask_tx_lane`, asked of `run_search` / `run_near`. Its
# own target because it needs a server carrying BOTH `vector` and `postgis`,
# which the unmask fixtures do not, and because it parks a real transaction
# connection the masking targets never open. Guarded like its siblings, and it
# FAILS rather than skips without a database or without an extension.
[[test]]
name = "search_tx_lane"
path = "tests/search_tx_lane.rs"
required-features = ["test-helpers"]

[lints]
workspace = true
