# The confined table-shape ceiling for plugin-db's SQLite `register_model` engine
# path (the dev-tier `zeroship serve` local backend). The published `zero-migrate`
# engine deliberately ships NO production confined-inject ceiling ("the REAL
# confined ceiling moves to the monorepo"; the engine's `ZEROSHIP_CONFINED_CEILING_TOML`
# is `#[cfg(test)]`-only), so the injecting shape must be supplied by the monorepo.
#
# THIS FILE IS HALF A DOCUMENT. It holds the grants only. The mandatory
# system-table `[[inject]]` rule is NOT written here: it lives once, in
# `policies/confined-system-shape.inject.toml` at the repo root, and
# `src/register_model/sqlite_engine.rs` concatenates the two with
# `concat!(include_str!(..), include_str!(..))`. Dev and production therefore
# cannot disagree about the shape of a creator table - they compile from the same
# bytes. Loading this file alone gets a ceiling that injects nothing.
#
# It used to be a mirror held in lockstep by a gate, and the lockstep was not
# free. Two things drifted while it was: the DB DEFAULTS on
# `created_at`/`updated_at`/`version` (this header claimed until 2026-08-20 that
# they were deliberately stamped here and omitted from the creator ceiling, which
# stopped being true on 2026-08-09 when `ddf636140` added them there too), and the
# `now()` / `NOW()` spelling, which was cosmetic but indistinguishable from a real
# difference. Neither is expressible now.
policy_version = 1

[[grant]]
key = "schema.create_table"
value = true
scope = "all"

[[grant]]
key = "schema.rename"
value = true
scope = "all"

[[grant]]
key = "safety.destructive_ops"
value = "allow"
scope = "all"

# NO per-op timeout ceilings. This file granted `runtime.lock_timeout_ms = 30000`
# and `runtime.statement_timeout_ms = 300000` until 2026-08-10, and the engine
# REFUSES the whole document for it:
#
#   sqlite engine: confined policy failed: policy charter failed to load:
#   DeclaredOnlyNonDefault { key: "runtime.lock_timeout_ms" }
#
# so every confined SQLite registerModel failed and three `register_model::tests::
# sqlite_*` cases were red on main. The identical grants were dropped from
# `crates/zeroship-migrate-server/policies/confined.policy.toml` the same day, for the same
# refusal, and that file carries the full reasoning; this one was missed, so the
# fix was half-applied and only the plugin-db half stayed broken.
#
# The refusal is CORRECT. Both keys are registered `declared_only` in the vendored
# engine (third_party/zero-migrate/crates/zeroship-migrate-ir/src/policy_registry.rs,
# "Declared only - no execution path applies it"), so a charter raising either
# above its default advertises authority the engine does not have.
#
# Dropping them costs NO enforcement HERE either, and for a different reason than
# in migrated: plugin-db does not bound its statements through the charter at all.
# It issues `SET LOCAL statement_timeout` / `SET LOCAL lock_timeout` from its own
# constants (`DB_STATEMENT_TIMEOUT_MS` / `DB_LOCK_TIMEOUT_MS`, see
# crates/plugin-db/src/auth/bootstrap.rs), on a path that never consults this file.
#
# These come back the moment the engine wires the knobs into the executor - the
# classification is a property of the current implementation, not of the key.

