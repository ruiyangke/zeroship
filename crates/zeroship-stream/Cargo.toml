[package]
name = "zeroship-stream"
version = "0.1.0"
edition = "2021"
description = "Kafka-family durable stream transport seam for zeroship billing events."

[dependencies]
async-trait = { workspace = true }
rdkafka = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The only logging in this crate, and it earns its place: `drain_batch` drops a
# transport error when it already holds records, and a swallow with no signal
# at all is the shape that produced the defect it fixes.
tracing = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
testcontainers = { version = "0.28", default-features = false, features = ["blocking", "watchdog"] }

[lints]
workspace = true
