[package]
name = "zeroship-stream"
version = "0.1.0"
edition = "2021"
description = "Kafka-family durable stream transport seam for zeroship billing events."
# Integration suites are modules of the one `tests/main.rs` target; a new tests/integration/<name>.rs is compiled by nothing until tests/integration/mod.rs declares it.
autotests = false

[dependencies]
async-trait = { workspace = true }
rdkafka = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The only logging in this crate, and it earns its place: `drain_batch` drops a
# transport error when it already holds records, and a swallow with no signal
# at all is the shape that produced the defect it fixes.
tracing = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
# The worktree's shared broker this binary runs against, and the lifetime
# measurements of its recipe.
zeroship-testkit = { workspace = true }
zeroship-testkit-server = { workspace = true }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
