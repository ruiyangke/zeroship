[package]
name = "appbase-metering"
version = "0.1.0"
edition = "2024"
description = "Multi-tenant metering, quota enforcement, and rate limiting for appbase"

[dependencies]
appbase-core = { path = "../core" }
appbase-plan = { path = "../plan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
time = "0.3"
tokio = { version = "1", features = ["time", "rt", "sync"] }
rusqlite = { version = "0.38", features = ["bundled"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
appbase-enforcement = { path = "../enforcement" }

[[bench]]
name = "quota_bench"
harness = false

[lints]
workspace = true
