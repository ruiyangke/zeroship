[package]
name = "appbase-v8-core"
version = "0.1.0"
edition = "2024"
description = "V8 dispatch primitives — runtime-agnostic"

[dependencies]
v8 = "147"
libc = "0.2"
serde_json = "1"
url = "2"
ada-url = "3.4.4"
aws-lc-rs = "1"
base64 = "0.22"
futures = "0.3"
tokio = { version = "1", features = ["sync", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
appbase-runtime-macros = { path = "../runtime_macros" }

[lints]
workspace = true
