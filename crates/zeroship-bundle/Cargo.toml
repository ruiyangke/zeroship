[package]
name = "zeroship-bundle"
version = "0.1.0"
edition = "2021"
description = ".zship deploy artifact: manifest types, content-addressed blob store, pack/unpack."
# Integration suites are modules of the one `tests/main.rs` target; a new tests/integration/<name>.rs is compiled by nothing until tests/integration/mod.rs declares it.
autotests = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
compio = { workspace = true, features = ["fs", "time"] }
zstd = { workspace = true }
tar = { workspace = true }
tracing = { workspace = true }
compio-s3 = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
# The typed app id the blob layout is keyed on. This is why `zeroship-id` is a
# leaf: a blob prefix that disagrees with the tenant it belongs to orphans every
# object under it, and this crate sits BELOW `zeroship-core` (which names
# `Manifest`), so the fence has to come from something below them both.
zeroship-id = { workspace = true }

[dev-dependencies]
compio = { workspace = true, features = ["fs", "macros", "runtime"] }
# The S3 fixture starts its own server through the daemon rather than a CLI.
testcontainers = { workspace = true }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
