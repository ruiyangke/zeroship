[package]
name = "zeroship-sandbox"
version = "0.1.0"
edition = "2021"
description = "zeroship sandbox service — pluggable backends (docker, k8s+libkrun) for AI builder sessions"

[[bin]]
name = "zeroship-sandbox"
path = "src/main.rs"

[lib]
name = "zeroship_sandbox"
path = "src/lib.rs"

[dependencies]
zeroship-core = { workspace = true }
zeroship-sandbox-agent = { path = "../sandbox-agent" }
compio = { workspace = true }
ntex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
mimalloc = { workspace = true }
subtle = "2"
# Phase-3 share-token HMAC. base64url + sha2 are already pulled in.
hmac = { workspace = true }
# Wraps `SandboxConfig.token` so debug output is redacted and the
# heap allocation is zeroed on drop (defense vs core-dump /
# /proc/<pid>/mem post-mortem reads).
zeroize = { version = "1", features = ["alloc"] }
bytes = { workspace = true }
# Ed25519 keypair generation for the K8s backend (controller-side
# private key; only the public half ships to the Pod).
ed25519-dalek = { workspace = true }
# XChaCha20-Poly1305 AEAD for sealed-record persistence; see
# crates/sandbox/src/persist.rs and the `docs/proposals/sandbox-preview-urls.md` § II.0.
chacha20poly1305 = { workspace = true }
base64 = { workspace = true }
# Sync HTTP client (blocking) for talking to the in-VM agent. Run
# inside `compio::runtime::spawn_blocking` so the ntex runtime
# never blocks on it.
ureq = { version = "2", default-features = false, features = ["json"] }
# WebSocket Upgrade parsing for the controller's preview-WS forwarder
# (Phase 2). The forwarder is a tiny compio raw-TCP listener that
# parses just the HTTP request-head with httparse, signs V1_1_Ws,
# and splices to the agent's WS port. No frame parsing.
httparse = { workspace = true }
# `futures::FutureExt::catch_unwind` for the detached-cleanup task
# instrumentation (M3) — local re-implementation of the runtime
# crate's `panic_util::guard` helper, kept inside this crate so we
# don't take a heavy crate-graph edge on `zeroship-runtime` just for
# panic logging.
futures = { workspace = true }
tracing = { workspace = true }
# Pg-backed non-secret state for sandboxes / shares / events
# (sandbox-pg-state design, Phase 0). Migrations + the `Database`
# handle live in `src/db.rs`. Compio-native; matches the rest of the
# stack (zero tokio).
compio-postgres = { workspace = true }
thiserror = { workspace = true }
# Bounded MPMC queue used by the Phase-1 pg-write worker pool
# (design § 14.14). Declared here in Phase 0 even though the queue
# isn't wired yet — the dep churn is paid once.
flume = { workspace = true }

[dev-dependencies]
ureq = { version = "2", default-features = false, features = ["json"] }

[lints]
workspace = true

[[example]]
name = "lifecycle_e2e"
path = "examples/lifecycle_e2e.rs"

[[example]]
name = "stress_e2e"
path = "examples/stress_e2e.rs"
