[package]
name = "zeroship-workflow-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authenticated workflow coordination metadata clients"
# The integration suites compile into one test binary instead of one per
# `tests/*.rs`. `tests/integration/main.rs` registers each suite module; a new
# `tests/integration/<name>.rs` is compiled by nothing until it is declared
# there.
autotests = false

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dependencies]
compio = { workspace = true }
cyper = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
zeroship-core = { workspace = true }

[dev-dependencies]
compio-tls = { workspace = true }
rustls = { workspace = true }
rcgen = "0.14"

[lints]
workspace = true
