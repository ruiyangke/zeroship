[package]
name = "zeroship-workflow-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authenticated workflow coordination metadata clients"
# One test target for the crate. `tests/main.rs` registers the tier modules and
# `tests/integration/mod.rs` each suite, so a new `tests/integration/<name>.rs`
# is compiled by nothing until it is declared there.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
compio = { workspace = true }
cyper = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
zeroship-core = { workspace = true }

[dev-dependencies]
compio-tls = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }

[lints]
workspace = true
