[package]
name = "zeroship-schema"
version = "0.1.0"
edition = "2021"
description = "Vendor-neutral schema-authority core — DDL builders, diff classifier, sentinel codec, and schema-shape descriptors shared by the migration engine and data plane. Leaf crate: NO database driver, v8, runtime, or crypto."

[dependencies]
# Schema-shape values (`Value`) flow through every DDL builder + the diff
# classifier.
serde_json = { workspace = true }
# `zeroship-core` is the inter-service / typed-id leaf; depending on it keeps
# this crate at the same trust layer (no v8, no runtime).
zeroship-core = { workspace = true }
# `sha2` produces the deterministic 10-char hex fingerprint the identifier
# cap appends when a DERIVED name exceeds the 63-byte NAMEDATALEN limit
# (`ident::cap_ident_name`, the crate's only such site). This is a NAME-hashing use
# (stable + roughly-uniform), NOT key/AEAD crypto — it touches no key
# material and does not implicate the trust domain the leaf-purity
# constraint protects. The migration engine already depends on `sha2`.
sha2 = { workspace = true }

[dev-dependencies]
# Test-only parity edges: the production crates stay separated by the migration
# engine boundary, while this suite compares the accept/refuse behavior they run.
zeroship-data-query-builder = { workspace = true }
# The composition root supplies the real shipping VendorSet. Keeping it test-only
# lets the parity corpus follow every registered backend without adding an engine
# or vendor crate to zeroship-schema's production graph.
zeroship-migrate = { workspace = true }
zeroship-migrate-core = { workspace = true }

[lints]
workspace = true
