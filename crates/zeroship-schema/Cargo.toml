[package]
name = "zeroship-schema"
version = "0.1.0"
edition = "2021"
description = "Vendor-neutral schema-authority core — DDL builders, diff classifier, sentinel codec, and schema-shape descriptors shared by the migration engine and data plane. Leaf crate: NO database driver, v8, runtime, or crypto."

[dependencies]
# Schema-shape values (`Value`) flow through every DDL builder + the diff
# classifier.
serde_json = { workspace = true }
# `sha2` produces the deterministic 10-char hex fingerprint the identifier
# cap appends when a DERIVED name exceeds the 63-byte NAMEDATALEN limit
# (`ident::cap_ident_name`, the crate's only such site). This is a NAME-hashing use
# (stable + roughly-uniform), NOT key/AEAD crypto — it touches no key
# material and does not implicate the trust domain the leaf-purity
# constraint protects. The migration engine already depends on `sha2`.
sha2 = { workspace = true }

[dev-dependencies]
# `zeroship-core` was a NORMAL dependency until 2026-09-08, described as keeping
# this crate "at the same trust layer (no v8, no runtime)". It did the opposite.
# The whole of this crate's production code names nothing from it - the only live
# reference is `zeroship_core::typed_id::USER_PREFIX` inside `query.rs`'s
# `#[cfg(test)] mod reserved_id_prefix_parity`, and the crate's four other
# mentions are `///` lines. Meanwhile the edge linked aes-gcm, ed25519-dalek,
# jsonwebtoken and an HTTP client into a crate whose own description says "no
# database driver, v8, runtime, or crypto".
#
# The test stays: it is the only binding between the platform's user-id prefix
# and this crate's reserved list, and deleting it to drop the edge would trade a
# real guarantee for a manifest line.
zeroship-core = { workspace = true }
# Test-only parity edges: the production crates stay separated by the migration
# engine boundary, while this suite compares the accept/refuse behavior they run.
zeroship-data-query-builder = { workspace = true }
# The composition root supplies the real shipping VendorSet. Keeping it test-only
# lets the parity corpus follow every registered backend without adding an engine
# or vendor crate to zeroship-schema's production graph.
zeroship-migrate = { workspace = true }
zeroship-migrate-core = { workspace = true }
# The backend CONTRACT crate, for its two renderer traits alone. A vendor's
# `synth_now` / `current_timestamp_expr` are trait methods on
# `BackendVendor::{dml, schema}`, and the composition root hands those out as
# `&'static dyn`, so calling either needs the trait in scope. `zeroship-migrate`
# already links it transitively; this line adds a NAME, not a build edge, and it
# is dev-only for the same reason the two above are.
zeroship-migrate-backend = { workspace = true }

[lints]
workspace = true
