[package]
name = "zeroship-schema"
version = "0.1.0"
edition = "2021"
description = "Shared schema-authority core — DDL builders, diff classifier, live introspection, sentinel codec, and schema-shape descriptors. The single schema implementation reused by the migration engine (write/diff/generate) and plugin-db's data plane (read/introspect). Leaf crate: NO v8, NO runtime, NO crypto."

[dependencies]
# Schema-shape values (`Value`) flow through every DDL builder + the diff
# classifier; the introspection rows are decoded into JSON-ish descriptors.
serde_json = { workspace = true }
# `read_live_schema` / `estimate_row_count` introspect the live catalog over
# the bespoke compio-native PG driver — ZERO tokio, per the platform invariant.
# The crate carries no crypto/v8/runtime: the data-plane transforms (AEAD,
# mask) stay in plugin-db and call this crate for the schema/DDL/codec they need.
compio-postgres = { workspace = true }
# `zeroship-core` is the inter-service / typed-id leaf; depending on it keeps
# this crate at the same trust layer (no v8, no runtime).
zeroship-core = { workspace = true }
# Observability facade ONLY — the live-introspection path emits a
# `tracing::warn!` on a recoverable malformed-mask-sentinel (preserved
# byte-for-byte from plugin-db's `diff::read_live_schema`). `tracing` is a
# pure logging facade: no v8, no runtime, no crypto, no metering — it does
# not touch the trust domain the leaf-purity constraint protects.
tracing = { workspace = true }
# `sha2` produces the deterministic 8-char base32 fingerprint the DDL
# builder appends when a generated index name exceeds the 60-byte
# NAMEDATALEN headroom (`query::index_name`). This is a NAME-hashing use
# (stable + roughly-uniform), NOT key/AEAD crypto — it touches no key
# material and does not implicate the trust domain the leaf-purity
# constraint protects. The migration engine already depends on `sha2`.
sha2 = { workspace = true }

[lints]
workspace = true
