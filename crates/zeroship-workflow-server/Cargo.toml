[package]
name = "zeroship-workflow-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Workflow worker registry, placement and management coordinator"

[[package.metadata.zeroship-config.targets]]
target = "zeroship-workflow-server"
class = "platform"
reason = "Metadata coordinator with a dedicated platform database login and generated settings."

[dependencies]
async-trait = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
compio = { workspace = true }
compio-postgres = { workspace = true }
ntex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
zeroship-core = { workspace = true }
zeroship-authn = { workspace = true }
zeroship-data-orm = { workspace = true }
zeroship-workflow-manager = { workspace = true }
# The journal artifacts, as a LEAF crate: it carries the generated SQL, the
# version series and the stamp descriptor, and depends on nothing else in the
# workspace. That is what lets the migration service install a journal from the
# same artifacts without linking anything else, and it is asserted by
# `the_workflow_schema_crate_reaches_nothing_else_in_the_workspace`.
zeroship-workflow-schema = { workspace = true }
zeroship-workflow-client = { workspace = true }
# The engine, for the creator-facing calls this service answers over its own
# journal. It reaches no payload storage: `PayloadObjects` and
# `ObjectStepOutputs` live in `zeroship-workflow-runner`, which
# `workflow_process_dependencies_follow_crate_ownership` forbids this crate from
# reaching, so the methods that move payload bytes are not served here.
zeroship-workflow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }
testcontainers = { version = "0.28", default-features = false, features = ["blocking"] }
# The journal bundle's declared charter is only meaningful against the service
# that composes it. `vet_schema_bundle` answers "would this service accept every
# step" with no database, so the manager can prove the artifact it ships is
# installable instead of finding out against a creator database.
zeroship-migrate-server = { workspace = true }

[lints]
workspace = true
