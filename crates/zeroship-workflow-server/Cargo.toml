[package]
name = "zeroship-workflow-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Workflow HTTP authority and worker task service"

[[package.metadata.zeroship-config.targets]]
target = "zeroship-workflow-server"
class = "platform"
reason = "Deployed workflow authority with a dedicated database login and generated settings."

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
compio = { workspace = true }
compio-postgres = { workspace = true }
ntex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
zeroship-core = { workspace = true }
zeroship-authn = { workspace = true }
zeroship-workflow = { workspace = true }
zeroship-storage = { workspace = true, features = ["s3"] }

[dev-dependencies]
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
testcontainers = { version = "0.28", default-features = false, features = ["blocking"] }

[lints]
workspace = true
