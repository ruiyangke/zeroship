[package]
name = "zeroship-cli"
version = "0.1.0"
edition = "2021"
description = "zeroship CLI — build, serve, deploy, inspect"
# End-to-end suites are modules of the one `tests/main.rs` target; a new tests/e2e/<name>.rs is compiled by nothing until tests/e2e/mod.rs declares it.
autotests = false

[[package.metadata.zeroship-config.targets]]
target = "zeroship"
class = "creator-cli"
reason = "Creator CLI and local serve flow are outside the server configuration overlay."

[[bin]]
name = "zeroship"
path = "src/main.rs"

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
async-trait = { workspace = true }
zeroship-core = { workspace = true }
uuid = { workspace = true }
zeroship-runtime = { workspace = true }
zeroship-data-v8 = { workspace = true }
zeroship-data-orm = { workspace = true }
zeroship-storage = { workspace = true, features = ["s3"] }
zeroship-storage-v8 = { workspace = true }
zeroship-kv = { workspace = true, features = ["redis", "redb"] }
zeroship-kv-v8 = { workspace = true }
zeroship-workflow-v8 = { workspace = true }
zeroship-workflow = { workspace = true }
zeroship-workflow-runner = { workspace = true }
zeroship-workflow-manager = { workspace = true }
zeroship-bundle = { workspace = true }
zeroship-metering = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
jsonc-parser = { version = "0.33.1", features = ["cst", "serde"] }
url = { workspace = true }
percent-encoding = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem", "rand_core"] }
hex = { workspace = true }
rand = "0.8"
compio = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

# Windows has no parent-death signal, so `parent_death` waits on the recorded
# parent's process handle through this safe wrapper.
[target.'cfg(windows)'.dependencies]
waitpid-any = "0.3"

[dev-dependencies]
# A second connection to the host's SQLite files: holding the journal's write
# lock and reading the queue row a claim leased.
rusqlite = { workspace = true }

# The recorded migration set the migrate suites pin against, and the listening
# socket check the e2e workflow host trusts. The testkit owns the set because
# `zeroship-migrate-node`'s suites pin the same bytes. It builds on Unix only:
# its container lease is an `flock` protocol.
[target.'cfg(unix)'.dev-dependencies]
zeroship-testkit = { workspace = true }

[lints]
workspace = true
