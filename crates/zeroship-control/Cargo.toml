[package]
name = "zeroship-control"
version = "0.1.0"
edition = "2021"
description = "zeroship control plane — admin API, internal API, Postgres, VFS"
# Integration targets are registered explicitly below. The workflow process
# contracts and the app/database decoupling exercise own separate targets.
autotests = false

[[package.metadata.zeroship-config.targets]]
target = "zeroship-control"
class = "platform"
reason = "Initial long-running control-plane service in the server configuration scope."

[[package.metadata.zeroship-config.targets]]
target = "zeroship-mock-stripe"
class = "test-dev-tool"
reason = "Standalone Stripe mock used only by billing and metering end-to-end tests."

[[package.metadata.zeroship-config.targets]]
target = "dev-provision"
class = "test-dev-tool"
reason = "Development and CI provisioning helper that is never deployed as a service."

[[example]]
name = "workflow-test-environment"
path = "tests/workflow_support/environment.rs"

[[bin]]
name = "zeroship-control"
path = "src/main.rs"

# Standalone mock-Stripe server for the billing & metering multi-node E2E.
# Reuses the same Stripe-wire idiom as the in-process mock in
# tests/billing_reconcile_test.rs, plus a /__mock/* introspection surface
# for external assertions.
[[bin]]
name = "zeroship-mock-stripe"
path = "src/bin/mock_stripe.rs"

# Dev/local/CI-only internal app provisioning tool. Requires direct DB +
# blob-store access; not a network endpoint and not a replacement for the
# PAT-gated production deploy path.
[[bin]]
name = "dev-provision"
path = "src/bin/dev_provision.rs"

[dependencies]
zeroship-core = { workspace = true }
zeroship-bundle = { workspace = true }
zeroship-authn = { workspace = true }
zeroship-authz = { workspace = true }
# Builder OAuth bootstrap reuses auth/control migrations for
# `control.oauth_clients` in dev-mode startup.
zeroship-auth = { workspace = true }
# Shared mailer (extracted to `crates/mailer` in PR-0). The billing-notify cron
# (PR-6) sends creator lifecycle/money emails through the `Mailer` seam, honouring
# the same `email_suppressions` contract auth uses. PR-0 deliberately left control
# un-wired; this is the wiring.
zeroship-mailer = { workspace = true }
zeroship-workflow = { workspace = true }
zeroship-workflow-client = { workspace = true }
zeroship-workflow-manager = { workspace = true }
zeroship-data-orm = { workspace = true }
zeroship-stream = { workspace = true }
zeroship-metering = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
# `with-chrono-0_4` so PAT issuance / the console seed can map
# `TIMESTAMPTZ` columns to `chrono::DateTime<Utc>` directly.
# `with-serde_json-1` so the plan catalog binds its JSONB price/quota/limits
# columns as `serde_json::Value` (PR4).
compio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1"] }
compio = { workspace = true }
memmap2 = { workspace = true }
ntex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
async-trait = { workspace = true }
bitflags = "2.11"
mimalloc = { workspace = true }
subtle = "2"
zeroize = "1"
# `stream_body_to_tmp_file` is generic over `Stream<Item = Result<B, E>>`
# (B: AsRef<[u8]>) so the helper compiles against ntex's `Bytes` from
# the request payload. We need `futures::Stream` in the public signature.
futures = { workspace = true }
# Auth — OIDC RP only post-U8. PKCE / state RNG + the legacy bcrypt
# password hasher + JWT cookie minter (which all lived under
# `auth_service` / `auth_handlers` / `oauth.rs`) were retired alongside
# those modules. The OIDC RP gets its CSRF + verifier bytes from
# `zeroship-core` and its JWKS verify path from `zeroship-core`'s
# `oidc_verify` module.
base64 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem", "rand_core"] }
rand = "0.8"
cyper = { workspace = true }
url = { workspace = true }
http = { workspace = true }
# The worker-enrolment envelope is a CIDR list. Same crate `zeroship-core`
# already parses egress destinations with, so one grammar answers "is this
# address inside that range" everywhere in the tree.
ipnet = { workspace = true }
tracing = { workspace = true }
# Phase 3 U7 — control plane OIDC RP module + console session store.
# `hmac` is already present above (used by the legacy stripe webhook
# verifier); reuse it here for the stash cookie HMAC envelope.
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }

[dev-dependencies]
# The OAuth and Supabase guard suites sign the bearer tokens they present.
jsonwebtoken = { workspace = true }
# The platform database and the Redpanda broker every test process of the
# worktree shares, and the lifetime measurements of the broker's recipe.
zeroship-testkit = { workspace = true }
zeroship-shared-server = { workspace = true }
zeroship-workflow-testkit = { workspace = true }
zeroship-workflow-server = { path = "../zeroship-workflow-server" }
# The workflow lane holds a payload store, so composing one in a test names the
# backend it is rooted at.
zeroship-storage = { workspace = true }
rcgen = { workspace = true }
testcontainers = { version = "0.28", default-features = false, features = ["blocking"] }
toml = { workspace = true }
# `deploy_test.rs` builds a synthetic `.zship` payload (tar+zstd) and
# feeds it through `zeroship_bundle::ingest`. The runtime path no longer
# depends on these crates — only the test packer does.
tar = { workspace = true }
zstd = { workspace = true }
# Stream tmp tests use `bytes::Bytes` to construct `stream::iter`
# inputs. The production helper is generic over `B: AsRef<[u8]>` so
# `bytes` itself isn't a runtime dep.
bytes = { workspace = true }
# Webhook HTTP-boundary tests compute a REAL Stripe `v1=` HMAC so the
# multi-v1 OR-fold and the signed-but-large-header paths exercise the production
# `verify_stripe_signature`, not a hand-faked header. Same crates the lib uses.
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zeroship-runtime = { workspace = true }
# The workflow test fixtures seed an app by INSERTing into `zeroship.apps`,
# which skips the deploy-time migration apply. They converge the creator
# database and grant its binding through the cluster reconciler's own
# `datastore::cluster` statements, and migrate it through `apply`, rather than
# a CREATE SCHEMA of their own, so the seeded app carries production's
# privilege shape instead of a test-only one.
zeroship-migrate-server = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

# `database_decoupling_e2e` runs CREATOR JAVASCRIPT through the real V8
# database plugin, so the one exercise that drives the whole app/database
# path reaches `env.db` and `env.databases.<label>` the way a deploy does
# rather than asserting the ORM layer underneath them.
zeroship-data-v8 = { workspace = true }

# Database verification is mandatory in ordinary cargo test runs. The suites
# reach the one migrated platform database `zeroship-testkit` shares across
# every test process of a worktree.

# One integration binary; tests/support, tests/integration and tests/e2e
# declare every suite.
[[test]]
name = "main"
path = "tests/main.rs"

# The controls here deliberately strand an io_uring ring and count every ring
# the process holds, so they must run in a process no other test shares.
[[test]]
name = "live_case_rings"
path = "tests/live_case_rings.rs"

# The workflow process contracts own a migrated template and clone disposable
# databases from it; a sibling module holding a session on that template would
# make the clone fail.
[[test]]
name = "workflow_e2e"
path = "tests/workflow_e2e.rs"

# This exercise declares a second execution zone in the platform fixture, so it
# cannot share a binary with the suites that resolve the default zone.
[[test]]
name = "database_decoupling_e2e"
path = "tests/database_decoupling_e2e.rs"

[lints]
workspace = true
