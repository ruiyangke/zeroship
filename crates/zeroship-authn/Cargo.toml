[package]
name = "zeroship-authn"
version = "0.1.0"
edition = "2021"
description = "Shared control-plane bearer authentication primitives"
# All suites are modules of the one test binary `tests/main.rs`.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
compio-postgres = { workspace = true }
ntex = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
zeroship-authz = { workspace = true }
zeroship-core = { workspace = true }

[dev-dependencies]
# Database cases run in compio; fixtures own their PostgreSQL containers.
base64 = { workspace = true }
compio = { workspace = true, features = ["polling"] }
futures = { workspace = true }
# The shared reaper-owned platform database this binary runs its cases against.
zeroship-testkit = { path = "../../tests/testkit" }

[lints]
workspace = true
