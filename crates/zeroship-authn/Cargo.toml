[package]
name = "zeroship-authn"
version = "0.1.0"
edition = "2021"
description = "Shared control-plane bearer authentication primitives"
# Register integration modules in tests/main.rs so database cases share the
# immutable migration seed while keeping their mutable resources private.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
compio-postgres = { workspace = true }
ntex = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
zeroship-authz = { workspace = true }
zeroship-core = { workspace = true }

[dev-dependencies]
# Database cases run in compio; fixtures own their PostgreSQL containers.
compio = { workspace = true, features = ["polling"] }
futures = { workspace = true }
tempfile = { workspace = true }
testcontainers = { version = "0.28", default-features = false, features = ["blocking", "watchdog"] }
toml = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
