[package]
name = "zeroship-authn"
version = "0.1.0"
edition = "2021"
description = "Shared control-plane bearer authentication primitives"
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "service_replay_pg_test"
path = "tests/service_replay_pg_test.rs"

[dependencies]
base64 = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
compio-postgres = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem", "rand_core"] }
jsonwebtoken = { workspace = true }
ntex = { workspace = true }
rand = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroship-authz = { workspace = true }
zeroship-core = { workspace = true }

[dev-dependencies]
# The Postgres jti store's race test drives two connections from one compio
# runtime. `polling` keeps it runnable in sandboxes that block io_uring, the
# same split the `auth` and `core` crates use.
compio = { workspace = true, features = ["polling"] }
futures = { workspace = true }
tempfile = { workspace = true }
testcontainers = { version = "0.28", default-features = false, features = ["blocking", "watchdog"] }
toml = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
