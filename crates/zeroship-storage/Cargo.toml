[package]
name = "zeroship-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Scoped object storage with local filesystem and S3-compatible backends"
autotests = false

[dependencies]
zeroship-core = { workspace = true }
compio = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
compio-s3 = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# The file index that identifies an object's file on Windows, read through a
# safe call (`backend::local`). Unix reads the inode from the file's metadata.
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

[features]
default = ["s3"]
s3 = ["dep:compio-s3", "dep:futures", "dep:tracing"]

[dev-dependencies]
tempfile = { workspace = true }
testcontainers = { version = "0.28", default-features = false, features = ["blocking"] }

# The shared S3 gateway the S3 suites join. It builds on Unix only: its
# container lease is an `flock` protocol.
[target.'cfg(unix)'.dev-dependencies]
zeroship-testkit = { workspace = true }

[lints]
workspace = true

# All suites are modules of the one test binary `tests/main.rs`.
[[test]]
name = "main"
path = "tests/main.rs"
