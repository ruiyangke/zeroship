[package]
name = "zeroship-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Scoped object storage with local filesystem and S3-compatible backends"

[dependencies]
zeroship-core = { workspace = true }
compio = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
compio-s3 = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = ["s3"]
s3 = ["dep:compio-s3", "dep:futures", "dep:tracing"]

[dev-dependencies]
tempfile = { workspace = true }
testcontainers = { version = "0.28", default-features = false, features = ["blocking"] }

[lints]
workspace = true
