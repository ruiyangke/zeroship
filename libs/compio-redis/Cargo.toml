[package]
name = "compio-redis"
version = "0.1.0"
edition = "2024"
description = "Minimal compio-native Redis client — RESP2, pooled connections, zero tokio"
# The integration suites are modules of one `tests/integration/main.rs` target, so
# the crate links one test executable instead of one per file.
autotests = false

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dependencies]
compio = { workspace = true }
bytes = { version = "1" }
redis-protocol = { version = "6", default-features = false, features = ["std", "resp2", "resp3", "bytes"] }
url = { workspace = true }
serde = { workspace = true }
percent-encoding = "2"
compio-tls = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { version = "0.8" }
rustls-pemfile = { version = "2" }

[dev-dependencies]
compio = { workspace = true }
serde_json = { workspace = true }
testcontainers = { version = "0.28", default-features = false, features = ["blocking"] }

[lints]
workspace = true
