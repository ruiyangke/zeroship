[package]
name = "compio-redis"
version = "0.1.0"
edition = "2024"
description = "Minimal compio-native Redis client — RESP2, pooled connections, zero tokio"
# Integration suites are modules of one `tests/main.rs` target, so
# the crate links one test executable instead of one per file.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
compio = { workspace = true }
bytes = { version = "1" }
redis-protocol = { version = "6", default-features = false, features = ["std", "resp2", "resp3", "bytes"] }
url = { workspace = true }
serde = { workspace = true }
percent-encoding = "2"
compio-tls = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { version = "0.8" }
rustls-pemfile = { version = "2" }

[dev-dependencies]
compio = { workspace = true }
# The shared Redis/Dragonfly fixture. zeroship-testkit's `redis` module hands
# out only URLs, ports and a minted prefix and carries no normal dependency on
# this crate (see its module doc and `[dev-dependencies]` placement there), so
# this edge does not form the cycle `cargo xtask test repository`'s
# `no_dev_only_package_depends_on_a_crate_whose_tests_use_it` forbids.
zeroship-testkit = { workspace = true }

[lints]
workspace = true
