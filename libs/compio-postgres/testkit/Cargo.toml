[package]
name = "compio-postgres-testkit"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Dev-only environment access shared by compio-postgres's test and bench targets"
# This crate is excluded from the workspace in the root `Cargo.toml`. It is
# reachable only as a dev-dependency of compio-postgres, so `cargo test
# --workspace` never compiles it, and it resolves under the root lock.

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
