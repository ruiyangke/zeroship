[package]
name = "compio-postgres-testkit"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Dev-only fixtures shared by compio-postgres's test and bench targets: the PostgreSQL server they dial and the one environment key they read"
# This crate is excluded from the workspace in the root `Cargo.toml`. It is
# reachable only as a dev-dependency of compio-postgres, so `cargo test
# --workspace` never compiles it, and it resolves under the root lock.
#
# It names no compio-postgres type and depends on no crate that does: the
# server is leased through `zeroship-shared-server`, which drives Docker and
# the lease protocol and links no database driver. A fixture that linked the
# driver would put a second copy of it into every test binary of the driver.

[dependencies]
zeroship-shared-server = { path = "../../../crates/zeroship-shared-server" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
