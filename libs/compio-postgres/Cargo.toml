[package]
name = "compio-postgres"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Native, asynchronous PostgreSQL client for compio/io_uring - port of tokio-postgres"
repository = "https://github.com/zeroship/zeroship"
keywords = ["database", "postgres", "postgresql", "sql", "compio"]
categories = ["database"]
rust-version = "1.85"

[lib]
test = true

[features]
default = []
array-impls = ["postgres-types/array-impls"]
with-chrono-0_4 = ["postgres-types/with-chrono-0_4"]
with-serde_json-1 = ["postgres-types/with-serde_json-1"]
with-uuid-1 = ["postgres-types/with-uuid-1"]
with-time-0_3 = ["postgres-types/with-time-0_3"]
with-bit-vec-0_8 = ["postgres-types/with-bit-vec-0_8"]
with-bit-vec-0_9 = ["postgres-types/with-bit-vec-0_9"]
with-eui48-1 = [
    "postgres-types/with-eui48-1",
    "tokio-postgres/with-eui48-1",
]
with-geo-types-0_7 = ["postgres-types/with-geo-types-0_7"]
with-jiff-0_2 = ["postgres-types/with-jiff-0_2"]
with-smol_str-01 = ["postgres-types/with-smol_str-01"]
with-cidr-0_3 = [
    "postgres-types/with-cidr-0_3",
    "tokio-postgres/with-cidr-0_3",
]
# rustls-backed TLS: `MakeRustlsConnect` (src/tls_rustls.rs) plus the pool's
# ability to open encrypted connections. rustls is pinned to `aws-lc-rs`, the
# workspace's single crypto provider (see the root Cargo.toml comment on
# `compio-tls`); the connector installs that provider explicitly rather than
# relying on a process-global default, so a binary that never calls
# `install_default` still works.
tls = [
    "dep:compio-tls",
    "dep:futures-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:pkcs8",
    "dep:sha1",
    "dep:sha2",
    "dep:x509-parser",
    "dep:zeroize",
]
# Opt-in for `tests/tls_live.rs`, which needs the five PostgreSQL servers
# `tests/tls_live_setup.sh` stands up.
#
# It is a FEATURE rather than a runtime check because the two states have to be
# distinguishable. A runtime check can only choose between "fail" (hostile to
# anyone who has not run Docker) and "return early" - and Rust cannot mark a
# test ignored at runtime, so returning early is counted by the harness as a
# pass. That is what this suite used to do: eight tests reporting green in a
# process that had never opened a socket. With `required-features`, cargo does
# not build the target at all unless it is asked for, so its absence is visible
# and its presence means it really ran.
live-tls-tests = ["tls"]
# Run the ORDINARY suite over TLS instead of plaintext.
#
# `tls_live.rs` proves the handshake, the verification modes and a couple of
# protocol claims. It does not prove that replication, the pool, portals,
# COPY, cancellation or two-phase behave the same once encrypted - every one
# of those tests hardcoded a plaintext transport, so both transports were
# never measured against the same assertions. With this feature
# `common::suite_tls()` returns a rustls connector and `common::test_url()`
# names the encrypted server, so the same test bodies run over TLS.
#
# A feature rather than an env var for the reason above and one more: the
# transport has to be chosen at COMPILE time, because the two connectors are
# different types.
suite-over-tls = ["tls"]
# Run the ORDINARY suite with the implicit raw-SQL prepared-statement cache.
#
# The default capacity is zero, so the ordinary test bodies otherwise leave
# admission, reuse, eviction and stale-statement retry almost entirely to the
# handful of cache-specific tests. With this feature `common::test_url()` adds
# a capacity of 32, so those same bodies exercise the cache too.
#
# A feature rather than an env var makes this an explicit suite variant and
# lets the common helper keep the crate-only parameter away from the
# tokio-postgres oracle, which rejects it.
suite-with-statement-cache = []
# Opt-in for `tests/unix_socket_live.rs`, which needs the server
# `tests/unix_socket_setup.sh` stands up on a SHORT socket path.
#
# A feature for the reason `live-tls-tests` gives above: a runtime check for a
# missing socket could only fail or return early, and an early return is
# counted as a pass, so an absent fixture would be indistinguishable from a
# working one.
live-unix-socket = []

[dependencies]
async-trait = "0.1"
bytes = { workspace = true }
byteorder = "1.0"
fallible-iterator = { workspace = true }
futures-channel = { version = "0.3", features = ["sink"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
log = "0.4"
parking_lot = "0.12"
percent-encoding = { workspace = true }
pin-project-lite = "0.2.11"
phf = "0.13"
postgres-protocol = { workspace = true }
# A source-local fork of postgres-types 0.2.14. Rust's orphan rules prevent
# repairing its SystemTime/chrono/time implementations from this crate, and
# the fork also owns the generated built-in Kind table used by Statement.
postgres-types = { path = "vendor/postgres-types", features = ["with-uuid-1"] }
rand = "0.10"
whoami = "2.0"
compio = { workspace = true }
socket2 = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# `requirepeer` needs both the kernel's peer credentials and the canonical
# passwd-database name for that UID. nix provides safe wrappers for
# SO_PEERCRED/getpwuid_r and carries no async runtime.
nix = { version = "0.31.2", features = ["socket", "user"] }

[dependencies.compio-tls]
workspace = true
optional = true

# `compio_tls::TlsStream` is the compio-side AsyncRead/AsyncWrite adapter, but
# it exposes only the negotiated ALPN - not the peer certificate chain, which
# `tls-server-end-point` channel binding needs. So we drive the handshake with
# futures-rustls directly (reading `peer_certificates()` off the
# `ClientConnection` before converting), and hand the finished stream to
# compio-tls via its `From` impl. Same version and features compio-tls itself
# pins, so this adds no crate to the lock.
[dependencies.futures-rustls]
version = "0.26"
default-features = false
features = ["logging", "tls12"]
optional = true

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["std", "logging", "tls12", "aws-lc-rs"]
optional = true

[dependencies.rustls-native-certs]
version = "0.8"
optional = true

# rustls-pki-types deliberately parses only unencrypted private keys. Modern
# OpenSSL emits passphrase-protected keys as encrypted PKCS#8, so the TLS
# connector needs PKCS#5 PBES2 decryption in addition to rustls' PEM reader.
# This stays pure Rust and avoids adding OpenSSL to the rustls-only transport.
[dependencies.pkcs8]
version = "0.10.2"
default-features = false
features = ["encryption", "pem"]
optional = true

# rustls-pki-types exposes explicit key zeroization but does not invoke it when
# the provider consumes an owned DER key. Wipe that transient copy after
# aws-lc imports it instead of leaving decrypted key bytes in freed memory.
[dependencies.zeroize]
version = "1"
optional = true

# `tls-server-end-point` is the hash of the server's DER certificate, and RFC
# 5929 picks the hash from the certificate's own signatureAlgorithm - so we
# have to read that OID out of the DER.
[dependencies.x509-parser]
version = "0.18"
optional = true

[dependencies.sha2]
workspace = true
optional = true

[dependencies.sha1]
workspace = true
optional = true

[dev-dependencies]
# Differential oracle. tokio-postgres is the crate this one was ported from,
# so running both against the same server and comparing answers is the
# strongest check available for a port. Permitted here and ONLY here: the
# zero-tokio invariant bans a normal or build dependency, and dev is exempt by
# the 2026-08-24 decision recorded in AGENTS.md.
#
# PINNED to the exact version this crate is a port OF, because an oracle is
# only an oracle for the version it is. `version = "0.7"` resolved to 0.7.17,
# one release behind - and 0.7.18's sole source change is a panic fix that this
# crate already carries (`Row::new` / `SimpleQueryRow::new` reject a `DataRow`
# whose field count disagrees with its `RowDescription`; see the guards in
# src/row.rs and their tests). So the suite was comparing a fixed driver
# against an unfixed one, and would have read OUR correct behaviour as the
# divergence. Move this deliberately when the port moves, never by resolution.
tokio-postgres = { version = "=0.7.18", default-features = false, features = [
    "runtime",
    "with-chrono-0_4",
    "with-time-0_3",
    "with-uuid-1",
] }
tokio = { version = "1", features = ["rt", "macros"] }
chrono = { version = "0.4.33", default-features = false, features = ["clock"] }
time = { workspace = true }
uuid = { workspace = true }
cidr = "0.3.2"
eui48 = { version = "1", default-features = false }
compio = { workspace = true }
criterion = { workspace = true }
# Integration tests consume the LISTEN/NOTIFY async-message stream
# (`StreamExt::next`) and drive two pipelined queries concurrently
# (`future::join`). Same version as the regular dependency above, so this
# adds no new crate to the lock - it only makes the surface visible to the
# `tests/integration.rs` target.
futures-util = { version = "0.3", default-features = false, features = ["sink", "async-await"] }
tempfile = { workspace = true }
# Self-signed certificates for the in-memory TLS pair in `tls_sansio`'s unit
# tests. Driving a real handshake is the only way to reach rustls' post-
# close_notify behaviour, which needs live keys.
rcgen = "0.14"

[[test]]
name = "tls_live"
required-features = ["tls", "live-tls-tests"]

[[test]]
name = "unix_socket_live"
required-features = ["live-unix-socket"]

[[bench]]
name = "buf_fill"
harness = false

[lints]
workspace = true

[[bench]]
name = "query_live"
harness = false

[[bench]]
name = "hot_path"
harness = false

[[bench]]
name = "soak"
harness = false

[[test]]
name = "serialized_loop"

# Its own binary because it installs a process-global `log::set_logger`, and so
# does `transaction_claims` inside the consolidated suite. Only the first call
# in a process succeeds; separate binaries are what keep both able to run.
[[test]]
name = "socket_release"

# Its own binary because it installs a process-global logger whose Debug level
# makes the query encoder take its parameter-logging branch. Sharing a process
# with another logger would silently select the non-Debug branch instead.
[[test]]
name = "query_debug_logging"
