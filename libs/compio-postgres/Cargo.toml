[package]
name = "compio-postgres"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Native, asynchronous PostgreSQL client for compio/io_uring — port of tokio-postgres"
repository = "https://github.com/zeroship/zeroship"
keywords = ["database", "postgres", "postgresql", "sql", "compio"]
categories = ["database"]
rust-version = "1.85"

[lib]
test = true

[features]
default = []
array-impls = ["postgres-types/array-impls"]
with-chrono-0_4 = ["postgres-types/with-chrono-0_4"]
with-serde_json-1 = ["postgres-types/with-serde_json-1"]
with-uuid-1 = ["postgres-types/with-uuid-1"]
with-time-0_3 = ["postgres-types/with-time-0_3"]
with-bit-vec-0_8 = ["postgres-types/with-bit-vec-0_8"]
with-bit-vec-0_9 = ["postgres-types/with-bit-vec-0_9"]
with-eui48-1 = ["postgres-types/with-eui48-1"]
with-geo-types-0_7 = ["postgres-types/with-geo-types-0_7"]
with-jiff-0_2 = ["postgres-types/with-jiff-0_2"]
with-smol_str-01 = ["postgres-types/with-smol_str-01"]
with-cidr-0_3 = ["postgres-types/with-cidr-0_3"]
# rustls-backed TLS: `MakeRustlsConnect` (src/tls_rustls.rs) plus the pool's
# ability to open encrypted connections. rustls is pinned to `aws-lc-rs`, the
# workspace's single crypto provider (see the root Cargo.toml comment on
# `compio-tls`); the connector installs that provider explicitly rather than
# relying on a process-global default, so a binary that never calls
# `install_default` still works.
tls = [
    "dep:compio-tls",
    "dep:futures-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:pkcs8",
    "dep:sha1",
    "dep:sha2",
    "dep:x509-parser",
    "dep:zeroize",
]
# Opt-in for `tests/tls_live.rs`, which needs the five PostgreSQL servers
# `tests/tls_live_setup.sh` stands up.
#
# It is a FEATURE rather than a runtime check because the two states have to be
# distinguishable. A runtime check can only choose between "fail" (hostile to
# anyone who has not run Docker) and "return early" - and Rust cannot mark a
# test ignored at runtime, so returning early is counted by the harness as a
# pass. That is what this suite used to do: eight tests reporting green in a
# process that had never opened a socket. With `required-features`, cargo does
# not build the target at all unless it is asked for, so its absence is visible
# and its presence means it really ran.
live-tls-tests = ["tls"]
# Test-only surface for downstream bench / unit-test crates that need to
# synthesise `Row` / `Statement` / `Column` values without a live
# Postgres. The feature is dev-only (consumers add it under
# `[dev-dependencies]`); production builds never see the constructors.
# Added for plugin-db's `bench_row_to_json`. See
# `libs/compio-postgres/src/test_utils.rs`.
test-utils = []

[dependencies]
async-trait = "0.1"
bytes = { workspace = true }
byteorder = "1.0"
fallible-iterator = { workspace = true }
futures-channel = { version = "0.3", features = ["sink"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
log = "0.4"
parking_lot = "0.12"
percent-encoding = { workspace = true }
pin-project-lite = "0.2.11"
phf = "0.13"
postgres-protocol = { workspace = true }
postgres-types = { workspace = true }
rand = "0.10"
whoami = "2.0"
compio = { workspace = true }
socket2 = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# `requirepeer` needs both the kernel's peer credentials and the canonical
# passwd-database name for that UID. nix provides safe wrappers for
# SO_PEERCRED/getpwuid_r and carries no async runtime.
nix = { version = "0.31.2", features = ["socket", "user"] }

[dependencies.compio-tls]
workspace = true
optional = true

# `compio_tls::TlsStream` is the compio-side AsyncRead/AsyncWrite adapter, but
# it exposes only the negotiated ALPN - not the peer certificate chain, which
# `tls-server-end-point` channel binding needs. So we drive the handshake with
# futures-rustls directly (reading `peer_certificates()` off the
# `ClientConnection` before converting), and hand the finished stream to
# compio-tls via its `From` impl. Same version and features compio-tls itself
# pins, so this adds no crate to the lock.
[dependencies.futures-rustls]
version = "0.26"
default-features = false
features = ["logging", "tls12"]
optional = true

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["std", "logging", "tls12", "aws-lc-rs"]
optional = true

[dependencies.rustls-native-certs]
version = "0.8"
optional = true

# rustls-pki-types deliberately parses only unencrypted private keys. Modern
# OpenSSL emits passphrase-protected keys as encrypted PKCS#8, so the TLS
# connector needs PKCS#5 PBES2 decryption in addition to rustls' PEM reader.
# This stays pure Rust and avoids adding OpenSSL to the rustls-only transport.
[dependencies.pkcs8]
version = "0.10.2"
default-features = false
features = ["encryption", "pem"]
optional = true

# rustls-pki-types exposes explicit key zeroization but does not invoke it when
# the provider consumes an owned DER key. Wipe that transient copy after
# aws-lc imports it instead of leaving decrypted key bytes in freed memory.
[dependencies.zeroize]
version = "1"
optional = true

# `tls-server-end-point` is the hash of the server's DER certificate, and RFC
# 5929 picks the hash from the certificate's own signatureAlgorithm - so we
# have to read that OID out of the DER.
[dependencies.x509-parser]
version = "0.18"
optional = true

[dependencies.sha2]
workspace = true
optional = true

[dependencies.sha1]
workspace = true
optional = true

[dev-dependencies]
compio = { workspace = true }
criterion = { workspace = true }
# Integration tests consume the LISTEN/NOTIFY async-message stream
# (`StreamExt::next`) and drive two pipelined queries concurrently
# (`future::join`). Same version as the regular dependency above, so this
# adds no new crate to the lock — it only makes the surface visible to the
# `tests/integration.rs` target.
futures-util = { version = "0.3", default-features = false, features = ["sink", "async-await"] }
tempfile = { workspace = true }

[[test]]
name = "tls_live"
required-features = ["tls", "live-tls-tests"]

[[bench]]
name = "buf_fill"
harness = false

[lints]
workspace = true

[[bench]]
name = "query_live"
harness = false
