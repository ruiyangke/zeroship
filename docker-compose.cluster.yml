# 3-node Dragonfly cluster for integration tests.
#
# Usage:
#   docker compose -f docker-compose.cluster.yml up -d
#   # Wait ~2s for listeners, then bootstrap the cluster:
#   ./scripts/bootstrap-dragonfly-cluster.sh
#   DRAGONFLY_CLUSTER_SEEDS='redis://127.0.0.1:7000,redis://127.0.0.1:7001,redis://127.0.0.1:7002' \
#     cargo test -p compio-redis --test cluster -- --nocapture
#   docker compose -f docker-compose.cluster.yml down -v

services:
  dragonfly-0:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: >
      --cluster_mode=yes
      --port=7000
      --cluster_announce_ip=127.0.0.1
      --cluster_node_id=node-0
      --logtostderr
    network_mode: host

  dragonfly-1:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: >
      --cluster_mode=yes
      --port=7001
      --cluster_announce_ip=127.0.0.1
      --cluster_node_id=node-1
      --logtostderr
    network_mode: host

  dragonfly-2:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: >
      --cluster_mode=yes
      --port=7002
      --cluster_announce_ip=127.0.0.1
      --cluster_node_id=node-2
      --logtostderr
    network_mode: host
