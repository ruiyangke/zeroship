[package]
name = "zerobench"
version = "0.1.0"
edition = "2021"
description = "Next-gen HTTP benchmark tool — wrk superset with SSE, WebSocket, NUMA, TUI"

[[bin]]
name = "zerobench"
path = "src/main.rs"

[dependencies]
compio = { version = "0.18", features = ["io", "net", "runtime", "macros", "time"] }
hdrhistogram = "7"
httparse = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { workspace = true }
base64 = { workspace = true }

[lints]
workspace = true
