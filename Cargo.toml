[workspace]
members = ["crates/*", "tools/bench"]
resolver = "3"
exclude = [
    "crates/platform",
    "crates/runtime/benches/ntex-bench",
    "refs",
]

# ---------------------------------------------------------------------------
# Shared dependency versions (single source of truth)
# ---------------------------------------------------------------------------

[workspace.dependencies]
# Async / I/O
compio = { version = "0.18", features = ["io", "net", "runtime", "macros", "time"] }
compio-tls = { version = "0.9", features = ["native-tls"] }
futures = "0.3"

# HTTP
ntex = { version = "3", features = ["compio"] }
httparse = "1"
http = "1"
cyper = { version = "0.8", default-features = false, features = ["rustls", "json", "stream"] }
url = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# Crypto
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
aws-lc-rs = "1"
base64 = "0.22"
bcrypt = "0.17"
jsonwebtoken = "9"
openidconnect = { version = "4.0", default-features = false }

# Database
postgres-protocol = "0.6"
postgres-types = { version = "0.2", features = ["with-uuid-1"] }
fallible-iterator = "0.2"
percent-encoding = "2"

# IDs
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Compression
zstd = "0.13"

# Error handling
thiserror = "2"

# Utilities
bytes = "1"
hex = "0.4"
mimalloc = { version = "0.1", default-features = false }
libc = "0.2"
itoa = "1"
socket2 = { version = "0.5", features = ["all"] }
ada-url = "3.4.4"

# V8
v8 = "147"

# Proc macros
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# Internal crates
zeroship-bundle = { path = "crates/bundle" }
zeroship-core = { path = "crates/core" }
compio-postgres = { path = "crates/compio-postgres" }
zeroship-plugin-db = { path = "crates/plugin-db" }
zeroship-runtime = { path = "crates/runtime" }
zeroship-runtime-macros = { path = "crates/runtime-macros" }
zeroship-compiler = { path = "crates/compiler" }

# ---------------------------------------------------------------------------
# Shared lints
# ---------------------------------------------------------------------------

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
