[workspace]
members = [
    "crates/core",
    "crates/isolate",
    "crates/plugins",
    "crates/server",
    "crates/cli",
    "crates/plan",
    "crates/enforcement",
    "crates/metering",
    "crates/compiler",
    "crates/billing",
    "crates/isolate_v8",
]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
