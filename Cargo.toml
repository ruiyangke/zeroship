[workspace]
members = ["crates/*", "libs/*"]
resolver = "3"
exclude = [
    "crates/zeroship-runtime/benches/ntex-bench",
    "libs/compio-postgres/vendor/postgres-types",
    "refs",
]

# ---------------------------------------------------------------------------
# Shared package metadata
# ---------------------------------------------------------------------------
# The migration-engine crates inherit these three keys rather than repeating
# them nine times. Every other crate in this workspace states its own, so this
# table serves the engine alone and adding it changed nothing for the rest.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# ---------------------------------------------------------------------------
# Shared dependency versions (single source of truth)
# ---------------------------------------------------------------------------

[workspace.dependencies]
# Async / I/O
compio = { version = "0.18", features = ["io", "net", "runtime", "macros", "time"] }
# Single TLS crypto provider end-to-end: rustls 0.23 + aws-lc-rs (FIPS-validated).
# `compio-tls`'s `rustls` feature only toggles the dep + futures-rustls + futures-util;
# the crypto provider (aws-lc-rs) is selected via `rustls/aws-lc-rs` directly in
# `crates/runtime/Cargo.toml`, which is the unified provider for the workspace.
# `default-features = false` is critical — compio-tls's default feature is
# `native-tls`, which would otherwise pull OpenSSL into the tree alongside rustls.
compio-tls = { version = "0.9", default-features = false, features = ["rustls"] }
# WebSocket framer — wraps tungstenite over compio. Default features off
# to keep `permessage-deflate` disabled (RSV1=1 frames hard-fail at the
# framer layer per RFC 6455 §5.2; design §VII.1 / MAJOR #18). We pick
# `rustls` + `rustls-native-certs` so handshake TLS uses the system trust
# store (matches fetch's discipline). NO `deflate` feature exists on
# tungstenite 0.28 — verify at boot via WebSocketConfig::default check.
compio-ws = { version = "0.3", default-features = false, features = ["rustls", "rustls-native-certs"] }
futures = "0.3"
async-trait = "0.1"

# HTTP
ntex = { version = "3", features = ["compio"] }
httparse = "1"
http = "1"
cyper = { version = "0.8", default-features = false, features = ["rustls", "json", "stream"] }
url = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
toml = "0.8"
indexmap = { version = "2", features = ["serde"] }

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# JSON Schema generation for the `op.*` migration IR contract (op-ir.schema.json).
# schemars 1.x: `schemars::schema_for!(T)` -> `schemars::Schema`, `#[derive(schemars::JsonSchema)]`.
# Emits the discriminated-union schema the JS `op.*` builder targets; leaf, sync,
# no tokio.
schemars = "1"

# Crypto
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
# **P5 PR 1** — column-encryption AEAD + key derivation. Promoted to
# the workspace from `crates/core/Cargo.toml` (where it lived as a
# crate-local pin for `crypto.rs`) so the plugin-db encryption module
# and the existing core wrappers share one version. HKDF-SHA256
# expands per-platform root keys into the (k_enc, k_siv) halves the
# plugin-db `EncryptedColumn` impls consume.
aes-gcm = "0.10"
hkdf = "0.12"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }
aws-lc-rs = "1"
base64 = "0.22"
bcrypt = "0.17"
jsonwebtoken = "9"
openidconnect = { version = "4.0", default-features = false }

# Database
postgres-protocol = "0.6.12"
postgres-types = { version = "0.2", features = ["with-uuid-1"] }
fallible-iterator = "0.2"
percent-encoding = "2"
# SQLite — bundled amalgamation pinned at the rusqlite-shipped version
# (3.51.3 ≥ the 3.16 minimum for `sqlite3_preupdate_hook`). `bundled`
# avoids a system-library dep; `preupdate_hook` enables the CDC seam
# we'll wire in P2. Optional throughout — only `zeroship-plugin-db`
# pulls it in under its `sqlite` feature.
rusqlite = { version = "0.39", features = ["bundled", "preupdate_hook"] }
# **P4 PR 7** — `sqlite-vec` statically compiles the C `vec0` extension
# into the binary and registers it via `sqlite3_auto_extension`. NO
# `.so` ships; preserves the bundled-SQLite invariant (design §1). The
# Rust crate exposes `sqlite3_vec_init` which rusqlite's `ffi`
# re-export of `sqlite3_auto_extension` hooks once per process. Gated
# to `plugin-db`'s `sqlite` feature.
sqlite-vec = "0.1"

# IDs
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# S3 client (compio-s3) — pure parsing/formatting deps for the hand-rolled
# SigV4 path. NONE of these may pull an async runtime; the zero-tokio
# dependency guard (`cargo tree -i tokio -p compio-s3`) proves it. `aws-sigv4`
# is BANNED here (it pulls tokio via aws-smithy-async); SigV4 is hand-rolled.
quick-xml = "0.38"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing"] }
httpdate = "1"

# Compression
zstd = "0.13"
tar = { version = "0.4", default-features = false }
# WHATWG CompressionStream / DecompressionStream codec backends.
# flate2 default features = miniz_oxide (pure Rust); revisit zlib-rs
# (pure-Rust zlib-ng port) when it stabilises — see compression design D-11.
flate2 = "1"
# Brotli — Dropbox's pure-Rust port (rust-brotli). No-default-features
# off keeps the alloc-stdlib + std features without dragging the C
# benchmark code or the validation/sha2 path. RFC 7932 wire format.
brotli = { version = "8", default-features = false, features = ["std"] }

# Error handling
thiserror = "2"

# Utilities
bytes = "1"
hex = "0.4"
lru = "0.12"
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false }
libc = "0.2"
# Kernel-sandbox primitives for the PR4a build-time recorder (design §8.9).
# `seccompiler` is Firecracker's audited seccomp-bpf compiler (default-deny
# syscall filter); `landlock` is the ABI-aware Landlock LSM wrapper (read-only
# filesystem ruleset, requires Linux >= 5.13). Both are pure-Rust, no C
# toolchain — the build-time analogue of the apply-time least-priv migrator role.
seccompiler = "0.5"
landlock = "0.4"
itoa = "1"
socket2 = { version = "0.6", features = ["all"] }
ada-url = "3.4.4"
# CIDR parsing + containment for the `node:net` egress rule set
# (`zeroship_core::net_policy::Destination::Range`). Parse and `contains`
# ONLY: its special-range predicates are not adopted and `is_blocked_ip`
# stays hand-rolled, because every maintained crate's `is_global()` omits
# forms `crates/runtime/src/transport/ssrf.rs` handles and adopting one
# would silently WIDEN the SSRF floor. `default = ["std"]`, `std = []` -
# zero transitive crates, so it adds nothing to the tokio graph.
ipnet = { version = "2.12", features = ["serde"] }

# V8
v8 = "147"
deno_core_icudata = "0.77"

# Microbenchmarks. Pinned at 0.5 (matches platform crate's dev-dep).
# Wave F (RPC v2 phase 1) added the first proper microbench in this
# workspace (`crates/runtime/benches/rpc_dispatch.rs`).
criterion = { version = "0.5", features = ["html_reports"] }

# WHATWG Encoding spec — Henri Sivonen's reference impl, also the
# encoding library used by Firefox. Replaces hand-rolled UTF-8 decode
# with a spec-correct state machine (matches WPT). 30+ encodings
# available for free if we ever need them (currently UTF-8 only).
encoding_rs = "0.8"

# Proc macros
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
linkme = "0.3.37"
cargo_metadata = "0.23.1"

# Logging / tracing — pluggable subscriber init lives in
# `crates/core/src/observability.rs`. Format pluggable via
# the generated observability.log_format setting (auto|pretty|compact|json|logfmt|bunyan).
tracing = "0.1"
# `ansi` is required for the pretty + compact text formatters; the
# subscriber strips ANSI codes automatically when stderr is not a TTY,
# so safe in production. `tracing-log` integrates `log::*` -> tracing
# at the layer level (`LogTracer::init` covers the rest).
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "env-filter", "fmt", "ansi", "json", "tracing-log"] }
tracing-log = "0.2"
tracing-logfmt = "0.3"
tracing-bunyan-formatter = "0.3"

# MPMC channel. Consumed by `crates/plugin-db`, `crates/gateway` and
# `crates/workflow-scheduler`.
#
# This comment used to justify the dependency by a planned worker queue in a
# sandbox-crate module that no longer exists here - the sandbox was extracted to
# the standalone `zeroship-sandbox` project. The dependency is
# not stale, but its stated reason was: the real consumers arrived elsewhere and
# nothing updated the note. A citation to a path that cannot resolve is worth
# less than no citation, because it invites a reader to go looking.
flume = { version = "0.11", default-features = false, features = ["async"] }
# Kafka-family stream transport. Default features stay OFF so rust-rdkafka does
# not enable its tokio-backed async producer/consumer helpers; the stream crate
# uses BaseProducer/BaseConsumer over librdkafka's own C threads.
rdkafka = { version = "0.36", default-features = false, features = ["cmake-build"] }

# Auto-cleaning temp file / directory helper. Used by
# `zeroship-plugin-db`'s `tests/sqlite_integration.rs` to provide a
# per-test `db_dir` for the SQLite-backed `SqliteBackend::new(...)`
# constructor (P1 PR 2). Workspace-level so the same pin is reused if
# other crates pick up integration-test temp dirs in the future.
tempfile = "3"

# Internal crates
zeroship-core = { path = "crates/zeroship-core" }
zeroship-bundle = { path = "crates/zeroship-bundle" }
compio-postgres = { path = "libs/compio-postgres" }
compio-redis = { path = "libs/compio-redis" }
compio-s3 = { path = "libs/compio-s3" }
zeroship-schema = { path = "crates/zeroship-schema" }
# SC-3's `DbPlan`: the runtime query plan in which a fragment of SQL text is not
# a representable value. A true leaf - it declares no dependencies of its own,
# which is what lets the whole grammar be built and tested without a database, a
# runtime or an isolate, and what makes `Serialize` impossible to derive on a
# plan rather than merely discouraged. Nothing consumes it yet; porting
# `zeroship-schema`'s runtime query builders onto it is a later step.
zeroship-data-core = { path = "crates/zeroship-data-core" }
zeroship-data-postgres = { path = "crates/zeroship-data-postgres" }
zeroship-data-sqlite = { path = "crates/zeroship-data-sqlite" }
# The ENGINE tier, extracted from `zeroship-plugin-db` on 2026-09-03: the CRUD
# passes, the SC-1 transaction protocol, the routed executor, the per-isolate
# transaction lanes and the `BackendHandle` dispatch enum. It sits ABOVE both
# vendor crates and BELOW the adapter, and its manifest header records why it is
# the one non-vendor crate allowed to name a driver.
zeroship-data-engine = { path = "crates/zeroship-data-engine" }
zeroship-data-query-builder = { path = "crates/zeroship-data-query-builder" }
# The `zeroship-migrate` engine, a full member of this workspace. It was a git submodule
# pinned to a commit recorded here; its history was grafted in so the engine and its
# consumers move together and a wire-format change is one commit, not two repos in
# lockstep. The `zeroship-migrate-server` service consumes it directly: it owns the
# native-PG producer (`CompioPgSession`) for the engine's driver-neutral `SqlSession`
# seam in its own `src/session.rs`.
zeroship-migrate = { path = "crates/zeroship-migrate" }
# The engine's Policy Decision Point (the knob/rule/document model + composition
# algebra) and its IR-side builtin registry. The `zeroship-migrate-server` managed-policy
# server composes the monorepo-owned confined/platform ceilings against untrusted
# creator drafts through these directly (`compose_strict` + `RootCeiling` +
# `builtin_registry`); the top-level `zeroship-migrate` facade re-exports only the seal +
# `resolve_create_table_policy`, not the composition surface.
zeroship-migrate-policy = { path = "crates/zeroship-migrate-policy" }
zeroship-migrate-ir = { path = "crates/zeroship-migrate-ir" }
# The rest of the engine's own crates. Nothing outside the engine names these -
# consumers go through the `zeroship-migrate` facade above, or through the two
# lower crates named directly for the reasons given there. They are declared
# here only so the engine's members can inherit them by `workspace = true`, the
# way they did under their own workspace root.
zeroship-migrate-backend = { path = "crates/zeroship-migrate-backend" }
zeroship-migrate-core = { path = "crates/zeroship-migrate-core" }
zeroship-migrate-postgres = { path = "crates/zeroship-migrate-postgres" }
zeroship-migrate-sqlite = { path = "crates/zeroship-migrate-sqlite" }
zeroship-migrate-mysql = { path = "crates/zeroship-migrate-mysql" }
zeroship-plugin-db = { path = "crates/zeroship-plugin-db" }
zeroship-plugin-storage = { path = "crates/zeroship-plugin-storage" }
zeroship-plugin-kv = { path = "crates/zeroship-plugin-kv" }
zeroship-plugin-workflow = { path = "crates/zeroship-plugin-workflow" }
zeroship-metering = { path = "crates/zeroship-metering" }
zeroship-stream = { path = "crates/zeroship-stream" }
zeroship-runtime = { path = "crates/zeroship-runtime" }
zeroship-runtime-macros = { path = "crates/zeroship-runtime-macros" }
zeroship-config-macros = { path = "crates/zeroship-config-macros" }
zeroship-config-contract = { path = "crates/zeroship-config-contract" }
zeroship-workflow-scheduler = { path = "crates/zeroship-workflow-scheduler" }
# The five server libraries, listed here so the non-shipped
# `zeroship-config-contract` checker can LINK their generated registries rather
# than re-parse their source. Nothing shipped depends on these entries.
zeroship-control = { path = "crates/zeroship-control" }
zeroship-gateway = { path = "crates/zeroship-gateway" }
zeroship-worker = { path = "crates/zeroship-worker" }
zeroship-migrate-server = { path = "crates/zeroship-migrate-server" }
zeroship-auth = { path = "crates/zeroship-auth" }
zeroship-authn = { path = "crates/zeroship-authn" }
zeroship-authz = { path = "crates/zeroship-authz" }
zeroship-mailer = { path = "crates/zeroship-mailer" }
# Dev-dependency only. Owns the one skip announcer every gated test calls, so
# that `tests/run_auth_suite.sh` has a single token to search for.
zeroship-test-support = { path = "crates/zeroship-test-support" }
# Dev-dependency only. The test harness's own logic; `live_db` is the preflight
# a live-database target runs before its first assertion. NOT test-support -
# that crate deliberately has no dependencies at all, and this one links a
# PostgreSQL driver.
zeroship-testkit = { path = "crates/zeroship-testkit" }

# ---------------------------------------------------------------------------
# Shared lints
# ---------------------------------------------------------------------------

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# The compiler half of the raw-environment gate. The methods themselves are
# listed in clippy.toml at the workspace root, with the reasoning. Stated
# explicitly rather than left to `all` so that relaxing `all` cannot silently
# relax this, and so the deny is visible where someone would look for it.
disallowed_methods = "deny"

# ---------------------------------------------------------------------------
# Build profiles
# ---------------------------------------------------------------------------

# RE-MEASURED 2026-08-21 as a real A/B: `cargo test --no-run --workspace` from
# an empty target dir under each profile, on one 16-core box. Both runs exited 0
# and linked the same 156 executables, so the totals compare like with like:
#
#   cargo default (debug = true)    49,246,889,485 B   45.86 GiB   636.5 s
#   debug = "line-tables-only"      21,991,315,736 B   20.48 GiB   347.0 s
#
# That is the case for this setting: 25.4 GiB off every full target dir, -55.3%.
# The warm edit-test loop got faster too (touch one crate, rebuild one package):
# 19.8 s -> 15.5 s, three runs each, /proc/loadavg 7-11 throughout. The cold
# times above were taken at different loads (20.6 vs 6.0) and are NOT a clean
# reading; on this box a repeated cold build of one package varied 121-287 s.
#
# The 2026-08-19 note this replaces measured `strip` on four linked test
# binaries and reported 71-92% per binary. That is what `debug = 0` saves, not
# what this line saves, and it overstated the effect of what actually landed.
#
# What is lost was established by panicking, not by assertion. A real panic
# under this profile prints every frame with `file:line` exactly as under
# `debug = true`, for our own code and for dependency frames alike; under
# `debug = 0` every `at <file>:<line>` line disappears. What goes is the type
# and variable DWARF, so `gdb`/`lldb` cannot inspect locals here. Raise this to
# `true` locally if you are stepping through code.
#
# Measured and rejected, so nobody re-runs them. Percentages are one package's
# target dir against the same scope's cargo default:
#
#   debug = 0                        -57.8%  no `file:line` in any backtrace
#   incremental = false              -60.4%  warm rebuild 18.5 s -> 43.9 s (2.4x)
#   strip = "debuginfo"              -27.3%  dep rlibs keep their DWARF; worse
#   debug = true + split-debuginfo   -25.9%  keeps the debugger, loses to this
#   [profile.dev.package."*"] = 0    -54.8%  dep `file:line` SURVIVES wherever
#                                            the code was monomorphised into the
#                                            caller, so the loss is unpredictable
#   [profile.dev.build-override]     -46.8%  0.84% better than this line alone
#
# `split-debuginfo = "unpacked"` ON TOP of this line is the one that works: full
# workspace 20.48 -> 17.80 GiB, a further -13.1%, and backtraces are unharmed
# (`.debug_line` stays in the binary; verified by running a copied binary with
# the .dwo files deleted). It is not taken because it adds 42,619 .dwo files per
# target dir and does not touch the term that actually dominates:
#
# ACCUMULATION, not per-build size, is why a target dir reaches 85G. A fresh
# full build here is 20.48 GiB; the main checkout's target/debug measured 85 GiB
# over 154,422 files and 1,567 incremental session dirs for the same ~156
# executables -- 14 hash variants of libserde alone. Cargo never collects
# artifacts for configurations it has stopped building, so the directory holds
# roughly 4x a fresh build. This profile halves what each build ADDS; only
# `cargo clean`, or deleting `target/debug/incremental`, removes what earlier
# builds left behind.
[profile.dev]
debug = "line-tables-only"

# `[profile.test]` is deliberately absent. Cargo derives it from `[profile.dev]`,
# and a test target's dependencies are built with `dev` regardless. Checked, not
# assumed: building under `debug = 0` produced a test binary whose OWN frames
# lost `file:line`, which they could only do by inheriting the dev setting.
