[workspace]
members = ["crates/*"]
resolver = "3"
exclude = [
    "crates/platform",
    "crates/runtime/benches/ntex-bench",
    "refs",
]

# ---------------------------------------------------------------------------
# Shared dependency versions (single source of truth)
# ---------------------------------------------------------------------------

[workspace.dependencies]
# Async / I/O
compio = { version = "0.18", features = ["io", "net", "runtime", "macros", "time"] }
# Single TLS crypto provider end-to-end: rustls 0.23 + aws-lc-rs (FIPS-validated).
# `compio-tls`'s `rustls` feature only toggles the dep + futures-rustls + futures-util;
# the crypto provider (aws-lc-rs) is selected via `rustls/aws-lc-rs` directly in
# `crates/runtime/Cargo.toml`, which is the unified provider for the workspace.
# `default-features = false` is critical — compio-tls's default feature is
# `native-tls`, which would otherwise pull OpenSSL into the tree alongside rustls.
compio-tls = { version = "0.9", default-features = false, features = ["rustls"] }
# WebSocket framer — wraps tungstenite over compio. Default features off
# to keep `permessage-deflate` disabled (RSV1=1 frames hard-fail at the
# framer layer per RFC 6455 §5.2; design §VII.1 / MAJOR #18). We pick
# `rustls` + `rustls-native-certs` so handshake TLS uses the system trust
# store (matches fetch's discipline). NO `deflate` feature exists on
# tungstenite 0.28 — verify at boot via WebSocketConfig::default check.
compio-ws = { version = "0.3", default-features = false, features = ["rustls", "rustls-native-certs"] }
futures = "0.3"
async-trait = "0.1"

# HTTP
ntex = { version = "3", features = ["compio"] }
httparse = "1"
http = "1"
cyper = { version = "0.8", default-features = false, features = ["rustls", "json", "stream"] }
url = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# Crypto
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }
aws-lc-rs = "1"
# XChaCha20-Poly1305 AEAD for sealed-record persistence
# (sandbox preview-URL feature § II.0 / § IX.a). Single trait dep
# pulls the symmetric-cipher + AEAD stack from RustCrypto. Used
# only by `crates/sandbox/src/persist.rs`.
chacha20poly1305 = "0.10"
base64 = "0.22"
bcrypt = "0.17"
jsonwebtoken = "9"
openidconnect = { version = "4.0", default-features = false }

# Database
postgres-protocol = "0.6"
postgres-types = { version = "0.2", features = ["with-uuid-1"] }
fallible-iterator = "0.2"
percent-encoding = "2"

# IDs
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Compression
zstd = "0.13"
tar = { version = "0.4", default-features = false }
# WHATWG CompressionStream / DecompressionStream codec backends.
# flate2 default features = miniz_oxide (pure Rust); revisit zlib-rs
# (pure-Rust zlib-ng port) when it stabilises — see compression design D-11.
flate2 = "1"
# Brotli — Dropbox's pure-Rust port (rust-brotli). No-default-features
# off keeps the alloc-stdlib + std features without dragging the C
# benchmark code or the validation/sha2 path. RFC 7932 wire format.
brotli = { version = "8", default-features = false, features = ["std"] }

# Error handling
thiserror = "2"

# Utilities
bytes = "1"
hex = "0.4"
lru = "0.12"
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false }
libc = "0.2"
itoa = "1"
socket2 = { version = "0.5", features = ["all"] }
ada-url = "3.4.4"

# V8
v8 = "147"
deno_core_icudata = "0.77"

# WHATWG Encoding spec — Henri Sivonen's reference impl, also the
# encoding library used by Firefox. Replaces hand-rolled UTF-8 decode
# with a spec-correct state machine (matches WPT). 30+ encodings
# available for free if we ever need them (currently UTF-8 only).
encoding_rs = "0.8"

# Proc macros
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# Logging / tracing — pluggable subscriber init lives in
# `crates/core/src/observability.rs`. Format pluggable via
# ZEROSHIP_LOG_FORMAT={pretty|compact|json|logfmt|bunyan}.
tracing = "0.1"
# `ansi` is required for the pretty + compact text formatters; the
# subscriber strips ANSI codes automatically when stderr is not a TTY,
# so safe in production. `tracing-log` integrates `log::*` -> tracing
# at the layer level (`LogTracer::init` covers the rest).
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "env-filter", "fmt", "ansi", "json", "tracing-log"] }
tracing-log = "0.2"
tracing-logfmt = "0.3"
tracing-bunyan-formatter = "0.3"

# Bounded MPMC queue. Used by `crates/sandbox/src/db.rs` for the
# Phase-1 worker queue (design § 14.14): handlers `try_send` writes
# onto a bounded `flume` channel, a fixed pool of workers drains.
# Phase 0 wires the dep but does not use the queue yet — declaring
# it now eliminates a Phase-1 dep churn.
flume = { version = "0.11", default-features = false, features = ["async"] }

# Internal crates
zeroship-core = { path = "crates/core" }
zeroship-bundle = { path = "crates/bundle" }
compio-postgres = { path = "crates/compio-postgres" }
compio-redis = { path = "crates/compio-redis" }
zeroship-plugin-db = { path = "crates/plugin-db" }
zeroship-plugin-storage = { path = "crates/plugin-storage" }
zeroship-plugin-kv = { path = "crates/plugin-kv" }
zeroship-runtime = { path = "crates/runtime" }
zeroship-runtime-macros = { path = "crates/runtime-macros" }

# ---------------------------------------------------------------------------
# Shared lints
# ---------------------------------------------------------------------------

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
