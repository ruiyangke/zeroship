# THE PLATFORM SYSTEM-TABLE SHAPE - the authored confined [[inject]] rule.
#
# This file is a FRAGMENT, not a whole policy document. It holds the [[inject]]
# rule and NOTHING else: no policy_version, no [[grant]]. On its own it does not
# load. Each consumer concatenates its own grants (which legitimately differ -
# the emit ceiling needs none, the adapter fixtures pin schema.cross_schema)
# with this file, and loads the concatenation.
#
# WHAT THE RULE IS. Platform identity, audit, version, and soft-delete columns;
# a pinned ["id"] primary key; author_primary_key = "forbid"; and the platform
# indexes, injected mandatorily into every table a creator migration creates.
#
# Rust consumers use
#
#     concat!(include_str!("<their grants>"), include_str!("<this file>"))
#
# which rustc evaluates at compile time, so each host embeds the authored bytes.
#
# TypeScript consumers take it through a generated module, because
# TypeScript has no include_str! and packages/vite-plugin is a PUBLISHED package that
# runs where this repo does not exist, so it can neither include nor read the
# file. policies/codegen.mjs emits these bytes as a const into
# packages/vite-plugin/src/gen-types/confined-system-shape.generated.ts, which
#
#   packages/vite-plugin/src/gen-types/confined-ceiling.ts   (build-time emit)
#   packages/vite-plugin/src/gen-types/dev-apply.ts          (dev apply)
#
# import and concatenate onto their own grants. That generated file is committed
# so tsc and the editor need no build-order knowledge. Edit this fragment and run
# pnpm gen-types; pnpm gen-types:check byte-compares the generated module in CI.

[[inject]]
scope = "all"
mandatory = true
primary_key = ["id"]
author_primary_key = "forbid"
columns = [
  # The three NOT NULL columns carry defaults because the data plane does not
  # send them. The ORM assignment pass omits database-defaulted fields
  # from every INSERT by design and relies on the DDL to supply the canonical
  # value; without these the first insert into any migration-created table fails
  # with "null value in column created_at violates not-null constraint".
  # id is deliberately defaultless - it is minted into the INSERT instead.
  #
  # TYPED-ID COMPARISON DOMAIN. id is the creator-visible row identity: prefix
  # + "_" + a base36 UUIDv7. Its byte order is its creation-time order, so it
  # must not inherit a locale-dependent collation.
  # created_by and updated_by carry typed actor ids and belong to the same
  # comparison domain: mismatched collations change ordering and prevent
  # collation-compatible ordered index joins. All three therefore use the
  # closed bytewise intent, which renders as COLLATE "C" on Postgres, BINARY on
  # SQLite, and utf8mb4_0900_bin on MySQL. Ordinary text remains
  # database-collated; names ending in "_id" do not acquire this intent.
  #
  # NOW() vs now(): nothing turns on the case. inject_default_to_ir lower-cases
  # the token before matching it against "now" | "now()" | "current_timestamp"
  # (third_party/zero-migrate/crates/zeroship-migrate/src/model/table_shape.rs), so
  # all three spellings produce the identical SynthFn::Now IR, and the
  # dialect-aware render localizes THAT to CURRENT_TIMESTAMP for SQLite.
  { name = "id",         type = "text",        nullable = false, collation = "bytewise", assign = { by = "typedId",      on = "insert" } },
  { name = "created_at", type = "timestamptz", nullable = false, default = "NOW()",      assign = { by = "now",          on = "insert" } },
  { name = "updated_at", type = "timestamptz", nullable = false, default = "NOW()",      assign = { by = "now",          on = "write"  } },
  { name = "created_by", type = "text",        nullable = true,  collation = "bytewise", assign = { by = "actor",        on = "insert" } },
  { name = "updated_by", type = "text",        nullable = true,  collation = "bytewise", assign = { by = "actor",        on = "write"  } },
  { name = "version",    type = "integer",     nullable = false, default = "1",          assign = { by = "increment(1)", on = "write"  } },
  { name = "deleted_at", type = "timestamptz", nullable = true,                          assign = { by = "now",          on = "delete" } },
]
indexes = [
  { name = "ix_deleted_at", columns = ["deleted_at"] },
  { name = "ix_updated_at", columns = ["updated_at"] },
  { name = "ix_created_by", columns = ["created_by"] },
]
