# THE PLATFORM SYSTEM-TABLE SHAPE - the one and only copy of the confined
# [[inject]] rule.
#
# This file is a FRAGMENT, not a whole policy document. It holds the [[inject]]
# rule and NOTHING else: no policy_version, no [[grant]]. On its own it does not
# load. Each consumer concatenates its own grants (which legitimately differ -
# the emit ceiling needs none, the adapter fixtures pin schema.cross_schema)
# with this file, and loads the concatenation.
#
# WHAT THE RULE IS. Seven platform system columns (id / created_at / updated_at
# / created_by / updated_by / version / deleted_at), a pinned ["id"] primary
# key, author_primary_key = "forbid", and three system indexes, injected
# mandatorily into every table a creator migration creates. It is the shape of
# every creator table on the platform.
#
# WHO TAKES IT, and how. Rust consumers use
#
#     concat!(include_str!("<their grants>"), include_str!("<this file>"))
#
# which rustc evaluates at compile time, so the bytes below are literally in
# every binary that carries the rule:
#
#   crates/zeroship-migrate-server/policies/confined.policy.toml
#       + crates/zeroship-migrate-server/src/policy.rs :: CONFINED_CEILING_TOML
#       the DEPLOYED server ceiling - the shape a creator's tables get in
#       production.
#   crates/zeroship-migrate-server/tests/smoke_apply_pg.rs
#   crates/zeroship-migrate-server/tests/author_and_apply_pg.rs
#       two Postgres-gated fixtures, each of which calls itself "the confined
#       table-shape ceiling" and must therefore be the shipped one.
#
# THE TWO TYPESCRIPT CONSUMERS take it through a generated module, because
# TypeScript has no include_str! and sdks/vite-plugin is a PUBLISHED package that
# runs where this repo does not exist, so it can neither include nor read the
# file. policies/codegen.mjs emits these bytes as a const into
# sdks/vite-plugin/src/gen-types/confined-system-shape.generated.ts, which
#
#   sdks/vite-plugin/src/gen-types/confined-ceiling.ts   (build-time emit)
#   sdks/vite-plugin/src/gen-types/dev-apply.ts          (dev apply)
#
# import and concatenate onto their own grants. That generated file is COMMITTED,
# not built, so tsc and the editor need no build-order knowledge; the price is
# that it can go stale, and tests/inject_policy_mirror_gate.sh regenerates and
# byte-compares it on every run. Edit THIS file and re-run the codegen; never
# hand-edit the generated one.
#
# THE SEVENTH PRODUCER CANNOT TAKE THIS FILE. zeroship-schema's
# build_system_field_columns (crates/zeroship-schema/src/query.rs) emits the
# same seven columns from Rust rather than from a policy document, and the two
# already differ on purpose - see the "id / created_by / updated_by" note below.
# Nothing here reaches it; that divergence needs a check of a different kind.
#
# ONE SOURCE OF TRUTH IS NOT SELF-ENFORCING. Re-inlining this block into a
# consumer is a two-line edit and would compile; so is deleting an include_str!,
# after which that ceiling injects nothing and its tables lose their system
# columns. tests/inject_policy_mirror_gate.sh scans the tree for [[inject]] rules
# it was not told about and counts the consumers, and REFUSES on either number it
# does not recognise.

[[inject]]
scope = "all"
mandatory = true
primary_key = ["id"]
author_primary_key = "forbid"
columns = [
  # The three NOT NULL columns carry defaults because the data plane does not
  # send them. crud/system_fields_pass.rs omits created_at/updated_at/version
  # from every INSERT by design and relies on the DDL to supply the canonical
  # value; without these the first insert into any migration-created table fails
  # with "null value in column created_at violates not-null constraint".
  # id is deliberately defaultless - it is minted into the INSERT instead.
  #
  # THE NAMES AND NULLABILITY match zeroship-schema's system_field_columns, and
  # that is all that matches. An earlier version of this comment claimed the two
  # producers "emit the same table"; they do not, and the claim is what kept
  # anyone from checking (measured 2026-08-10 on a deployed app schema):
  #
  #   this file, via the engine   id / created_by / updated_by  varchar(255)
  #   zeroship-schema PG renderer id / created_by / updated_by  text
  #
  # TYPED-ID COMPARISON DOMAIN. id is the creator-visible row identity: prefix
  # + "_" + a base62 UUIDv7. Its byte order is its creation-time order, so it
  # must not inherit a locale collation that interleaves base62's case runs.
  # created_by and updated_by carry typed actor ids and belong to the same
  # comparison domain: mismatched collations change ordering and prevent
  # collation-compatible ordered index joins. All three therefore use the
  # closed bytewise intent, which renders as COLLATE "C" on Postgres, BINARY on
  # SQLite, and utf8mb4_0900_bin on MySQL. Ordinary text remains
  # database-collated; names ending in "_id" do not acquire this intent.
  #
  # NOW() vs now(): nothing turns on the case. inject_default_to_ir lower-cases
  # the token before matching it against "now" | "now()" | "current_timestamp"
  # (third_party/zero-migrate/crates/zeroship-migrate/src/model/table_shape.rs), so
  # all three spellings produce the identical SynthFn::Now IR, and the
  # dialect-aware render localizes THAT to CURRENT_TIMESTAMP for SQLite.
  { name = "id",         type = "text",        nullable = false, collation = "bytewise" },
  { name = "created_at", type = "timestamptz", nullable = false, default = "NOW()" },
  { name = "updated_at", type = "timestamptz", nullable = false, default = "NOW()" },
  { name = "created_by", type = "text",        nullable = true,  collation = "bytewise" },
  { name = "updated_by", type = "text",        nullable = true,  collation = "bytewise" },
  { name = "version",    type = "integer",     nullable = false, default = "1" },
  { name = "deleted_at", type = "timestamptz", nullable = true  },
]
indexes = [
  { name = "ix_deleted_at", columns = ["deleted_at"] },
  { name = "ix_updated_at", columns = ["updated_at"] },
  { name = "ix_created_by", columns = ["created_by"] },
]
