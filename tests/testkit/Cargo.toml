[package]
name = "zeroship-testkit"
version = "0.1.0"
edition = "2021"
description = "Shared test fixtures: reaper-owned containers, the shared platform database and scoped tenants"
publish = false

# This crate is excluded from the workspace on purpose. It is reachable only
# through a consuming crate's `[dev-dependencies]`, so the testcontainers it
# carries stays off every shipped normal edge. Because it is not a member it
# cannot inherit `workspace = true`; `xtask/tests/repository/testkit_versions.rs`
# asserts each entry shared with `[workspace.dependencies]` keeps that entry's
# version requirement, features and path.

[dependencies]
compio = { version = "0.18", features = ["io", "net", "runtime", "macros", "time"] }
compio-postgres = { path = "../../libs/compio-postgres" }
compio-redis = { path = "../../libs/compio-redis" }
compio-s3 = { path = "../../libs/compio-s3" }
futures = "0.3"
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
tempfile = "3"
testcontainers = { version = "0.28", default-features = false, features = ["blocking", "watchdog"] }
toml = "0.8"
url = "2"
zeroship-id = { path = "../../crates/zeroship-id" }
